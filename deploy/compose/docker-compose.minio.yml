# Object-store overlay — MinIO as the reference self-hosted S3 backend.
#
# Authority: taskplans/42_deployment_hardening.md §4.4; the driver is Task 41's.
#
# Compose it with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
#
# THIS IS THE S3 CONTRACT, NOT A MINIO DEPENDENCY. The same four variables
# point at AWS, Ceph RGW, Wasabi, Backblaze B2 or SeaweedFS's S3 gateway with
# no code change — that is what Task 41 proved. MinIO is here so that a
# `docker compose up` produces a *working* storage backend with no cloud
# account, which is the difference between a deployment package and a
# deployment prerequisite.

services:
  objects:
    image: quay.io/minio/minio:latest
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VERITY_S3_ACCESS_KEY_ID:?set VERITY_S3_ACCESS_KEY_ID in the env file}
      MINIO_ROOT_PASSWORD: ${VERITY_S3_SECRET_ACCESS_KEY:?set VERITY_S3_SECRET_ACCESS_KEY in the env file}
      TZ: UTC
    volumes:
      - verity-object-data:/data
    # NO PORTS by default. The application reaches it over the compose network.
    # An operator who wants the MinIO console forwards 9001 deliberately.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    depends_on:
      objects:
        condition: service_healthy

volumes:
  verity-object-data:
