<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon: the board's FAVICON cell — the gold mark held in a rounded
       square with a hairline, not a bare glyph on transparency. The tile is
       what makes it findable in a strip of twenty tabs; a bare mark at 16px
       reads as a smudge. Ground, border and mark are the board's own values:
       Surface #FFFFFF, Border #E6E8EB, Primary Gold #D4A017.
       Geometry is identical to components/brand/VerityMark. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#FFFFFF" stroke="#E6E8EB"/>
  <g transform="translate(9.77 7) scale(0.75)" fill="#D4A017">
    <path d="M 2 0 H 14.613 A 2 2 0 0 1 16.1432 3.288 L 9.4078 11.283 A 1.3135 1.3135 0 0 0 7.2052 11.283 L 0.4698 3.288 A 2 2 0 0 1 2 0 Z"/>
    <path d="M 2 24 H 14.613 A 2 2 0 0 0 16.1432 20.712 L 9.4078 12.717 A 1.3135 1.3135 0 0 1 7.2052 12.717 L 0.4698 20.712 A 2 2 0 0 0 2 24 Z"/>
  </g>
</svg>
