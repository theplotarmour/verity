<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 24" width="20" height="24">
  <!-- Favicon: the bare mark, as the identity sheet's FAVICON cell shows it.
       Gold rather than the sheet's black because a favicon sits on browser
       chrome we do not control — black vanishes on a dark tab strip, while gold
       holds against both. Geometry is identical to components/brand/VerityMark;
       the 20-wide viewBox centres the 16.613-wide mark with breathing room so it
       does not touch the tab's edges at 16px. -->
  <g transform="translate(1.694 0)" fill="#D4A017">
    <path d="M 2 0 H 14.613 A 2 2 0 0 1 16.1432 3.288 L 9.4078 11.283 A 1.3135 1.3135 0 0 0 7.2052 11.283 L 0.4698 3.288 A 2 2 0 0 1 2 0 Z"/>
    <path d="M 2 24 H 14.613 A 2 2 0 0 0 16.1432 20.712 L 9.4078 12.717 A 1.3135 1.3135 0 0 1 7.2052 12.717 L 0.4698 20.712 A 2 2 0 0 0 2 24 Z"/>
  </g>
</svg>
