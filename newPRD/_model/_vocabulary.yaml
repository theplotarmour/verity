council: VERITY CANONICAL VOCABULARY
version: 0.1.0
status: WORKING ASSUMPTION
note: >
  Single source of truth for terms reused across every capability and module model.
  Generators resolve all short keys in module models against this file. Changing a
  key here changes every generated document. Nothing in this file may be duplicated
  inside a module model.

# ---------------------------------------------------------------------------
# ROLE ARCHETYPES
# Roles are archetypes at platform level. Tenants instantiate concrete roles that
# map to one or more archetypes. Permission grants are expressed against
# archetypes so a pack ships working permissions on day one.
# ---------------------------------------------------------------------------
role_archetypes:
  platform_operator:
    label: Platform Operator (Verity HQ)
    description: Verity staff operating the platform itself across all tenants.
    tenant_bound: false
    can_impersonate: true
    impersonation_requires: [ticket_reference, tenant_admin_consent_or_contract_clause, time_boxed_session]
  platform_support:
    label: Platform Support (Verity HQ)
    description: Verity staff resolving tenant support issues. Read-biased.
    tenant_bound: false
    can_impersonate: true
    impersonation_requires: [ticket_reference, tenant_admin_consent, time_boxed_session, redacted_financial_fields]
  tenant_owner:
    label: Owner / Director
    description: Ultimate authority inside one tenant. Full financial visibility.
    tenant_bound: true
  tenant_admin:
    label: Tenant Administrator
    description: Configures the tenant. May not automatically see financials.
    tenant_bound: true
  finance:
    label: Finance
    description: Revenue, costs, invoices, payments, payroll, margins.
    tenant_bound: true
  ops_manager:
    label: Operations / Area Manager
    description: Multi-site operational authority. Site and workforce costs only.
    tenant_bound: true
  supervisor:
    label: Site Supervisor
    description: Single-site or single-team operational authority.
    tenant_bound: true
  dispatcher:
    label: Dispatcher / Scheduler
    description: Assigns work and people to time and place.
    tenant_bound: true
  employee:
    label: Employee / Field Worker / Guard / Technician
    description: Executes work. Sees own records only.
    tenant_bound: true
  customer_contact:
    label: Client Contact (B2B)
    description: External. Sees only their own contracts, invoices, service metrics.
    tenant_bound: true
    external: true
  consumer:
    label: Consumer (B2C)
    description: External end customer booking or ordering.
    tenant_bound: true
    external: true
  vendor_contact:
    label: Vendor / Supplier Contact
    description: External. Sees only their own POs and submissions.
    tenant_bound: true
    external: true
  auditor:
    label: Auditor
    description: Read-only across a defined scope, including audit trail. Cannot mutate.
    tenant_bound: true
  integration_principal:
    label: Integration / Service Account
    description: Non-human principal. Never inherits a humans scope implicitly.
    tenant_bound: true
    non_human: true

# ---------------------------------------------------------------------------
# SCOPES
# Per product owner decision: permissions are Action + Entity + Field + Scope.
# Scope is evaluated after entity and field checks pass.
# ---------------------------------------------------------------------------
scopes:
  own:            {label: Own records, resolution: subject_id == principal.id}
  own_team:       {label: Own team, resolution: subject.team_id IN principal.managed_team_ids}
  own_site:       {label: Own site, resolution: subject.site_id IN principal.assigned_site_ids}
  own_region:     {label: Own region, resolution: subject.site.region_id IN principal.managed_region_ids}
  own_department: {label: Own department, resolution: subject.department_id == principal.department_id}
  own_customer:   {label: Own customer account, resolution: subject.customer_id IN principal.linked_customer_ids}
  own_vendor:     {label: Own vendor account, resolution: subject.vendor_id IN principal.linked_vendor_ids}
  tenant:         {label: Entire tenant, resolution: subject.tenant_id == principal.tenant_id}
  platform:       {label: All tenants, resolution: principal.tenant_bound == false}

# ---------------------------------------------------------------------------
# PERMISSION VERBS
# Deliberately closed set. A module may not invent a verb; it composes these.
# ---------------------------------------------------------------------------
verbs:
  view:      {mutating: false, audit_class: read_sensitive_only}
  list:      {mutating: false, audit_class: read_sensitive_only}
  create:    {mutating: true, audit_class: always}
  edit:      {mutating: true, audit_class: always}
  delete:    {mutating: true, audit_class: always, soft_delete_default: true}
  restore:   {mutating: true, audit_class: always}
  approve:   {mutating: true, audit_class: always, requires_reason_on_reject: true}
  assign:    {mutating: true, audit_class: always}
  execute:   {mutating: true, audit_class: always, note: state transitions that are not plain edits}
  export:    {mutating: false, audit_class: always, note: 'export is always audited, it is an exfiltration vector'}
  import:    {mutating: true, audit_class: always}
  administer: {mutating: true, audit_class: always, note: configuration of the entity type itself}
  view_financial: {mutating: false, audit_class: always, note: '''field-level gate, not a module gate'}
  view_sensitive: {mutating: false, audit_class: always, note: PII/identity documents/salary/health}

# ---------------------------------------------------------------------------
# UNIVERSAL LIFECYCLE STATES
# Not every entity uses all of these. An entity declares its own subset plus
# entity-specific states. These four are reserved and behave identically everywhere.
# ---------------------------------------------------------------------------
reserved_states:
  draft:     {terminal: false, mutable: true, billable: false, description: Created but not committed. Invisible to downstream modules.}
  active:    {terminal: false, mutable: true, billable: true, description: In normal operational use.}
  archived:  {terminal: true, mutable: false, billable: false, description: 'Retained, excluded from default lists and from all aggregate reports unless explicitly included.'}
  deleted:   {terminal: true, mutable: false, billable: false, description: Soft-deleted. Row retained with deleted_at. Hard delete only via retention job or DSR erasure.}

# ---------------------------------------------------------------------------
# EVENT NAMING
# ---------------------------------------------------------------------------
event_convention:
  pattern: "{entity_key}.{past_tense_verb}"
  examples: [work_order.completed, booking.cancelled, attendance.disputed]
  envelope_fields:
    - {key: event_id, type: uuid, note: idempotency key for consumers}
    - {key: event_type, type: string}
    - {key: event_version, type: int, note: '''incremented on breaking payload change, old version emitted in parallel for one minor release'}
    - {key: tenant_id, type: uuid}
    - {key: subject_type, type: string}
    - {key: subject_id, type: uuid}
    - {key: actor_type, type: enum, values: [user, service_account, system_scheduler, external_webhook]}
    - {key: actor_id, type: uuid, nullable: true}
    - {key: occurred_at, type: timestamptz, note: business time}
    - {key: recorded_at, type: timestamptz, note: 'system time, differs from occurred_at on offline replay'}
    - {key: correlation_id, type: uuid, note: survives across module boundaries in one workflow}
    - {key: causation_id, type: uuid, note: the event_id that caused this event}
    - {key: source, type: enum, values: [ui_web, ui_mobile, offline_replay, api, automation_rule, scheduler, integration]}
    - {key: payload, type: json}
    - {key: payload_before, type: json, nullable: true, note: present for state-change and financial events only}
  delivery: at_least_once
  consumer_requirement: must be idempotent on event_id
  ordering: per subject_id only, never global

# ---------------------------------------------------------------------------
# ERROR / FAILURE TAXONOMY
# Every action spec must map its failure modes to these codes.
# ---------------------------------------------------------------------------
error_taxonomy:
  E_AUTHN:            {http: 401, user_message: Session expired. Sign in again., retryable: false}
  E_AUTHZ_ENTITY:     {http: 403, user_message: You do not have access to this record type., retryable: false, leak_risk: must not reveal record existence}
  E_AUTHZ_SCOPE:      {http: 404, user_message: Not found., retryable: false, leak_risk: deliberately 404 not 403 to avoid confirming existence outside scope}
  E_AUTHZ_FIELD:      {http: 200, user_message: null, retryable: false, note: 'field omitted from response, never nulled, so client cannot distinguish empty from hidden'}
  E_VALIDATION:       {http: 422, user_message: field-specific, retryable: false}
  E_PRECONDITION:     {http: 409, user_message: This action is not available in the current state., retryable: false}
  E_CONFLICT_VERSION: {http: 409, user_message: Someone else changed this record., retryable: true, resolution: present diff and let user merge}
  E_CONFLICT_UNIQUE:  {http: 409, user_message: A record with this value already exists., retryable: false}
  E_RATE_LIMIT:       {http: 429, user_message: Too many attempts. Try again shortly., retryable: true}
  E_DEPENDENCY:       {http: 424, user_message: A required service is unavailable., retryable: true}
  E_QUOTA:            {http: 402, user_message: Plan limit reached., retryable: false}
  E_TENANT_SUSPENDED: {http: 423, user_message: This workspace is suspended., retryable: false}
  E_OFFLINE_STALE:    {http: 409, user_message: This was changed while you were offline., retryable: true, resolution: conflict queue}
  E_INTERNAL:         {http: 500, user_message: Something went wrong. The team has been notified., retryable: true}

# ---------------------------------------------------------------------------
# UI STATES — every screen spec must answer all of these
# ---------------------------------------------------------------------------
ui_states: [loading, empty_first_use, empty_no_results, populated, partial_data, error, permission_denied, offline, saving, success, conflict]

# ---------------------------------------------------------------------------
# AUDIT CLASSES
# ---------------------------------------------------------------------------
audit_classes:
  always:               {retain_years: 7, immutable: true, fields: [actor, action, entity, entity_id, before, after, reason, source, ip, device, geo_if_captured, correlation_id, occurred_at]}
  read_sensitive_only:  {retain_years: 2, immutable: true, note: 'log reads only of fields marked sensitive or financial, not every list view, to avoid audit-log flooding'}
  security:             {retain_years: 7, immutable: true, note: 'auth, permission change, impersonation, export, key rotation'}

# ---------------------------------------------------------------------------
# CONFIDENCE MARKERS — mandated by product owner
# ---------------------------------------------------------------------------
confidence_levels:
  KNOWN:              Evidence from multiple independent sources or direct operator statement.
  WORKING_ASSUMPTION: Product owner decision recorded, not yet validated in the field.
  VALIDATION_REQUIRED: Neither researched nor decided. Must not be implemented before validation.
