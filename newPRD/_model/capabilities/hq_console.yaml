key: hq_console
name: HQ Console
layer: platform
confidence: KNOWN
description: >
  Verity operating itself - the tenants, the capability library, the packs, the manifests
  that describe what each tenant is actually running, the deployments that change them, and
  the tooling support uses to help without seeing more than it should. It is the only
  capability whose principals are not tenant-bound, which makes it the one place where a
  mistake affects everybody at once.

principles:
  - A tenant is a manifest, not a database row. What a tenant is running must be answerable from one versioned, diffable artifact rather than reconstructed from archaeology across a database.
  - Every platform action is cross-tenant by nature and therefore blast-radius-bearing. Scope, rehearsal and reversibility are properties of the action, not of the operator's care.
  - Support sees what it needs and no more. Impersonation is a permission construct with a redaction profile, and platform staff reading a tenant's financials by default is a breach of the relationship rather than a convenience.
  - Deployments are staged, rehearsed and reversible where reversibility is possible, and where it is not, the model says so rather than implying otherwise.
  - Drift between the manifest and the running system is an alert, never a surprise. Reconciliation reports and never silently corrects, because an automatic correction can overwrite an emergency intervention.
  - Nothing about a tenant is deleted on suspension. A suspended tenant is a commercial state and its data is untouched, because the most common suspension is an unpaid invoice that is paid the following week.

entities:

  - key: tenant
    name: Tenant
    description: One customer workspace - its identity, its commercial state, its residency and its lifecycle. The entity every tenant_scoped row in the platform is isolated by.
    owner: platform
    tenancy: platform_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: global, immutable: true, note: the stable short identifier used in support conversations and in every log line}
      - {key: display_name, type: string, req: true}
      - {key: legal_party_ref, type: string, nullable: true, sensitive: true, note: 'the contracting entity, held as a reference to the platform''s own commercial records rather than as a party inside any tenant'}
      - {key: created_at, type: timestamptz, req: true, immutable: true}
      - {key: plan_key, type: string, req: true, financial: true}
      - {key: seat_entitlement, type: int, nullable: true, financial: true}
      - {key: data_residency_region, type: string, req: true, immutable: true, note: 'immutable, because moving a tenant between regions is a migration with legal consequences and not a field edit'}
      - {key: primary_locale, type: string, req: true}
      - {key: primary_timezone, type: string, req: true}
      - {key: support_access_consent_until, type: timestamptz, nullable: true, note: time-boxed consent for impersonation. A permanent consent is deliberately not offered}
      - {key: support_access_contract_clause, type: bool, req: true, default: false, note: whether the contract permits support access without per-instance consent}
      - {key: current_manifest_id, type: uuid, nullable: true, fk: tenant_manifest}
      - {key: suspension_reason, type: text, nullable: true}
      - {key: suspended_at, type: timestamptz, nullable: true}
      - {key: closure_requested_at, type: timestamptz, nullable: true}
      - {key: data_erasure_due_at, type: timestamptz, nullable: true, note: when the retention window after closure expires and data is destroyed}
      - {key: export_delivered_at, type: timestamptz, nullable: true, note: 'when the tenant''s own data was handed back to them, which must precede erasure'}
    invariants:
      - data_residency_region is immutable. A change is a migration with legal consequences, executed as a distinct operation rather than as an edit.
      - Suspension never deletes, hides or degrades tenant data. It restricts sign-in and it leaves everything else intact, because the most common suspension is an unpaid invoice that is paid the following week.
      - Closure never destroys data before export_delivered_at is set, or before an explicit waiver is recorded by the tenant. Destroying a customer's records before giving them back is unrecoverable and indefensible.
      - support_access_consent_until is time-boxed and expires. There is no permanent consent value.
      - Every tenant_scoped table in the platform is isolated by this entity's id through row-level security at the database role level, not by application predicates. This is restated here because this is the entity that isolation is defined against.
    states: [provisioning, trial, active, suspended, closure_requested, closed, purged]
    initial_state: provisioning
    transitions:
      - {from: provisioning, to: trial, action: provision_tenant, actor: platform_operator, guard: a manifest is applied and at least one tenant_owner principal exists, side_effects: the workspace becomes reachable, reversibility: true}
      - {from: provisioning, to: active, action: provision_tenant, actor: platform_operator, guard: as above and the plan is not a trial plan, side_effects: as above, reversibility: true}
      - {from: trial, to: active, action: activate_tenant, actor: platform_operator, guard: a commercial arrangement is recorded, side_effects: none, reversibility: true}
      - {from: trial, to: closed, action: close_tenant, actor: platform_operator, guard: the trial lapsed and the retention notice period has elapsed, side_effects: sign-in stops; data retained until the erasure date, reversibility: true}
      - {from: active, to: suspended, action: suspend_tenant, actor: platform_operator or tenant_owner, guard: a reason is supplied and the acting session is elevated, side_effects: sign-in refused with E_TENANT_SUSPENDED; DATA UNTOUCHED; integrations paused rather than disabled; queued outbound messages retained, reversibility: true}
      - {from: suspended, to: active, action: reinstate_tenant, actor: platform_operator, guard: the reason is resolved, side_effects: 'sign-in restored, integrations resumed, queued outbound delivery resumes from where it stopped', reversibility: true}
      - {from: active, to: closure_requested, action: request_closure, actor: tenant_owner or platform_operator, guard: 'the requester is tenant_owner, or a platform_operator acting on a recorded instruction', side_effects: 'the export is prepared, the erasure date is set, and the tenant is told both dates', reversibility: true}
      - {from: suspended, to: closure_requested, action: request_closure, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: closure_requested, to: active, action: cancel_closure, actor: tenant_owner or platform_operator, guard: the erasure date has not passed, side_effects: the erasure schedule is cancelled and the tenant is told, reversibility: false}
      - {from: closure_requested, to: closed, action: close_tenant, actor: platform_operator, guard: 'the export has been delivered or explicitly waived, and the notice period has elapsed', side_effects: sign-in stops permanently; data retained until the erasure date, reversibility: true}
      - {from: closed, to: active, action: reinstate_tenant, actor: platform_operator, guard: 'before the erasure date, acting session elevated, a reason recorded and the tenant''s instruction evidenced', side_effects: none, reversibility: false}
      - {from: closed, to: purged, action: purge_tenant, actor: platform_operator, guard: 'the erasure date has passed, the export was delivered or waived, no legal hold exists anywhere in the tenant, and a second platform principal has confirmed', side_effects: 'tenant data is destroyed; the tenant row, the manifest history and the audit of the purge are retained permanently', reversibility: false}
    stuck_state_policy:
      provisioning: >
        A tenant stuck in provisioning is a customer who has bought something they cannot use.
        Threshold: provisioning_alert_minutes (default 30). Told: platform_operator and whoever
        owns the commercial relationship. Escape hatch: complete or roll back. The
        characteristic failure is a manifest that applies partially and leaves a workspace
        reachable with half its capabilities, which is worse than one that is not reachable at
        all - so a failed provisioning rolls back rather than leaving a partial tenant.
      trial: >
        Bounded by the trial period. The monitored exception is a trial with no sign-in for
        trial_silence_days (default 7), which is a customer who has not started rather than one
        who has decided. Told: whoever owns the relationship. Escape hatch: contact them. This
        is a commercial monitor living in a technical capability because it is the only place
        that knows.
      active: >
        Steady state. Four monitored conditions. (a) Manifest drift - the running system
        disagreeing with the current manifest. Told: platform_operator, always, and never
        auto-corrected. (b) A tenant whose seat usage exceeds its entitlement, told to the
        relationship owner rather than enforced, because cutting off access over a commercial
        matter is a decision for a person. (c) A tenant on a capability version more than
        version_lag_alert minor versions behind, which is where upgrade debt accumulates
        silently until an upgrade becomes a project. (d) A tenant with no tenant_owner able to
        sign in - the last-owner protection should make this impossible and its occurrence is a
        defect alert rather than an operational one.
      suspended: >
        A suspended tenant is a commercial dispute with a clock on it. Threshold:
        suspension_review_days (default 14), then weekly to the relationship owner and
        platform_operator. Told: the tenant_owner throughout, with what is required to
        reinstate. Escape hatch: reinstate or move to closure. Verity never escalates a
        suspension into a closure automatically, because the two have completely different
        consequences and only the second is irreversible.
      closure_requested: >
        Bounded by the erasure date, which is the most consequential date in the platform.
        Threshold: notification to the tenant_owner at the closure request, at export delivery,
        at half the retention window, at 7 days and at 1 day before erasure. Told: the
        tenant_owner and the relationship owner. Escape hatch: cancel, or proceed. The export
        must be delivered before erasure and the model refuses the purge without it, because
        destroying a customer's records before returning them is unrecoverable.
      closed: >
        Bounded by the erasure date. Reinstatement remains available throughout, which is
        deliberate - a business that closes and returns is common and forcing a fresh workspace
        loses their history. Told: nobody routinely; the erasure countdown is the notification.
      purged: >
        Terminal. The tenant row, the manifest history, the purge audit and the fact that the
        tenant existed are retained permanently. A purge that removed the record of the purge
        would make the platform unable to answer whether a customer ever existed, which is a
        question asked by both regulators and former customers. Nothing pends.

  - key: capability_version
    name: Capability Version
    description: One published version of one capability in the library, with what changed, whether the change is breaking, and which tenants are on it.
    owner: platform
    tenancy: platform_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: capability_key, type: string, req: true, immutable: true}
      - {key: semver, type: string, req: true, immutable: true}
      - {key: is_breaking, type: bool, req: true, note: 'derived from the composition model''s breaking-change definition and recorded rather than judged per release, so that the same change is always classified the same way'}
      - {key: breaking_reasons, type: json, nullable: true, note: 'flat list drawn from the declared set - a removed field, a narrowed permission default, an event payload change without a parallel version, a lifecycle change stranding an instance'}
      - {key: released_at, type: timestamptz, nullable: true}
      - {key: deprecates_version, type: string, nullable: true}
      - {key: migration_required, type: bool, req: true, default: false}
      - {key: migration_is_reversible, type: bool, nullable: true, note: 'nullable and NEVER defaulted to true. Where the rollback strategy is unresolved the honest value is unknown, and a null renders as unknown rather than as reversible'}
      - {key: override_impact_summary, type: json, nullable: true, note: 'which tenant override kinds this version invalidates, computed at publication against every live override'}
      - {key: tenant_count_on_version, type: int, req: true, default: 0}
      - {key: known_issues, type: text, nullable: true}
    invariants:
      - semver is immutable and a published version is never republished. A version that can change content is a version number that means nothing.
      - is_breaking is derived from the declared definition rather than judged per release. A per-release judgement means the same change is breaking in one release and not in another.
      - migration_is_reversible is nullable and may never be defaulted to true. The platform's rollback strategy is an unresolved kernel decision, and claiming reversibility that has not been established would be a promise the platform cannot keep.
      - Publication computes override_impact_summary against every live tenant override. A version published without knowing which tenants it breaks is a version whose upgrade is discovered tenant by tenant, at their expense.
    states: [draft, released, deprecated, withdrawn]
    initial_state: draft
    transitions:
      - {from: draft, to: released, action: release_capability_version, actor: platform_operator, guard: 'the breaking classification is computed, the override impact is computed, and any required migration declares its reversibility as true, false or explicitly unknown', side_effects: the version becomes deployable to tenants, reversibility: true}
      - {from: released, to: deprecated, action: deprecate_version, actor: platform_operator, guard: a successor is released, side_effects: tenants on this version are told and appear in the upgrade backlog, reversibility: true}
      - {from: released, to: withdrawn, action: withdraw_version, actor: platform_operator, guard: a serious defect is found and the acting session is elevated, side_effects: 'no new deployments; tenants already on it are told immediately with the defect and the mitigation, because they are running it right now', reversibility: false}
      - {from: deprecated, to: withdrawn, action: withdraw_version, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: draft, to: withdrawn, action: withdraw_version, actor: platform_operator, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_version_stale_days (default 30). Told: the authoring platform_operator.
        Escape hatch: release or withdraw. Low urgency; the risk is a version everybody believes
        is available.
      released: >
        Steady state. Two monitored conditions. (a) A released version on which fewer than
        adoption_floor of eligible tenants sit after adoption_window_days (default 90), which
        means upgrades are not happening and the platform is accumulating a long tail it will
        eventually have to support. (b) A released version whose override_impact_summary shows
        breakage for tenants who have not been contacted. Told: platform_operator, and this is
        the condition under which an upgrade becomes a surprise for a customer.
      deprecated: >
        A deprecated version with tenants still on it is support debt with a date on it.
        Threshold: deprecation_grace_days (default 180), then monthly. Told: platform_operator
        with the tenant list, and each affected tenant_owner. Escape hatch: migrate the
        remaining tenants, or extend the grace deliberately. A version deprecated forever is
        worse than one never deprecated, because the warning becomes noise.
      withdrawn: >
        A withdrawn version with tenants still running it is an active incident, not a queue.
        Threshold: immediate, then every withdrawal_chase_hours (default 4) until every tenant
        has moved. Told: platform_operator, tenant_owner of every affected tenant, and the
        relationship owners. Escape hatch: move them. There is no timer that resolves this and
        no threshold at which it stops escalating.

  - key: tenant_manifest
    name: Tenant Manifest
    description: The single resolved, versioned artifact that fully describes what one tenant is running - capabilities, packs, port bindings, configuration deltas, roles, navigation and a schema fingerprint.
    owner: platform
    tenancy: platform_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true, fk: tenant}
      - {key: manifest_version, type: int, req: true, immutable: true}
      - {key: generated_at, type: timestamptz, req: true, immutable: true}
      - {key: generated_by_principal_id, type: uuid, req: true, immutable: true}
      - {key: capability_versions, type: json, req: true, immutable: true, note: flat list of capability key and exact resolved version}
      - {key: pack_versions, type: json, req: true, immutable: true}
      - {key: port_bindings, type: json, req: true, immutable: true, note: every binding INCLUDING deliberate null bindings. A null binding recorded explicitly is the difference between a decision and an omission}
      - {key: configuration_deltas, type: json, req: true, immutable: true, note: 'every value differing from default, with the scope it was set at and who set it'}
      - {key: rule_overrides, type: json, req: true, immutable: true, note: 'each with the rule''s overridable_at, proving the override was legal at the time it was made'}
      - {key: role_expansions, type: json, req: true, immutable: true}
      - {key: navigation_tree, type: json, req: true, immutable: true}
      - {key: workflow_versions, type: json, req: true, immutable: true}
      - {key: integration_bindings, type: json, req: true, immutable: true, note: 'credential references only, never credentials'}
      - {key: schema_fingerprint, type: string, req: true, immutable: true, note: 'hash of the resolved data definition, used for drift detection'}
      - {key: deployed_at, type: timestamptz, nullable: true}
      - {key: superseded_at, type: timestamptz, nullable: true}
      - {key: last_reconciled_at, type: timestamptz, nullable: true}
      - {key: drift_findings, type: json, nullable: true, note: what the running system does that this manifest does not describe}
    invariants:
      - A manifest is immutable once deployed. A change produces a new version. Editing a deployed manifest means the artifact no longer describes what is running, which removes the only reason it exists.
      - manifest_version is contiguous per tenant. A gap means a manifest was generated and lost.
      - port_bindings records every requires-port of every enabled capability, including those bound to null. An omitted binding and a deliberate null binding are different facts and only one of them is a decision.
      - rule_overrides records the overridable_at that made each override legal. An override whose legality cannot be reconstructed cannot be re-evaluated at upgrade.
      - integration_bindings hold credential references and never credentials. A manifest is diffable, exportable and frequently read by support, and a manifest containing a secret is a secret in every one of those places.
      - Drift is recorded and never auto-corrected. An automatic correction can overwrite an emergency intervention somebody made at three in the morning for a reason the manifest does not know.
    states: [generated, staged, deployed, superseded, failed]
    initial_state: generated
    transitions:
      - {from: generated, to: staged, action: stage_manifest, actor: platform_operator, guard: the tenant has a staging environment and the manifest validates, side_effects: applied to staging and the acceptance suite is run, reversibility: true}
      - {from: staged, to: deployed, action: deploy_manifest, actor: platform_operator, guard: 'the acceptance run passed or its failures were explicitly accepted with a reason, a human approval is recorded, and the acting session is elevated', side_effects: 'applied to production, the previous manifest superseded, post-deploy reconciliation scheduled', reversibility: false}
      - {from: generated, to: deployed, action: deploy_manifest, actor: platform_operator, guard: 'every change is on the immediate deployment path - labels, terminology, branding, feature flags, notification preferences and non-structural view tweaks', side_effects: as above, reversibility: false, note: the fast path the composition model declares. Forcing a colour change through staging is how a team learns to route around staging}
      - {from: staged, to: failed, action: observe_acceptance_failure, actor: system, guard: the acceptance suite failed and the failures were not accepted, side_effects: staging is reverted to match production and the failures are reported, reversibility: true}
      - {from: failed, to: staged, action: stage_manifest, actor: platform_operator, guard: the manifest was corrected, side_effects: as for staging, reversibility: true}
      - {from: deployed, to: superseded, action: deploy_manifest, actor: platform_operator, guard: a later manifest is deployed, side_effects: none, reversibility: false}
    stuck_state_policy:
      generated: >
        Threshold: generated_manifest_stale_days (default 7). Told: the generating operator.
        Escape hatch: stage, deploy or discard. A generated and undeployed manifest is a change
        somebody intended and did not make, and the tenant is still running the previous one.
      staged: >
        A staged manifest occupies the tenant's staging environment and blocks the next change.
        Threshold: staged_manifest_stale_days (default 3). Told: the operator, then
        platform_operator generally. Escape hatch: deploy, revert or evict. The eviction is
        never silent, for the same reason it is never silent in core_configuration.
      deployed: >
        The steady state, and the one the drift monitor watches. Threshold: reconciliation runs
        every reconciliation_interval_hours (default 6), and a manifest not reconciled for four
        intervals is a platform alert. Told: platform_operator for reconciliation failure, and
        platform_operator plus tenant_admin for drift findings. Escape hatch: regenerate the
        manifest to match reality, or correct reality to match the manifest - and the choice
        between those two is exactly why drift is reported rather than auto-corrected.
      failed: >
        Threshold: immediate. Told: the operator with the specific acceptance failures. Escape
        hatch: correct and re-stage, or abandon. A failed manifest is the system working as
        intended and the notification says so, because otherwise the staging gate is
        experienced as an obstacle rather than as a control.
      superseded: >
        Terminal. Retained permanently, because the question of what a tenant was running on a
        given date is asked during every incident review and every dispute. This is the entity
        that makes that question answerable at all. Nothing pends.

  - key: deployment
    name: Deployment
    description: One act of changing what one or many tenants are running, with its scope, its rehearsal, its approval and its outcome per tenant.
    owner: platform
    tenancy: platform_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: label, type: string, req: true}
      - {key: kind, type: enum, values: [capability_upgrade, pack_upgrade, configuration, port_rebinding, migration, hotfix, rollback_forward], req: true, note: 'rollback_forward rather than rollback, because the platform''s rollback strategy is unresolved and naming a state rollback would imply a capability that has not been established'}
      - {key: target_selector, type: text, req: true, note: 'which tenants, as an expression. An explicit selector rather than a list, so the blast radius is computed and shown rather than assembled by hand'}
      - {key: target_tenant_count, type: int, req: true, note: computed at planning and shown in the confirmation. The number that determines how carefully this is done}
      - {key: from_versions, type: json, req: true}
      - {key: to_versions, type: json, req: true}
      - {key: is_breaking, type: bool, req: true}
      - {key: broken_override_count, type: int, req: true, default: 0, note: 'overrides across all targets that this deployment invalidates, computed before approval'}
      - {key: rehearsal_run_ref, type: string, nullable: true}
      - {key: rehearsal_outcome, type: enum, values: [not_run, passed, passed_with_accepted_failures, failed], req: true, default: not_run}
      - {key: approved_by_principal_id, type: uuid, nullable: true}
      - {key: approval_reason, type: text, nullable: true}
      - {key: wave_size, type: int, req: true, default: 1, note: how many tenants per wave. A deployment to every tenant at once is a decision that should require saying so}
      - {key: started_at, type: timestamptz, nullable: true}
      - {key: completed_at, type: timestamptz, nullable: true}
      - {key: succeeded_count, type: int, req: true, default: 0}
      - {key: failed_count, type: int, req: true, default: 0}
      - {key: halted_reason, type: text, nullable: true}
    invariants:
      - A deployment affecting more than one tenant proceeds in waves, and a wave failing beyond the halt threshold stops the deployment. A change that fails for one tenant will usually fail for the rest, and continuing turns one incident into fifty.
      - broken_override_count is computed before approval and shown in it. Per the composition model, broken overrides block an upgrade in staging and are never silently dropped; this field is what makes them visible before anybody approves.
      - is_breaking true requires a recorded approval with a reason regardless of the target count, including a target count of one.
      - A deployment is never edited after it starts. A change of plan halts it and a new deployment carries the revised plan.
      - kind=rollback_forward is a forward deployment restoring previous versions. The model does not offer a reverse migration, because DEC-K-011 is unresolved and the evidence gathered establishes that forward-only is the norm in this class of platform.
    states: [planned, rehearsing, approved, deploying, completed, halted, cancelled]
    initial_state: planned
    transitions:
      - {from: planned, to: rehearsing, action: rehearse_deployment, actor: platform_operator, guard: the target selector resolves and the blast radius is computed, side_effects: 'applied to a representative sample of target tenants in staging, and the acceptance suite is run against each', reversibility: true}
      - {from: rehearsing, to: approved, action: approve_deployment, actor: platform_operator, guard: 'the rehearsal passed or its failures were explicitly accepted, and the broken override count was acknowledged', side_effects: none, reversibility: true}
      - {from: rehearsing, to: planned, action: return_deployment, actor: platform_operator, guard: the rehearsal failed, side_effects: none, reversibility: true}
      - {from: planned, to: approved, action: approve_deployment, actor: platform_operator, guard: every change is on the immediate deployment path and is not breaking, side_effects: none, reversibility: true}
      - {from: approved, to: deploying, action: execute_deployment, actor: platform_operator, guard: the acting session is elevated and the approval is not older than the approval validity window, side_effects: waves begin; each tenant receives a new manifest version, reversibility: false}
      - {from: deploying, to: completed, action: observe_deployment_complete, actor: system, guard: every target succeeded or was explicitly skipped, side_effects: post-deploy reconciliation scheduled for every target, reversibility: false}
      - {from: deploying, to: halted, action: halt_deployment, actor: platform_operator or system, guard: 'failures in a wave exceed the halt threshold, or an operator halts it', side_effects: 'remaining waves stop; already-deployed tenants are LEFT on the new version and listed, because reverting them is a second change rather than an undo', reversibility: true}
      - {from: halted, to: deploying, action: execute_deployment, actor: platform_operator, guard: 'the cause is resolved, the acting session is elevated, and a reason is recorded', side_effects: resumes from the next undeployed target, reversibility: false}
      - {from: halted, to: cancelled, action: cancel_deployment, actor: platform_operator, guard: a reason is recorded and the mixed-version state is acknowledged, side_effects: the already-deployed tenants remain on the new version and appear in the version-skew report, reversibility: false}
      - {from: planned, to: cancelled, action: cancel_deployment, actor: platform_operator, guard: null, side_effects: none, reversibility: false}
      - {from: approved, to: cancelled, action: cancel_deployment, actor: platform_operator, guard: a reason is recorded, side_effects: none, reversibility: false}
    stuck_state_policy:
      planned: >
        Threshold: planned_deployment_stale_days (default 14). Told: the planning operator.
        Escape hatch: rehearse or cancel. The specific risk is a plan built against a library
        state that has since moved, so a plan older than the threshold is re-validated before
        it can be approved.
      rehearsing: >
        Threshold: rehearsal_timeout_hours (default 4). Told: platform_operator. Escape hatch:
        investigate or cancel. A rehearsal that hangs is usually a staging environment problem
        rather than a deployment problem, and the two look identical until somebody looks.
      approved: >
        Approved and unexecuted is the most dangerous of these states, because everybody
        involved believes the change is live. Threshold: approved_unexecuted_hours (default 48),
        and approval expires at approval_validity_days (default 7), after which it returns to
        rehearsing. Told: the approver and the planner. An approval given against a week-old
        rehearsal is an approval of something else.
      deploying: >
        Bounded by the wave schedule. The monitored exception is a wave that neither succeeds
        nor fails within wave_timeout_minutes (default 30), which usually means a tenant-level
        migration that is taking far longer than rehearsal suggested. Told: platform_operator
        immediately, with the tenant. Escape hatch: halt. A deployment that is neither
        progressing nor halted is the state in which a fleet-wide change does the most damage.
      halted: >
        A halted deployment leaves the fleet on mixed versions, which is precisely the condition
        DEC-C-003 has not resolved. Threshold: immediate, then hourly. Told: platform_operator
        and the relationship owners of every affected tenant. Escape hatch: resume, or cancel
        and accept the skew deliberately. Nothing resolves this on a timer, because both
        resolutions are decisions with cost.
      completed: >
        Terminal. The follow-on obligation is post-deploy reconciliation for every target, which
        is tracked on the manifest rather than here so that a failed reconciliation does not
        make a completed deployment look incomplete. Nothing else pends.
      cancelled: >
        Terminal. Retained with the reason and with the list of tenants left on the new version,
        because a cancelled deployment that partly happened is the origin of a version skew
        somebody will later be puzzled by. Nothing pends.

ports:
  - port_key: tenant_directory
    direction: provides
    contract: >
      Resolve a tenant reference to its display name, its commercial state, its residency,
      its locale and timezone, and whether it is suspended. This is the port every
      tenant_scoped capability consumes rather than holding a foreign key to the tenant entity,
      because tenant is owned here and kernel K04 forbids the concrete reference.
    cardinality: exactly_one

  - port_key: manifest_authority
    direction: provides
    contract: Resolve the current manifest for a tenant - enabled capabilities, port bindings including nulls, resolved configuration and role expansions - and report drift against the running system.
    cardinality: exactly_one

  - port_key: principal_directory
    direction: requires
    contract: Resolve platform principals and tenant principals, and provide the impersonation mechanism with its redaction profile.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. Platform operation without identity is unauditable, and impersonation is the mechanism by which support works at all.

  - port_key: authorization_decision
    direction: requires
    contract: Evaluate platform-scoped permissions and enforce that a support impersonation is an INTERSECTION with a redaction profile rather than a grant of the target's full access.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. This is the one capability whose principals are not tenant-bound, and unbounded cross-tenant access is the worst failure available in the platform.

  - port_key: audit_sink
    direction: requires
    contract: Record every platform action, every impersonation and every deployment, in the tenant's own audit stream as well as the platform's.
    cardinality: exactly_one
    unbound_behaviour: >
      FORBIDDEN. Writing platform actions into the affected tenant's own audit stream is what
      makes support access visible to the customer, and support access a customer cannot see in
      their own trail is indistinguishable from an intrusion.

  - port_key: notification
    direction: requires
    contract: Deliver support-access, suspension, closure, erasure-countdown, withdrawal and deployment messages to tenant owners and to platform operators.
    cardinality: zero_or_one
    unbound_behaviour: >
      Everything degrades to console lists. The erasure countdown in particular becomes
      invisible to the tenant, which would mean a customer's data being destroyed on a schedule
      they were never reminded of. A pack or environment binding hq_console without notification
      should be treated as incomplete.

  - port_key: config_resolution
    direction: requires
    contract: Resolve and apply configuration deltas as part of manifest generation and deployment.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. A manifest without resolved configuration describes nothing about how a tenant actually behaves.

actions:

  - key: provision_tenant
    entity: tenant
    label: Create a workspace
    actors: [platform_operator]
    preconditions: [the key is globally unique, a residency region is chosen, a system template or pack set is chosen, an initial tenant_owner identifier is supplied]
    inputs: [key, display_name, plan_key, data_residency_region, primary_locale, primary_timezone, template_key, initial_owner_identifier]
    creates: [tenant, tenant_manifest, an invitation for the initial owner]
    updates: []
    events: [platform.tenant_provisioned]
    notifications:
      - {to: the initial owner identifier, channel: 'their identifier''s channel', when: always, template: workspace_ready, must_include: [workspace_name, how_to_sign_in], cost_class: utility}
      - {to: the relationship owner, channel: in_app, when: always, template: tenant_provisioned}
    undoable: true
    reversal_action: close_tenant while still provisioning or trial
    audit_class: security
    idempotency_key_source: 'the tenant key. Re-running provisioning for an existing key returns the existing tenant rather than creating a second, which matters because provisioning is frequently retried after a partial failure.'
    offline_policy: refuse
    concurrency: >
      Provisioning is a single transaction over the tenant row and its first manifest, with the
      workspace made reachable only after both commit. A partial provisioning is rolled back
      entirely rather than left reachable, because a workspace with half its capabilities is
      worse than one that is not there - the customer signs in, finds it broken, and forms a
      view of the product in the first five minutes.
    failure_modes:
      - {code: E_CONFLICT_UNIQUE, cause: the key already exists, message: That workspace key is taken.}
      - {code: E_VALIDATION, cause: an unsupported residency region, message: field-specific, note: 'immutable afterwards, so it is validated hard here. Changing it later is a migration with legal consequences'}
      - {code: E_PRECONDITION, cause: the template references a withdrawn capability version, message: This action is not available in the current state., note: 'names the version, because provisioning onto a withdrawn version is how a new customer starts on a known defect'}
      - {code: E_DEPENDENCY, cause: manifest generation failed, message: null, note: the whole provisioning rolls back. A tenant with no manifest is a tenant nobody can describe}
      - {code: E_QUOTA, cause: the platform region is at capacity, message: Plan limit reached., note: 'refused rather than provisioned into a different region, because residency is immutable and silently choosing a different one is a legal problem rather than an inconvenience'}
    edge_cases:
      - Provisioning from a system template. The template is a snapshot and not a live link, per the composition model, so the tenant does not track template updates. This is stated at provisioning time because the assumption otherwise is the reverse, and it is the source of the expectation that a template fix reaches existing tenants.
      - Provisioning with an initial owner who never accepts. The workspace exists with no principal who can sign in, which the active-state monitor detects. The invitation expiry machinery in core_identity_session governs, and a workspace that reaches expiry with no owner is escalated rather than left.
      - Two operators provisioning the same customer concurrently. The key uniqueness collapses them, which is why the key rather than the display name is the identity - two workspaces for one customer is a support problem that persists for years.
      - Provisioning a trial that is never used. Detected by the trial silence monitor. This is a commercial signal living in a technical capability because it is the only place that knows whether anybody has signed in.

  - key: deploy_manifest
    entity: tenant_manifest
    label: Change what a tenant is running
    actors: [platform_operator]
    rationale: >
      The action with the largest blast radius in the platform. Everything about it - waves,
      rehearsal, explicit blast radius, broken-override visibility, halt behaviour - exists
      because a change applied to every tenant at once is the failure that ends a platform's
      reputation in an afternoon.
    preconditions:
      - The manifest validates against the kernel and the composition rules.
      - Every broken override has been listed and acknowledged.
      - The acceptance run passed or its failures were explicitly accepted with a reason.
      - The acting session is elevated.
      - The tenant is not mid-deployment.
    inputs: [manifest_id, acknowledgement_of_broken_overrides, reason]
    creates: [a new manifest version marked deployed]
    updates: [tenant current_manifest_id, previous manifest superseded, reconciliation scheduled]
    events: [platform.manifest_deployed]
    notifications:
      - {to: tenant_admin, channel: in_app, when: the deployment changes anything a tenant administrator configured, template: workspace_updated, must_include: [what_changed, any_overrides_that_no_longer_apply]}
      - {to: tenant_owner, channel: in_app_and_email, when: 'the change is breaking, or any override was invalidated', template: significant_update, must_include: [what_changed, what_was_affected, who_to_contact], mandatory_operational: true}
    undoable: false
    confirmation_specification: 'Modal stating the tenant, the exact version changes, whether the change is breaking, the count of overrides that will be invalidated and which they are, whether any required migration declares itself reversible or unknown, and the post-deploy reconciliation that will follow. Requires typing the tenant key. Required because a deployment cannot be undone - a correction is a further forward deployment, and where a migration is involved the platform has not established that reversal is possible at all.'
    audit_class: security
    idempotency_key_source: manifest_id. Redeploying an already-deployed manifest is a 2xx no-op that does not re-notify and does not supersede itself.
    offline_policy: refuse
    concurrency: >
      One deployment per tenant at a time, enforced by a lock on the tenant row. A tenant-level
      migration runs inside its own transaction where the change permits and in a documented
      multi-step sequence where it does not, and the manifest is only marked deployed once the
      sequence completes - so a partially migrated tenant is never described by a manifest
      claiming it is complete.
    failure_modes:
      - {code: E_PRECONDITION, cause: broken overrides are not acknowledged, message: This action is not available in the current state., note: 'lists the tenant, the exact override and the change that broke it, per the composition model''s upgrade semantics. They are never silently dropped'}
      - {code: E_PRECONDITION, cause: the acceptance run did not pass and its failures were not accepted, message: This action is not available in the current state.}
      - {code: E_CONFLICT_VERSION, cause: 'the tenant''s current manifest changed since this one was generated', message: Someone else changed this record., note: regenerate against the current state. Deploying a manifest generated against a superseded one would silently revert whatever changed in between}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
      - {code: E_INTERNAL, cause: the migration fails partway, message: null, note: 'the manifest is marked failed, the tenant is left in a documented intermediate state rather than an unknown one, and platform_operator is paged. The platform does NOT attempt an automatic reverse migration, because DEC-K-011 is unresolved and an unproven reversal on live customer data is worse than a known intermediate state'}
      - {code: E_PRECONDITION, cause: the tenant is suspended, message: This action is not available in the current state., note: 'permitted for a hotfix with an explicit override, because a suspended tenant may still need a security fix'}
    edge_cases:
      - A deployment that invalidates a tenant override. Blocked until acknowledged, listed with the exact override and the change that broke it, and the tenant is told after deployment which of their configurations no longer applies. Silently dropping an override is the failure the composition model explicitly forbids, and this is where that rule is enforced.
      - A migration whose reversibility is unknown. The confirmation states unknown rather than implying either answer, and there is no rollback offered. This is DEC-K-011 arriving at the point where it actually bites, and the model refuses to imply a capability that has not been established.
      - A deployment to a tenant whose device fleet is largely offline. Devices on the previous dataset version continue pushing already-queued mutations and cannot queue new ones, per the offline_sync degraded behaviour. The deployment does not wait for the fleet, and the count of devices that will degrade is shown in the confirmation.
      - Deploying only labels, terminology or branding. Takes the immediate path with no staging, per the composition model. Forcing a colour change through a staging gate is how a team stops using the staging gate for the changes that need it.
      - A deployment during a tenant's operating hours. Permitted, and the confirmation shows the tenant's local time and whether it is within their operating calendar. The model does not forbid it, because a security fix at three in the afternoon is sometimes correct, and it does make the operator see what they are doing.

  - key: start_support_session
    entity: tenant
    label: Look at a tenant's workspace
    actors: [platform_support, platform_operator]
    rationale: >
      Support cannot resolve most problems without seeing what the customer sees. This action
      is the alternative to asking a customer for their password, and every constraint on it
      exists because the alternative to a controlled mechanism is an uncontrolled one.
    preconditions:
      - A ticket reference is supplied.
      - Consent is in force, or a contract clause permits access.
      - The operator's own session is elevated.
      - The session is time-boxed.
    inputs: [tenant_id, target_principal_id, ticket_reference, justification, requested_minutes]
    creates: [an impersonation grant through the authorization port]
    updates: []
    events: [platform.support_session_started]
    notifications:
      - {to: tenant_admin, channel: email_and_in_app, when: always, template: support_access_started, must_include: [operator_name, ticket_reference, target, window], mandatory_legal: true}
      - {to: the impersonated principal, channel: in_app, when: 'tenant policy notifies them, which is the shipped default', template: support_acting_as_you}
    undoable: true
    reversal_action: end the support session
    audit_class: security
    idempotency_key_source: operator plus tenant plus ticket_reference plus the minute bucket
    offline_policy: refuse
    concurrency: One live support session per operator, and a second ends the first with reason=superseded. An operator acting as two people simultaneously makes the audit unreadable, which is the whole reason the constraint exists.
    failure_modes:
      - {code: E_PRECONDITION, cause: no consent in force and no contract clause, message: This workspace has not permitted support access., note: 'consent is time-boxed and expires; there is no permanent value, so this is a condition support will meet regularly and must be able to resolve by asking'}
      - {code: E_VALIDATION, cause: ticket reference missing, message: A ticket reference is required.}
      - {code: E_PRECONDITION, cause: the target holds tenant_owner and the operator is platform_support, message: This action is not available in the current state., note: impersonating an owner is restricted to the higher archetype because an owner sees everything}
      - {code: E_AUTHN, cause: operator session not elevated, message: Confirm your identity to continue.}
      - {code: E_RATE_LIMIT, cause: more than the daily support session limit, message: Too many attempts. Try again shortly., note: generous for genuine support work and tight enough that bulk browsing is visible}
    edge_cases:
      - "Permissions under support access are the INTERSECTION of the target's permissions and the operator's redaction profile. platform_support carries a redaction of every field marked financial, so support sees the layout and the workflow and not the numbers. This is enforced by core_authorization and is restated here because it is the property that makes the whole mechanism acceptable to a customer."
      - Every action taken under support access appears in the TENANT's own audit stream with the operator and the ticket reference, not only in the platform's. Support access a customer cannot see in their own trail is indistinguishable from an intrusion, and the audit port contract carries this requirement rather than leaving it to be remembered.
      - Elevation is structurally unavailable under support access, because elevation requires a credential the operator does not hold. High-risk actions are therefore impossible during support rather than merely forbidden by a rule somebody could misconfigure.
      - Consent withdrawn during a live session. The session ends at the next request boundary rather than mid-action. Whether that is the right boundary is an open question carried from core_authorization and it is the same question, not a second one.
      - A support session on a suspended tenant. Permitted, because the most common reason to look at a suspended tenant is to help them resolve the suspension, and refusing would make that impossible.

rules:
  - key: tenant_isolation_is_a_database_property
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Every tenant_scoped table is isolated by tenant id through row-level security at the database role level. No application predicate is the mechanism of isolation.'
    on_conflict: not overridable
    rationale: Kernel K03. Restated here because this is the entity isolation is defined against, and because this is the one capability whose principals are not tenant-bound.

  - key: manifest_is_immutable_once_deployed
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A deployed manifest is never edited. A change produces a new version.'
    on_conflict: not overridable
    rationale: An edited manifest no longer describes what is running, which removes the only reason it exists.

  - key: drift_is_reported_never_corrected
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Reconciliation reports differences between the manifest and the running system and never applies a correction automatically.'
    on_conflict: not overridable
    rationale: An automatic correction can overwrite an emergency intervention somebody made at three in the morning for a reason the manifest does not know.

  - key: broken_overrides_block_and_are_never_dropped
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'A deployment invalidating a tenant override is blocked until the override is listed and acknowledged, and the tenant is told afterwards which of their configurations no longer applies.'
    on_conflict: not overridable
    rationale: Stated in the composition model's upgrade semantics; this is the point at which it is enforced.

  - key: no_reverse_migration_is_offered
    kind: constraint
    scope: kernel
    overridable_at: null
    default: >
      The platform offers no reverse migration. A correction is a forward deployment. Where a
      migration''s reversibility has not been established, migration_is_reversible is null and
      renders as unknown, never as true.
    on_conflict: not overridable
    rationale: >
      DEC-K-011 is unresolved and the evidence in the kernel establishes that forward-only is
      the norm in this class of platform. Implying a rollback the platform has not built is a
      promise that would be discovered during an incident.

  - key: support_access_is_consented_time_boxed_and_visible
    kind: guard
    scope: kernel
    overridable_at: null
    default: >
      A support session requires a ticket reference, consent or a contract clause, a time box,
      and an elevated operator session; it carries a redaction profile; and every action under
      it is written to the tenant''s own audit stream.
    on_conflict: not overridable

  - key: suspension_never_touches_data
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Suspension restricts sign-in and pauses integrations. It never deletes, hides, degrades or discards tenant data or queued work.'
    on_conflict: not overridable
    rationale: The most common suspension is an unpaid invoice paid the following week, and a suspension that destroyed anything would be unrecoverable for a routine commercial event.

  - key: export_precedes_erasure
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'A tenant purge is refused unless the export has been delivered or explicitly waived by the tenant, no legal hold exists anywhere in the tenant, and a second platform principal has confirmed.'
    on_conflict: not overridable

  - key: fleet_changes_proceed_in_waves
    kind: policy
    scope: capability
    overridable_at: null
    default: 'A deployment targeting more than one tenant proceeds in waves and halts when failures in a wave exceed the halt threshold. A single-wave deployment to every tenant requires an explicit acknowledgement.'
    on_conflict: not overridable
    rationale: A change that fails for one tenant will usually fail for the rest, and continuing turns one incident into fifty.

policy_knobs:
  - {key: provisioning_alert_minutes, default: 30, range: [1, 480], lowest_settable_scope: kernel}
  - {key: trial_silence_days, default: 7, range: [1, 90], lowest_settable_scope: kernel}
  - {key: suspension_review_days, default: 14, range: [1, 180], lowest_settable_scope: kernel}
  - {key: closure_retention_days, default: 90, range: [7, 730], lowest_settable_scope: kernel, note: how long after closure data is retained before erasure}
  - {key: reconciliation_interval_hours, default: 6, range: [1, 168], lowest_settable_scope: kernel}
  - {key: generated_manifest_stale_days, default: 7, range: [1, 90], lowest_settable_scope: kernel}
  - {key: staged_manifest_stale_days, default: 3, range: [1, 60], lowest_settable_scope: kernel}
  - {key: draft_version_stale_days, default: 30, range: [1, 180], lowest_settable_scope: kernel}
  - {key: adoption_window_days, default: 90, range: [7, 730], lowest_settable_scope: kernel}
  - {key: adoption_floor, default: 0.5, range: [0.0, 1.0], lowest_settable_scope: kernel}
  - {key: deprecation_grace_days, default: 180, range: [7, 1095], lowest_settable_scope: kernel}
  - {key: withdrawal_chase_hours, default: 4, range: [1, 72], lowest_settable_scope: kernel}
  - {key: version_lag_alert, default: 3, range: [1, 20], lowest_settable_scope: kernel}
  - {key: planned_deployment_stale_days, default: 14, range: [1, 90], lowest_settable_scope: kernel}
  - {key: rehearsal_timeout_hours, default: 4, range: [1, 72], lowest_settable_scope: kernel}
  - {key: approved_unexecuted_hours, default: 48, range: [1, 336], lowest_settable_scope: kernel}
  - {key: approval_validity_days, default: 7, range: [1, 90], lowest_settable_scope: kernel}
  - {key: wave_timeout_minutes, default: 30, range: [1, 480], lowest_settable_scope: kernel}
  - {key: default_wave_size, default: 1, range: [1, 1000], lowest_settable_scope: kernel}
  - {key: wave_halt_failure_fraction, default: 0.1, range: [0.0, 1.0], lowest_settable_scope: kernel}
  - {key: support_session_max_minutes, default: 60, range: [5, 480], lowest_settable_scope: kernel}
  - {key: support_session_daily_limit, default: 25, lowest_settable_scope: kernel}
  - {key: notify_impersonated_user, default: true}

open_questions:
  - {q: 'DEC-K-011 is unresolved and it lands here. The model offers no reverse migration and records migration reversibility as unknown where it has not been established, which is honest and means a failed migration leaves a tenant in a documented intermediate state with no automated recovery. What is the actual recovery path?', assumption: None. Forward-only with compensating changes is the shape the kernel evidence supports and no compensating-change mechanism is specified anywhere., confidence: VALIDATION_REQUIRED, method: 'resolve DEC-K-011, then specify the compensating-change mechanism and rehearse a failed migration end to end', priority: Critical, blocks: [DEC-K-011, deployment failure handling, any recovery-time commitment]}
  - {q: DEC-C-003 is unresolved and a halted deployment creates exactly the condition it asks about - a fleet on mixed capability versions. The model permits the state and specifies nothing about how long it may persist or how two versions coexist., assumption: None., confidence: VALIDATION_REQUIRED, method: resolve DEC-C-003, priority: Critical, blocks: [DEC-C-003, halt and cancel behaviour, version skew reporting]}
  - {q: 'Does every tenant get a staging environment? The composition model''s staging-first rule is unconditional and the per-tenant infrastructure cost is real. This capability''s stage_manifest action assumes one exists, and core_configuration raised the same tension from its own side.', assumption: None. Two capabilities now depend on an answer nobody has given., confidence: VALIDATION_REQUIRED, method: cost model against the target price point for the smallest customer segment, priority: Critical, blocks: [stage_manifest, core_configuration change sets, deployment rehearsal]}
  - {q: 'What is the platform''s obligation when a tenant closes - what must the export contain, in what format, and how long must it remain retrievable? The model refuses to purge before an export is delivered and does not specify what a delivered export is.', assumption: None. The guard exists and the artefact it guards is unspecified., confidence: VALIDATION_REQUIRED, method: 'legal review of data portability obligations for the target segments, plus a decision on format', priority: Critical, blocks: [export_precedes_erasure enforcement, closure timeline]}
  - {q: 'Should platform_support be able to see a tenant''s data at all outside an impersonation session - for example to diagnose a data problem without a live session? The model offers only impersonation, which requires a target principal and produces a session, and there are diagnostic tasks that fit neither.', assumption: Impersonation only. The consequence is that some diagnosis requires a customer to be available., confidence: VALIDATION_REQUIRED, method: 'measure how often support cannot proceed without a broader mechanism, before building one', priority: High}
