key: offline_sync
name: Offline Sync
layer: core
confidence: KNOWN
description: >
  Letting somebody keep working on a device with no connectivity, and reconciling what they
  did when it returns without losing their work and without corrupting anybody else's. It
  owns the local store, the mutation queue, the conflict model and the observability that
  lets a supervisor see what is stranded on a handset. Every field capability depends on it
  and none of them may implement their own.

principles:
  - Offline is the normal state for a field device, not a failure mode. The design starts from no connectivity and treats a connection as an opportunity rather than a precondition.
  - Work is never silently discarded. A queued mutation that cannot be applied is held with its evidence and surfaced to a person, because somebody did the work and destroying the record is worse than a conflict.
  - A conflict is a fact about two people, not a merge algorithm. Some fields can be merged automatically and the interesting ones cannot, and pretending otherwise silently destroys somebody's decision.
  - The queue is visible from the server before it arrives. A supervisor must be able to see that a device holds unsynced work, or stranded work is invisible until it is too late.
  - Financial and permission-sensitive actions never run offline. This is a kernel rule, not a policy knob, because a device is the weakest link in the security model.
  - Replay attributes work to the person who did it at the time they did it, not to whoever synced it. Attribution is the whole value of the record.

entities:

  - key: device_store
    name: Device Store
    description: What one device is holding - its dataset scope, its freshness, its queue depth and when the server last heard from it.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: device_ref, type: uuid, req: true, note: resolved through the principal_directory port}
      - {key: principal_id, type: uuid, req: true, note: 'whose queue this is. A shared device holds a separate store per principal, because queued work belongs to the person who did it'}
      - {key: scope_expression, type: text, req: true, note: 'what this device is entitled to hold, derived from the principal''s permission scope at sync time and never wider. A device holding data the principal cannot see is a disclosure that survives a permission change'}
      - {key: dataset_version, type: string, req: true, note: fingerprint of the schema and configuration the local store was built against}
      - {key: last_pull_at, type: timestamptz, nullable: true}
      - {key: last_push_at, type: timestamptz, nullable: true}
      - {key: last_seen_at, type: timestamptz, nullable: true}
      - {key: queued_mutation_count, type: int, req: true, default: 0, note: 'the number the SERVER believes is outstanding, updated on every contact. This is what makes stranded work visible before the device returns'}
      - {key: queued_financial_count, type: int, req: true, default: 0, note: should always be zero by the kernel rule; a non-zero value is a defect alert rather than an operational one}
      - {key: oldest_queued_at, type: timestamptz, nullable: true}
      - {key: storage_used_bytes, type: bigint, nullable: true}
      - {key: storage_limit_bytes, type: bigint, nullable: true}
      - {key: app_version, type: string, nullable: true}
      - {key: min_supported_version_ok, type: bool, req: true, default: true}
      - {key: wipe_requested_at, type: timestamptz, nullable: true}
      - {key: wipe_confirmed_at, type: timestamptz, nullable: true}
    invariants:
      - unique(tenant_id, device_ref, principal_id). A shared device holds one store per principal and the stores never merge, because a queued mutation belongs to the person who made it and replaying it under another identity would falsify the record.
      - scope_expression is derived from the principal's live permission scope at each pull and is never widened locally. A local store may hold less than the principal can see and never more.
      - queued_financial_count above zero is a defect. The kernel forbids offline financial mutations, so a non-zero value means a client bypassed the rule and it is raised as a security finding rather than as a sync condition.
      - A wipe request is not complete until the device confirms it. An unconfirmed wipe is a device that may still hold data, and treating a request as a completion is how a lost handset is recorded as cleared.
      - dataset_version mismatch blocks push, not pull. A device on an old schema may always receive corrections and may not write against a shape the server no longer has.
    states: [provisioning, active, degraded, blocked, wipe_pending, retired]
    initial_state: provisioning
    transitions:
      - {from: provisioning, to: active, action: complete_initial_sync, actor: the device, guard: the initial dataset is pulled in full and the dataset version matches, side_effects: the device may begin queueing mutations, reversibility: false}
      - {from: active, to: degraded, action: observe_degradation, actor: system, guard: 'the app version is below minimum, the dataset version is stale beyond the tolerated window, or storage is above the alert threshold', side_effects: push is restricted to already-queued mutations; no new mutation kinds are accepted locally, reversibility: true}
      - {from: degraded, to: active, action: complete_initial_sync, actor: the device, guard: the condition is resolved, side_effects: none, reversibility: true}
      - {from: active, to: blocked, action: block_store, actor: tenant_admin or system, guard: 'the device was blocked, the principal was suspended, or the membership was revoked', side_effects: 'pull stops immediately; the queue is RETAINED and its contents are surfaced to a supervisor for a decision, never auto-discarded and never auto-applied', reversibility: true}
      - {from: degraded, to: blocked, action: block_store, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: blocked, to: active, action: unblock_store, actor: tenant_admin, guard: the underlying block is cleared and a reason is supplied, side_effects: 'queued mutations become eligible for review and replay, each tagged with the block window they spanned', reversibility: false}
      - {from: blocked, to: wipe_pending, action: request_wipe, actor: tenant_admin or tenant_owner, guard: 'acting session is elevated, and the queued count and its contents have been acknowledged', side_effects: a wipe instruction is queued for the next contact; the queue contents remain visible server-side as a record of what will be lost, reversibility: true}
      - {from: active, to: wipe_pending, action: request_wipe, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: wipe_pending, to: retired, action: observe_wipe_confirmed, actor: system, guard: the device confirms the wipe, side_effects: the store is closed and the unrecovered queue is recorded permanently as lost work, reversibility: false}
      - {from: wipe_pending, to: active, action: cancel_wipe, actor: tenant_admin, guard: the device has not yet confirmed and a reason is supplied, side_effects: none, reversibility: false}
      - {from: blocked, to: retired, action: retire_store, actor: tenant_admin, guard: the queue is empty or explicitly abandoned with a reason, side_effects: none, reversibility: false}
    stuck_state_policy:
      provisioning: >
        A device that never completes its first sync is a person who cannot start. Threshold:
        provisioning_alert_minutes (default 30). Told: the principal on the device, and the
        supervisor of their location. Escape hatch: retry, reduce the scope, or provision on a
        better connection. The characteristic failure is an initial dataset too large for the
        connection at the location where the device will actually be used, which is precisely
        where it is being provisioned.
      active: >
        Steady state. Four monitored conditions, and these are the observability that makes
        this capability worth having. (a) A store whose oldest_queued_at exceeds
        stranded_work_alert_hours (default 12) - somebody's work exists only on a handset.
        Told: the principal and their supervisor. (b) A store not seen for
        device_silence_alert_hours (default 24) while holding a non-empty queue - the most
        dangerous condition, because both the work and the device may be gone. Told: the
        supervisor, escalating daily. (c) A store whose queue depth exceeds
        queue_depth_alert (default 200), which usually means a device that has been offline for
        days and whose replay will be long and conflict-prone. (d) queued_financial_count above
        zero, told to platform_operator as a security finding.
      degraded: >
        Threshold: degraded_alert_hours (default 24). Told: the principal and the supervisor,
        with the specific reason - version, staleness or storage - because the three have
        completely different remedies and a generic message produces a support call. Escape
        hatch: update, resync or free storage. A degraded store still pushes what it has
        queued, deliberately, because refusing to accept existing work over a version mismatch
        strands it permanently.
      blocked: >
        A blocked store holds work that nobody has decided about. Threshold: immediate on
        entry. Told: the supervisor and tenant_admin, with the queue contents summarised by
        kind and by age. Escape hatch: unblock and review, or explicitly abandon with a reason
        recorded against each mutation. Verity never auto-discards a blocked queue and never
        auto-applies one. Auto-applying launders a suspended person's writes; auto-discarding
        destroys a day of legitimate work, and only a human can tell which case it is.
      wipe_pending: >
        A wipe requested and unconfirmed means a device that may still hold data. Threshold:
        wipe_confirmation_hours (default 24), then daily. Told: tenant_admin and
        platform_operator. Escape hatch: none automatic. The store stays wipe_pending
        indefinitely rather than being presumed wiped, because presuming a wipe on a device
        that never returned is the exact opposite of what a security record should do.
      retired: >
        Terminal. Retained permanently, with the record of any queue that was never recovered,
        because a supervisor asking what was lost with a handset must have an answer. Nothing
        pends.

  - key: queued_mutation
    name: Queued Mutation
    description: One thing somebody did on a device that has not yet been applied on the server, with everything needed to apply it faithfully.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true, note: 'minted on the device, so the mutation has an identity before it has ever reached a server'}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: device_store_id, type: uuid, req: true, fk: device_store}
      - {key: sequence_in_device, type: bigint, req: true, immutable: true, note: 'monotonic per device store. Replay order within a device is this, never arrival order, because the person did them in an order and that order carries meaning'}
      - {key: capability_key, type: string, req: true, immutable: true}
      - {key: action_key, type: string, req: true, immutable: true}
      - {key: subject_ref, type: uuid, nullable: true, immutable: true}
      - {key: payload, type: json, req: true, immutable: true}
      - {key: base_version, type: string, nullable: true, immutable: true, note: 'the version of the subject the device was looking at when the person acted. The whole conflict model rests on this, and a mutation with no base version can only be applied blind'}
      - {key: occurred_at, type: timestamptz, req: true, immutable: true, note: 'when the person did it, from the device clock'}
      - {key: queued_at, type: timestamptz, req: true, immutable: true}
      - {key: received_at, type: timestamptz, nullable: true}
      - {key: applied_at, type: timestamptz, nullable: true}
      - {key: acting_principal_id, type: uuid, req: true, immutable: true, note: who did it. Replay attributes to this principal and never to whoever happened to be signed in at sync time}
      - {key: clock_skew_seconds, type: int, nullable: true, note: 'computed against the first server contact and retained, because it is the only evidence that occurred_at is unreliable'}
      - {key: attached_evidence_ids, type: json, nullable: true, note: evidence items that must arrive with this mutation. The unit is atomic - neither replays without the other}
      - {key: atomic_group_id, type: uuid, nullable: true, note: 'mutations that must apply together or not at all, such as a completion and its stock movements'}
      - {key: idempotency_key, type: string, req: true, immutable: true, note: carried through to the server action so that a retried push applies once}
      - {key: attempt_count, type: int, req: true, default: 0}
      - {key: conflict_id, type: uuid, nullable: true, fk: sync_conflict}
      - {key: outcome_code, type: string, nullable: true, note: 'the server''s response, retained so a device can show the person what happened to their work'}
    invariants:
      - Every field except the receipt, application, attempt and conflict fields is immutable. A mutation is a record of what somebody did and editing it falsifies that.
      - Replay within a device store is strictly in sequence_in_device order. Reordering is forbidden even where it would succeed, because the person performed a sequence and later items frequently depend on earlier ones in ways the payload does not express.
      - A mutation whose action is marked financial or permission-affecting is rejected at queue time on the device and, if one arrives anyway, at receipt on the server, as a security finding. This is the kernel rule and it is enforced twice deliberately.
      - A mutation with attached evidence or an atomic_group_id applies only when every member of its unit is present. Partial application of an atomic group is forbidden.
      - A mutation is never deleted. It is applied, superseded by a conflict resolution, or explicitly abandoned with a reason, and all three are retained.
    states: [queued, transmitted, applied, conflicted, rejected, abandoned, superseded]
    initial_state: queued
    transitions:
      - {from: queued, to: transmitted, action: push_mutations, actor: the device, guard: connectivity and the store is not blocked, side_effects: received_at set, reversibility: false}
      - {from: transmitted, to: applied, action: replay_mutation, actor: system, guard: 'the server action succeeds, or the idempotency key shows it already applied', side_effects: applied_at and outcome recorded; the device is told so the person sees their work confirmed, reversibility: false}
      - {from: transmitted, to: conflicted, action: replay_mutation, actor: system, guard: the base version no longer matches and the field-level merge cannot resolve it, side_effects: a sync_conflict is raised; the mutation and its evidence are held intact, reversibility: true}
      - {from: conflicted, to: applied, action: resolve_conflict, actor: 'a person, or system where the resolution is declared automatic for that field set', guard: a resolution is chosen, side_effects: the chosen outcome is written and both versions are retained on the conflict record, reversibility: false}
      - {from: conflicted, to: superseded, action: resolve_conflict, actor: a person, guard: the server version is kept and the device version is discarded with a reason, side_effects: 'the discarded payload is retained permanently, because somebody did that work', reversibility: false}
      - {from: transmitted, to: rejected, action: replay_mutation, actor: system, guard: 'the server action fails for a reason that will not change on retry - a validation failure, a permission denial, a subject that no longer exists', side_effects: the mutation is held with its reason and surfaced to the acting principal and their supervisor, reversibility: true}
      - {from: rejected, to: transmitted, action: retry_mutation, actor: a person, guard: 'the payload was corrected, or the blocking condition was resolved', side_effects: none, reversibility: false}
      - {from: rejected, to: abandoned, action: abandon_mutation, actor: the acting principal or a supervisor, guard: a reason is supplied, side_effects: the payload and any evidence are retained permanently, reversibility: false}
      - {from: conflicted, to: abandoned, action: abandon_mutation, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: queued, to: abandoned, action: abandon_mutation, actor: the acting principal or a supervisor, guard: a reason is supplied and the count is typed where the tenant requires it, side_effects: as above, reversibility: false}
    stuck_state_policy:
      queued: >
        Bounded by connectivity and by nothing else. Threshold: stranded_work_alert_hours
        (default 12) from queued_at, and a second escalation at
        stranded_work_critical_hours (default 72) at which the owning records are marked as
        having work that may never arrive. Told: the acting principal first, because the fix is
        usually to walk somewhere with a signal, then the supervisor. Escape hatch: sync, or
        abandon explicitly. This is the state where real work is actually lost and every
        threshold here is set to make that visible before the device is dropped in a puddle.
      transmitted: >
        A short mechanical window between arrival and replay. Threshold: replay_lag_minutes
        (default 5). Told: platform_operator. The device still shows the work as unconfirmed
        during this window, deliberately, because telling somebody their work is saved before
        it has been applied is a promise the platform may not be able to keep.
      conflicted: >
        A conflict is somebody's work waiting on a decision, and every hour it waits is an hour
        the two people involved remember the situation less clearly. Threshold:
        conflict_resolution_hours (default 8), escalating to the supervisor and then to
        ops_manager. Told: the acting principal and whoever made the competing change, both,
        because a conflict resolved by one party without the other knowing is how one of them
        later discovers their work vanished. Escape hatch: resolve. Never auto-resolved after
        any interval, because an expiring conflict resolves in favour of whoever was online.
      rejected: >
        Rejected work is work the server will not accept and that the person believes is done.
        Threshold: immediate. Told: the acting principal with the specific reason in plain
        terms, and their supervisor. Escape hatch: correct and retry, or abandon with a reason.
        The single most important property here is that the reason reaches the person who did
        the work rather than an integration log, because they are the only one who knows what
        they meant.
      applied: >
        Terminal. Retained for the audit period as the record of what was done offline and when
        it arrived. The sync lag between occurred_at and applied_at is retained and queryable,
        because a fortnight of work arriving in one burst is the shape of both a broken handset
        and a fabrication.
      abandoned: >
        Terminal. The payload and any evidence are retained permanently with the abandonment
        reason and the principal who abandoned it. This is the one place in the platform where
        somebody deliberately throws away recorded work, and it is the last place that should
        be untraceable.
      superseded: >
        Terminal. The discarded device version is retained in full on the conflict record.
        Nothing pends.

  - key: sync_conflict
    name: Sync Conflict
    description: Two versions of the truth about one record, with both retained and a person deciding between them.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: mutation_id, type: uuid, req: true, fk: queued_mutation}
      - {key: capability_key, type: string, req: true}
      - {key: subject_ref, type: uuid, req: true}
      - {key: conflicting_fields, type: json, req: true, note: flat list of field keys that actually differ. A conflict presented as two whole records is one nobody can decide}
      - {key: device_values, type: json, req: true, immutable: true}
      - {key: server_values, type: json, req: true, immutable: true}
      - {key: device_principal_id, type: uuid, req: true}
      - {key: server_principal_id, type: uuid, nullable: true, note: 'who made the competing change, so both parties can be told and, where possible, can speak to each other'}
      - {key: device_occurred_at, type: timestamptz, req: true}
      - {key: server_changed_at, type: timestamptz, req: true}
      - {key: auto_resolvable, type: bool, req: true, default: false, note: computed from the declared merge strategy of every conflicting field. False whenever any conflicting field has merge_strategy manual}
      - {key: resolution, type: enum, values: [unresolved, device_wins, server_wins, merged, both_retained, abandoned], req: true, default: unresolved}
      - {key: resolved_by_principal_id, type: uuid, nullable: true}
      - {key: resolution_reason, type: text, nullable: true}
      - {key: resolved_at, type: timestamptz, nullable: true}
    invariants:
      - device_values and server_values are both immutable and both retained permanently, whatever the resolution. A conflict where the losing version is discarded cannot be reviewed, and reviewing conflicts is the only way the merge strategies ever get corrected.
      - auto_resolvable is false whenever any conflicting field declares merge_strategy manual, and a manual field can never be resolved automatically at any scope.
      - resolution other than unresolved requires resolved_by_principal_id, except where auto_resolvable is true and the resolution followed the declared strategy, in which case the strategy is recorded in place of a principal.
      - both_retained is a legitimate resolution, used where two records should exist rather than one, and it produces a new record rather than editing either.
      - A conflict is never resolved by timestamp alone. Last-write-wins is a merge strategy a field may declare; it is never a default and never a fallback.
    states: [open, under_review, resolved, escalated]
    initial_state: open
    transitions:
      - {from: open, to: resolved, action: resolve_conflict, actor: system, guard: auto_resolvable is true and every conflicting field has a declared non-manual strategy, side_effects: the strategy is applied and recorded; both parties are told what happened to their change, reversibility: false}
      - {from: open, to: under_review, action: claim_conflict, actor: 'the device principal, the server principal or a supervisor', guard: null, side_effects: locked to the reviewer so two people do not resolve it differently, reversibility: true}
      - {from: under_review, to: open, action: release_conflict, actor: the reviewer or system_scheduler on claim timeout, guard: null, side_effects: none, reversibility: true}
      - {from: under_review, to: resolved, action: resolve_conflict, actor: a person, guard: a resolution and a reason are recorded, side_effects: 'the chosen outcome is written, both parties are told, both versions retained', reversibility: false}
      - {from: open, to: escalated, action: escalate_conflict, actor: system_scheduler or either party, guard: 'the resolution threshold passed, or the two parties disagree', side_effects: routed to the supervisor and then to ops_manager, reversibility: true}
      - {from: under_review, to: escalated, action: escalate_conflict, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: escalated, to: resolved, action: resolve_conflict, actor: 'supervisor, ops_manager or tenant_owner', guard: as for resolution, side_effects: as for resolution, reversibility: false}
    stuck_state_policy:
      open: >
        Threshold: conflict_claim_hours (default 4). Told: both parties. Escape hatch: claim
        and resolve. An unclaimed conflict is work in limbo that neither person can see the
        state of, and telling both is deliberate - a conflict where only one side knows is one
        where the other later discovers their change vanished.
      under_review: >
        Threshold: conflict_resolution_hours (default 8), and the claim itself times out at
        conflict_claim_timeout_hours (default 24) and returns to open, so a reviewer who goes
        off shift does not park somebody's work indefinitely. Told: both parties, with the
        elapsed time.
      escalated: >
        Threshold: escalated_conflict_hours (default 24), then daily. Told: both parties and
        the escalation chain. Escape hatch: resolve. No expiry and no automatic resolution at
        any point, because an expiring conflict resolves in favour of whoever happened to be
        online, which is always the office rather than the field.
      resolved: >
        Terminal. Both versions retained permanently. The monitored condition is a pattern -
        a field that conflicts more than field_conflict_alert times in a period, which means
        its merge strategy is wrong or two roles are legitimately editing the same thing and
        the workflow needs changing. Told: the owning capability's owner, monthly. This is the
        only signal that ever causes a merge strategy to be corrected.

ports:
  - port_key: offline_capability
    direction: provides
    contract: >
      Declare a local dataset scope, queue a mutation with its base version, its idempotency
      key, its evidence and its atomic group, and receive the outcome. Every field capability
      consumes this rather than implementing its own queue, so that conflict semantics,
      attribution and observability are uniform.
    cardinality: exactly_one

  - port_key: principal_directory
    direction: requires
    contract: Resolve the device and the principal, report device trust and block state, and report a principal being suspended or losing membership so the store can be blocked.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. A queue belongs to a person on a device, and without either the work cannot be attributed or the store secured.

  - port_key: authorization_decision
    direction: requires
    contract: Resolve the principal's scope for the local dataset, and re-evaluate permission at replay time rather than trusting the permission that applied when the mutation was made.
    cardinality: exactly_one
    unbound_behaviour: >
      FORBIDDEN. Re-evaluating permission at replay is what stops a mutation made before a
      permission was revoked from applying afterwards, and it is the single control that makes
      an offline queue safe to hold across a permission change.

  - port_key: evidence_capture
    direction: requires
    contract: Hold captured items in the same atomic unit as the mutation they evidence, and replay them together.
    cardinality: zero_or_one
    unbound_behaviour: 'Mutations queue without evidence and any capability requiring evidence cannot operate offline. The atomicity guarantee is unnecessary and the field surface refuses evidenced actions offline rather than accepting them and losing the evidence.'

  - port_key: audit_sink
    direction: requires
    contract: Record replay, conflict, rejection and abandonment as audit events, carrying both occurred_at and applied_at.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. The gap between when something was done and when it was recorded is precisely what an offline dispute examines, and it exists only in the audit record.

  - port_key: notification
    direction: requires
    contract: Deliver stranded-work, conflict and rejection messages to the acting principal and their supervisor.
    cardinality: zero_or_one
    unbound_behaviour: >
      Every condition degrades to a console list and to the device's own display. The device
      display is the more important of the two here, because the person holding it is the one
      who can fix stranded work, and it works with no server at all - which is why the local
      surface is the primary channel and the notification is the escalation.

actions:

  - key: pull_dataset
    entity: device_store
    label: Refresh what the device holds
    actors: [the device]
    rationale: >
      The local dataset is what makes work possible with no signal. Its scope, its freshness
      and its size are the three variables that decide whether a field application is usable,
      and all three are modelled rather than left to a client implementation.
    preconditions: [the store is not blocked, the principal is active, the app version is supported for pull]
    inputs: [device_store_id, since_cursor, requested_scope]
    creates: []
    updates: [last_pull_at, dataset_version, scope_expression, storage_used_bytes]
    events: [sync.pulled]
    notifications: []
    undoable: false
    confirmation_specification: 'None. A read performed by the device in the background. The control that matters is that the scope is derived server-side from live permissions rather than requested by the client.'
    audit_class: read_sensitive_only
    idempotency_key_source: device_store_id plus since_cursor. A repeated pull from the same cursor returns the same page.
    offline_policy: read_only
    concurrency: >
      Pull is a cursored read against a consistent snapshot. A permission change mid-pull does
      not produce a partially widened dataset; the cursor carries the scope fingerprint and a
      change invalidates the cursor, forcing the next page to be fetched under the new scope.
      This matters because the alternative is a device that ends a pull holding a mixture of
      two permission states.
    failure_modes:
      - {code: E_AUTHZ_SCOPE, cause: 'the requested scope exceeds the principal''s live permission', message: null, note: 'the scope is NARROWED server-side to what the principal may see and the narrowing is reported to the device, which then deletes what it may no longer hold. A client never widens its own scope'}
      - {code: E_PRECONDITION, cause: the dataset version has changed incompatibly, message: null, note: a full resync is required and is offered as such. A device silently mixing two schema versions produces mutations the server cannot interpret}
      - {code: E_QUOTA, cause: the dataset exceeds the device storage limit, message: null, note: the scope is reduced by the declared priority order - assignments for today before history - and the reduction is reported. A pull that simply fails leaves the device with nothing}
      - {code: E_RATE_LIMIT, cause: a device pulling far more often than its data changes, message: null, note: throttled. Usually a client defect and the person holding the device can do nothing about it}
      - {code: E_DEPENDENCY, cause: the authorization service is unavailable, message: null, note: 'the pull is REFUSED. Serving a dataset without resolving the scope would mean guessing what somebody may see, and the safe guess is nothing, which is the same as refusing'}
    edge_cases:
      - A principal whose scope narrows while their device is offline. The narrowing takes effect at the next pull, and the device deletes what it may no longer hold. Between the change and the next contact the device holds data the principal can no longer see, bounded by offline_grace_hours, and that exposure is stated in the security model rather than pretended away.
      - A shared device with several principals' stores. Each store pulls under its own principal's scope and they never merge. The device shows only the signed-in principal's store, and switching principals does not carry data across.
      - An initial pull at a location with poor connectivity - the characteristic provisioning failure. The dataset is delivered in priority order so that a partial pull is still usable, and the store reports which priorities it holds. A device with today's assignments and no history is far more useful than one with nothing.
      - A pull that would exceed storage. Reduced by priority rather than failed, and the reduction is visible to the person. A field application that silently holds less than the person expects is one they stop trusting the first time something is missing.

  - key: push_mutations
    entity: queued_mutation
    label: Send queued work
    actors: [the device]
    rationale: >
      The moment somebody's work becomes real. Order, attribution, atomicity and idempotency
      all have to hold simultaneously, and each of them is a place where a naive implementation
      quietly loses or duplicates work.
    preconditions: [the store is not blocked, the dataset version is compatible for push, connectivity exists]
    inputs: [device_store_id, mutations, evidence_items]
    creates: []
    updates: [mutation states, last_push_at, queued counts]
    events: [sync.pushed]
    notifications:
      - {to: the acting principal, channel: device_surface, when: any mutation is rejected or conflicted, template: work_needs_attention, must_include: [what_it_was, why], mandatory_operational: true}
    undoable: false
    confirmation_specification: 'None for the push itself, which is background. A confirmation IS required for abandoning queued work, which is a separate action and requires the count to be typed.'
    audit_class: always
    idempotency_key_source: 'the device-minted mutation id, carried through to each server action as its own idempotency key. A push interrupted halfway and retried applies each mutation exactly once, which is the property the entire capability rests on.'
    offline_policy: queue
    concurrency: >
      Mutations from one device store replay strictly in sequence_in_device order, and a
      mutation that conflicts or is rejected HALTS that store's replay by default rather than
      being skipped. Skipping ahead applies later work against a state the person never saw and
      is how one conflict silently corrupts five subsequent records. Different stores replay
      independently, so one device's conflict never blocks another's.
    failure_modes:
      - {code: E_CONFLICT_VERSION, cause: the subject changed since base_version, message: null, note: a conflict is raised and the mutation is HELD with its evidence. It is never discarded and never force-applied}
      - {code: E_AUTHZ_ENTITY, cause: the acting principal no longer holds the permission the action requires, message: null, note: 'REJECTED, not applied. Permission is re-evaluated at replay rather than trusted from queue time, which is what stops work queued before a revocation from applying after it'}
      - {code: E_PRECONDITION, cause: the subject no longer exists or has moved to a state that forbids the action, message: null, note: 'rejected and held. The most common instance is a completion for a work order cancelled while the device was offline, and the correct outcome is that a person sees it and decides, because the work was done'}
      - {code: E_VALIDATION, cause: the payload fails validation against the current schema, message: null, note: rejected and held with the specific validation error rendered for the person rather than for a log}
      - {code: E_PRECONDITION, cause: 'an atomic group is incomplete because one member''s evidence has not uploaded', message: null, note: the whole group waits rather than partially applying. A completion applied without its stock movements is the failure this grouping exists to prevent}
      - {code: E_PRECONDITION, cause: the mutation is for a financial or permission-affecting action, message: null, note: 'REJECTED and raised as a security finding against the client. The kernel forbids it and the server enforces it independently of the client, because a client that produced one is a client that cannot be trusted to enforce it'}
      - {code: E_TENANT_SUSPENDED, cause: the tenant was suspended while the device was offline, message: null, note: the push is refused and the queue is retained intact. Work is never discarded because of a billing state}
    edge_cases:
      - "A device offline for a fortnight pushing several hundred mutations. Replayed in order, oldest first, with the store's replay halting at the first unresolvable conflict. The person is shown one conflict at a time in the order they created the work, which is the only order in which their own decisions make sense to them."
      - A completion whose work order was cancelled offline. Rejected and held. The work was done and the record of it is the only evidence; discarding it because the record was cancelled destroys the one thing that would let somebody be paid for it.
      - Two devices holding conflicting offline edits to the same record. Whichever arrives first applies; the second conflicts and both versions are retained. Neither is privileged by being first, and the conflict record names both people so they can speak to each other.
      - Attribution at replay. Every applied mutation is attributed to acting_principal_id and to occurred_at, never to whoever synced it or to the moment of arrival. A supervisor who plugs in a technician's handset must not appear as the author of a week of work.
      - A mutation carrying an occurred_at in the future because the device clock is wrong. Applied with the claimed time retained and the skew recorded. Never silently corrected, because the skew is the only evidence that the timestamp is unreliable, and corrected timestamps make an offline dispute unwinnable for the person holding the device.
      - A push interrupted by connectivity loss halfway through. Resumed from the last acknowledged sequence. The idempotency keys make re-sending the boundary mutations harmless, which is why they are carried through to the server actions rather than being a transport-level concern.

  - key: resolve_conflict
    entity: sync_conflict
    label: Decide between two versions
    actors: [employee, supervisor, ops_manager, system]
    rationale: >
      The point at which the platform admits that two people did incompatible things and asks a
      human. Everything about the presentation is designed so that the human can actually
      decide - the differing fields only, both authors named, both times shown.
    preconditions: [the conflict is open, under_review or escalated, the resolver is a party to it or holds authority over the subject]
    inputs: [conflict_id, resolution, field_choices, reason]
    creates: []
    updates: [the subject record, conflict resolution, mutation state]
    events: [sync.conflict_resolved]
    notifications:
      - {to: both the device principal and the server principal, channel: in_app_and_device_surface, when: always, template: conflict_resolved, must_include: [what_was_kept, what_was_discarded, who_decided, reason], mandatory_operational: true}
      - {to: 'the owning capability''s owner', channel: in_app, when: the field conflict rate exceeds the alert, template: merge_strategy_review, batching_policy: monthly}
    undoable: false
    confirmation_specification: 'Modal showing only the differing fields, both values side by side with who set each and when, what will be kept and what will be discarded, and that the discarded version is retained but will not take effect. Requires a reason where any discarded field is marked manual. Required because the resolution writes a value one of two people did not choose.'
    audit_class: always
    idempotency_key_source: conflict_id plus the chosen resolution. A replayed resolution writes once.
    offline_policy: refuse
    concurrency: >
      The conflict is claimed before resolution so two people cannot resolve it differently.
      Resolution takes the subject row and re-checks the server version inside the transaction;
      where the server changed again since the conflict was raised, the resolution fails and a
      new conflict is raised on the new pair, because resolving against a stale server version
      would discard a third person's change nobody has seen.
    failure_modes:
      - {code: E_CONFLICT_VERSION, cause: the server version changed again since the conflict was raised, message: Someone else changed this record., note: a new conflict is raised on the current pair and the previous resolution attempt is retained. Three-way conflicts are rare and silently applying a stale resolution is how the third change disappears}
      - {code: E_VALIDATION, cause: a reason is required for a manual-strategy field and none is supplied, message: Say why. Both people will see it.}
      - {code: E_PRECONDITION, cause: the conflict is claimed by somebody else, message: Someone else is looking at this., note: names them and the remaining claim time}
      - {code: E_AUTHZ_ENTITY, cause: the resolver holds no authority over the subject, message: You do not have access to this record type.}
      - {code: E_PRECONDITION, cause: the resolution would apply a financial field from a device version, message: null, note: 'refused. A financial value cannot arrive from an offline device under any resolution, which is the kernel rule enforced once more at the last possible point'}
    edge_cases:
      - A conflict where the two versions are both correct because they concern different things that happened - a technician recorded a completion and a supervisor recorded a cancellation. both_retained produces two records and the underlying capability decides what that means. Forcing a single winner would erase one of two true facts.
      - Automatic resolution where every conflicting field declares a non-manual strategy. Applied and both parties are still told what happened to their change. Silent automatic resolution is how somebody discovers a fortnight later that their edit never took effect.
      - A conflict on a quantity field with last-write-wins declared. Applied by strategy and counted. The field conflict monitor exists precisely so that a quantity field carrying a careless last-write-wins strategy is discovered from its conflict rate rather than from a stock discrepancy.
      - A conflict whose device principal has since left. The supervisor resolves it, the departed principal is not notified, and the conflict record retains their authorship. Their work is still theirs.
      - A conflict escalated because the two parties disagree with each other. There is no mechanism inside the platform that compels agreement, and the escalated state exists so the disagreement is visible to somebody who can end it. The model does not pretend to arbitrate.

rules:
  - key: no_financial_or_permission_mutation_offline
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'An action touching a field marked financial, or affecting permissions, may never be queued offline and is rejected at replay if one arrives. Enforced independently on the client and the server.'
    on_conflict: not overridable
    rationale: The kernel rule. A device is the weakest link in the security model, and double enforcement exists because a client that produced such a mutation is a client that cannot be trusted to enforce anything.

  - key: replay_is_in_device_order_and_halts_on_conflict
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Mutations from one store replay in sequence_in_device order and replay halts at the first unresolved conflict or rejection rather than skipping it.'
    on_conflict: not overridable
    rationale: Skipping applies later work against a state the person never saw, which is how one conflict silently corrupts five subsequent records.

  - key: attribution_is_to_the_actor_and_the_moment
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A replayed mutation is attributed to acting_principal_id and occurred_at, never to the syncing principal or the arrival time. Both timestamps are retained.'
    on_conflict: not overridable

  - key: work_is_never_silently_discarded
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A mutation is applied, conflicted, rejected, superseded or explicitly abandoned with a reason. There is no path that deletes one, and the payload and evidence of an abandoned mutation are retained permanently.'
    on_conflict: not overridable

  - key: permission_is_re_evaluated_at_replay
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'Every replayed mutation is authorised against the principal''s permissions at replay time, not against those in force when it was queued.'
    on_conflict: not overridable
    rationale: This single rule is what makes it safe to hold a queue across a permission change, and it is the reason a revoked permission cannot be exercised by a device that was offline when it was revoked.

  - key: no_default_merge_strategy
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'Every offline-editable field declares a merge_strategy. A field without one is a hard generator error. Last-write-wins is a strategy a field may declare and is never a default or a fallback.'
    on_conflict: not overridable
    rationale: Kernel K02. Silent last-write-wins on a quantity field silently destroys stock, and the absence of a default is what forces somebody to think about each field once.

  - key: conflicts_never_auto_resolve_on_a_timer
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A conflict has no expiry. It escalates indefinitely until a person decides it, unless every conflicting field declares a non-manual strategy, in which case it resolves immediately rather than after a delay.'
    on_conflict: not overridable
    rationale: An expiring conflict resolves in favour of whoever was online, which is always the office rather than the field.

  - key: client_never_widens_its_own_scope
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'The local dataset scope is derived server-side from live permissions at every pull. A client request for a wider scope is narrowed rather than honoured or refused.'
    on_conflict: not overridable

policy_knobs:
  - {key: stranded_work_alert_hours, default: 12, range: [1, 168]}
  - {key: stranded_work_critical_hours, default: 72, range: [1, 720]}
  - {key: device_silence_alert_hours, default: 24, range: [1, 720]}
  - {key: queue_depth_alert, default: 200, range: [10, 10000]}
  - {key: provisioning_alert_minutes, default: 30, range: [1, 480]}
  - {key: degraded_alert_hours, default: 24, range: [1, 336]}
  - {key: wipe_confirmation_hours, default: 24, range: [1, 336]}
  - {key: replay_lag_minutes, default: 5, range: [1, 120], lowest_settable_scope: kernel}
  - {key: conflict_claim_hours, default: 4, range: [1, 168]}
  - {key: conflict_claim_timeout_hours, default: 24, range: [1, 336]}
  - {key: conflict_resolution_hours, default: 8, range: [1, 336]}
  - {key: escalated_conflict_hours, default: 24, range: [1, 336]}
  - {key: field_conflict_alert, default: 20, range: [1, 10000]}
  - {key: offline_grace_hours, default: 12, range: [0, 72], note: 'the same knob core_identity_session declares, resolved once and consumed by both. The maximum time a device may act on a cached permission set'}
  - {key: abandon_requires_typed_count, default: true}

open_questions:
  - {q: 'What is the correct behaviour when a device returns after longer than offline_grace_hours holding work performed under permissions that have since been revoked? The model rejects the mutations, which is safe and discards a person''s legitimate work performed while they still held the permission.', assumption: 'Rejected and held for a supervisor to decide, never auto-applied. The consequence - that legitimate work may need re-entering by somebody else - is real.', confidence: VALIDATION_REQUIRED, method: 'measure how often permissions change while a device is offline in pilot, and observe what supervisors do with the held queue', priority: Critical, blocks: [permission re-evaluation rule, offline_grace_hours default]}
  - {q: 'Should replay halt the whole store on a conflict, or halt only the affected subject and continue with unrelated mutations? Halting everything is safe and can strand a day of unrelated work behind one disputed record; halting per subject is more useful and requires a dependency model between mutations that the payload does not express.', assumption: 'Halt the whole store, which is the conservative choice and will be felt on the first busy day.', confidence: VALIDATION_REQUIRED, method: measure conflict rates and queue composition in pilot; if conflicts are rare the conservative choice costs nothing and if they are common it is unusable, priority: Critical, blocks: [replay ordering rule, field surface design]}
  - {q: 'How large may a local dataset be before the field application becomes unusable on the devices actually in use? Every scope, priority and storage decision in this capability depends on a number nobody has measured.', assumption: 'None. Priority-ordered pull exists so that a partial dataset is usable, without any evidence about where the limit falls.', confidence: VALIDATION_REQUIRED, method: 'measure install size, pull time and application responsiveness on the cheapest devices in the target segment at realistic dataset sizes', priority: Critical, blocks: [pull scope defaults, storage limits, provisioning experience]}
  - {q: 'Should a shared device support several principals holding queues simultaneously, or must a queue be drained before switching? The model supports several, which is more forgiving and means a device can hold several people''s unsynced work with no signal for days.', assumption: 'Several stores, one per principal, never merged. core_identity_session already refuses a sign-in while another principal''s queue is non-empty on a shared device, which contradicts this and is the tension worth resolving.', confidence: VALIDATION_REQUIRED, method: reconcile with the shared-device sign-in rule in core_identity_session and decide once, priority: High, blocks: [core_identity_session shared device sign-in edge case]}
  - {q: 'Is there any circumstance in which a device version of a financial field should be accepted? The kernel says never, and the practical consequence is that any field capability wanting to record a price, a quantity charged or a cost offline simply cannot.', assumption: 'Never, per the kernel. The consequence is accepted and is the reason work_order records parts as free text offline and inventory permits quantities but not costs.', confidence: WORKING_ASSUMPTION, method: confirm with operators that no field workflow genuinely requires capturing a monetary value offline, priority: High}
