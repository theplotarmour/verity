key: assets
name: Assets
layer: domain
confidence: KNOWN
description: >
  The register of things the tenant is responsible for, where they are, who holds them, what
  they have done, and what care they are due. It provides the subject that work is performed
  against, without knowing what kind of thing any of them is. Meters, warranties, maintenance
  plans and depreciation are here because each of them generates work, cost or obligation.

principles:
  - An asset is a subject, not a category. This capability holds identity, custody, condition and history; anything specific to a kind of thing lives in a pack as attributes or in a separate capability.
  - Custody and location are different facts. Something can be at a place and be the responsibility of somebody who is not there, and conflating them makes every loss investigation start from the wrong question.
  - A meter reading is evidence with a source and a reader, not a number. Readings go backwards, get mistyped and get estimated, and a model that treats them as a monotonic series produces maintenance schedules built on fiction.
  - Maintenance plans generate demand and never perform it. The plan says what is due; the work capability does it. Merging them makes a plan that cannot be rescheduled without editing history.
  - Depreciation is a derived view over an immutable cost history. It is never a stored number that somebody adjusts.
  - The hierarchy is a tree of responsibility, not of physical containment. What contains what is frequently unclear and rarely useful; who answers for what is always both.

entities:

  - key: asset
    name: Asset
    description: One identified thing the tenant is responsible for, with its identity, its custody, its condition and its position in a responsibility hierarchy.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: tag, type: string, req: true, unique_scope: tenant, immutable: true, note: 'the identifier physically attached to the thing and read out loud. Mandatory and immutable, because a re-tagged asset is a new record with a documented predecessor rather than the same record wearing a new label'}
      - {key: name, type: string, req: true}
      - {key: asset_class_id, type: uuid, req: true, fk: asset_class}
      - {key: parent_asset_id, type: uuid, nullable: true, fk: asset, note: 'responsibility hierarchy, not physical containment'}
      - {key: path, type: string, req: true, note: 'materialised ancestor path, so a subtree query is a prefix match'}
      - {key: location_ref, type: uuid, nullable: true, note: 'where it is, resolved through the org_structure port'}
      - {key: custodian_principal_id, type: uuid, nullable: true, note: 'who answers for it, resolved through the principal_directory port. Deliberately separate from location'}
      - {key: owning_party_ref, type: uuid, nullable: true, note: 'null when the tenant owns it; otherwise whose it is, resolved through the party_directory port. A great deal of what a business maintains belongs to somebody else'}
      - {key: serial_reference, type: string, nullable: true, note: 'the manufacturer''s identifier, which is what a warranty claim is made against'}
      - {key: attributes, type: json, nullable: true, note: 'pack-defined key-value scalars only, per the object-valued prohibition. This is the extension point that keeps kind-specific properties out of the core schema and it is the field DEC-K-001 will decide the future of'}
      - {key: acquired_on, type: date, nullable: true}
      - {key: acquisition_cost_minor, type: money_minor, nullable: true, financial: true}
      - {key: expected_life_months, type: int, nullable: true, financial: true}
      - {key: residual_value_minor, type: money_minor, nullable: true, financial: true}
      - {key: disposal_on, type: date, nullable: true}
      - {key: disposal_proceeds_minor, type: money_minor, nullable: true, financial: true}
      - {key: criticality, type: enum, values: [standard, high, critical], req: true, default: standard, note: drives escalation and plan priority without this capability knowing what an escalation is}
      - {key: condition, type: enum, values: [unknown, good, fair, poor, unserviceable], req: true, default: unknown, note: unknown is the honest initial value and is deliberately not good. An asset register that starts every record as good is a register nobody has looked at}
      - {key: condition_assessed_at, type: timestamptz, nullable: true, note: 'the age of a condition assessment is what tells you how much to trust it, and a condition with no date is an opinion of unknown vintage'}
      - {key: warranty_expires_on, type: date, nullable: true}
      - {key: warranty_party_ref, type: uuid, nullable: true}
    invariants:
      - parent_asset_id must not create a cycle and depth is bounded at asset_hierarchy_max_depth.
      - path is derived and never writable.
      - tag is immutable. Re-tagging creates a new asset with a recorded predecessor, so the physical label and the record never silently diverge.
      - Financial fields are gated by view_financial and are never offline_editable. Condition, location and custody are none of those things, because a technician in the field must be able to record all three.
      - An asset in state disposed may not be the parent of a non-disposed asset. Disposing of something that other things hang off is a decision about those things too.
      - condition_assessed_at is required whenever condition is anything other than unknown.
    states: [registered, in_service, in_storage, under_repair, impaired, lost, disposed]
    initial_state: registered
    transitions:
      - {from: registered, to: in_service, action: commission_asset, actor: supervisor or ops_manager, guard: 'a location and a custodian are set, and any mandatory attributes for the class are present', side_effects: the asset becomes a valid work subject and its maintenance plans begin generating demand, reversibility: true}
      - {from: in_service, to: in_storage, action: move_asset, actor: 'supervisor, ops_manager or employee', guard: a destination is supplied, side_effects: 'maintenance plans based on elapsed time continue; plans based on meter usage pause, because a stored thing accrues no usage', reversibility: true}
      - {from: in_storage, to: in_service, action: move_asset, actor: as above, guard: a location and a custodian are set, side_effects: usage-based plans resume from the last reading rather than from zero, reversibility: true}
      - {from: in_service, to: under_repair, action: record_condition, actor: 'employee, supervisor or system', guard: 'condition is recorded as poor or unserviceable, or a work order against it reports the asset out of service', side_effects: 'the asset is unavailable as a resource where it is published as one, and dependent assets are listed rather than automatically taken out of service', reversibility: true}
      - {from: under_repair, to: in_service, action: record_condition, actor: employee or supervisor, guard: condition is recorded as fair or better with an assessment date, side_effects: none, reversibility: true}
      - {from: under_repair, to: impaired, action: impair_asset, actor: ops_manager or finance, guard: acting session is elevated and a reason is supplied, side_effects: 'depreciation treatment changes, finance is told, replacement is flagged', reversibility: true}
      - {from: in_service, to: impaired, action: impair_asset, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: impaired, to: in_service, action: record_condition, actor: ops_manager or finance, guard: 'acting session is elevated, a reason is supplied and condition is fair or better', side_effects: none, reversibility: true}
      - {from: in_service, to: lost, action: record_loss, actor: supervisor or ops_manager, guard: a reason is supplied and the acting session is elevated, side_effects: 'the custodian at the time is recorded on the loss, finance is told, open work orders against it are listed', reversibility: true}
      - {from: in_storage, to: lost, action: record_loss, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: lost, to: in_service, action: record_recovery, actor: supervisor or ops_manager, guard: a reason is supplied and a condition is assessed, side_effects: 'the loss record is retained, because a thing that was lost and found is a different history from one that was never lost', reversibility: false}
      - {from: in_service, to: disposed, action: dispose_asset, actor: ops_manager or finance, guard: 'acting session is elevated, no child asset is non-disposed, open work orders are closed or reassigned, and proceeds or a nil disposal are recorded', side_effects: 'plans stop, depreciation closes, the disposal gain or loss becomes derivable', reversibility: false}
      - {from: in_storage, to: disposed, action: dispose_asset, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: impaired, to: disposed, action: dispose_asset, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: lost, to: disposed, action: dispose_asset, actor: as above, guard: acting session is elevated and the write-off is recorded with a reason, side_effects: as above, reversibility: false}
      - {from: under_repair, to: disposed, action: dispose_asset, actor: as above, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      registered: >
        A registered asset is on the books and not in use, which is either a stock of spares or
        an item somebody imported and never commissioned. Threshold:
        uncommissioned_days (default 30). Told: the creating principal and ops_manager. Escape
        hatch: commission, or move to storage explicitly. The characteristic failure is a bulk
        import at onboarding leaving several hundred assets that generate no maintenance
        demand because nothing has commissioned them, which is discovered when something
        breaks.
      in_service: >
        Steady state. Four monitored exceptions. (a) An asset whose condition has not been
        assessed for condition_stale_days (default 365, or shorter for high and critical
        criticality) - a condition of unknown vintage. (b) An asset with no custodian for
        uncustodied_days (default 30), which is a thing nobody answers for and is the single
        most reliable precursor of a loss. (c) An asset whose warranty expires within
        warranty_warning_days (default 60) while open work against it might be claimable -
        told with the open work listed, because the claim is worth money and the window is
        short. (d) An asset whose usage-based plan has had no meter reading for
        reading_stale_days (default 60), which means the plan is not generating demand and
        looks identical to an asset that needs no work.
      in_storage: >
        Storage is a valid long-term state. The monitored exception is stored value: assets in
        storage whose aggregate net book value exceeds a tenant threshold, or an individual
        asset stored for longer than storage_review_days (default 180). Told: ops_manager and
        finance, with the value, because stored assets are capital doing nothing and their
        cost is invisible unless somebody says it out loud.
      under_repair: >
        Threshold: under_repair_alert_days (default 14), shorter for high and critical
        criticality. Told: the custodian and ops_manager, with any open work orders against it
        named. Escape hatch: return to service, impair, or dispose. An asset under repair
        indefinitely with no open work order is the specific case worth naming - it means
        somebody marked it broken and nobody raised the work.
      impaired: >
        Threshold: impairment_review_days (default 90). Told: finance and ops_manager. Escape
        hatch: return to service, or dispose. An impaired asset that is neither repaired nor
        disposed is a decision nobody has taken and a value nobody has corrected.
      lost: >
        Threshold: loss_review_days (default 30). Told: ops_manager, finance and the custodian
        at the time of loss. Escape hatch: recover, or dispose as written off. Verity never
        auto-writes-off a lost asset at any age, because a write-off is a financial decision
        and because a lost thing that is quietly written off is a loss nobody investigated.
      disposed: >
        Terminal. The record is retained permanently, because work orders, meter readings,
        costs and custody history all reference it and an asset register with holes in it
        cannot be reconciled to a fixed asset ledger. Nothing pends.

  - key: asset_class
    name: Asset Class
    description: The definition of a kind of asset - what attributes it must carry, what plans apply to it by default, how it depreciates and what meters it has.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true}
      - {key: parent_class_id, type: uuid, nullable: true, fk: asset_class}
      - {key: required_attribute_keys, type: json, nullable: true, note: flat list of scalars that an asset of this class must carry before it can be commissioned}
      - {key: meter_definitions, type: json, nullable: true, note: 'flat list of scalars per meter - key, label, unit, is_cumulative, rollover_value. is_cumulative is mandatory because a cumulative meter and a periodic one behave completely differently on every reading'}
      - {key: default_plan_ids, type: json, nullable: true, note: flat list of maintenance plan references applied to new assets of this class}
      - {key: depreciation_method, type: enum, values: [none, straight_line, reducing_balance, usage_based], req: true, default: none, financial: true}
      - {key: default_life_months, type: int, nullable: true, financial: true}
      - {key: warranty_default_months, type: int, nullable: true}
      - {key: criticality_default, type: enum, values: [standard, high, critical], req: true, default: standard}
      - {key: source_pack_key, type: string, nullable: true}
    invariants:
      - Class hierarchy depth is bounded at asset_class_max_depth and may not contain a cycle.
      - depreciation_method=usage_based requires at least one cumulative meter definition. Depreciating by usage with nothing measuring usage is a calculation with no input.
      - depreciation_method other than none requires default_life_months, or every asset of the class to carry its own expected_life_months. A depreciation method with no life is not a method.
      - Editing a class never retroactively invalidates existing assets. Newly required attributes are reported as missing on existing assets rather than blocking them, because blocking a commissioned asset because somebody added a field is how a register stops being maintained.
    states: [draft, active, archived]
    initial_state: draft
    transitions:
      - {from: draft, to: active, action: publish_asset_class, actor: ops_manager or tenant_admin, guard: the depreciation method is internally consistent and every meter definition declares its cumulativity, side_effects: the class becomes selectable and its default plans apply to new assets, reversibility: true}
      - {from: active, to: draft, action: unpublish_asset_class, actor: as above, guard: no asset references it, side_effects: none, reversibility: true}
      - {from: active, to: archived, action: archive_asset_class, actor: as above, guard: no non-disposed asset references it, side_effects: 'removed from pickers, historical assets continue to resolve', reversibility: false}
      - {from: draft, to: archived, action: archive_asset_class, actor: as above, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_class_stale_days (default 21). Told: the creating principal. Escape
        hatch: publish or archive. The characteristic confusion is somebody having defined a
        class with its plans and finding that no new asset picks them up.
      active: >
        Two monitored exceptions. (a) A class whose required attributes are missing on more
        than missing_attribute_alert of its assets (default 0.2) - either the requirement was
        added after the fact or nobody is filling it in, and both mean the requirement is not
        real. (b) A class with a depreciation method and assets carrying no acquisition cost,
        which produces a depreciation schedule of nothing while appearing configured. Told:
        ops_manager and finance respectively.
      archived: >
        Terminal. Retained permanently so historical assets resolve. Nothing pends.

  - key: meter_reading
    name: Meter Reading
    description: One observation of a counter on an asset, with who read it, how, and whether it is plausible.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: asset_id, type: uuid, req: true, fk: asset}
      - {key: meter_key, type: string, req: true}
      - {key: value, type: decimal, req: true}
      - {key: unit, type: string, req: true}
      - {key: read_at, type: timestamptz, req: true}
      - {key: recorded_at, type: timestamptz, req: true}
      - {key: source, type: enum, values: [manual, work_order, integration, estimated, rollover_correction], req: true, note: 'estimated is first-class, because an estimated reading is what actually happens when nobody can get to the thing, and recording it as manual would make every downstream schedule look better evidenced than it is'}
      - {key: read_by_principal_id, type: uuid, nullable: true}
      - {key: evidence_ref, type: string, nullable: true, note: 'a photograph of the counter, through the evidence_capture port. This is what settles a disputed reading'}
      - {key: delta_since_previous, type: decimal, nullable: true, note: 'derived at write, so an implausible jump is detectable at the moment it is entered rather than at the next schedule run'}
      - {key: plausibility, type: enum, values: [not_assessed, plausible, implausible_jump, went_backwards, duplicate_value], req: true, default: not_assessed}
      - {key: superseded_by_reading_id, type: uuid, nullable: true, fk: meter_reading}
    invariants:
      - Readings are append-only. A wrong reading is superseded by a corrected one with a reason; it is never edited, because maintenance demand may already have been generated from it.
      - value is non-negative for a cumulative meter.
      - A reading lower than the previous one on a cumulative meter is recorded as went_backwards and is NOT rejected. Counters are replaced, roll over and are misread, and rejecting the reading means the true current value never gets in.
      - delta_since_previous is derived and frozen at write, against the reading in force at that moment. Recomputing it after a correction elsewhere would silently change history.
      - A reading whose read_at is earlier than an existing later reading is accepted and marked out-of-order, because a technician entering yesterday's reading today is ordinary.
    states: [recorded, superseded, disregarded]
    initial_state: recorded
    transitions:
      - {from: recorded, to: superseded, action: correct_reading, actor: 'employee, supervisor or ops_manager', guard: a corrected reading is written with a reason in the same transaction, side_effects: schedules recompute from the corrected series; any demand already generated is listed rather than withdrawn, reversibility: false}
      - {from: recorded, to: disregarded, action: disregard_reading, actor: supervisor or ops_manager, guard: a reason is supplied, side_effects: the reading is excluded from schedule computation and is retained and visible, reversibility: true}
      - {from: disregarded, to: recorded, action: reinstate_reading, actor: supervisor or ops_manager, guard: a reason is supplied, side_effects: schedules recompute, reversibility: false}
    stuck_state_policy:
      recorded: >
        Readings do not pend individually. Two conditions on the series are monitored here.
        (a) A reading marked implausible_jump or went_backwards that nobody has resolved within
        reading_review_days (default 7). Told: the custodian and the supervisor, with the
        previous reading alongside, because the resolution is almost always either a
        transposed digit or a replaced counter and both are obvious once the two numbers are
        side by side. (b) A meter with no reading at all for reading_stale_days (default 60)
        while a usage-based plan depends on it - the plan is silently generating no demand,
        which is indistinguishable from an asset that needs no work. This is the most
        dangerous quiet failure in the capability and it is reported to ops_manager.
      superseded: >
        Terminal. Retained permanently. The monitored condition is a pattern of corrections
        concentrated on one asset or one reader, told to ops_manager, because it is either a
        failing counter or a systematic misreading and both are fixable once seen.
      disregarded: >
        Terminal unless reinstated. Retained and visible in the series rather than hidden,
        because a series with invisible gaps cannot be audited. The monitored condition is a
        disregard rate above disregard_rate_alert (default 0.05), which usually means the
        plausibility thresholds are wrong rather than that the readings are.

  - key: maintenance_plan
    name: Maintenance Plan
    description: A rule that generates work against an asset on a schedule, on usage, or on a condition - and never performs any of it.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true}
      - {key: applies_to_class_id, type: uuid, nullable: true, fk: asset_class}
      - {key: applies_to_asset_ids, type: json, nullable: true, note: 'flat list, for a plan attached to specific assets rather than to a class'}
      - {key: trigger_kind, type: enum, values: [elapsed_time, meter_usage, condition_threshold, external_signal], req: true}
      - {key: interval_days, type: int, nullable: true}
      - {key: meter_key, type: string, nullable: true}
      - {key: meter_interval, type: decimal, nullable: true}
      - {key: condition_trigger, type: enum, values: [none, fair, poor, unserviceable], req: true, default: none}
      - {key: lead_days, type: int, req: true, default: 7, note: 'how far ahead demand is generated, so the work can be scheduled rather than becoming urgent the day it is due'}
      - {key: tolerance_days, type: int, req: true, default: 0, note: 'how late is still compliant. Explicit, because a plan with no tolerance reports every job done a day late as a breach and the report becomes noise'}
      - {key: work_type_ref, type: uuid, nullable: true, note: 'what kind of work to raise, resolved through the work_generation port'}
      - {key: last_generated_at, type: timestamptz, nullable: true}
      - {key: next_due_at, type: timestamptz, nullable: true}
      - {key: next_due_meter_value, type: decimal, nullable: true}
      - {key: suppress_when_out_of_service, type: bool, req: true, default: true, note: 'whether to keep generating demand for something already under repair. Default true, because raising a service job for a broken thing wastes a visit'}
    invariants:
      - trigger_kind=elapsed_time requires interval_days. trigger_kind=meter_usage requires meter_key and meter_interval. trigger_kind=condition_threshold requires condition_trigger other than none.
      - A plan with both a class and an explicit asset list applies to the union, and the overlap generates one demand rather than two. Two plans generating two identical work orders for one due date is the classic duplicate in maintenance systems.
      - A plan never creates work directly. It emits demand through the work_generation port, so that rescheduling, cancelling and completing all belong to the capability that owns work.
      - Changing a plan never withdraws demand already generated. Existing work is listed for review, because a technician may already be on the way.
    states: [draft, active, suspended, retired]
    initial_state: draft
    transitions:
      - {from: draft, to: active, action: publish_plan, actor: ops_manager or tenant_admin, guard: the trigger configuration is internally consistent and a work type resolves where the port is bound, side_effects: 'demand generation begins from the next due point, not retrospectively', reversibility: true}
      - {from: active, to: suspended, action: suspend_plan, actor: ops_manager or supervisor, guard: a reason is supplied, side_effects: generation stops; demand already generated is untouched and listed, reversibility: true}
      - {from: suspended, to: active, action: resume_plan, actor: as above, guard: null, side_effects: 'generation resumes from now, and the gap created while suspended is listed rather than backfilled', reversibility: true}
      - {from: active, to: retired, action: retire_plan, actor: ops_manager or tenant_admin, guard: a reason is supplied, side_effects: generation stops permanently; outstanding demand is listed for cancellation rather than cancelled automatically, reversibility: false}
      - {from: suspended, to: retired, action: retire_plan, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: draft, to: retired, action: retire_plan, actor: as above, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_plan_stale_days (default 14). Told: the creating principal. Escape
        hatch: publish or retire. The specific risk is somebody having written a plan in
        response to a failure and believing it is running.
      active: >
        The most valuable monitor here. (a) A plan whose last_generated_at is older than its
        interval plus its lead time - it should have generated and did not, which means either
        the generation job is not running or the trigger cannot resolve. Threshold: interval
        plus lead plus generation_lag_days (default 2). Told: ops_manager AND
        platform_operator, because the two causes look identical and have different fixes, and
        this is the case where nobody notices because absent work orders are invisible.
        (b) A meter-triggered plan whose meter has gone stale, which is the same silence seen
        from the meter side and is reported once rather than twice by correlating the two.
        (c) A plan whose generated work is completed later than tolerance on more than
        overdue_completion_alert of occurrences (default 0.3) - the interval is shorter than
        the operation can sustain, which is a planning conversation rather than a compliance
        failure.
      suspended: >
        Threshold: plan_suspension_review_days (default 30). Told: the suspending principal and
        ops_manager. Escape hatch: resume or retire. A suspended plan produces no work and no
        alerts, so it is invisible by construction and the review is the only thing that
        surfaces it.
      retired: >
        Terminal. Retained, because it is the explanation for work that already exists.
        Nothing pends.

ports:
  - port_key: work_subject
    direction: provides
    contract: >
      Resolve an asset reference to a display label, its location, its state, its criticality
      and whether it wants to be told about work against it. This is the port that makes an
      asset a valid subject for a work order without the work capability knowing what an asset
      is.
    cardinality: zero_or_many

  - port_key: work_generation
    direction: requires
    contract: Raise a unit of work of a stated type against an asset for a due date, and report back when it completes or is cancelled.
    cardinality: zero_or_one
    unbound_behaviour: >
      Plans compute their due dates and generate NOTHING. The due list exists and is visible
      and nobody is dispatched. This is genuinely useful as a register with a reminder list and
      it is not maintenance management, and the surface says which of the two the tenant has.

  - port_key: schedulable_resource
    direction: provides
    contract: Publish an in-service asset as a schedulable resource with its availability and capabilities, for operations that schedule things rather than only people.
    cardinality: zero_or_many

  - port_key: org_structure
    direction: requires
    contract: Resolve asset locations and the site partition.
    cardinality: zero_or_one
    unbound_behaviour: Assets carry no location and are tenant-scoped. Location-based work routing and the whole notion of an asset being somewhere are unavailable, which for a register of fixed things is a material loss and for a register of things people carry is almost none.

  - port_key: party_directory
    direction: requires
    contract: Resolve the owning party for assets belonging to somebody else, and the warranty party for claims.
    cardinality: zero_or_one
    unbound_behaviour: 'Every asset is treated as the tenant''s own and warranty parties cannot be recorded. For a business that maintains other people''s things this is a material limitation, and the warranty warning degrades to a date with nobody to claim from.'

  - port_key: evidence_capture
    direction: requires
    contract: Attach photographs to meter readings, condition assessments and disposals.
    cardinality: zero_or_one
    unbound_behaviour: Readings and conditions are recorded without evidence. A disputed reading becomes one person's word, which matters most where readings drive billing or warranty claims.

  - port_key: stock_movement_sink
    direction: requires
    contract: Record parts consumed against an asset, so that lifetime cost is derivable.
    cardinality: zero_or_one
    unbound_behaviour: 'Lifetime cost includes labour and external cost only. Parts appear as free text on the underlying work orders, so total cost of ownership is understated by an unknown amount rather than being wrong by a known one, and the surface says so.'

  - port_key: financial_document_sink
    direction: requires
    contract: Report acquisition, depreciation, impairment and disposal movements for the accounting period.
    cardinality: zero_or_one
    unbound_behaviour: 'Depreciation is computed and reported here and posted nowhere. The register produces a schedule to be read rather than entries, which is how a business with an external accountant operates.'

  - port_key: notification
    direction: requires
    contract: Deliver warranty expiry, plan due, meter stale, condition and custody messages.
    cardinality: zero_or_one
    unbound_behaviour: Everything degrades to console lists. Warranty expiry in particular becomes invisible, which converts a claimable repair into a paid one.

actions:

  - key: register_asset
    entity: asset
    label: Add an asset
    actors: [supervisor, ops_manager, tenant_admin, integration_principal]
    preconditions: [a class is chosen and active, the tag is unique within the tenant]
    inputs: [tag, name, asset_class_id, parent_asset_id, location_ref, custodian_principal_id, owning_party_ref, serial_reference, attributes, acquired_on, acquisition_cost_minor]
    creates: [asset, plan attachments from the class defaults]
    updates: [parent path index]
    events: [asset.registered]
    notifications:
      - {to: the named custodian, channel: in_app, when: a custodian is set, template: asset_assigned_to_you, must_include: [tag, name, location]}
    undoable: true
    reversal_action: dispose_asset while still registered
    audit_class: always
    idempotency_key_source: 'tenant_id plus tag. A re-run of an onboarding import returns the existing asset rather than creating a second record for one physical thing.'
    offline_policy: queue
    concurrency: Unique index on (tenant_id, tag). Path materialisation for a subtree happens under a lock on the parent, as for locations, so a child cannot compute its path from a stale parent.
    failure_modes:
      - {code: E_CONFLICT_UNIQUE, cause: the tag already exists, message: That tag is already used., note: 'shows the existing asset, because the next question is always which one'}
      - {code: E_PRECONDITION, cause: the class is not active, message: This kind of asset is not available.}
      - {code: E_VALIDATION, cause: a required attribute for the class is missing, message: field-specific, note: 'permitted at registration and blocking at commissioning, because a bulk import frequently lacks details that are filled in when somebody physically visits the thing'}
      - {code: E_AUTHZ_FIELD, cause: acquisition cost supplied without view_financial, message: null, note: dropped and reported}
      - {code: E_QUOTA, cause: asset count limit reached, message: Plan limit reached.}
      - {code: E_VALIDATION, cause: parent would create a cycle or exceed the depth bound, message: field-specific, note: names the path}
    edge_cases:
      - A bulk import at onboarding. Idempotent on the tag, so a re-uploaded file produces no duplicates. Assets arrive in registered rather than in_service, and the uncommissioned monitor is what stops several hundred of them sitting there generating no maintenance demand - which is exactly what happens without it.
      - An asset registered without a class-required attribute. Permitted, and commissioning is what blocks. This split is deliberate: the register should accept what is known now, and the point at which the thing becomes operationally live is the right place to insist.
      - Registering something that belongs to a counterparty. Fully supported through owning_party_ref and is the normal case for a maintenance business. Depreciation does not apply to it, and the surface does not show depreciation fields at all rather than showing them empty.
      - Two physical things sharing one tag because a label was reused. The unique constraint catches it and the resolution is a new tag, never a re-tag, because the immutable tag is what keeps the physical label and the record aligned.
      - Registration offline by somebody walking round a location with a scanner. Queued. Tag conflicts resolve on sync and are surfaced as a conflict rather than silently merged, because two things with one label is a physical problem that needs a physical fix.

  - key: record_reading
    entity: meter_reading
    label: Record a meter reading
    actors: [employee, supervisor, integration_principal, system]
    rationale: >
      Readings drive maintenance demand, usage-based depreciation and frequently billing. They
      are entered by somebody standing in front of a counter, get transposed, go backwards when
      a counter is replaced, and are estimated when nobody can reach the thing. Every one of
      those has to be recordable and distinguishable.
    preconditions: [the asset exists and is not disposed, the meter key is defined on its class]
    inputs: [asset_id, meter_key, value, unit, read_at, source, evidence_ref]
    creates: [meter_reading]
    updates: [plan next_due_meter_value, plausibility assessment]
    events: [asset.reading_recorded, asset.reading_implausible]
    notifications:
      - {to: the custodian and the supervisor, channel: in_app, when: plausibility is implausible_jump or went_backwards, template: reading_needs_review, must_include: [previous_value, new_value, delta, previous_read_at], batching_policy: daily digest}
    undoable: true
    reversal_action: correct_reading, or disregard_reading
    audit_class: always
    idempotency_key_source: >
      asset_id plus meter_key plus read_at truncated to the minute plus value. Two people
      recording the same reading from the same counter produce one row, which happens routinely
      when a technician records it and an integration also reports it.
    offline_policy: queue
    concurrency: >
      Readings are append-only and do not contend. Plausibility is assessed against the latest
      reading at write time and is frozen; a later out-of-order reading does not retrospectively
      change an earlier assessment, because that assessment is what somebody acted on.
    failure_modes:
      - {code: E_VALIDATION, cause: 'the meter key is not defined on the asset''s class', message: This asset does not have that meter., note: names the meters it does have}
      - {code: E_VALIDATION, cause: unit does not match the meter definition, message: field-specific, note: 'refused rather than converted. An assumed conversion between hours and kilometres is not a rounding error, it is a different quantity'}
      - {code: E_VALIDATION, cause: a negative value on a cumulative meter, message: field-specific}
      - {code: E_PRECONDITION, cause: the value is lower than the previous reading on a cumulative meter, message: null, note: 'ACCEPTED and marked went_backwards. Counters are replaced, roll over and are misread, and rejecting the reading means the true current value never gets recorded at all'}
      - {code: E_PRECONDITION, cause: the delta exceeds the plausibility threshold for the meter, message: null, note: accepted and marked implausible_jump. A transposed digit and a genuinely heavy month look identical to a threshold and only a person can tell them apart}
      - {code: E_PRECONDITION, cause: the asset is disposed, message: This action is not available in the current state.}
    edge_cases:
      - A replaced counter reading from zero. Recorded as went_backwards and resolved by a rollover_correction reading that records the retired counter's final value and the new counter's start, so cumulative usage across the replacement remains derivable. Without this the asset's lifetime usage resets and every usage-based plan and depreciation figure silently restarts.
      - An estimated reading because the asset could not be reached. Recorded with source=estimated. Plans still compute from it and every downstream artefact carries the estimation through, so a maintenance record built on estimates is visibly built on estimates.
      - A reading entered days after it was taken. read_at and recorded_at are both retained, plans compute from read_at, and the gap is visible. Computing from recorded_at would push every due date later by however long the paperwork took.
      - Two readings for one asset arriving out of order from an offline device. Both are stored, the series is ordered by read_at, and each carries the plausibility assessment made at its own write time. The frozen assessment matters because a technician may already have been dispatched on the strength of it.
      - A reading that triggers a plan whose demand is already open. The plan generates one demand, not two, because generation is idempotent per plan per due point. Duplicate maintenance work orders are the classic failure of meter-driven maintenance.

  - key: transfer_custody
    entity: asset
    label: Hand an asset over
    actors: [employee, supervisor, ops_manager]
    rationale: >
      Custody is the fact that decides who answers when something is missing. Modelled as an
      explicit two-sided act rather than an edit to a field, because an unacknowledged transfer
      is exactly how an asset becomes nobody's responsibility.
    preconditions: [the asset is not disposed, a receiving custodian is named, the acting principal is the current custodian or holds edit on asset at a covering scope]
    inputs: [asset_id, to_custodian_principal_id, to_location_ref, condition, condition_note, evidence_ref, reason]
    creates: [a custody transfer record]
    updates: [asset custodian, location, condition, condition_assessed_at]
    events: [asset.custody_transferred]
    notifications:
      - {to: the receiving custodian, channel: push_and_in_app, when: always, template: asset_handed_to_you, must_include: [tag, name, condition_stated, who_from], mandatory_operational: true}
      - {to: the previous custodian, channel: in_app, when: the transfer was initiated by somebody else, template: asset_taken_from_you}
      - {to: supervisor, channel: in_app, when: the transfer is not acknowledged within the acknowledgement window, template: unacknowledged_transfer}
    undoable: true
    reversal_action: transfer_custody back, which is a new transfer rather than an undo
    audit_class: always
    idempotency_key_source: asset_id plus to_custodian_principal_id plus the acting principal plus the minute bucket
    offline_policy: queue
    concurrency: >
      Custody is a single-valued field written under the asset row lock, so two concurrent
      transfers serialise and the loser is told who currently holds it. The transfer record is
      appended regardless, so an attempted transfer that lost a race is still visible - which
      matters, because two people both believing they handed something to a third is exactly
      how a loss investigation stalls.
    failure_modes:
      - {code: E_PRECONDITION, cause: the asset is disposed or lost, message: This action is not available in the current state., note: 'for a lost asset the correct act is record_recovery, and the message says so'}
      - {code: E_VALIDATION, cause: the receiving custodian is the current one, message: This is already theirs.}
      - {code: E_AUTHZ_SCOPE, cause: 'the receiving custodian is outside the acting principal''s scope', message: Not found.}
      - {code: E_VALIDATION, cause: condition not stated where the tenant requires it on transfer, message: Say what condition it is in., note: a transfer with no condition statement is how a dispute about who broke something becomes unresolvable}
      - {code: E_CONFLICT_VERSION, cause: custody changed since the screen loaded, message: Someone else changed this record., note: names the current custodian}
    edge_cases:
      - A transfer the receiving custodian never acknowledges. The custody changes immediately and the lack of acknowledgement is reported, because holding the transfer pending acknowledgement would leave the asset with the person who no longer has it. Acknowledgement is evidence, not a gate.
      - A transfer to somebody whose engagement ends before they acknowledge. The asset returns to the transferring custodian automatically and both are told, because an asset held by a departed person is a loss waiting to be discovered at a count.
      - Condition recorded differently by the two parties. Both statements are retained on the transfer record. The model does not reconcile them; a difference between what the giver said and what the receiver said is precisely the evidence a later damage dispute needs.
      - Bulk transfer when a custodian leaves. Supported as a batch with one reason and one correlation id, so the receiving custodian gets one message listing everything rather than forty messages.
      - A transfer recorded offline at a handover in the field. Queued with its evidence as one unit. Where two offline transfers of one asset sync in conflicting order, both records are retained, the later read_at wins for the current custodian, and the conflict is surfaced rather than resolved silently.

rules:
  - key: custody_and_location_are_separate
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'An asset''s location and its custodian are independent fields and neither is derived from the other.'
    on_conflict: not overridable
    rationale: Something can be at a place and be the responsibility of somebody who is not there, and conflating the two makes every loss investigation start from the wrong question.

  - key: readings_are_append_only_and_never_rejected
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A meter reading is never rejected for going backwards or for an implausible delta. It is recorded, assessed and flagged. Corrections supersede; they never edit.'
    on_conflict: not overridable
    rationale: Rejecting the reading means the true current value never gets recorded, and the series then contains only the values that happened to look reasonable.

  - key: plans_generate_and_never_perform
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A maintenance plan emits demand through the work_generation port. It never creates, schedules, completes or cancels work itself.'
    on_conflict: not overridable

  - key: generation_is_idempotent_per_due_point
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A plan generates at most one demand per asset per due point, whether triggered by elapsed time, meter or condition, and overlapping plans that would produce identical work at one due point produce one demand.'
    on_conflict: not overridable
    rationale: Duplicate maintenance work orders are the classic failure of meter-driven maintenance and they destroy trust in the schedule within a month.

  - key: condition_starts_unknown
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A newly registered asset has condition unknown, and any condition other than unknown requires an assessment date.'
    on_conflict: not overridable
    rationale: A register that starts every record as good is a register nobody has looked at, and it reports perfect condition across an estate that has never been inspected.

  - key: tag_is_immutable
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'The asset tag may never be changed. Re-tagging creates a new asset recording its predecessor.'
    on_conflict: not overridable

  - key: nothing_is_written_off_by_age
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'No age or threshold moves an asset to disposed or writes off a lost asset. Both are explicit acts by a principal with the authority.'
    on_conflict: not overridable

  - key: plan_tolerance
    kind: policy
    scope: capability
    overridable_at: site
    default: 'tolerance_days 0 for critical assets, 7 for high, 14 for standard. Completion within tolerance is compliant.'
    on_conflict: the stricter tolerance wins
    rationale: A plan with no tolerance reports every job done a day late as a breach, and a compliance report that is mostly noise is a compliance report nobody reads.

policy_knobs:
  - {key: asset_hierarchy_max_depth, default: 6, range: [1, 12], lowest_settable_scope: kernel}
  - {key: asset_class_max_depth, default: 4, range: [1, 8], lowest_settable_scope: kernel}
  - {key: uncommissioned_days, default: 30, range: [1, 365]}
  - {key: condition_stale_days, default: 365, range: [7, 1825]}
  - {key: uncustodied_days, default: 30, range: [1, 365]}
  - {key: warranty_warning_days, default: 60, range: [1, 365]}
  - {key: reading_stale_days, default: 60, range: [1, 730]}
  - {key: reading_review_days, default: 7, range: [1, 90]}
  - {key: disregard_rate_alert, default: 0.05, range: [0.001, 1.0]}
  - {key: storage_review_days, default: 180, range: [7, 1095]}
  - {key: under_repair_alert_days, default: 14, range: [1, 365]}
  - {key: impairment_review_days, default: 90, range: [1, 730]}
  - {key: loss_review_days, default: 30, range: [1, 365]}
  - {key: draft_class_stale_days, default: 21, range: [1, 180]}
  - {key: draft_plan_stale_days, default: 14, range: [1, 180]}
  - {key: generation_lag_days, default: 2, range: [1, 30], lowest_settable_scope: kernel}
  - {key: plan_suspension_review_days, default: 30, range: [1, 365]}
  - {key: overdue_completion_alert, default: 0.3, range: [0.01, 1.0]}
  - {key: missing_attribute_alert, default: 0.2, range: [0.01, 1.0]}
  - {key: meter_jump_threshold_multiple, default: 3, range: [1, 100], note: how many times the trailing average delta counts as an implausible jump}
  - {key: transfer_requires_condition, default: true}
  - {key: transfer_acknowledgement_hours, default: 48, range: [1, 720]}

open_questions:
  - {q: 'Should asset attributes be tenant-definable, and if so how? attributes is a flat scalar map today, which keeps kind-specific properties out of the core schema and gives them no validation, no permission gating and no reporting. This is DEC-K-001 arriving in the capability where the pressure to extend is most obvious.', assumption: 'None. The flat map exists as a holding position, not as a decision.', confidence: VALIDATION_REQUIRED, method: resolve DEC-K-001, priority: Critical, blocks: [DEC-K-001, asset.attributes, asset_class.required_attribute_keys]}
  - {q: 'Is depreciation in scope for Verity at all, or does it belong entirely to whatever accounting system the tenant uses? The model computes it as a derived view and posts nothing, which is defensible and may be an unnecessary source of numbers that disagree with the accountant''s.', assumption: 'Computed and reported, never posted. Whether it should be computed at all is the open part.', confidence: VALIDATION_REQUIRED, method: operator interviews plus a review of whether any target tenant would use the figure, priority: High}
  - {q: 'How should a meter rollover or counter replacement be handled where the retired counter''s final value was never read? The model requires a rollover_correction carrying both values, and if the final value is unknown the lifetime series has an unquantifiable gap.', assumption: The gap is recorded as unquantifiable rather than estimated. Estimating it would make every downstream usage figure confidently wrong., confidence: WORKING_ASSUMPTION, method: measure how often this occurs in pilot, priority: Medium}
  - {q: 'Should an asset be publishable as a schedulable resource by default, or only where a tenant opts in? Publishing everything makes the scheduler''s resource picker unusable; publishing nothing means a tenant that schedules equipment has to discover the setting.', assumption: Opt in per asset class. Not validated., confidence: WORKING_ASSUMPTION, method: pilot with a tenant that schedules equipment alongside people, priority: Medium}
  - {q: 'Who owns an asset''s condition when the tenant maintains it and a counterparty owns it? A condition assessment is an opinion with commercial consequences for both parties, and the model records only the tenant''s.', assumption: 'The tenant''s assessment is recorded and the counterparty''s is not modelled at all.', confidence: VALIDATION_REQUIRED, method: review with a maintenance business whose contracts include condition reporting, priority: High, blocks: [customer_surface for assets, condition dispute handling]}
