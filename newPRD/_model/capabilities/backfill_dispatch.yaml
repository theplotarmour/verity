key: backfill_dispatch
name: Backfill Dispatch
layer: domain
confidence: KNOWN
description: >
  Detecting that a commitment has lost its cover, finding somebody else, and recording what
  the replacement cost and who bears it. It is separated from scheduling deliberately:
  scheduling decides who does the work, backfill decides what happens when that falls
  through at short notice, and the two have different urgency, different escalation and
  different money attached.

principles:
  - Speed beats optimality. A reliever found in four minutes who is the third-best choice covers the commitment; the best choice found in forty minutes does not.
  - Every escalation step is configurable timing, not hardcoded delay. Businesses differ by an order of magnitude in how long they can wait, and a hardcoded ladder is wrong for most of them.
  - Whether a backfill is billable is a policy the tenant sets, not a rule this capability knows. The product owner is explicit that backfill billing is configurable, and that is honoured here as a Rule with a shipped default rather than as behaviour.
  - Ranking must be explainable. A dispatcher who cannot see why somebody was offered first will override the ranking, and once overridden habitually the ranking is decoration.
  - A reliever who declines has not failed. Decline rates are a signal about offers, distances and notice periods, not primarily about people.
  - The absence of any candidate is a first-class outcome that must be reported loudly and early, not discovered when the escalation ladder runs out.

entities:

  - key: backfill_request
    name: Backfill Request
    description: An open need for cover on a specific commitment, with its deadline, its escalation position and its outcome.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: commitment_ref, type: uuid, req: true, note: 'the commitment that lost cover, resolved through the schedulable_demand port'}
      - {key: location_ref, type: uuid, nullable: true, note: resolved through the org_structure port}
      - {key: absent_resource_ref, type: uuid, nullable: true, note: 'who was covering it, resolved through the schedulable_resource port. Null where the commitment was never covered'}
      - {key: cause, type: enum, values: [absence, decline, no_show, release, qualification_lapse, demand_increase, unknown], req: true, note: 'cause drives the default billing classification, and unknown is deliberately present because a commitment can lose cover without anyone knowing why yet'}
      - {key: window_start, type: timestamptz, req: true}
      - {key: window_end, type: timestamptz, req: true}
      - {key: required_qualification_keys, type: json, req: true, note: 'flat list of scalars, carried from the demand'}
      - {key: required_count, type: int, req: true, default: 1}
      - {key: priority, type: enum, values: [routine, elevated, urgent, critical], req: true}
      - {key: lead_minutes_at_raise, type: int, req: true, note: 'how much notice existed when the need was detected. Frozen, because it is the number that determines whether the outcome was reasonable and it must not shrink as the clock runs'}
      - {key: escalation_tier, type: int, req: true, default: 0}
      - {key: escalation_policy_id, type: uuid, req: true, fk: escalation_policy}
      - {key: filled_by_resource_ref, type: uuid, nullable: true}
      - {key: filled_at, type: timestamptz, nullable: true}
      - {key: time_to_fill_seconds, type: int, nullable: true, note: 'the operational metric that matters. Reported per location and per cause, because a location that takes four hours to backfill has a staffing problem the roster is hiding'}
      - {key: offers_made, type: int, req: true, default: 0}
      - {key: declines_received, type: int, req: true, default: 0}
      - {key: billing_classification, type: enum, values: [undetermined, billable_to_counterparty, absorbed_by_tenant, recharged_to_supplier, disputed], req: true, default: undetermined, financial: true, note: a classification recorded here and priced elsewhere. The rule that sets it is tenant policy}
      - {key: premium_applied, type: bool, req: true, default: false, financial: true, note: whether a short-notice premium was offered to secure the cover}
      - {key: outcome_reason, type: text, nullable: true}
    invariants:
      - window_end > window_start.
      - lead_minutes_at_raise is immutable after creation. It is the fairness measure for the outcome and a recomputed value would always flatter the result.
      - A request may not be created without an escalation_policy_id. A backfill with no ladder has no defined behaviour after the first offer, and the first offer is declined most of the time.
      - filled_by_resource_ref must differ from absent_resource_ref. Backfilling somebody with themselves is a data error masquerading as a resolution.
      - billing_classification is gated by view_financial. Whether cover was arranged is operational; who pays for it is not.
    states: [raised, searching, offered, filled, partially_filled, escalated, unfilled, cancelled]
    initial_state: raised
    transitions:
      - {from: raised, to: searching, action: rank_candidates, actor: system, guard: at least one candidate source is available, side_effects: the ranked list is computed and recorded with its factors, reversibility: true}
      - {from: raised, to: unfilled, action: observe_no_candidates, actor: system, guard: the ranking returns an empty list at tier 0, side_effects: 'immediate escalation to the dispatcher and the location supervisor, with the reason no candidates rather than a silent wait', reversibility: true, note: 'deliberately immediate. Waiting out an escalation ladder that has nobody on it wastes the only thing that matters, which is lead time'}
      - {from: searching, to: offered, action: offer_backfill, actor: system or dispatcher, guard: at least one candidate is offered the cover, side_effects: the offer is sent with an expiry; the candidate is not held or reserved, reversibility: true}
      - {from: offered, to: filled, action: accept_backfill, actor: the candidate, guard: the offer is unexpired and the resulting assignment breaks no working-hour limit, side_effects: 'an assignment is created through the scheduling port, the request closes, time_to_fill computed', reversibility: true}
      - {from: offered, to: partially_filled, action: accept_backfill, actor: the candidate, guard: fewer acceptances than required_count, side_effects: searching continues for the remainder, reversibility: true}
      - {from: partially_filled, to: filled, action: accept_backfill, actor: the candidate, guard: acceptances equal required_count, side_effects: as for filled, reversibility: true}
      - {from: offered, to: searching, action: observe_offer_expiry, actor: system_scheduler, guard: every outstanding offer expired or was declined and the current tier is not exhausted, side_effects: the next candidates in the current tier are offered, reversibility: true}
      - {from: searching, to: escalated, action: escalate_backfill, actor: system_scheduler or dispatcher, guard: the current tier is exhausted or its time budget has elapsed, side_effects: 'escalation_tier incremented, the next tier''s audience and any premium are applied, the tier''s notify list is told', reversibility: true}
      - {from: escalated, to: searching, action: rank_candidates, actor: system, guard: the new tier widens the candidate pool, side_effects: as for searching, reversibility: true}
      - {from: escalated, to: unfilled, action: observe_ladder_exhausted, actor: system_scheduler, guard: 'every tier is exhausted, or window_start has passed with cover below required_count', side_effects: 'the failure is recorded with the shortfall, the offers made, the declines received and the lead time; the demand is told through the port', reversibility: false}
      - {from: filled, to: searching, action: observe_cover_lost, actor: system, guard: the covering assignment is released or declined and the window has not started, side_effects: 'the request reopens at its current tier rather than at tier zero, because the lead time is now shorter, not longer', reversibility: true}
      - {from: raised, to: cancelled, action: cancel_backfill, actor: dispatcher or the demand through the port, guard: null, side_effects: outstanding offers withdrawn and candidates told, reversibility: false}
      - {from: searching, to: cancelled, action: cancel_backfill, actor: as above, guard: null, side_effects: as above, reversibility: false}
      - {from: offered, to: cancelled, action: cancel_backfill, actor: as above, guard: null, side_effects: as above, reversibility: false}
      - {from: escalated, to: cancelled, action: cancel_backfill, actor: as above, guard: null, side_effects: as above, reversibility: false}
    stuck_state_policy:
      filled: >
        Cover exists and the request is done, but it is not terminal - cover can still be
        lost before the window starts, which is why observe_cover_lost reopens it at its
        CURRENT tier rather than at tier zero. The monitored exception is a filled request
        whose covering assignment is released with less lead time than the fastest tier
        needs. Told: the dispatcher immediately, not on a timer, because the second failure
        has less notice than the first and the ladder cannot help. Escape hatch: manual
        dispatch. Nothing else pends.
      raised: >
        A raised request that has not begun searching is machinery not running. Threshold:
        ranking_lag_seconds (default 60) - deliberately in seconds, because the whole
        capability is a race against lead time. Told: platform_operator, since this is
        scheduler machinery, AND the dispatcher, since the operational consequence is theirs.
        Escape hatch: rank manually, or dispatch by hand. This is the shortest threshold in
        the entire library and it is short on purpose.
      searching: >
        Searching with no offer going out means candidates exist and nobody is being asked.
        Threshold: half the current tier's time budget. Told: the dispatcher. Escape hatch:
        offer manually. The common cause is a notification channel failing, which is
        invisible from inside this capability, so the monitor is on the absence of offers
        rather than on the delivery of them.
      offered: >
        Bounded by offer_expiry_minutes, which is tier-configured. The monitored exception is
        an offer outstanding with less remaining lead time than the offer's own expiry - the
        ladder will run out before the offer does. In that case the expiry is shortened
        automatically to fit the remaining lead time, and the shortening is recorded, because
        an offer that expires after the commitment starts is theatre.
      partially_filled: >
        Worse than unfilled on a summary screen, because it reads as progress. Same
        thresholds as searching, and every notification names the SHORTFALL rather than the
        coverage. Told: the dispatcher and, at critical priority, ops_manager.
      escalated: >
        Each tier carries its own time budget and its own audience. The overall stuck
        condition is the last tier with lead time remaining and nobody accepting. Told: the
        dispatcher, the location supervisor, then ops_manager, at a cadence that increases as
        window_start approaches. Escape hatch: widen manually, apply a premium beyond the
        policy with a recorded authorisation, reduce required_count with a reason, or accept
        the shortfall. There is no auto-widening beyond the last configured tier, because the
        last tier is where the tenant has said the cost stops being worth it.
      unfilled: >
        A recorded failure, not a queue. It stops escalating on entry, because the moment has
        passed. Told once, to ops_manager, with the full narrative - lead time, offers,
        declines, tiers reached and the reason. It appears permanently in coverage reporting
        and in the location's staffing analysis. Escape hatch: none. The state exists so the
        failure is not erasable.
      cancelled: >
        Terminal. Retained with the cancelling party and the offers already made, because
        candidates were contacted and possibly rearranged their day. Nothing pends.

  - key: escalation_policy
    name: Escalation Policy
    description: The configured ladder - who is asked, in what order, with how long at each step and what premium, before the next step widens.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true}
      - {key: applies_to_priority, type: json, req: true, note: flat list of priority values this policy serves}
      - {key: tiers, type: json, req: true, note: 'ordered list of tiers, each a flat set of scalars - audience_selector, time_budget_seconds, offer_expiry_minutes, concurrent_offer_count, premium_percent, notify_role. Flat rather than nested so a policy diff is readable and so no merge semantics are needed'}
      - {key: min_lead_minutes_for_full_ladder, type: int, req: true, default: 120, note: 'below this the ladder compresses - tiers run concurrently rather than in sequence, because a sequential ladder with four tiers cannot complete inside twenty minutes of lead time'}
      - {key: allow_premium, type: bool, req: true, default: false, financial: true}
      - {key: max_premium_percent, type: int, nullable: true, financial: true}
      - {key: source_pack_key, type: string, nullable: true}
    invariants:
      - tiers may not be empty and each tier's time_budget_seconds must be positive. A tier with no budget never expires and the ladder stops there.
      - The sum of tier budgets is compared against typical lead time at publication, and a policy whose ladder cannot complete within min_lead_minutes_for_full_ladder is refused unless compression is enabled. A ladder that cannot finish in time is a ladder that fails silently.
      - allow_premium false requires max_premium_percent null and every tier's premium_percent zero.
      - Editing a policy never alters a request already in flight. The request captures its resolved tiers at creation, because a ladder changing underneath a running escalation produces behaviour nobody can reconstruct afterwards.
    states: [draft, active, archived]
    initial_state: draft
    transitions:
      - {from: draft, to: active, action: publish_escalation_policy, actor: ops_manager or tenant_admin, guard: 'tiers are non-empty and budgets are positive, and the ladder fits the declared lead time or compression is enabled', side_effects: new requests at the covered priorities use it, reversibility: true}
      - {from: active, to: draft, action: unpublish_escalation_policy, actor: ops_manager or tenant_admin, guard: no in-flight request references it, side_effects: none, reversibility: true}
      - {from: active, to: archived, action: archive_escalation_policy, actor: ops_manager or tenant_admin, guard: no in-flight request references it and another active policy covers its priorities, side_effects: none, reversibility: false}
      - {from: draft, to: archived, action: archive_escalation_policy, actor: as above, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_policy_stale_days (default 14). Told: the creating principal. Escape
        hatch: publish or archive. The specific danger is that somebody has configured a
        faster ladder in response to an incident and believes it is running.
      active: >
        Two monitored exceptions. (a) A policy whose median time_to_fill exceeds the sum of
        its own tier budgets - the ladder is not the binding constraint, notification delivery
        or candidate availability is, and tuning the ladder will do nothing. (b) A policy
        whose fill rate is below fill_rate_alert (default 0.8) over a rolling month. Told:
        ops_manager, monthly, with the decline reasons grouped, because the decline reasons
        are what tell you whether the problem is notice, distance or pay.
      archived: >
        Terminal. Retained, because in-flight requests captured their tiers from it and a
        completed request must remain explicable. Nothing pends.

  - key: backfill_offer
    name: Backfill Offer
    description: One approach to one candidate, with what was offered, when it expires and what came back.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: request_id, type: uuid, req: true, fk: backfill_request}
      - {key: candidate_resource_ref, type: uuid, req: true, note: resolved through the schedulable_resource port}
      - {key: tier, type: int, req: true}
      - {key: rank, type: int, req: true}
      - {key: rank_factors, type: json, req: true, note: 'flat set of scalars naming why this candidate ranked here - distance, qualification match, hours headroom, recent decline rate, cost. Mandatory, because an unexplainable ranking gets overridden until it is switched off'}
      - {key: premium_percent, type: int, req: true, default: 0, financial: true}
      - {key: sent_at, type: timestamptz, req: true}
      - {key: channel, type: enum, values: [push, sms, whatsapp, voice, in_app, spoken_by_dispatcher], req: true, note: spoken_by_dispatcher exists because the telephone is the fastest channel and pretending otherwise would leave the fastest path unrecorded}
      - {key: expires_at, type: timestamptz, req: true}
      - {key: responded_at, type: timestamptz, nullable: true}
      - {key: response, type: enum, values: [pending, accepted, declined, expired, withdrawn], req: true, default: pending}
      - {key: decline_reason, type: enum, values: [not_stated, too_far, too_late_notice, already_committed, unwell, pay_insufficient, personal, other], nullable: true, note: 'a closed set so decline reasons are analysable. not_stated is present and is expected to dominate, and pretending otherwise would make the analysis dishonest'}
      - {key: delivery_confirmed_at, type: timestamptz, nullable: true, note: whether the offer actually reached the candidate. An offer that was never delivered and an offer that was ignored are different facts and only one of them is about the candidate}
    invariants:
      - expires_at > sent_at, and expires_at may never be later than the request's window_start. An offer that expires after the commitment begins is theatre.
      - rank_factors is mandatory and non-empty.
      - An offer may not be sent to a candidate whom the resource provider reports unavailable for the window, except through the explicit override path.
      - A candidate is never held or reserved by an outstanding offer. Reserving them removes them from other offers and, with a decline rate above half, reserving is how one absence becomes two uncovered commitments.
      - premium_percent is gated by view_financial on read, and is shown to the candidate in the offer regardless, because an offer that hides its own terms is not an offer.
    states: [pending, accepted, declined, expired, withdrawn]
    initial_state: pending
    transitions:
      - {from: pending, to: accepted, action: accept_backfill, actor: the candidate, guard: unexpired and the resulting assignment breaks no working-hour limit, side_effects: 'assignment created, sibling offers withdrawn where the request is now full', reversibility: false}
      - {from: pending, to: declined, action: decline_backfill, actor: the candidate, guard: null, side_effects: the next candidate in the tier is offered immediately rather than at the next scheduler pass, reversibility: false}
      - {from: pending, to: expired, action: observe_offer_expiry, actor: system_scheduler, guard: 'now > expires_at', side_effects: as for decline, reversibility: false}
      - {from: pending, to: withdrawn, action: withdraw_offer, actor: system or dispatcher, guard: 'the request is filled, cancelled, or the candidate has become unavailable', side_effects: 'the candidate is told the cover is no longer needed, which matters because they may have rearranged their day on the strength of being asked', reversibility: false}
    stuck_state_policy:
      pending: >
        Bounded by expires_at. The monitored exception is an offer with no
        delivery_confirmed_at after delivery_confirm_seconds (default 120) - the message
        never arrived, and every second spent waiting for a response to an undelivered offer
        is lead time thrown away. Told: nobody by notification, because a notification about
        a failed notification is unreliable by construction. Instead the request advances
        immediately to the next candidate and the delivery failure is recorded against the
        channel, so the pattern surfaces in the escalation policy's monthly review.
      accepted: >
        Terminal. Retained. Nothing pends beyond the assignment, which the scheduling
        capability owns.
      declined: >
        Terminal. Retained with the reason. The monitored condition is a pattern rather than
        an instance - a candidate declining more than decline_rate_threshold of offers, or a
        location whose offers are declined for too_far more than distance_decline_threshold of
        the time. Both are reported to ops_manager as signals about the offer, the distance
        or the notice, not primarily about the people. Nothing pends on the individual row.
      expired: >
        Terminal. Retained, and counted separately from declines. An expired offer is usually
        somebody who did not see it, which is a channel problem; a decline is a decision. A
        model that merged them would attribute a delivery failure to a person.
      withdrawn: >
        Terminal. Retained, because the candidate was contacted and may have rearranged
        around it. Nothing pends.

ports:
  - port_key: backfill_request
    direction: provides
    contract: >
      Accept a signal that a commitment has lost cover, carrying the window, the location, the
      required qualifications, the required count, the cause and the remaining lead time; run
      the configured escalation ladder; and report the outcome - filled, partially filled or
      unfilled - back to the requesting capability.
    cardinality: zero_or_many

  - port_key: schedulable_resource
    direction: requires
    contract: >
      Resolve candidates with their availability, qualifications, hours headroom, distance to
      the location and a single reason code when unavailable. Ranking factors are computed
      from this and nothing else.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. Backfill with no source of candidates has nothing to do. The capability is meaningless without it and declaring it FORBIDDEN makes the dependency explicit at pack publication.

  - port_key: schedulable_demand
    direction: requires
    contract: Receive the signal that a commitment lost cover, resolve its window, location, qualifications and required count, and accept the resulting cover.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. There is nothing to backfill without a commitment.

  - port_key: org_structure
    direction: requires
    contract: Resolve the location for distance ranking and for the escalation audience.
    cardinality: zero_or_one
    unbound_behaviour: 'Distance drops out of the ranking entirely and the factors say so on every offer. Ranking falls back to qualification match, hours headroom and recent decline rate, which for a geographically dispersed workforce is materially worse and is stated rather than silently degraded.'

  - port_key: notification
    direction: requires
    contract: Deliver offers with a delivery receipt, across push, SMS, WhatsApp and voice, treating backfill offers as mandatory_operational so they override quiet hours.
    cardinality: zero_or_one
    unbound_behaviour: >
      Offers can only be made through the spoken_by_dispatcher channel, recorded manually.
      The capability degrades to a ranked call list, which is genuinely useful and is not
      automation. The pack documentation must say so plainly, because a ranked list that
      nobody is paged about is indistinguishable from a system that is not working.

  - port_key: billable_outcome_sink
    direction: requires
    contract: Accept a filled backfill as a billable outcome carrying its classification, its premium and the cause of the original loss of cover.
    cardinality: zero_or_one
    unbound_behaviour: The classification is still recorded on the request for later use. No billable event is created and the surface shows no billing affordance.

  - port_key: approval_chain
    direction: requires
    contract: Route premium authorisations beyond policy, and reductions of required_count, for approval.
    cardinality: zero_or_one
    unbound_behaviour: >
      The dispatcher may authorise a premium beyond policy directly, with a mandatory reason,
      and every such authorisation is reported to finance. Deliberately not blocked - a
      commitment failing at 5am because nobody could approve an extra payment is a worse
      outcome than an unapproved premium, and the record makes it reviewable afterwards.

  - port_key: sla_clock
    direction: requires
    contract: Report the contractual consequence of the commitment going uncovered, so that escalation urgency reflects the penalty rather than only the priority.
    cardinality: zero_or_one
    unbound_behaviour: 'Escalation urgency is driven by priority and lead time alone. The escalation ladder cannot distinguish a commitment whose failure costs nothing from one that triggers a penalty, which means both are chased equally hard - wasteful in one direction and insufficient in the other.'

actions:

  - key: raise_backfill_request
    entity: backfill_request
    label: Seek cover
    actors: [system, dispatcher, supervisor]
    rationale: >
      Almost always triggered automatically by an absence, a decline or a no-show elsewhere.
      Modelled as an explicit action because the manual path matters just as much - a
      supervisor who learns by telephone that somebody is not coming needs the same machinery
      as the automatic detector.
    preconditions: [the commitment exists and is not cancelled, its window has not ended, an escalation policy covers its priority]
    inputs: [commitment_ref, absent_resource_ref, cause, priority_override, required_count]
    creates: [backfill_request]
    updates: []
    events: [backfill.requested]
    notifications:
      - {to: dispatcher, channel: push_and_in_app, when: always, template: cover_needed, must_include: [location, window, lead_time, cause], priority: high, mandatory_operational: true}
    undoable: true
    reversal_action: cancel_backfill
    audit_class: always
    idempotency_key_source: 'commitment_ref plus absent_resource_ref plus window_start. An absence recorded twice, or an absence and a no-show for the same person and commitment, produce ONE request. Two parallel searches for one gap is how two relievers arrive and one is sent home unpaid.'
    offline_policy: refuse
    concurrency: >
      A unique index over (commitment_ref, window_start) among non-terminal requests. A second
      raise returns the existing request rather than erroring, because the second caller is
      usually a different detector noticing the same gap and their next action should be to
      watch the existing search, not to start another.
    failure_modes:
      - {code: E_PRECONDITION, cause: the commitment window has already ended, message: This action is not available in the current state., note: 'the correct record is an unfilled outcome on the commitment itself, not a backfill nobody can fulfil'}
      - {code: E_PRECONDITION, cause: no escalation policy covers this priority, message: This action is not available in the current state., note: 'names the missing policy. A backfill with no ladder is undefined after the first offer, so this is refused rather than defaulted'}
      - {code: E_CONFLICT_UNIQUE, cause: a live request already exists for this commitment, message: null, note: returns the existing request with 200}
      - {code: E_DEPENDENCY, cause: the resource provider is unavailable, message: A required service is unavailable., note: 'the request is still CREATED in state raised, and the ranking retries. The gap exists whether or not the candidate service is reachable, and recording it is what makes the dispatcher aware'}
      - {code: E_AUTHZ_SCOPE, cause: 'the commitment is outside the raiser''s scope', message: Not found.}
    edge_cases:
      - Raised for a commitment that was never covered in the first place. Legitimate and common - a roster published with a known gap. absent_resource_ref is null and cause is demand_increase or unknown, and the billing classification default differs from a decline-driven backfill, which is exactly why cause is a field rather than an inference.
      - Two causes for one gap - somebody declined and then also reported an absence. One request, and the cause is the first one recorded, with the second appended to the narrative. Changing the cause afterwards would change the billing classification retroactively.
      - Raised with less lead time than the fastest tier can complete. Accepted, the ladder compresses per the policy, and the request records that it started already compressed - so that an unfilled outcome can be read against what was actually possible rather than against the policy on paper.
      - Raised automatically while the dispatcher is already handling the same gap manually. The idempotency key collapses them, and the dispatcher's manual offers are recorded against the same request through the spoken_by_dispatcher channel. Parallel manual and automatic searches are the most reliable way to double-staff a commitment.

  - key: rank_candidates
    entity: backfill_offer
    label: Rank who to ask
    actors: [system, dispatcher]
    rationale: >
      The ranking is the product. It must be fast, explainable and unsurprising, and it must
      degrade honestly when a factor is unavailable rather than silently dropping it.
    preconditions: [the request is in state raised, searching or escalated, the resource provider is reachable]
    inputs: [request_id, tier, exclude_resource_refs]
    creates: [a ranked candidate list recorded against the request]
    updates: [request state]
    events: [backfill.candidates_ranked]
    notifications: []
    undoable: true
    reversal_action: 'none required; re-ranking supersedes'
    confirmation_specification: 'None. A computation whose output is a list; the control that matters is that every rank carries its factors.'
    audit_class: read_sensitive_only
    idempotency_key_source: request_id plus tier plus a hash of the exclusion list. Re-ranking within one tier is deterministic given the same inputs.
    offline_policy: refuse
    concurrency: >
      Ranking is a pure computation over a snapshot of candidate availability. Two concurrent
      rankings produce the same list. Availability changing between ranking and offering is
      expected and is handled at offer time rather than by locking candidates, because
      locking candidates during a search is how one absence becomes two.
    failure_modes:
      - {code: E_DEPENDENCY, cause: the resource provider is unavailable, message: null, note: 'the request stays in raised and the ranking retries with backoff. It does NOT fall back to an unranked list of everybody, which would page an entire workforce for one gap'}
      - {code: E_PRECONDITION, cause: the ranking returns no candidates at this tier, message: null, note: 'an outcome, not an error. It escalates immediately rather than consuming the tier''s time budget waiting for offers that cannot be made'}
      - {code: E_DEPENDENCY, cause: org_structure unavailable so distance cannot be computed, message: null, note: ranking proceeds without the distance factor and every offer records that distance was unavailable. A ranking that silently drops a factor is one nobody can audit}
      - {code: E_QUOTA, cause: the candidate pool exceeds max_ranked_candidates, message: null, note: truncated at the limit with the truncation recorded. An unbounded ranking on a large workforce is slow at exactly the moment speed matters most}
    edge_cases:
      - A candidate who is the absent person. Always excluded. Backfilling somebody with themselves is a data error that looks like a resolution.
      - A candidate whose acceptance would breach a working-hour limit. Excluded from the ranking rather than offered and refused at acceptance, because an offer that cannot be accepted wastes the candidate's attention and the request's lead time. The exclusion is recorded in the factors so a dispatcher can see who was skipped and why.
      - Every candidate at a tier has already declined at a previous tier. They are not re-offered within the same request unless the tier explicitly permits re-asking with a premium, which is a configured behaviour rather than a default. Re-asking somebody who already said no, with nothing changed, is how people stop reading offers.
      - Ranking during a widespread disruption when most of the workforce is unavailable. The empty-list outcome fires immediately at tier 0 and escalates to a human. This is the case the capability most needs to handle well, because it is exactly when the automatic path is least useful.
      - A tenant with a small workforce where the ranking is trivially the whole list. Fully supported, and the tier structure still governs timing and premium. The capability's value at that size is the timing and the record, not the ranking.

  - key: accept_backfill
    entity: backfill_offer
    label: Accept cover
    actors: [employee, dispatcher]
    rationale: The moment somebody's day changes at short notice. It must work on one bar of signal, in one tap, and it must never accept two people for one place.
    preconditions: [the offer is pending and unexpired, the request still needs cover, the resulting assignment breaks no working-hour limit]
    inputs: [offer_id, accepted_by_principal_id, acceptance_channel]
    creates: [an assignment through the scheduling port]
    updates: [offer response, request coverage and state, sibling offers withdrawn where the request is now full]
    events: [backfill.accepted, backfill.filled]
    notifications:
      - {to: the accepting candidate, channel: push_and_in_app, when: always, template: cover_confirmed, must_include: [window, location, premium_if_any, who_to_report_to], mandatory_operational: true}
      - {to: dispatcher, channel: in_app, when: always, template: cover_found, must_include: [who, time_to_fill]}
      - {to: candidates whose offers are withdrawn, channel: same_as_offer, when: always, template: cover_no_longer_needed, mandatory_operational: true, note: they may have rearranged their day on the strength of being asked}
      - {to: the location supervisor, channel: in_app, when: always, template: cover_arranged, must_include: [who, replacing_whom]}
    undoable: true
    reversal_action: release the resulting assignment through the scheduling capability
    audit_class: always
    idempotency_key_source: 'offer_id. A double tap produces one acceptance and one assignment. This is the key that stops two relievers being sent, which costs a wasted journey and an argument about who gets paid.'
    offline_policy: refuse
    concurrency: >
      Acceptance takes the REQUEST row exclusively, not the offer row, and re-checks the
      coverage count inside the transaction. Two candidates accepting simultaneously for a
      single-count request: exactly one wins and the other is told immediately that the cover
      was taken, before they set off. The loser's message is deliberately worded as
      first-come rather than as a rejection, because they did nothing wrong and will be asked
      again next week. Acceptance also creates the assignment inside the same transaction, so
      a request can never be marked filled without an assignment existing.
    failure_modes:
      - {code: E_PRECONDITION, cause: the offer has expired, message: This cover has already been taken or has expired., note: 'deliberately merged with the taken case, because the candidate''s next action is identical and distinguishing them only invites a complaint about timing'}
      - {code: E_CONFLICT_VERSION, cause: another candidate accepted first, message: This cover has already been taken or has expired.}
      - {code: E_PRECONDITION, cause: a working-hour limit would be breached, message: This action is not available in the current state., note: 'names the limit and the resulting total. This should have been caught at ranking, and reaching it here means the candidate''s hours changed in between, which is legitimate and is why the check is repeated'}
      - {code: E_PRECONDITION, cause: the candidate has acquired an overlapping assignment since the offer was sent, message: This action is not available in the current state., note: names the clash and its location}
      - {code: E_DEPENDENCY, cause: the scheduling port is unavailable so the assignment cannot be created, message: A required service is unavailable., note: acceptance is REFUSED rather than recorded without an assignment. A request marked filled with no assignment behind it is a commitment everybody believes is covered and nobody is assigned to}
    edge_cases:
      - Accepted by a dispatcher on the candidate's behalf after a telephone call. Fully supported through the spoken_by_dispatcher channel, with the dispatcher recorded as the accepting principal and the candidate notified that cover was accepted on their behalf. The telephone is the fastest channel and leaving it unrecorded would mean the fastest path is invisible in every report.
      - Accepted after the window has started, which happens when somebody is found late and travels immediately. Permitted, and the assignment is created with a start time of now rather than the window start, so that the partial coverage is honest and the person is paid for what they actually work.
      - The accepting candidate then does not turn up. That is a no-show on the resulting assignment and raises a NEW backfill request with cause=no_show, chained to the original. The chain is retained, because a location whose backfills repeatedly fail twice is a different problem from one whose backfills fail once.
      - Acceptance racing a cancellation of the underlying commitment. The cancellation wins and the candidate is told immediately, with the premium honoured where the tenant policy says a short-notice acceptance is compensated even when withdrawn. Whether it is compensated is configuration; that the candidate is told immediately is not.
      - A candidate accepting who is under a delegation or acting on somebody else's behalf. Not permitted. Acceptance commits a person to be somewhere, and it is the one act in the platform that may not be delegated.

rules:
  - key: backfill_billing_is_policy
    kind: policy
    scope: capability
    overridable_at: tenant
    default: >
      cause=absence and cause=no_show classify as absorbed_by_tenant. cause=demand_increase
      classifies as billable_to_counterparty. cause=decline, release, qualification_lapse and
      unknown classify as undetermined and require a human classification before the outcome
      is emitted.
    on_conflict: most specific scope wins
    rationale: >
      The product owner is explicit that backfill billing is a configurable policy rather
      than a hardcoded rule. The shipped default is deliberately conservative - it never
      classifies something as billable to a counterparty on a guess, because a wrongly
      billed cover charge is discovered by the counterparty and not by the tenant.

  - key: ranking_must_explain
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'An offer without non-empty rank_factors is rejected at write time.'
    on_conflict: not overridable
    rationale: An unexplainable ranking is overridden until it is switched off, and a switched-off ranking is a ranked list nobody reads.

  - key: candidates_are_never_reserved
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'An outstanding offer does not reserve, hold or block a candidate from other offers or assignments.'
    on_conflict: not overridable
    rationale: With decline rates above half, reserving candidates during a search is how one uncovered commitment becomes two.

  - key: no_candidates_escalates_immediately
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'An empty candidate list at any tier escalates immediately rather than consuming that tier''s time budget.'
    on_conflict: not overridable
    rationale: Lead time is the only resource this capability has, and waiting out a ladder with nobody on it spends all of it for nothing.

  - key: ladder_compression_under_short_notice
    kind: policy
    scope: capability
    overridable_at: site
    default: 'Below min_lead_minutes_for_full_ladder (default 120) the tiers run concurrently rather than sequentially, and the compression is recorded on the request.'
    on_conflict: most specific scope wins

  - key: premium_beyond_policy_is_permitted_and_reported
    kind: policy
    scope: capability
    overridable_at: tenant
    default: 'A dispatcher may authorise a premium beyond the policy maximum with a mandatory reason. It is reported to finance and counted. It is never silently blocked.'
    on_conflict: most specific scope wins
    rationale: A commitment failing at 5am because nobody could approve an extra payment is worse than an unapproved premium that is reviewable the next morning.

  - key: acceptance_may_not_be_delegated
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'accept_backfill may not be performed under a delegation. It may be performed by a dispatcher on a candidate''s behalf only through an explicitly recorded channel, with the candidate notified.'
    on_conflict: not overridable
    rationale: Acceptance commits a person to be physically somewhere. It is the one act in the platform that must be the person's own, or explicitly recorded as somebody speaking for them.

policy_knobs:
  - {key: ranking_lag_seconds, default: 60, range: [5, 600], lowest_settable_scope: kernel}
  - {key: delivery_confirm_seconds, default: 120, range: [10, 900]}
  - {key: min_lead_minutes_for_full_ladder, default: 120, range: [5, 1440]}
  - {key: default_offer_expiry_minutes, default: 10, range: [1, 240]}
  - {key: default_concurrent_offer_count, default: 3, range: [1, 50], note: 'how many candidates are asked at once within a tier. More is faster and risks several acceptances for one place, which the coverage lock prevents at the cost of telling people they were too late'}
  - {key: max_ranked_candidates, default: 200, range: [10, 5000]}
  - {key: decline_rate_threshold, default: 0.5, range: [0.1, 1.0]}
  - {key: distance_decline_threshold, default: 0.3, range: [0.05, 1.0]}
  - {key: fill_rate_alert, default: 0.8, range: [0.1, 1.0]}
  - {key: draft_policy_stale_days, default: 14, range: [1, 90]}
  - {key: reask_declined_candidates, default: false}
  - {key: compensate_withdrawn_acceptance, default: false, note: whether a candidate who accepted and was then stood down is compensated}

open_questions:
  - {q: 'Should ranking consider fairness of distribution - who has recently been offered and who has recently been paid a premium - or only speed and suitability? A pure speed ranking concentrates short-notice work on the same few people, who are also the people most likely to accept, and that is a workforce problem before it is a scheduling one.', assumption: None. The rank_factors structure can carry a fairness factor and no fairness factor is specified., confidence: VALIDATION_REQUIRED, method: 'operator and workforce interviews, plus measuring the concentration of accepted offers in pilot', priority: High, blocks: [rank_candidates factors, the same open question in scheduling_dispatch]}
  - {q: 'Is a short-notice premium the right mechanism at all, or does it teach people to wait for the premium rather than accept the roster? The model supports it and does not recommend it.', assumption: None., confidence: VALIDATION_REQUIRED, method: 'pilot with premium enabled at one location and disabled at a comparable one, comparing fill rate and roster acceptance rate', priority: Medium}
  - {q: 'What is the correct default billing classification for cause=decline? A decline is the tenant''s workforce failing to cover a commitment, which argues for absorbed_by_tenant; it can also be caused by a counterparty changing requirements at short notice, which argues the other way.', assumption: 'undetermined, requiring a human classification. This is deliberately the slower option.', confidence: WORKING_ASSUMPTION, method: 'review of what target customers'' contracts actually say about short-notice cover charges', priority: High}
  - {q: 'Should a counterparty see that a commitment was backfilled, and by whom? Transparency is what a service contract usually implies; it also exposes staffing instability that the tenant may reasonably regard as internal.', assumption: None. The customer_surface port is deliberately absent from this capability so that the question is not answered by accident., confidence: VALIDATION_REQUIRED, method: contract review plus operator interview, priority: High}
  - {q: 'DEC-C-002 bites here. If two packs each bind a backfill provider with different escalation policies, a single commitment could be searched twice under two ladders, and both would find candidates.', assumption: None. DEC-C-002 is unresolved., confidence: VALIDATION_REQUIRED, method: resolve DEC-C-002, priority: Medium, blocks: [DEC-C-002]}
