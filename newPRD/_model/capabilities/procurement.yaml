key: procurement
name: Procurement
layer: domain
confidence: KNOWN
description: >
  Asking for something, approving the ask, ordering it from a supplier, receiving it, and
  agreeing that what arrived matches what was ordered and what was invoiced. The three-way
  match is the whole point: an operation that receives goods without matching them pays for
  things it did not get, and one that matches too rigidly stops receiving anything at all.

principles:
  - The request and the order are separate records with separate authority. Somebody who needs something is rarely the person permitted to commit money, and collapsing the two removes the control.
  - Receipt is a physical fact and is recorded first, matched second. Blocking a receipt because it does not match an order means goods sitting on a loading area while somebody looks for a purchase order number.
  - Tolerance is configuration with a shipped default. A zero-tolerance match stops an operation; an infinite one is no control at all, and the right number differs by what is being bought.
  - A supplier invoice is a claim, not a liability, until it is matched. Recording it as a liability on arrival is how a duplicate invoice gets paid.
  - Partial everything is normal. Partial receipt, partial invoice, partial approval and partial cancellation all occur constantly, and a model that treats them as exceptions is a model people work around.
  - Nothing about a commitment may be edited after it has been sent to a supplier. Amendments are versions, because the supplier is holding a copy of what was sent.

entities:

  - key: purchase_request
    name: Purchase Request
    description: Somebody stating that something is needed, with what it is for and who approved it. Deliberately separate from the commitment to buy.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: reference, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: requested_by_principal_id, type: uuid, req: true, note: resolved through the principal_directory port}
      - {key: location_ref, type: uuid, nullable: true, note: resolved through the org_structure port}
      - {key: needed_by, type: date, nullable: true}
      - {key: justification, type: text, nullable: true}
      - {key: source_capability_key, type: string, nullable: true, note: 'which capability triggered it, for a request raised automatically from a low balance or from a work order'}
      - {key: source_ref, type: uuid, nullable: true}
      - {key: lines, type: json, req: true, note: 'flat ordered list, each entry a set of scalars - item_ref or free_text_description, quantity, unit_of_measure, estimated_unit_cost_minor, suggested_supplier_ref. Free text is permitted deliberately: a great deal of what a business buys is not in its catalogue and refusing to request it pushes the purchase outside the system entirely'}
      - {key: estimated_total_minor, type: money_minor, nullable: true, financial: true}
      - {key: currency, type: string, req: true, financial: true}
      - {key: approval_route_ref, type: uuid, nullable: true, note: resolved through the approval_chain port}
      - {key: approved_by_principal_id, type: uuid, nullable: true}
      - {key: approved_at, type: timestamptz, nullable: true}
      - {key: rejection_reason, type: text, nullable: true}
    invariants:
      - lines may not be empty.
      - Every line has either an item_ref or a free_text_description, and never both. Both would make it ambiguous which one the supplier is being asked for.
      - approved_by_principal_id may not equal requested_by_principal_id unless the tenant explicitly permits self-approval below a stated value, and that permission is a recorded configuration rather than an omission.
      - Financial fields are gated by view_financial. quantity and description are not, because the person who needs the thing must be able to describe it.
    states: [draft, submitted, partially_approved, approved, rejected, converted, cancelled]
    initial_state: draft
    transitions:
      - {from: draft, to: submitted, action: submit_request, actor: any principal with create on purchase_request, guard: at least one line and a location where the tenant requires one, side_effects: 'routed through the approval_chain port where bound, otherwise routed to any principal holding approve at a covering scope', reversibility: true}
      - {from: submitted, to: draft, action: return_request, actor: the approver, guard: a reason is supplied, side_effects: the requester is told with the reason, reversibility: true}
      - {from: submitted, to: partially_approved, action: approve_request, actor: any principal holding approve at a covering scope, guard: some but not all lines approved, side_effects: approved lines become convertible; the rest stay pending, reversibility: true, note: 'partial approval is the normal outcome of a request containing one expensive line among five cheap ones, and forcing all-or-nothing means the cheap lines wait'}
      - {from: submitted, to: approved, action: approve_request, actor: as above, guard: every line approved, side_effects: convertible to a commitment, reversibility: true}
      - {from: partially_approved, to: approved, action: approve_request, actor: as above, guard: the remaining lines are approved, side_effects: as above, reversibility: true}
      - {from: submitted, to: rejected, action: reject_request, actor: as above, guard: a reason is supplied, side_effects: the requester is told with the reason, reversibility: true}
      - {from: partially_approved, to: rejected, action: reject_request, actor: as above, guard: a reason is supplied and no line has been converted, side_effects: as above, reversibility: true}
      - {from: approved, to: converted, action: raise_commitment, actor: 'finance, ops_manager or a principal holding create on purchase_commitment', guard: every approved line is placed on one or more commitments, side_effects: none, reversibility: false}
      - {from: partially_approved, to: converted, action: raise_commitment, actor: as above, guard: every approved line is placed and the unapproved lines are cancelled or left for a later request, side_effects: none, reversibility: false}
      - {from: draft, to: cancelled, action: cancel_request, actor: the requester, guard: null, side_effects: none, reversibility: false}
      - {from: submitted, to: cancelled, action: cancel_request, actor: the requester or an approver, guard: a reason is supplied, side_effects: approvers are told, reversibility: false}
      - {from: approved, to: cancelled, action: cancel_request, actor: 'the requester, an approver or finance', guard: a reason is supplied and no line has been converted, side_effects: as above, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_request_stale_days (default 7). Told: the requester only. Escape
        hatch: submit or cancel. The characteristic failure is somebody starting a request,
        being interrupted, and the thing still being needed a fortnight later - which is why
        the notification names the needed_by date where one is set.
      submitted: >
        An unanswered request is the most common quiet grievance in an operation and the most
        common cause of somebody buying something with their own money. Threshold:
        approval_response_days (default 3), or immediately where needed_by is within that
        window. Told: the approver, then their manager where the org_structure port resolves
        one, then ops_manager. The requester is shown that it is still waiting rather than
        being left to guess. Escape hatch: approve, reject or return. Never auto-approved and
        never auto-rejected - one commits money nobody agreed to and the other silently
        refuses something that may be urgent.
      partially_approved: >
        Worse than submitted because it reads as progress. Same thresholds, and every
        notification names the OUTSTANDING lines rather than the approved ones. Told: the
        approver and the requester. Escape hatch: decide the remaining lines, or convert the
        approved ones and leave the rest.
      approved: >
        Approved and unconverted is the state where everybody believes the thing is on order
        and nobody has ordered it. Threshold: conversion_lag_days (default 2), or immediately
        where needed_by is inside the supplier's typical lead time. Told: whoever holds create
        on commitments, then ops_manager. Escape hatch: raise a commitment, or cancel with a
        reason. This is the single most damaging quiet state in the capability.
      rejected: >
        Terminal. Retained with the reason. The monitored condition is a pattern - a requester
        whose requests are rejected above rejection_rate_alert (default 0.3), or an approver
        who rejects above the same rate. Told: ops_manager, quarterly. Both directions matter:
        one is somebody asking for the wrong things and the other is a bottleneck that people
        will route around.
      converted: >
        Terminal. Retained as the origin of the commitment, so that a purchase can always be
        traced back to who asked for it and why. Nothing pends.
      cancelled: >
        Terminal. Retained with the reason. Nothing pends.

  - key: purchase_commitment
    name: Purchase Commitment
    description: The order placed with a supplier - what was asked for, at what price, for when, and everything received and invoiced against it.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: reference, type: string, req: true, unique_scope: tenant, immutable: true, note: the number the supplier quotes back}
      - {key: supplier_party_ref, type: uuid, req: true, note: resolved through the party_directory port}
      - {key: request_id, type: uuid, nullable: true, fk: purchase_request}
      - {key: deliver_to_location_ref, type: uuid, nullable: true}
      - {key: deliver_to_stock_location_ref, type: uuid, nullable: true, note: 'resolved through the stock_movement_sink port, so a receipt lands somewhere specific rather than at a site'}
      - {key: expected_at, type: date, nullable: true}
      - {key: lines, type: json, req: true, note: 'flat ordered list of scalars per line - item_ref or description, quantity_ordered, unit_of_measure, unit_price_minor, tax_classification, quantity_received, quantity_invoiced, line_state'}
      - {key: currency, type: string, req: true, financial: true}
      - {key: subtotal_minor, type: money_minor, req: true, default: 0, financial: true}
      - {key: tax_total_minor, type: money_minor, nullable: true, financial: true, note: 'nullable rather than zero, so unknown tax and no tax never render identically'}
      - {key: total_minor, type: money_minor, req: true, default: 0, financial: true}
      - {key: payment_terms_days, type: int, nullable: true, financial: true}
      - {key: version_number, type: int, req: true, default: 1}
      - {key: sent_at, type: timestamptz, nullable: true}
      - {key: sent_via, type: enum, values: [not_sent, email, portal, messaging, telephone, integration, in_person], req: true, default: not_sent, note: telephone and in_person are first-class because a great many commitments in this market are made verbally and recording them as not-sent would make the record wrong}
      - {key: acknowledged_at, type: timestamptz, nullable: true}
      - {key: closed_reason, type: text, nullable: true}
    invariants:
      - lines may not be empty and every quantity_ordered is positive.
      - No field on a sent commitment may be edited. An amendment increments version_number and produces a new document, because the supplier is holding a copy of what was sent.
      - quantity_received may exceed quantity_ordered only where over-receipt tolerance permits it; the excess is always visible as an over-receipt rather than absorbed by silently raising the ordered quantity.
      - Financial fields are gated by view_financial. Quantities and descriptions are not, because the person receiving goods must be able to see what was expected.
      - A commitment may not be raised against a supplier whose party relationship is suspended or ended. This is checked at raise time and again at send time, because the two can be days apart.
    states: [draft, pending_approval, open, partially_received, received, closed, cancelled]
    initial_state: draft
    transitions:
      - {from: draft, to: pending_approval, action: submit_commitment, actor: finance or ops_manager, guard: 'the total exceeds the tenant''s commitment approval threshold', side_effects: routed through the approval_chain port, reversibility: true}
      - {from: draft, to: open, action: send_commitment, actor: finance or ops_manager, guard: 'the total is within the approval threshold, or approval is recorded, and the supplier is active', side_effects: 'sent_at and sent_via recorded, the supplier told through the configured channel, stock reservations created where the sink is bound', reversibility: false}
      - {from: pending_approval, to: open, action: send_commitment, actor: as above, guard: approval is recorded, side_effects: as above, reversibility: false}
      - {from: pending_approval, to: draft, action: return_commitment, actor: the approver, guard: a reason is supplied, side_effects: none, reversibility: true}
      - {from: open, to: partially_received, action: record_receipt, actor: 'employee, supervisor or integration', guard: some but not all ordered quantity received, side_effects: stock movements written where the sink is bound, reversibility: true}
      - {from: partially_received, to: received, action: record_receipt, actor: as above, guard: 'every line received in full, or the shortfall is explicitly closed short', reversibility: true, side_effects: as above}
      - {from: open, to: received, action: record_receipt, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: received, to: closed, action: close_commitment, actor: finance or ops_manager, guard: 'every line is matched or explicitly written off, and any variance has a reason', side_effects: the commitment becomes immutable; later differences are supplier credit notes, reversibility: false}
      - {from: partially_received, to: closed, action: close_commitment, actor: as above, guard: the outstanding quantity is closed short with a reason, side_effects: 'reservations released, as above', reversibility: false}
      - {from: open, to: cancelled, action: cancel_commitment, actor: finance or ops_manager, guard: 'a reason is supplied, nothing has been received, and the supplier is told', side_effects: 'reservations released, supplier notified through the same channel the commitment was sent on', reversibility: false}
      - {from: draft, to: cancelled, action: cancel_commitment, actor: as above, guard: null, side_effects: none, reversibility: false}
      - {from: pending_approval, to: cancelled, action: cancel_commitment, actor: as above, guard: a reason is supplied, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_commitment_stale_days (default 3) - short, because a draft commitment
        usually exists because an approved request is waiting behind it. Told: the creating
        principal and finance. Escape hatch: send or cancel. The approved-request monitor
        fires in parallel, deliberately, so that the gap is visible from both ends.
      pending_approval: >
        Threshold: commitment_approval_days (default 2), or immediately where expected_at is
        inside the supplier lead time. Told: the approver, then finance, then tenant_owner
        where the value exceeds the escalation threshold. Escape hatch: approve, return or
        cancel. Never auto-approved at any value.
      open: >
        Two monitored exceptions. (a) A commitment past expected_at with nothing received.
        Threshold: immediate on the date passing, then every overdue_chase_days (default 3).
        Told: the raising principal and the requester behind it, with the supplier's contact,
        because the required action is a telephone call. (b) A commitment sent and never
        acknowledged for acknowledgement_days (default 2) where the channel supports
        acknowledgement - the supplier may never have received it, which looks identical to a
        late delivery until somebody asks.
      partially_received: >
        The state that reads as progress and is frequently finished in reality - the supplier
        short-shipped and nobody closed it. Threshold: partial_receipt_stale_days (default 7)
        with no further receipt. Told: the receiving location and finance, with the
        outstanding quantity NAMED rather than expressed as a percentage. Escape hatch:
        receive the rest, close short with a reason, or chase. A commitment left partially
        received holds a reservation and inflates expected stock indefinitely.
      received: >
        Received and unclosed is an unmatched liability. Threshold: match_lag_days (default 5)
        where an invoice has arrived, and unclosed_received_days (default 30) where it has
        not. Told: finance. Escape hatch: close, or record the variance. A received and
        unmatched commitment is where duplicate supplier invoices survive, because nothing has
        yet claimed the receipt.
      closed: >
        Terminal and immutable. The monitored exception is a supplier invoice arriving against
        a closed commitment, which is either a duplicate or a late claim and must never be
        matched automatically. Told: finance immediately, with the closed commitment named.
      cancelled: >
        Terminal. Retained with the reason and the notification that was sent to the supplier,
        because a supplier who delivers against a cancelled commitment will produce the copy
        they were sent. Nothing pends.

  - key: goods_receipt
    name: Receipt
    description: The physical fact that something arrived, recorded before it is matched to anything, with who received it and in what condition.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: commitment_id, type: uuid, nullable: true, fk: purchase_commitment, note: 'nullable deliberately. Goods arrive without a purchase order reference constantly, and refusing to record them means they sit on a loading area or go straight onto a shelf unrecorded'}
      - {key: supplier_party_ref, type: uuid, nullable: true}
      - {key: stock_location_ref, type: uuid, req: true}
      - {key: received_at, type: timestamptz, req: true}
      - {key: received_by_principal_id, type: uuid, req: true}
      - {key: supplier_document_ref, type: string, nullable: true, note: 'the delivery note number, which is what a dispute is actually settled with'}
      - {key: lines, type: json, req: true, note: 'flat list per line - commitment_line_index or free text, item_ref, quantity_received, unit_of_measure, condition, batch_ref, expires_on, rejection_reason'}
      - {key: has_discrepancy, type: bool, req: true, default: false}
      - {key: evidence_refs, type: json, nullable: true, note: 'photographs of damage or of the delivery note, through the evidence_capture port'}
      - {key: created_offline, type: bool, req: true, default: false}
    invariants:
      - lines may not be empty and every quantity_received is positive. A receipt of nothing is a non-event.
      - A receipt is append-only once submitted. A correction is a further receipt with a negative-direction return line, never an edit, because the supplier holds a copy of the delivery note that was signed.
      - Rejected quantity is recorded on the receipt and does NOT create stock. It creates a return obligation, so that rejected goods are neither invisible nor counted as held.
      - Every receipt line either references a commitment line or is explicitly marked unmatched. There is no implicit matching by item, because two lines of the same item on one commitment are ordinary.
    states: [draft, submitted, matched, disputed, returned]
    initial_state: draft
    transitions:
      - {from: draft, to: submitted, action: record_receipt, actor: 'employee, supervisor or integration', guard: at least one line with a positive quantity, side_effects: 'stock movements written for accepted quantity, return obligations raised for rejected quantity, the commitment''s received quantities updated', reversibility: false}
      - {from: submitted, to: matched, action: match_documents, actor: finance or system, guard: the receipt reconciles to a commitment and an invoice within tolerance, side_effects: the invoice becomes payable, reversibility: true}
      - {from: submitted, to: disputed, action: raise_receipt_discrepancy, actor: 'employee, supervisor or finance', guard: a discrepancy reason is supplied, side_effects: 'matching is blocked, the supplier is told, finance is told', reversibility: true}
      - {from: disputed, to: matched, action: resolve_receipt_discrepancy, actor: finance or ops_manager, guard: an outcome and a reason are recorded, side_effects: 'a credit is expected, the quantity is adjusted, or the discrepancy is accepted, in each case explicitly', reversibility: false}
      - {from: submitted, to: returned, action: return_to_supplier, actor: 'supervisor, ops_manager or finance', guard: a reason is supplied and the supplier is told, side_effects: 'a return movement is written, a credit expectation is raised', reversibility: false}
      - {from: disputed, to: returned, action: return_to_supplier, actor: as above, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      draft: >
        A receipt in draft is goods physically present and not recorded. Threshold:
        draft_receipt_stale_minutes (default 60) - in minutes, because the goods are on the
        floor. Told: the receiving principal, then the location supervisor. Escape hatch:
        submit or discard. Verity never auto-submits, because a receipt submitted with lines
        somebody had not finished checking becomes stock the operation does not have.
      submitted: >
        Submitted and unmatched is where duplicate supplier invoices survive. Threshold:
        match_lag_days (default 5). Told: finance. Escape hatch: match, dispute or accept
        unmatched with a reason. A receipt with no commitment at all is reported separately
        and immediately, because it is either an unrecorded purchase or a delivery to the
        wrong place, and both need somebody today.
      matched: >
        Terminal in receipt terms. Nothing pends here; the commitment's own closure policy
        governs.
      disputed: >
        A dispute with a supplier holds up payment and frequently holds up the operation.
        Threshold: receipt_dispute_days (default 7), escalating to ops_manager then finance.
        Told: finance, the receiving location and the supplier where a channel is bound.
        Escape hatch: resolve. Never auto-resolved in the supplier's favour by expiry, and
        never auto-resolved in the tenant's favour either - both amount to deciding a
        commercial disagreement with a timer.
      returned: >
        Terminal on the receipt. The monitored exception is a return with no supplier credit
        received within credit_expectation_days (default 30). Told: finance, with the value.
        Returns for which no credit ever arrives are one of the most reliable sources of
        quiet loss in a purchasing operation, and they are invisible unless the expectation is
        recorded at the moment of return.

  - key: supplier_invoice
    name: Supplier Invoice
    description: A supplier's claim for payment, recorded as a claim and only becoming a liability once it matches a receipt and a commitment.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: supplier_party_ref, type: uuid, req: true}
      - {key: supplier_invoice_number, type: string, req: true, sensitive: false, note: 'the supplier''s own number. Unique per supplier per tenant, which is the single control that catches most duplicate invoices'}
      - {key: invoice_date, type: date, req: true}
      - {key: due_date, type: date, nullable: true, financial: true}
      - {key: commitment_id, type: uuid, nullable: true, fk: purchase_commitment}
      - {key: lines, type: json, req: true, note: 'flat list per line - description, quantity, unit_price_minor, tax_classification, commitment_line_index'}
      - {key: currency, type: string, req: true, financial: true}
      - {key: subtotal_minor, type: money_minor, req: true, financial: true}
      - {key: tax_total_minor, type: money_minor, nullable: true, financial: true}
      - {key: total_minor, type: money_minor, req: true, financial: true}
      - {key: document_ref, type: string, nullable: true, note: the scanned or received document through the evidence_capture port}
      - {key: match_variance_minor, type: money_minor, nullable: true, financial: true}
      - {key: match_variance_reason, type: text, nullable: true}
      - {key: approved_for_payment_by_principal_id, type: uuid, nullable: true, financial: true}
      - {key: payment_reference, type: string, nullable: true, financial: true, note: set by the payment capability. This capability never moves money}
    invariants:
      - unique(tenant_id, supplier_party_ref, supplier_invoice_number). This one constraint catches the majority of duplicate invoices, which is the most common way a business pays for the same thing twice.
      - An invoice is a claim until matched. It never appears as a liability, an accrual or a payable until it reaches matched or accepted-with-variance.
      - Financial fields are gated by view_financial. The supplier and the invoice number are not, so that a receiving clerk can check whether a document has already been recorded.
      - An invoice may not be approved for payment by the principal who recorded it where the tenant requires separation, and that separation is a recorded configuration rather than an assumption.
    states: [received, matching, matched, variance_hold, approved_for_payment, paid, rejected, credited]
    initial_state: received
    transitions:
      - {from: received, to: matching, action: match_documents, actor: finance or system, guard: a commitment and at least one receipt are identified, side_effects: none, reversibility: true}
      - {from: matching, to: matched, action: match_documents, actor: as above, guard: quantity and price variance are within tolerance on every line, side_effects: the invoice becomes a liability and is eligible for payment approval, reversibility: true}
      - {from: matching, to: variance_hold, action: match_documents, actor: as above, guard: any line exceeds tolerance, side_effects: finance and the requesting location are told with the specific variance, reversibility: true}
      - {from: variance_hold, to: matched, action: accept_variance, actor: finance or ops_manager, guard: a reason is supplied and the acting session is elevated where the variance exceeds the elevation threshold, side_effects: the variance is recorded on the invoice permanently, reversibility: false}
      - {from: variance_hold, to: rejected, action: reject_invoice, actor: finance or ops_manager, guard: a reason is supplied and the supplier is told, side_effects: a corrected invoice is expected, reversibility: false}
      - {from: matched, to: approved_for_payment, action: approve_for_payment, actor: finance or tenant_owner, guard: acting session is elevated and the approver is not the recorder where separation is required, side_effects: none, reversibility: true}
      - {from: approved_for_payment, to: paid, action: observe_payment, actor: system or finance, guard: the payment capability returns a reference, side_effects: payment_reference recorded; this capability never moves money itself, reversibility: false}
      - {from: received, to: rejected, action: reject_invoice, actor: finance, guard: a reason is supplied - typically a duplicate or an invoice for a different tenant, side_effects: the supplier is told, reversibility: false}
      - {from: matched, to: credited, action: record_credit_note, actor: finance, guard: a supplier credit is recorded against it, side_effects: the liability is reduced by the credit, reversibility: false}
      - {from: variance_hold, to: credited, action: record_credit_note, actor: finance, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      received: >
        An unmatched invoice sitting in a queue is where late-payment charges come from.
        Threshold: match_start_days (default 2). Told: finance. Escape hatch: match or reject.
        An invoice with no identifiable commitment is reported separately, because it is
        either an unrecorded purchase, a duplicate under a different number, or a supplier
        billing the wrong tenant, and all three need a person rather than a queue.
      matching: >
        Threshold: match_lag_days (default 5). Told: finance. Escape hatch: complete the
        match or move to variance hold. Matching that stalls is usually a receipt that has
        not been recorded, and the notification says so and names the commitment, because
        that is the action that unblocks it.
      variance_hold: >
        A held invoice is a supplier not being paid and a relationship deteriorating.
        Threshold: variance_resolution_days (default 5), escalating to ops_manager then
        tenant_owner. Told: finance and the requesting location, because the location
        frequently knows why the quantity differs and finance does not. Escape hatch: accept
        with a reason, reject, or obtain a credit. Never auto-accepted at any tolerance,
        because auto-accepting a variance is paying more than was agreed without anybody
        agreeing to it.
      matched: >
        Matched and unapproved is a liability nobody has authorised. Threshold: due_date minus
        payment_approval_lead_days (default 3), or approval_lag_days (default 5) where no due
        date is known. Told: finance, then tenant_owner. Escape hatch: approve or dispute.
      approved_for_payment: >
        Approved and unpaid past its due date is a late payment with a known owner. Threshold:
        the due date. Told: finance and tenant_owner. Escape hatch: pay, or record why not.
        The specific monitored case is an approved invoice whose payment never returns a
        reference, which means the two systems disagree about whether a supplier has been paid
        - the most expensive divergence available here.
      paid: >
        Terminal. Retained permanently with its payment reference, which is the join between
        this capability and wherever money actually moved. Nothing pends.
      rejected: >
        Terminal. Retained, because a rejected invoice that is re-sent unchanged is a pattern
        worth seeing, and because a supplier will produce their copy.
      credited: >
        Terminal. Retained with the credit note reference. The monitored exception is a credit
        expectation raised by a return that has no matching credit note after
        credit_expectation_days. Told: finance, with the value, because uncollected supplier
        credits are quiet loss.

ports:
  - port_key: procurement_source
    direction: provides
    contract: Resolve a receipt to its commitment, its supplier and the expected quantities and unit costs, so a receipt can be matched rather than merely recorded.
    cardinality: zero_or_one

  - port_key: party_directory
    direction: requires
    contract: Resolve the supplier to a display name, contactable channels, payment terms, tax registration status and relationship state.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. A purchase is a commitment to somebody. Without a party directory the supplier is free text, no duplicate-invoice control is possible, and no commitment can be sent anywhere.

  - port_key: stock_movement_sink
    direction: requires
    contract: Write receipt, return and rejection movements at a stock location, and hold reservations against expected receipts.
    cardinality: zero_or_one
    unbound_behaviour: >
      Receipts are recorded as documents with no stock effect. Everything commercial - the
      three-way match, variance control, duplicate detection - still works completely. What is
      lost is any connection between what was bought and what is held, so a low balance can
      never trigger a request. This is a legitimate configuration for a business that buys
      services and consumables it does not track.

  - port_key: orderable_item
    direction: requires
    contract: Resolve an item to its unit of measure, its tax classification and its typical suppliers.
    cardinality: zero_or_one
    unbound_behaviour: 'Every line is free text with a manually entered unit and no tax classification. Matching still works on quantity and price. This is deliberately supported rather than degraded, because a large share of what these businesses buy will never be catalogued.'

  - port_key: approval_chain
    direction: requires
    contract: Route requests and commitments for approval, resolving approvers from role, scope and value.
    cardinality: zero_or_one
    unbound_behaviour: >
      Requests are approved by any principal holding approve at a covering scope, and
      commitments above the threshold are approved by finance or tenant_owner directly, with
      an audit note recording that no chain was configured. The value thresholds still apply -
      an unbound chain removes the routing, not the control.

  - port_key: org_structure
    direction: requires
    contract: Resolve the requesting and delivery locations and the approval scope hierarchy.
    cardinality: zero_or_one
    unbound_behaviour: Requests and commitments are tenant-scoped with no location. Approval routing by location is unavailable and every approver sees everything, which for a multi-site tenant is both a workload problem and a disclosure.

  - port_key: financial_document_sink
    direction: requires
    contract: Post matched supplier invoices, credit notes and accruals for the accounting period, and return a reference.
    cardinality: zero_or_one
    unbound_behaviour: 'Invoices are matched, approved and recorded here and posted nowhere. The payable position exists as a report to be read rather than as an entry, which is exactly how a business with an external accountant operates and is not an error.'

  - port_key: payment_authorisation
    direction: requires
    contract: Execute an approved payment against a supplier and return a reference. This capability never holds a payment credential and never moves money.
    cardinality: zero_or_one
    unbound_behaviour: Payment is recorded manually as a reference and a date entered by finance. This is how most of the target market pays suppliers and it is a first-class path rather than a fallback.

  - port_key: evidence_capture
    direction: requires
    contract: Store delivery notes, supplier invoice documents and photographs of damaged or rejected goods.
    cardinality: zero_or_one
    unbound_behaviour: 'Documents are referenced by number only. A damage dispute becomes one person''s account, and a supplier invoice cannot be produced during an audit without going to a filing cabinet. Not a blocker and a material weakening of every dispute.'

  - port_key: notification
    direction: requires
    contract: Deliver approval requests, overdue-delivery chases, discrepancy and variance messages, and supplier communications.
    cardinality: zero_or_one
    unbound_behaviour: Everything degrades to console lists and no commitment can be sent to a supplier electronically. sent_via falls back to telephone or in_person, recorded manually, which is a real operating mode and not a failure.

actions:

  - key: submit_request
    entity: purchase_request
    label: Ask for something
    actors: [employee, supervisor, dispatcher, ops_manager, system]
    rationale: >
      Deliberately open to almost everybody. A request path restricted to managers is a path
      that gets bypassed, and the bypass is somebody buying something with their own money and
      claiming it back, which is invisible to every control in this capability.
    preconditions: [at least one line, the tenant is not suspended]
    inputs: [lines, location_ref, needed_by, justification, source_ref]
    creates: [purchase_request]
    updates: []
    events: [purchase_request.submitted]
    notifications:
      - {to: the resolved approver, channel: in_app_and_push, when: always, template: approval_requested, must_include: [requester, estimated_total_if_visible, needed_by, line_summary], batching_policy: 'digest per approver per configured interval, except where needed_by is inside the approval window, which is immediate'}
      - {to: the requester, channel: in_app, when: always, template: request_submitted, must_include: [who_it_went_to]}
    undoable: true
    reversal_action: cancel_request
    audit_class: always
    idempotency_key_source: >
      tenant_id plus source_capability_key plus source_ref where present, otherwise the
      requesting principal plus a hash of the line list plus the minute bucket. The
      source-keyed form is what stops a low-balance rule raising the same request nightly.
    offline_policy: queue
    concurrency: >
      Requests do not contend. Two people requesting the same thing both succeed and the
      duplicate is surfaced to the approver rather than prevented, because two people needing
      the same thing is frequently two genuine needs and sometimes one, and only a person
      knows which.
    failure_modes:
      - {code: E_VALIDATION, cause: no lines, message: Add at least one item.}
      - {code: E_VALIDATION, cause: a line has both an item and a free-text description, message: field-specific}
      - {code: E_PRECONDITION, cause: no approver can be resolved for this scope and value, message: This action is not available in the current state., note: 'names the missing approval configuration. The request is still CREATED in draft rather than lost, because the requester still needs the thing and the fix is an administrator''s job'}
      - {code: E_AUTHZ_FIELD, cause: estimated costs supplied without view_financial, message: null, note: 'dropped. The request proceeds with quantities and descriptions, which is the common case for a person on a location who knows what is needed and not what it costs'}
      - {code: E_QUOTA, cause: open request limit reached, message: Plan limit reached.}
    edge_cases:
      - A request raised automatically by a low balance. Idempotent on the source reference, so a nightly rule produces one open request rather than thirty. When the balance recovers before approval the request is not auto-cancelled; the approver is shown the current balance alongside, and decides.
      - A request for something not in the catalogue. Fully supported as free text, and this is the majority case in several target segments. The commitment raised from it carries the free text through to the supplier, and no stock movement results unless somebody catalogues it later.
      - A request submitted offline from a location with no signal. Queued. The approver is notified on sync, and the notification carries both the claimed submission time and the arrival time, because needed_by dates are frequently already past by the time the request lands.
      - Self-approval. Permitted only below a configured value and only where the tenant has explicitly enabled it, because for a two-person business requiring a second approver makes the capability unusable. Where permitted it is always recorded as self-approved and reported.

  - key: record_receipt
    entity: goods_receipt
    label: Record what arrived
    actors: [employee, supervisor, integration_principal]
    rationale: >
      Recorded first and matched second, deliberately. Blocking a receipt because it does not
      match an order leaves goods on a loading area while somebody hunts for a reference, and
      what actually happens next is that the goods go onto a shelf unrecorded.
    preconditions: [a stock location is named, at least one line with a positive quantity, the receiver holds create on goods_receipt at a covering scope]
    inputs: [commitment_id, supplier_party_ref, stock_location_ref, supplier_document_ref, lines, evidence_refs, received_at]
    creates: [goods_receipt, stock movements for accepted quantity, return obligations for rejected quantity]
    updates: [commitment line received quantities, reservation discharge]
    events: [goods_receipt.recorded, stock.received]
    notifications:
      - {to: finance and the requesting principal, channel: in_app, when: 'a discrepancy is recorded, or the receipt has no commitment', template: receipt_needs_attention, must_include: [supplier, document_ref, discrepancy_summary], priority: high}
      - {to: the requester behind the commitment, channel: in_app, when: the receipt completes their requested lines, template: your_request_arrived}
    undoable: false
    confirmation_specification: 'Modal listing accepted and rejected quantities per line, the stock location they will land in, any over-receipt beyond the ordered quantity, and that rejected goods create a return obligation rather than stock. Required because a submitted receipt is append-only - a correction is a further receipt, not an edit, since the supplier holds a signed copy of the delivery note.'
    audit_class: always
    idempotency_key_source: >
      supplier_party_ref plus supplier_document_ref where present, otherwise commitment_id
      plus received_at truncated to the minute plus the receiving principal. Keying on the
      supplier's own document number is what stops one delivery being received twice by two
      people at a busy loading point, which creates stock that does not exist and an invoice
      that appears to match.
    offline_policy: queue
    concurrency: >
      The receipt writes its stock movements and updates the commitment's received quantities
      in one transaction, under a lock on the commitment. Two receipts against one commitment
      serialise, so the received quantity can never exceed the ordered quantity by more than
      one receipt's worth through a race. Over-receipt beyond tolerance is surfaced rather than
      refused, because the goods are physically present.
    failure_modes:
      - {code: E_VALIDATION, cause: a line quantity is zero or negative, message: field-specific, note: a return is a separate action with its own authority}
      - {code: E_PRECONDITION, cause: over-receipt exceeds the tolerance and the tenant refuses over-receipt, message: This action is not available in the current state., note: 'names the ordered and received quantities. The default is to PERMIT with the excess flagged, because the goods are on the floor and refusing to record them does not send them back'}
      - {code: E_CONFLICT_UNIQUE, cause: a receipt with this supplier document reference already exists, message: This delivery has already been recorded., note: 'shows the existing receipt, because the receiver''''s next question is who recorded it'}
      - {code: E_PRECONDITION, cause: the commitment is cancelled or closed, message: This action is not available in the current state., note: 'the receipt is still recorded as an unmatched receipt rather than being refused, because the goods arrived and refusing the record loses them'}
      - {code: E_DEPENDENCY, cause: the stock sink is bound but unavailable, message: A required service is unavailable., note: 'the receipt is REFUSED rather than committing without stock movements. A receipt recorded without its movements means the goods exist commercially and not physically, and reconstructing which receipts were affected afterwards is impractical'}
      - {code: E_AUTHZ_FIELD, cause: unit prices supplied without view_financial, message: null, note: dropped. Quantities and conditions are recordable by any receiver}
    edge_cases:
      - Goods arriving with no purchase order reference, which is common. Recorded with commitment_id null and reported immediately to finance as an unmatched receipt. It is either an unrecorded purchase, a delivery to the wrong place, or somebody's verbal order, and all three need a person today rather than a queue entry.
      - Partial delivery. Recorded as received quantity below ordered, and the commitment moves to partially received. The outstanding quantity is always expressed as a count rather than a percentage in every notification, because a percentage makes a shortfall look acceptable.
      - Damaged or rejected goods. Recorded on the receipt with a reason and a photograph where evidence capture is bound, and they do NOT create stock. They create a return obligation with a credit expectation, so that rejected goods are neither invisible nor counted as held - the two failure modes of the naive implementation.
      - A receipt recorded offline at a location with no signal. Queued with its evidence as one unit. On sync, stock movements apply in occurred_at order alongside any consumption recorded in the same period, so a consumption recorded after the receipt but occurring before it does not produce a spurious negative.
      - Over-receipt where the supplier shipped more than ordered. Permitted by default with the excess flagged, because the goods are physically present. Whether to keep or return them is a commercial decision and the flag is what makes it a decision rather than an accident.
      - Two people receiving the same delivery at a busy loading point. The supplier document reference collapses them into one receipt. Where no document reference exists, the minute-bucket key catches most of it and the rest surfaces as a duplicate at match time, which is late but visible.

  - key: match_documents
    entity: supplier_invoice
    label: Match order, receipt and invoice
    actors: [finance, ops_manager, system]
    rationale: >
      The control this capability exists for. An operation that receives goods without matching
      them pays for things it did not get; one that matches with no tolerance stops paying
      anybody. The tolerance is configuration with a shipped default, and every variance
      outside it needs a person.
    preconditions: [the invoice exists, a commitment is identified, at least one receipt exists against that commitment]
    inputs: [invoice_id, commitment_id, receipt_ids, line_mapping]
    creates: []
    updates: [invoice state, match variance, receipt state]
    events: [procurement.matched, procurement.variance_detected]
    notifications:
      - {to: finance and the requesting location, channel: in_app, when: any line exceeds tolerance, template: match_variance, must_include: [line, ordered, received, invoiced, variance_value], priority: high}
      - {to: finance, channel: in_app, when: the invoice references a closed commitment, template: invoice_against_closed_commitment, priority: high, note: this is either a duplicate or a late claim and must never match automatically}
    undoable: true
    reversal_action: 'unmatch, which returns the invoice to matching and is separately audited'
    audit_class: always
    idempotency_key_source: invoice_id plus a hash of the ordered receipt id list plus the line mapping
    offline_policy: refuse
    concurrency: >
      Matching locks the invoice and takes shared locks on the receipts, so one receipt cannot
      be consumed by two invoices concurrently - which is exactly how a duplicate invoice gets
      paid. Quantities already matched are tracked per receipt line rather than per receipt,
      because partial invoicing across several receipts is ordinary.
    failure_modes:
      - {code: E_PRECONDITION, cause: no receipt exists against the commitment, message: Nothing has been recorded as received against this order., note: 'the message names the action that unblocks it, because a stalled match is almost always an unrecorded receipt rather than a genuine dispute'}
      - {code: E_CONFLICT_UNIQUE, cause: a receipt line is already fully matched to another invoice, message: That delivery has already been invoiced., note: names the other invoice. This is the duplicate-payment control and it is a constraint rather than a report}
      - {code: E_VALIDATION, cause: quantity or price variance exceeds tolerance, message: null, note: 'not an error - the invoice moves to variance_hold, which is a state a person works, rather than failing a job that nobody sees'}
      - {code: E_PRECONDITION, cause: the commitment is closed, message: This action is not available in the current state., note: 'requires an explicit reopen with a reason, because an invoice arriving against a closed order is a duplicate more often than it is a late claim'}
      - {code: E_CONFLICT_UNIQUE, cause: this supplier invoice number already exists for this supplier, message: This invoice number has already been recorded., note: 'the single control that catches most duplicate invoices, enforced at record time and re-checked here'}
    edge_cases:
      - One invoice covering several receipts, and one receipt covering several invoices. Both are ordinary and both are supported by tracking matched quantity per receipt line. A model that matches whole documents fails on the first partial delivery.
      - A price variance within tolerance but consistently in the supplier's favour. Matched, and reported as a pattern to finance monthly. A systematic small overcharge is invisible per invoice and material per quarter, and the tolerance is precisely what conceals it.
      - An invoice for goods never received because the delivery went to another location. The match fails, and the unmatched-receipt report at the other location is what resolves it. The two reports are deliberately cross-referenced by supplier and date, because otherwise both sides wait.
      - Matching where the commitment used free-text lines and the invoice uses the supplier's own descriptions. No automatic matching by description is attempted; the line mapping is supplied by a person. Fuzzy description matching is exactly the kind of helpfulness that pays a supplier for something else.
      - Tax variance where the supplier applied a different treatment from the one expected. Held as a variance with the tax difference reported separately from the price difference, because the two have different resolutions - one is a negotiation and the other is a question for an accountant.

rules:
  - key: request_and_commitment_are_separate
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A purchase request and a purchase commitment are distinct records with distinct authority. Approving a request never commits money; only sending a commitment does.'
    on_conflict: not overridable

  - key: receipt_is_recorded_before_it_is_matched
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A receipt may always be recorded, with or without a commitment. Matching is a separate act and never a precondition of recording.'
    on_conflict: not overridable
    rationale: Blocking a receipt on a reference number means goods on a loading area and then goods on a shelf that the system knows nothing about.

  - key: invoice_is_a_claim_until_matched
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A supplier invoice is never a liability, an accrual or a payable until it reaches matched or accepted-with-variance.'
    on_conflict: not overridable
    rationale: Recording a claim as a liability on arrival is how a duplicate invoice becomes a payment.

  - key: duplicate_invoice_number_is_a_constraint
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'unique(tenant, supplier, supplier_invoice_number), enforced at the database rather than checked in application code.'
    on_conflict: not overridable

  - key: match_tolerance
    kind: policy
    scope: capability
    overridable_at: tenant
    default: >
      Quantity tolerance zero for goods and 5 percent for measured or bulk items. Price
      tolerance the lesser of 2 percent or a small absolute value per line, with an absolute
      cap per invoice. Anything outside goes to variance_hold and needs a person.
    on_conflict: most specific scope wins
    rationale: >
      A zero tolerance stops an operation on rounding differences; an open tolerance is no
      control. The shipped numbers are a starting point and are explicitly flagged for
      validation rather than presented as correct.

  - key: variance_is_never_auto_accepted
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'No timer, threshold or sweep may move an invoice out of variance_hold. Only a person accepts, rejects or credits it.'
    on_conflict: not overridable
    rationale: Auto-accepting a variance is paying more than was agreed without anybody agreeing to it.

  - key: over_receipt_is_permitted_and_flagged
    kind: policy
    scope: capability
    overridable_at: site
    default: 'Permitted, with the excess flagged and reported. A site may refuse it, in which case the excess must be recorded as a separate unmatched receipt.'
    on_conflict: most specific scope wins
    rationale: The goods are physically present. Refusing to record them does not send them back; it only removes them from the record.

policy_knobs:
  - {key: draft_request_stale_days, default: 7, range: [1, 90]}
  - {key: approval_response_days, default: 3, range: [1, 60]}
  - {key: conversion_lag_days, default: 2, range: [1, 30]}
  - {key: rejection_rate_alert, default: 0.3, range: [0.01, 1.0]}
  - {key: draft_commitment_stale_days, default: 3, range: [1, 60]}
  - {key: commitment_approval_days, default: 2, range: [1, 30]}
  - {key: acknowledgement_days, default: 2, range: [1, 30]}
  - {key: overdue_chase_days, default: 3, range: [1, 30]}
  - {key: partial_receipt_stale_days, default: 7, range: [1, 90]}
  - {key: unclosed_received_days, default: 30, range: [1, 365]}
  - {key: draft_receipt_stale_minutes, default: 60, range: [5, 1440]}
  - {key: receipt_dispute_days, default: 7, range: [1, 90]}
  - {key: credit_expectation_days, default: 30, range: [1, 365]}
  - {key: match_start_days, default: 2, range: [1, 30]}
  - {key: match_lag_days, default: 5, range: [1, 60]}
  - {key: variance_resolution_days, default: 5, range: [1, 60]}
  - {key: approval_lag_days, default: 5, range: [1, 60]}
  - {key: payment_approval_lead_days, default: 3, range: [0, 30]}
  - {key: quantity_tolerance_percent, default: 0, range: [0, 50]}
  - {key: price_tolerance_percent, default: 2, range: [0, 50]}
  - {key: commitment_approval_threshold_minor, default: null, note: 'null means every commitment needs approval. Deliberately null rather than a number, because a shipped threshold is a shipped opinion about how much money a stranger may spend unsupervised'}
  - {key: self_approval_limit_minor, default: 0, note: zero means self-approval is never permitted}
  - {key: separation_of_recording_and_payment_approval, default: true}

open_questions:
  - {q: 'What match tolerances are actually workable for these segments? The shipped numbers are a starting point chosen for plausibility rather than from evidence, and a tolerance set too tight stops the operation while one set too loose is no control at all.', assumption: 'Zero quantity tolerance for discrete goods, 5 percent for measured, 2 percent on price. Chosen for plausibility.', confidence: VALIDATION_REQUIRED, method: measure the real distribution of quantity and price variance across pilot tenants for a quarter before fixing the defaults, priority: High, blocks: [match_tolerance defaults, variance queue volume]}
  - {q: 'Should commitment_approval_threshold_minor ship with a value? Null means every commitment needs approval, which is safe and makes the product tedious for a small business buying stationery.', assumption: 'Null, with the consequence surfaced during onboarding rather than hidden behind a guessed number.', confidence: VALIDATION_REQUIRED, method: 'operator interviews on current practice, and measure how many approvals a threshold of a given size would remove', priority: High, blocks: [AET-06 decision count]}
  - {q: 'Where a receipt arrives with no commitment, should the system offer to create one retrospectively? It makes the record complete and it also makes it trivially easy to manufacture a purchase order after the fact to justify a delivery, which is the classic procurement fraud.', assumption: None. The model records the unmatched receipt and does not offer retrospective commitment creation., confidence: VALIDATION_REQUIRED, method: review with somebody who has audited a purchasing function, priority: High}
  - {q: 'Should a supplier be able to see their own commitments, receipts and invoice status through a portal? It removes a large volume of telephone chasing and it exposes the tenant''s receiving discrepancies to the supplier before the tenant has decided its position.', assumption: 'None. No supplier surface is declared in this capability, deliberately, so that the question is not answered by accident.', confidence: VALIDATION_REQUIRED, method: operator interviews plus a commercial decision, priority: Medium}
  - {q: 'How should a verbal commitment be recorded so that it is both honest and controllable? sent_via includes telephone and in_person, which reflects reality and means a commitment can exist with no document the supplier ever received.', assumption: 'Recorded as sent with the channel, and the acknowledgement monitor never fires for those channels. Whether a verbal commitment should require a confirming document is not decided.', confidence: WORKING_ASSUMPTION, method: measure how large a share of commitments are verbal in pilot, priority: Medium}
