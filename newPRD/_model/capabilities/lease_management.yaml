key: lease_management
name: Lease Management
layer: domain
confidence: KNOWN
description: >
  Agreements to occupy space for a period in exchange for periodic payment, with the
  schedules, escalations, recoverable charges, deposits and renewals that follow from them.
  Explicitly not part of Core, per the product owner - it is a domain capability that a
  property pack installs and that every other pack ignores entirely.

principles:
  - A lease is a commitment schedule, not a contract document. The document is evidence; the schedule is what generates money, obligations and dates that somebody must act on.
  - Escalation is a rule with a date, not a number somebody remembers. An escalation that depends on a person remembering is one that is applied late, applied wrongly, or not applied at all.
  - Recoverable charges are estimated, then reconciled against actual cost, and the difference is always owed in one direction. Modelling the estimate without the reconciliation produces a charge nobody can defend.
  - Every date that produces an obligation is a date somebody must be told about in advance. A renewal window that closes silently is an automatic renewal nobody chose.
  - A deposit is somebody else's money held on trust. It is tracked separately from revenue, never netted against arrears without an explicit act, and its return is an obligation with a deadline.
  - The occupied thing arrives through a port. This capability never learns what kind of space it is, which is what stops it becoming a second location model.

entities:

  - key: lease
    name: Lease
    description: One agreement with one counterparty to occupy defined space for a period, with its commercial terms and its lifecycle.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: reference, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: counterparty_ref, type: uuid, req: true, note: resolved through the party_directory port}
      - {key: space_refs, type: json, req: true, note: 'flat list of occupied space references, resolved through the occupiable_space port. Opaque here - this capability never learns what kind of space it is'}
      - {key: measured_area, type: decimal, nullable: true}
      - {key: area_unit, type: string, nullable: true}
      - {key: area_basis, type: enum, values: [not_stated, measured_internal, measured_gross, agreed_notional], req: true, default: not_stated, note: which measurement the rent is calculated on. Different bases give materially different numbers for the same space and an unstated basis is the origin of most rent disputes}
      - {key: starts_on, type: date, req: true}
      - {key: ends_on, type: date, req: true}
      - {key: break_dates, type: json, nullable: true, note: flat list of dates on which either party may end the agreement early}
      - {key: notice_days, type: int, nullable: true}
      - {key: renewal_option, type: enum, values: [none, tenant_option, landlord_option, mutual, automatic_unless_notice], req: true, default: none}
      - {key: renewal_window_opens_on, type: date, nullable: true}
      - {key: renewal_window_closes_on, type: date, nullable: true}
      - {key: base_amount_minor, type: money_minor, req: true, financial: true}
      - {key: currency, type: string, req: true, financial: true}
      - {key: payment_frequency, type: enum, values: [monthly, quarterly, half_yearly, annually], req: true, financial: true}
      - {key: payment_in_advance, type: bool, req: true, default: true, financial: true, note: whether a period is paid at its start or its end. Explicit because it moves every due date by a whole period and is a frequent source of disagreement}
      - {key: deposit_amount_minor, type: money_minor, nullable: true, financial: true}
      - {key: rent_free_periods, type: json, nullable: true, note: flat list of period start and end pairs}
      - {key: document_ref, type: string, nullable: true, note: the executed agreement through the evidence_capture port}
      - {key: supersedes_lease_id, type: uuid, nullable: true, fk: lease}
      - {key: ended_reason, type: enum, values: [not_ended, expired, break_exercised, surrendered, forfeited, superseded], nullable: true}
    invariants:
      - ends_on is after starts_on, and every break date and renewal window date falls within the term.
      - space_refs may not be empty. An agreement to occupy nothing is not a lease.
      - Two active leases may not claim the same space over overlapping dates. The overlap is detected at activation and refused, because double-letting is discovered by two counterparties arriving at the same place.
      - Financial fields are gated by view_financial and are never offline_editable.
      - area_basis is required before any charge is calculated per unit of area. A per-area charge computed on an unstated basis is a number neither party can check.
      - renewal_option=automatic_unless_notice requires both renewal window dates and a notice period. An automatic renewal with no window is a commitment nobody can escape.
    states: [draft, agreed, active, in_notice, holding_over, ended, terminated]
    initial_state: draft
    transitions:
      - {from: draft, to: agreed, action: agree_lease, actor: 'finance, ops_manager or tenant_owner', guard: 'terms are complete, the space does not overlap another active lease, and the acting session is elevated', side_effects: the schedule is generated and the deposit obligation is raised, reversibility: true}
      - {from: agreed, to: draft, action: return_lease_to_draft, actor: as above, guard: the term has not started, side_effects: the schedule is discarded and any raised charge is cancelled, reversibility: true}
      - {from: agreed, to: active, action: observe_term_start, actor: system_scheduler, guard: 'now >= starts_on', side_effects: charges begin to be raised on schedule, reversibility: false}
      - {from: active, to: in_notice, action: serve_notice, actor: 'finance, ops_manager or the counterparty through the customer_surface port', guard: 'a notice date and a party are recorded, and the notice satisfies the notice period against a break date or the term end', side_effects: 'the end date is fixed, the renewal window is closed, and the reinstatement and dilapidation obligations are surfaced', reversibility: true}
      - {from: in_notice, to: active, action: withdraw_notice, actor: the serving party, guard: both parties agree and a reason is recorded, side_effects: none, reversibility: false}
      - {from: active, to: holding_over, action: observe_term_end, actor: system_scheduler, guard: 'now > ends_on, no notice was served and no renewal was agreed', side_effects: 'charges continue at the holding-over basis the agreement specifies, or at the last basis with the ambiguity flagged where it specifies none', reversibility: true}
      - {from: holding_over, to: active, action: renew_lease, actor: finance or tenant_owner, guard: 'a successor lease is agreed, or the term is extended with both parties recorded as agreeing', side_effects: 'a new lease supersedes this one, or the term extends and the schedule regenerates from the change forward', reversibility: false}
      - {from: in_notice, to: ended, action: observe_end_date, actor: system_scheduler, guard: 'now >= the notice end date', side_effects: 'charges stop, the deposit return obligation is raised with its deadline, and any reinstatement obligation is listed', reversibility: false}
      - {from: active, to: ended, action: observe_term_end, actor: system_scheduler, guard: 'now > ends_on and the agreement provides for no holding over', side_effects: as above, reversibility: false}
      - {from: holding_over, to: ended, action: observe_end_date, actor: system_scheduler, guard: a notice period from within holding over has expired, side_effects: as above, reversibility: false}
      - {from: active, to: terminated, action: terminate_lease, actor: tenant_owner, guard: 'acting session is elevated, a reason and an effective date are recorded, and the legal basis is stated', side_effects: 'charges stop from the effective date, the deposit position is frozen pending resolution, and arrears remain owed', reversibility: false}
      - {from: in_notice, to: terminated, action: terminate_lease, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: holding_over, to: terminated, action: terminate_lease, actor: as above, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_lease_stale_days (default 30). Told: the drafting principal and
        finance. Escape hatch: agree or discard. The specific risk is a counterparty already in
        occupation under terms that exist only in a draft, so the notification asks whether the
        space is already occupied.
      agreed: >
        Bounded by starts_on. The monitored exception is an agreed lease whose start date has
        passed without the scheduler activating it, which means charges are not being raised
        while somebody is occupying space. Threshold: activation_lag_days (default 1). Told:
        finance and platform_operator, because the two causes look identical from a report.
      active: >
        Steady state and where every date-driven obligation lives. Four monitored conditions.
        (a) A renewal window opening within renewal_warning_days (default 180, or the notice
        period plus 60 where that is longer). Told: finance, the relationship owner and
        tenant_owner, at the window opening, at halfway, at 30 days and at 7 days before it
        closes. A renewal window that closes silently is an automatic renewal nobody chose, or
        a vacancy nobody planned for. (b) An escalation due within escalation_warning_days
        (default 90) that has not been calculated. (c) A lease with arrears exceeding
        arrears_alert_periods (default 2) of the base amount. (d) A lease with no executed
        document attached after document_chase_days (default 60), which is an agreement nobody
        can produce if it is disputed.
      in_notice: >
        Bounded by the notice end date, and it is the period in which everything must be
        arranged. Threshold: notifications at notice service, at halfway, at 30 days and at 7
        days, carrying the reinstatement obligations, the deposit return deadline and the
        vacancy that follows. Told: finance, the relationship owner and the space owner. Escape
        hatch: withdraw the notice by agreement, or proceed. The characteristic failure is a
        space becoming empty on a date nobody planned around.
      holding_over: >
        The most commercially dangerous state, because it looks like continuity and is
        frequently an agreement with no agreed terms. Threshold: holding_over_review_days
        (default 30), then monthly, escalating to tenant_owner. Told: finance and
        tenant_owner, and the notification states plainly whether the agreement specifies a
        holding-over basis or whether charges are continuing on an assumption. Escape hatch:
        renew, serve notice, or terminate. Verity never assumes a holding-over rent where the
        agreement is silent; it continues at the last basis and flags the assumption on every
        charge raised, so an eventual dispute is about a number somebody can see was assumed.
      ended: >
        Terminal in occupation terms. Two obligations pend. (a) The deposit return, which has a
        deadline and is monitored by its own entity. (b) Any reinstatement or final
        reconciliation, threshold final_reconciliation_days (default 90). Told: finance.
        Escape hatch: complete the reconciliation and return or apply the deposit. A lease
        ended with an unreturned deposit and no reconciliation is somebody else's money held
        with no stated reason.
      terminated: >
        Terminal. Retained permanently with the reason, the effective date and the stated legal
        basis. Arrears remain owed and the deposit position is frozen rather than resolved,
        because a termination is usually contested and resolving the deposit unilaterally
        forecloses the argument. Told once to finance and tenant_owner. Nothing further pends
        automatically.

  - key: charge_schedule
    name: Charge Schedule
    description: The generated series of periodic charges a lease produces, with the basis of each and its escalation history.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: lease_id, type: uuid, req: true, fk: lease}
      - {key: charge_kind, type: enum, values: [base, recoverable_estimate, recoverable_balancing, service, insurance, other], req: true}
      - {key: period_start, type: date, req: true}
      - {key: period_end, type: date, req: true}
      - {key: due_on, type: date, req: true}
      - {key: amount_minor, type: money_minor, req: true, financial: true}
      - {key: basis_note, type: text, req: true, note: 'how the amount was arrived at, in words - the base amount, the escalation applied, the area and rate, the apportionment. Mandatory, because a charge a counterparty cannot check is a charge they will query and finance will then reconstruct by hand'}
      - {key: escalation_applied_id, type: uuid, nullable: true, fk: escalation_rule}
      - {key: rent_free, type: bool, req: true, default: false}
      - {key: apportioned, type: bool, req: true, default: false, note: whether the period is partial and the amount pro-rated}
      - {key: billable_outcome_ref, type: uuid, nullable: true, note: 'the outcome emitted to billing, so a schedule row and an invoice line can be reconciled'}
      - {key: superseded_by_schedule_id, type: uuid, nullable: true, fk: charge_schedule}
    invariants:
      - period_end is on or after period_start, and due_on is consistent with payment_in_advance - at or before period_start when in advance, at or after period_end when in arrears.
      - basis_note is mandatory and non-empty on every row including unescalated ones.
      - A raised charge is never edited. A correction supersedes it with a new row and, where it has already been invoiced, produces a credit through the billing capability rather than altering the schedule.
      - A schedule row emits at most one billable outcome. The uniqueness is enforced by the billing capability's own constraint and is restated here because a duplicated rent charge is discovered by the counterparty.
      - Regenerating a schedule after a lease change affects only rows not yet raised. Rows already raised are superseded explicitly where they must change.
    states: [projected, raised, invoiced, superseded, cancelled]
    initial_state: projected
    transitions:
      - {from: projected, to: raised, action: raise_charge, actor: system_scheduler, guard: 'now >= the raise date and the lease is active, in_notice or holding_over', side_effects: a billable outcome is emitted where the sink is bound, reversibility: true}
      - {from: raised, to: invoiced, action: observe_invoiced, actor: system, guard: the billing capability reports the outcome invoiced, side_effects: none, reversibility: false}
      - {from: projected, to: superseded, action: regenerate_schedule, actor: system or finance, guard: the lease terms changed and this row has not been raised, side_effects: a replacement row is generated, reversibility: false}
      - {from: raised, to: superseded, action: correct_charge, actor: finance, guard: acting session is elevated and a reason is supplied, side_effects: 'a replacement row is generated and, where already invoiced, a credit is requested through billing rather than the invoice being altered', reversibility: false}
      - {from: projected, to: cancelled, action: cancel_charge, actor: finance, guard: the lease ended or terminated before this period, side_effects: none, reversibility: false}
    stuck_state_policy:
      projected: >
        Bounded by the raise date. The monitored exception is a projected row whose raise date
        has passed while the lease is active - rent that should have been charged and was not.
        Threshold: raise_lag_days (default 1). Told: finance AND platform_operator, because a
        scheduler that is not running and a lease that is not active look identical in a
        report and have completely different fixes. This is the highest-value monitor in the
        capability, since unraised rent is invisible by construction.
      raised: >
        Raised and uninvoiced is revenue asked for by nobody. Threshold: invoice_lag_days
        (default 5). Told: finance. Escape hatch: invoice, or investigate the billing sink. The
        specific case worth naming is a raised charge whose billable outcome was never
        acknowledged, which is the same divergence billing watches for from its own side.
      invoiced: >
        Terminal in schedule terms. Collection, dispute and write-off all belong to billing.
        Nothing pends here, deliberately, because two capabilities both chasing the same debt
        produce two conversations with one counterparty.
      superseded: >
        Terminal. Retained permanently with its basis note, because a superseded charge is
        exactly what a counterparty produces when they query a correction. Nothing pends.
      cancelled: >
        Terminal. Retained with the reason. Nothing pends.

  - key: escalation_rule
    name: Escalation Rule
    description: How and when a charge changes over a lease term, expressed as a rule with a date rather than as a number somebody remembers.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: lease_id, type: uuid, req: true, fk: lease}
      - {key: applies_to_charge_kind, type: enum, values: [base, recoverable_estimate, service, insurance, all], req: true}
      - {key: method, type: enum, values: [fixed_percentage, fixed_amount, index_linked, stepped_schedule, open_market_review], req: true}
      - {key: percentage, type: decimal, nullable: true, financial: true}
      - {key: amount_minor, type: money_minor, nullable: true, financial: true}
      - {key: index_key, type: string, nullable: true, note: 'the published index the escalation follows. Held as a key rather than a value, because the value is external, is published late, and is sometimes revised'}
      - {key: index_lag_months, type: int, nullable: true, note: 'how far back the reference index value is taken, because the current period''s index is not published in time to bill'}
      - {key: floor_percentage, type: decimal, nullable: true, financial: true}
      - {key: cap_percentage, type: decimal, nullable: true, financial: true}
      - {key: steps, type: json, nullable: true, note: flat list of effective date and amount pairs for a stepped schedule}
      - {key: effective_dates, type: json, req: true, note: flat list of dates on which this rule applies}
      - {key: last_applied_on, type: date, nullable: true}
      - {key: next_due_on, type: date, nullable: true}
      - {key: requires_agreement, type: bool, req: true, default: false, note: 'true for an open market review, where the new amount is negotiated rather than computed'}
    invariants:
      - method=fixed_percentage requires percentage; fixed_amount requires amount_minor; index_linked requires index_key and index_lag_months; stepped_schedule requires steps; open_market_review requires requires_agreement true.
      - effective_dates may not be empty and every date falls within the lease term.
      - cap_percentage, where set, is at or above floor_percentage.
      - An index-linked escalation is never applied with an estimated or provisional index value. Where the value is unpublished the escalation is held and reported, because applying an estimate and correcting it later produces a charge, a credit and a conversation for every affected period.
      - An escalation that requires agreement never computes an amount automatically. It raises an obligation for somebody to negotiate and records the outcome.
    states: [scheduled, due, applied, held, agreed_pending]
    initial_state: scheduled
    transitions:
      - {from: scheduled, to: due, action: observe_escalation_due, actor: system_scheduler, guard: 'now >= next_due_on', side_effects: finance is told; the schedule is not yet regenerated, reversibility: true}
      - {from: due, to: applied, action: apply_escalation, actor: system or finance, guard: 'the method computes an amount and, for index-linked, the reference index value is published', side_effects: 'future schedule rows are regenerated from the effective date forward, with the basis note recording the calculation', reversibility: true}
      - {from: due, to: held, action: hold_escalation, actor: system or finance, guard: 'the reference index value is not yet published, or an input is missing', side_effects: charges continue at the previous amount and the under-recovery accrues visibly rather than silently, reversibility: true}
      - {from: held, to: applied, action: apply_escalation, actor: system or finance, guard: the input became available, side_effects: the escalation is applied from its original effective date and the difference for periods already charged is raised as a balancing charge rather than being written off, reversibility: true}
      - {from: due, to: agreed_pending, action: request_review_agreement, actor: finance, guard: requires_agreement is true, side_effects: a negotiation obligation is raised and the counterparty is told, reversibility: true}
      - {from: agreed_pending, to: applied, action: record_reviewed_amount, actor: finance or tenant_owner, guard: an agreed amount and evidence of agreement are recorded, side_effects: as for application, reversibility: false}
    stuck_state_policy:
      scheduled: >
        Bounded by next_due_on. Not otherwise monitored; the lease's own escalation warning
        carries the advance notice.
      due: >
        An escalation due and unapplied is money not being charged, accruing every period.
        Threshold: escalation_apply_lag_days (default 7). Told: finance and tenant_owner,
        with the cumulative under-recovery to date, because that number is what makes it
        urgent. Escape hatch: apply, hold explicitly, or start the review.
      held: >
        Held is legitimate for an unpublished index and dangerous as a resting place.
        Threshold: escalation_hold_review_days (default 30), then monthly. Told: finance, with
        the accrued difference. Escape hatch: apply once the input arrives, or record a
        deliberate decision not to escalate. The accrued difference is shown on every
        notification so that the cost of continuing to hold is visible rather than
        theoretical.
      agreed_pending: >
        A review under negotiation, which frequently runs long. Threshold:
        review_negotiation_days (default 90), then monthly, escalating to tenant_owner. Told:
        finance and the relationship owner, with the accrued difference at the old amount.
        Escape hatch: agree, or invoke whatever determination the agreement provides for.
        Verity never imposes a reviewed amount, because a reviewed amount is a negotiated fact
        and imposing one would produce a charge with no basis a counterparty accepts.
      applied: >
        Terminal for that effective date. Where the rule has further effective dates it returns
        to scheduled for the next. Retained with its computation so a charge can always be
        traced to the rule and the inputs that produced it.

  - key: deposit
    name: Deposit
    description: Money held on trust against a lease, tracked separately from revenue, with its return obligation and its deadline.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: lease_id, type: uuid, req: true, fk: lease}
      - {key: required_amount_minor, type: money_minor, req: true, financial: true}
      - {key: held_amount_minor, type: money_minor, req: true, default: 0, financial: true}
      - {key: held_since, type: date, nullable: true}
      - {key: holding_arrangement, type: enum, values: [not_stated, held_by_landlord, third_party_scheme, bank_guarantee, none_required], req: true, default: not_stated, note: where the money actually is. Materially different obligations follow from each and an unstated arrangement is one nobody can discharge correctly}
      - {key: scheme_reference, type: string, nullable: true, sensitive: true}
      - {key: return_due_by, type: date, nullable: true}
      - {key: returned_amount_minor, type: money_minor, req: true, default: 0, financial: true}
      - {key: applied_amount_minor, type: money_minor, req: true, default: 0, financial: true, note: 'applied against arrears or reinstatement, only by an explicit act'}
      - {key: application_reason, type: text, nullable: true, financial: true}
      - {key: disputed, type: bool, req: true, default: false}
    invariants:
      - returned_amount_minor plus applied_amount_minor may never exceed held_amount_minor.
      - A deposit is never netted against arrears automatically. Application is an explicit act with a reason, because applying somebody else's money to a debt they dispute is the act most likely to be challenged.
      - Deposit money is tracked separately from revenue at every point and never appears in a revenue figure. This is restated in the reporting projections rather than trusted to be remembered.
      - return_due_by is set at lease end and is a real deadline. A deposit held past it with no dispute recorded is money held with no stated basis.
      - Financial fields are gated by view_financial, and scheme_reference is additionally gated by view_sensitive.
    states: [required, held, partially_returned, returned, applied, disputed]
    initial_state: required
    transitions:
      - {from: required, to: held, action: record_deposit_received, actor: finance, guard: a receipt is recorded and the holding arrangement is stated, side_effects: 'held_since set; where the arrangement is a third-party scheme, the protection deadline is tracked', reversibility: false}
      - {from: held, to: partially_returned, action: return_deposit, actor: finance, guard: 'acting session is elevated, an amount and a reason for any retention are recorded', side_effects: a payment is made and the remainder stays held, reversibility: false}
      - {from: held, to: returned, action: return_deposit, actor: finance, guard: the full held amount is returned, side_effects: none, reversibility: false}
      - {from: partially_returned, to: returned, action: return_deposit, actor: finance, guard: the remainder is returned, side_effects: none, reversibility: false}
      - {from: held, to: applied, action: apply_deposit, actor: finance or tenant_owner, guard: 'acting session is elevated, a reason is recorded, and the counterparty has been told with the calculation', side_effects: the applied amount is offset against the stated obligation and the counterparty is given the breakdown, reversibility: true}
      - {from: partially_returned, to: applied, action: apply_deposit, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: held, to: disputed, action: dispute_deposit, actor: 'the counterparty through the customer_surface port, or finance', guard: a reason is recorded, side_effects: return and application are both blocked pending resolution, reversibility: true}
      - {from: applied, to: disputed, action: dispute_deposit, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: disputed, to: held, action: resolve_deposit_dispute, actor: finance or tenant_owner, guard: an outcome and a reason are recorded, side_effects: return or application proceeds per the outcome, reversibility: false}
    stuck_state_policy:
      required: >
        A required and unreceived deposit is an unsecured occupation. Threshold:
        deposit_chase_days (default 14) from lease start. Told: finance and the relationship
        owner. Escape hatch: collect, or record that it was waived. Verity never assumes a
        waiver from silence, because an unrecorded waiver is discovered at the end of the term
        when there is nothing to return and nothing to apply.
      held: >
        Steady state during the term. Two monitored exceptions. (a) A deposit whose holding
        arrangement is not_stated for arrangement_chase_days (default 30) - nobody has recorded
        where somebody else's money is. (b) A third-party scheme arrangement with no scheme
        reference, which usually means the protection step was never completed and is a
        compliance exposure rather than an administrative one. Told: finance and tenant_owner.
      partially_returned: >
        Threshold: the return deadline. Told: finance and the counterparty, with the retained
        amount and the reason. Escape hatch: return the remainder or apply it explicitly. A
        partial return with an unexplained retention is the shape of a dispute waiting to
        happen, and stating the reason at the moment of retention is what prevents it.
      applied: >
        Terminal unless disputed. Retained with the calculation given to the counterparty. The
        monitored condition is application without a prior notification, which should be
        impossible by the guard and whose occurrence is a defect alert.
      disputed: >
        Threshold: deposit_dispute_days (default 30), escalating to tenant_owner. Told: both
        parties. Escape hatch: resolve. No expiry, for the same reason as every other dispute
        in the platform - an expiring dispute resolves in favour of whoever holds the money,
        and here that is always the tenant of Verity rather than their counterparty.
      returned: >
        Terminal. Retained permanently with the return evidence, because a returned deposit is
        the thing most often claimed not to have been returned. Nothing pends.

ports:
  - port_key: occupiable_space
    direction: requires
    contract: >
      Resolve a space reference to a display label, its position in a hierarchy, its measured
      area on each available basis, and its availability over a date range. The space is opaque
      here, which is what stops this capability becoming a second location model.
    cardinality: exactly_one
    unbound_behaviour: >
      FORBIDDEN. A lease is an agreement to occupy something. Without a space provider there is
      nothing to occupy, no overlap detection is possible, and double-letting becomes
      undetectable until two counterparties arrive at the same place.

  - port_key: party_directory
    direction: requires
    contract: Resolve the counterparty to a display name, billing details, contactable channels and permission scope.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. A lease is an agreement with somebody, and without a directory there is no addressee for a charge or a notice.

  - port_key: billable_outcome_sink
    direction: requires
    contract: Accept a raised charge as a billable outcome with its period, its basis note and its schedule reference.
    cardinality: zero_or_one
    unbound_behaviour: >
      Charges are raised and recorded and nothing is invoiced. The schedule exists as a list of
      what is owed, which is genuinely useful to a small operator billing by hand, and no
      collection, dispute or arrears machinery exists because that all belongs to billing.

  - port_key: contract_terms
    direction: provides
    contract: Expose a lease as a contract with its parties, its term, its charge basis and its obligations, so that any capability consuming contract terms can resolve one.
    cardinality: zero_or_many

  - port_key: work_subject
    direction: requires
    contract: Resolve a leased space as a subject for work, so that reinstatement, condition and maintenance obligations against it can be raised as work.
    cardinality: zero_or_one
    unbound_behaviour: 'Reinstatement and condition obligations are recorded as text on the lease and nothing is raised. They are then remembered by a person, which is the failure this capability exists to replace, and the surface says so at lease end.'

  - port_key: index_source
    direction: requires
    contract: Resolve a published index key and a reference date to a published value, and report whether a value is published, provisional or revised.
    cardinality: zero_or_one
    unbound_behaviour: >
      Index-linked escalations cannot be computed and are held, with the accrued under-recovery
      shown. Values may be entered manually, which works and puts a number somebody typed at
      the base of every subsequent charge - so a manually entered value records who entered it
      and from what source.

  - port_key: evidence_capture
    direction: requires
    contract: Store executed agreements, notices, condition schedules and deposit protection evidence.
    cardinality: zero_or_one
    unbound_behaviour: 'Documents are referenced by number only. A disputed term, a served notice or a deposit protection cannot be produced without going to a filing cabinet, which for a capability whose entire subject matter is agreements is a material weakening.'

  - port_key: customer_surface
    direction: requires
    contract: Expose the lease, its schedule, its charges and its deposit position to the counterparty, and accept notices and disputes from them.
    cardinality: zero_or_one
    unbound_behaviour: 'Counterparties see nothing and communicate by email and telephone. Notices served by them arrive outside the system and are entered by hand, with whatever delay that introduces on a date-critical obligation.'

  - port_key: notification
    direction: requires
    contract: Deliver renewal window, escalation, arrears, notice, deposit and reconciliation messages.
    cardinality: zero_or_one
    unbound_behaviour: >
      Every date-driven obligation degrades to a console list. This is the most damaging
      unbound behaviour here, because the entire premise of the capability is that a date
      nobody is watching produces a consequence nobody chose - an automatic renewal, a missed
      escalation, an unreturned deposit.

actions:

  - key: agree_lease
    entity: lease
    label: Agree a lease
    actors: [finance, ops_manager, tenant_owner]
    preconditions:
      - Terms are complete including the area basis where any charge is per unit of area.
      - No active lease overlaps the same space over the same dates.
      - The acting session is elevated.
      - A renewal option of automatic_unless_notice carries both window dates and a notice period.
    inputs: [counterparty_ref, space_refs, term, base_amount, frequency, payment_in_advance, deposit, escalations, rent_free_periods, renewal_option, document_ref]
    creates: [lease, charge_schedule rows for the whole term, escalation_rule rows, deposit]
    updates: []
    events: [lease.agreed]
    notifications:
      - {to: the counterparty, channel: their consenting channel, when: a customer surface is bound, template: lease_agreed, must_include: [term, first_due_date, deposit_required], cost_class: utility}
      - {to: finance and the relationship owner, channel: in_app, when: always, template: lease_agreed_internal, must_include: [renewal_window_dates, first_escalation_date]}
    undoable: true
    reversal_action: return_lease_to_draft before the term starts
    audit_class: always
    idempotency_key_source: tenant_id plus reference. Re-agreeing an existing reference returns the existing lease rather than generating a second schedule, which matters because a duplicated schedule double-charges rent.
    offline_policy: refuse
    concurrency: >
      Overlap detection takes a lock over the candidate spaces for the date range inside the
      transaction, so two leases for one space cannot both commit. Schedule generation happens
      in the same transaction as the lease, because a lease with no schedule charges nothing
      and is indistinguishable from one that is working.
    failure_modes:
      - {code: E_CONFLICT_UNIQUE, cause: a space is already let over overlapping dates, message: This space is already let for part of that period., note: names the other lease and the overlapping dates. Double-letting is discovered by two counterparties arriving at the same place}
      - {code: E_VALIDATION, cause: a per-area charge with no area basis stated, message: Say which measurement the rent is based on., note: never defaulted. Different bases give materially different numbers for the same space}
      - {code: E_VALIDATION, cause: automatic renewal with no window or notice period, message: field-specific, note: an automatic renewal with no window is a commitment nobody can escape}
      - {code: E_AUTHZ_FIELD, cause: financial terms supplied without view_financial, message: null, note: 'refused rather than dropped, because the financial terms ARE the lease'}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
      - {code: E_DEPENDENCY, cause: the space provider is unavailable, message: A required service is unavailable., note: refused. Agreeing a lease without being able to check for an overlap is how a space is let twice}
      - {code: E_QUOTA, cause: the term would generate more than max_schedule_rows, message: Plan limit reached., note: 'a very long term at a short frequency; the correct action is to generate the schedule in horizons rather than raising the limit, and the message says so'}
    edge_cases:
      - A lease over several spaces with different area bases. Each space carries its own measurement and the lease records which basis the rent is calculated on. Averaging them would produce a rate neither party recognises.
      - Rent-free periods at the start of a term. Schedule rows are generated for those periods with amount zero and rent_free true, rather than being omitted. An omitted period is indistinguishable from a scheduler failure, and the counterparty's own statement should show the concession rather than a gap.
      - A lease agreed after occupation has already begun, which is common. Permitted, and the schedule is generated from starts_on, so early periods raise immediately on activation. The gap between starts_on and the agreement date is retained and visible, because it is frequently the subject of a later question.
      - A term long enough that generating the whole schedule is impractical. Generated in horizons with the horizon recorded, and the same materialisation-lag monitor applies as in scheduling - a schedule that has silently stopped generating is rent that is silently not charged.
      - An open market review scheduled during the term. The escalation rule is created with requires_agreement true and nothing is computed. The obligation to negotiate is raised when it falls due, and until it is agreed the charges continue at the old amount with the accrued difference visible.

  - key: apply_escalation
    entity: escalation_rule
    label: Apply an escalation
    actors: [system, finance]
    rationale: >
      The mechanism by which rent changes without anybody remembering to change it. Modelled
      explicitly because its failure mode - not being applied - is invisible, and because an
      index that is unpublished must produce a hold rather than an estimate.
    preconditions: [the rule is due or held, the method's inputs are available, the lease is active, in_notice or holding_over]
    inputs: [escalation_rule_id, index_value_override, override_source, reason]
    creates: [balancing charge rows where the escalation is applied retrospectively]
    updates: [future schedule rows regenerated, last_applied_on, next_due_on]
    events: [lease.escalation_applied]
    notifications:
      - {to: the counterparty, channel: their consenting channel, when: always, template: charge_changing, must_include: [effective_date, old_amount, new_amount, how_it_was_calculated], cost_class: utility, mandatory_operational: true}
      - {to: finance and the relationship owner, channel: in_app, when: always, template: escalation_applied}
    undoable: true
    reversal_action: correct_charge on the affected rows, which supersedes rather than edits
    audit_class: always
    idempotency_key_source: 'escalation_rule_id plus the effective date. An escalation applied twice for one date compounds, which is the most expensive arithmetic error available in this capability and is discovered by the counterparty'
    offline_policy: refuse
    concurrency: >
      Schedule regeneration takes the lease exclusively and rewrites only unraised rows,
      superseding raised ones explicitly where the effective date is in the past. Two concurrent
      applications collapse via the idempotency key, which matters because compounding an
      escalation twice is both wrong and difficult to unwind once invoiced.
    failure_modes:
      - {code: E_PRECONDITION, cause: the reference index value is not published, message: null, note: 'the rule is HELD rather than estimated. Applying an estimate and correcting it later produces a charge, a credit and a conversation for every affected period'}
      - {code: E_PRECONDITION, cause: requires_agreement is true and no agreed amount is recorded, message: This action is not available in the current state., note: a reviewed amount is a negotiated fact and the model never imposes one}
      - {code: E_VALIDATION, cause: the computed increase falls outside the floor and cap, message: null, note: 'clamped to the boundary and the clamping is recorded in the basis note, because a counterparty checking the arithmetic must be able to see why the number is not what the index alone would give'}
      - {code: E_AUTHZ_FIELD, cause: a manual index value supplied without view_financial, message: null, note: refused. A manually entered index value sits at the base of every subsequent charge}
      - {code: E_VALIDATION, cause: a manual index value with no source recorded, message: Say where this figure came from., note: it is the input to every future charge and its provenance is what makes a dispute answerable}
      - {code: E_DEPENDENCY, cause: the index source is unavailable, message: null, note: 'held and retried, with the accrued difference reported so the cost of the delay is visible'}
    edge_cases:
      - An index value published and later revised. The escalation already applied is not recomputed automatically; the revision is reported to finance with the difference, and correcting it is a decision. Silently recomputing would change charges a counterparty has already paid.
      - An escalation held for months and then applied from its original effective date. The difference for periods already charged is raised as a balancing charge rather than written off, and the counterparty receives the calculation for every affected period. Writing it off silently is a revenue decision nobody made.
      - A stepped schedule where a step is missed because the rule was suspended. The next application applies the correct step for the current date rather than working through the missed ones, and the difference for the missed period is raised as a balancing charge with its own basis note. Applying steps in sequence after a gap would charge the wrong amount for the current period.
      - An escalation whose effective date falls inside a rent-free period. The escalation applies to the underlying amount and the period remains rent-free, so the post-concession charge is correct. Applying it after the concession ends instead would understate every subsequent period.
      - An escalation on a lease in holding over where the agreement is silent on the holding-over basis. Held, not applied, and reported. Escalating an amount that is itself an assumption compounds the assumption.

  - key: reconcile_recoverable_charges
    entity: charge_schedule
    label: Reconcile estimated recoverable charges against actual cost
    actors: [finance, ops_manager]
    rationale: >
      Recoverable charges are estimated in advance and settled in arrears against real cost.
      The reconciliation is where most of the disputes in this domain originate, and almost all
      of them come down to a counterparty being unable to check the apportionment.
    preconditions: [the reconciliation period has ended, actual costs for the period are available, an apportionment basis is recorded]
    inputs: [lease_id, period, actual_cost_lines, apportionment_basis, exclusions, reason]
    creates: [a balancing charge or credit row per lease]
    updates: [the estimate rows for the period marked reconciled]
    events: [lease.recoverables_reconciled]
    notifications:
      - {to: the counterparty, channel: their consenting channel, when: always, template: recoverables_reconciled, must_include: [period, estimated_total, actual_total, apportionment_basis, their_share, balance_owed_or_credited, cost_breakdown], cost_class: utility, mandatory_operational: true}
      - {to: finance and tenant_owner, channel: in_app, when: the balancing amount exceeds the alert threshold in either direction, template: large_reconciliation_balance}
    undoable: true
    reversal_action: correct_charge on the balancing row, which supersedes and issues a credit through billing where already invoiced
    audit_class: always
    idempotency_key_source: lease_id plus period plus a hash of the actual cost lines. A repeated reconciliation of one period produces one balancing charge, and a duplicate would bill a counterparty twice for the same shortfall.
    offline_policy: refuse
    concurrency: >
      Reconciliation across every lease sharing a cost pool runs as one operation under a lock
      on the pool, so the apportioned shares always sum to the reconcilable total. Reconciling
      leases individually is how the shares add up to more or less than the cost, which is the
      first thing a counterparty's adviser checks.
    failure_modes:
      - {code: E_VALIDATION, cause: no apportionment basis recorded, message: Say how the cost is divided., note: never defaulted to area. The basis is the single most disputed element of a recoverable charge and an assumed one is indefensible}
      - {code: E_VALIDATION, cause: the apportioned shares do not sum to the reconcilable total, message: field-specific, note: refused. Shares that do not sum are the first thing an adviser checks and the fastest way to lose the argument}
      - {code: E_PRECONDITION, cause: a cost line has no supporting evidence where the agreement requires it, message: This action is not available in the current state., note: names the lines. A recoverable cost a counterparty cannot inspect is one they will refuse}
      - {code: E_AUTHZ_FIELD, cause: cost lines supplied without view_financial, message: null, note: refused}
      - {code: E_PRECONDITION, cause: 'the period is outside the agreement''s reconciliation deadline', message: null, note: 'permitted with an explicit acknowledgement, because a late reconciliation may be unrecoverable under the agreement and that is a commercial decision rather than a validation failure'}
    edge_cases:
      - A lease that started or ended mid-period. Its share is apportioned by occupation time as well as by the apportionment basis, and both apportionments are shown in the breakdown. Showing only the final figure guarantees a query.
      - A cost the agreement excludes. Excluded explicitly with the exclusion recorded and shown in the breakdown as excluded rather than omitted. An omitted cost looks like an oversight and invites a request for the full ledger.
      - A reconciliation producing a credit rather than a charge. Handled identically and issued as a credit through billing. Deferring a credit while charges are issued promptly is noticed, and it is noticed by exactly the counterparties who read their statements.
      - A cost pool shared with spaces that are vacant. The vacant share is borne by the tenant of Verity rather than redistributed to occupiers, unless the agreement provides otherwise, and which of the two applied is stated in the breakdown. Silently redistributing a vacancy cost is one of the most common grounds for a successful challenge.
      - Reconciliation where the estimate was never charged because the schedule stalled. The reconciliation reveals it, and the missing estimate periods are raised alongside the balancing charge with their own basis notes rather than being folded into one unexplained figure.

rules:
  - key: no_double_letting
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Two active leases may not claim the same space over overlapping dates. Enforced inside the transaction, not by a report.'
    on_conflict: not overridable

  - key: area_basis_is_explicit
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'Any charge calculated per unit of area requires a stated area basis. There is no default basis at any scope.'
    on_conflict: not overridable
    rationale: Different bases give materially different numbers for the same space, and an unstated basis is the origin of most rent disputes.

  - key: every_charge_states_its_basis
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'basis_note is mandatory and non-empty on every schedule row, stating in words how the amount was arrived at.'
    on_conflict: not overridable
    rationale: A charge a counterparty cannot check is a charge they will query, and finance then reconstructs it by hand each time.

  - key: index_escalations_are_never_estimated
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'An index-linked escalation is held until the reference value is published. A provisional or estimated value is never applied.'
    on_conflict: not overridable
    rationale: Applying an estimate and correcting it later produces a charge, a credit and a conversation for every affected period.

  - key: reviewed_amounts_are_never_imposed
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'An escalation requiring agreement never computes an amount. It raises an obligation to negotiate and records the agreed outcome with its evidence.'
    on_conflict: not overridable

  - key: deposits_are_not_revenue
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Deposit money is tracked separately from revenue, never appears in a revenue figure, and is never netted against arrears without an explicit act with a reason and a notification.'
    on_conflict: not overridable

  - key: apportioned_shares_must_sum
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'A reconciliation is refused unless the apportioned shares sum to the reconcilable total across the cost pool.'
    on_conflict: not overridable

  - key: no_automatic_renewal_without_notice
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'A renewal option of automatic_unless_notice requires a window and a notice period, and the window opening and closing are notified. A renewal never completes without the window having been notified.'
    on_conflict: not overridable
    rationale: A renewal window that closes silently is an automatic renewal nobody chose, and it is a multi-year commitment.

  - key: holding_over_basis
    kind: policy
    scope: capability
    overridable_at: tenant
    default: >
      Where the agreement specifies a holding-over basis it is applied. Where it is silent,
      charges continue at the last basis and every charge raised is flagged as continuing on an
      assumption. Verity never assumes an uplift.
    on_conflict: most specific scope wins
    rationale: An assumed holding-over uplift is a charge with no basis, and the flag is what makes an eventual dispute about a number somebody can see was assumed.

policy_knobs:
  - {key: draft_lease_stale_days, default: 30, range: [1, 180]}
  - {key: activation_lag_days, default: 1, range: [1, 30], lowest_settable_scope: kernel}
  - {key: renewal_warning_days, default: 180, range: [7, 730]}
  - {key: escalation_warning_days, default: 90, range: [7, 365]}
  - {key: escalation_apply_lag_days, default: 7, range: [1, 90]}
  - {key: escalation_hold_review_days, default: 30, range: [1, 365]}
  - {key: review_negotiation_days, default: 90, range: [7, 730]}
  - {key: arrears_alert_periods, default: 2, range: [1, 12]}
  - {key: document_chase_days, default: 60, range: [1, 365]}
  - {key: holding_over_review_days, default: 30, range: [1, 365]}
  - {key: final_reconciliation_days, default: 90, range: [7, 730]}
  - {key: raise_lag_days, default: 1, range: [1, 30], lowest_settable_scope: kernel}
  - {key: invoice_lag_days, default: 5, range: [1, 90]}
  - {key: deposit_chase_days, default: 14, range: [1, 180]}
  - {key: arrangement_chase_days, default: 30, range: [1, 180]}
  - {key: deposit_dispute_days, default: 30, range: [1, 365]}
  - {key: deposit_return_days, default: null, note: 'the deadline for returning a deposit after lease end. Deliberately null, because it is set by the agreement or by law rather than by a platform default, and a shipped number would be wrong and would look authoritative'}
  - {key: max_schedule_rows, default: 600, range: [12, 5000]}
  - {key: schedule_horizon_months, default: 36, range: [1, 240]}
  - {key: reconciliation_balance_alert_minor, default: null, note: null means no threshold. A shipped money threshold is noise for one portfolio and silence for another}

open_questions:
  - {q: 'What is the lawful deadline for returning a deposit after a lease ends, and does it differ by holding arrangement? deposit_return_days ships null because a shipped number would look authoritative and be wrong, which means the platform enforces no deadline until somebody configures one.', assumption: None. The obligation is real and the model tracks a deadline it cannot supply., confidence: VALIDATION_REQUIRED, method: 'legal review for the jurisdictions the property pack targets, per holding arrangement', priority: Critical, blocks: [deposit.return_due_by, the return obligation monitor]}
  - {q: 'Is a third-party deposit protection scheme applicable to the commercial arrangements this pack targets, and if so does Verity have any obligation to verify protection rather than merely record a reference?', assumption: 'Recorded, not verified. The model tracks scheme_reference and monitors its absence and makes no claim about protection having occurred.', confidence: VALIDATION_REQUIRED, method: legal review alongside the deposit deadline question, priority: High}
  - {q: 'Where the agreement is silent on a holding-over basis, the model continues at the last basis and flags the assumption. Is continuing to charge at all lawful in that position, and does continuing on an assumption create an implied agreement on those terms?', assumption: Continue and flag. This is the conservative operational choice and its legal effect has not been established., confidence: VALIDATION_REQUIRED, method: legal review, priority: Critical, blocks: [holding_over_basis rule, holding_over charge generation]}
  - {q: 'Should vacant space in a shared cost pool bear its own share, or should the share be redistributed to occupiers? The model bears it with the tenant unless the agreement says otherwise, which is the defensible position and is not what every agreement says.', assumption: 'Borne by the tenant of Verity unless the agreement provides otherwise, and always stated in the breakdown.', confidence: WORKING_ASSUMPTION, method: review a sample of real agreements from the target portfolio, priority: High}
  - {q: 'Is a lease a contract for the purposes of the sla_contract capability, and should the two be unified? This capability provides contract_terms and sla_contract has its own contract entity, and a property operation with service obligations would have both, describing overlapping things.', assumption: 'Separate, with lease providing contract_terms. Whether that produces two places to look for one agreement has not been tested.', confidence: VALIDATION_REQUIRED, method: model a property operation with service level obligations and see whether the two entities collide, priority: High, blocks: [contract_terms port cardinality, property_operations pack composition]}
