key: sites
name: Sites and Locations
layer: core
confidence: KNOWN
description: >
  The physical and organisational geography a tenant operates across - locations, the
  spaces inside them, the regions above them, their calendars, and the geofences that
  decide whether somebody is where they say they are. Almost every scope in the
  permission vocabulary resolves through this capability, which is why it is core.

principles:
  - Location hierarchy is a tree with a declared maximum depth, not an arbitrary graph. An arbitrary graph makes every scope resolution a recursive query with no bound, and makes "which region is this in" ambiguous.
  - A location's calendar is not the tenant's calendar. Operating hours, holidays and closures differ per location and are the reason a single national holiday list is always wrong for somebody.
  - A geofence is evidence, not truth. Consumer GPS is accurate to tens of metres on a good day and to hundreds inside a building. Any capability that treats a geofence result as a binary fact will accuse honest people of lying.
  - A location that is closed is not a location that is deleted. Closures are periods, are scheduled, end, and must not destroy the history of what happened there.
  - The tenant's own hierarchy and its counterparties' hierarchies are different trees. A location may belong to the tenant, or be a counterparty's location the tenant works at, and conflating them is how a customer's address ends up in the tenant's own site list.

entities:

  - key: location
    name: Location
    description: A place with an address, a position in a hierarchy, and an operating calendar. The unit that own_site scope resolves against.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: code, type: string, req: true, unique_scope: tenant, note: 'a short human key people say out loud on the phone. Mandatory because every operational conversation needs one and if the model does not supply it, somebody puts it in the name'}
      - {key: name, type: string, req: true}
      - {key: level, type: enum, values: [region, site, building, floor, area, unit], req: true, note: 'a closed ladder rather than free-form nesting, so depth is bounded and so "which region" is always answerable in one hop'}
      - {key: parent_location_id, type: uuid, nullable: true, fk: location}
      - {key: path, type: string, req: true, note: 'materialised ancestor path, maintained on write. Scope resolution is a prefix match rather than a recursive walk, because scope resolution happens on every request'}
      - {key: owning_party_ref, type: uuid, nullable: true, note: 'null when the tenant owns or occupies it themselves; otherwise the counterparty whose location this is, resolved through the party_directory port'}
      - {key: address_text, type: text, nullable: true, note: 'as entered. Retained verbatim even after geocoding, because the normalised form is frequently worse at finding the gate'}
      - {key: position, type: geo_point, nullable: true}
      - {key: position_accuracy_m, type: int, nullable: true, note: the accuracy of the recorded position itself. A geofence computed against a position captured at 200m accuracy is a geofence with 200m of slop before anyone moves}
      - {key: timezone, type: string, req: true, note: 'mandatory and per location. A tenant operating across one timezone still needs this, because assuming the tenant timezone is how a multi-region expansion breaks every shift boundary at once'}
      - {key: operating_calendar_id, type: uuid, nullable: true, fk: operating_calendar}
      - {key: capacity, type: int, nullable: true, note: 'a generic count of how many of the thing this location holds. What the thing is belongs to the pack, never here'}
      - {key: attributes, type: json, nullable: true, note: 'pack-defined key-value attributes of scalars only, per the kernel prohibition on object-valued configuration. This is the extension point that keeps industry properties out of the core schema'}
      - {key: criticality, type: enum, values: [standard, high, critical], req: true, default: standard, note: drives escalation defaults through the sla_clock port without this capability knowing what an escalation is}
      - {key: opened_at, type: date, nullable: true}
      - {key: closed_at, type: date, nullable: true}
    invariants:
      - parent_location_id must reference a location at a strictly higher level in the ladder. A floor cannot be the parent of a building.
      - path is derived and is never writable directly. A hand-edited path is a scope resolution that silently grants access to the wrong locations.
      - A location with owning_party_ref set may not be an ancestor of a location without one. The tenant's own hierarchy never hangs beneath a counterparty's.
      - Deleting is not offered. A location that is finished is closed, then archived, because attendance, work and invoices reference it forever.
    states: [planned, active, suspended, closed, archived]
    initial_state: planned
    transitions:
      - {from: planned, to: active, action: open_location, actor: ops_manager or tenant_admin, guard: 'address or position is present, timezone is set, and a calendar is resolved either directly or by inheritance', side_effects: 'the location becomes assignable, enters scope pickers and enters the search index', reversibility: true}
      - {from: active, to: suspended, action: suspend_location, actor: ops_manager or tenant_admin, guard: a reason is supplied, side_effects: 'no new assignments accepted, existing assignments listed to the dispatcher rather than cancelled', reversibility: true}
      - {from: suspended, to: active, action: resume_location, actor: ops_manager or tenant_admin, guard: null, side_effects: none, reversibility: true}
      - {from: active, to: closed, action: close_location, actor: ops_manager or tenant_admin, guard: 'no assignment, obligation or open work remains after the closure date, or each has been explicitly reassigned', side_effects: 'removed from assignment pickers, retained in every historical view and in scope resolution for past records', reversibility: true}
      - {from: suspended, to: closed, action: close_location, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: closed, to: active, action: reopen_location, actor: ops_manager or tenant_admin, guard: a reason is supplied and the acting session is elevated, side_effects: none, reversibility: true, note: 'reopening is deliberately available. Locations reopen, and forcing a new record would split the history of one place across two ids'}
      - {from: closed, to: archived, action: archive_location, actor: tenant_admin, guard: closed for at least location_archive_delay_days and no child location is active, side_effects: excluded from default lists and from aggregate reports, reversibility: false}
      - {from: planned, to: archived, action: archive_location, actor: tenant_admin, guard: never opened, side_effects: none, reversibility: false}
    stuck_state_policy:
      planned: >
        A location planned and never opened is a mobilisation that stalled, and it is
        invisible because planned locations are excluded from operational lists. Threshold:
        planned_location_stale_days (default 60). Told: the creating principal and
        ops_manager. Escape hatch: open or archive. Verity never auto-opens - opening a
        location makes it assignable, and assigning work to a location that is not ready is
        an operational failure with a person standing outside a locked gate at 6am.
      active: >
        Steady state. Two monitored exceptions. (a) An active location with no activity of
        any kind for inactive_location_days (default 90) - usually a location that closed in
        reality and not in the system, which quietly inflates every per-location metric.
        Told: ops_manager, monthly, as a list. (b) An active location whose position is null
        or whose position_accuracy_m exceeds geofence_usable_accuracy_m while any capability
        is relying on a geofence there. This is a silent correctness failure - the geofence
        appears to work and is measuring nothing - and it is reported immediately rather than
        on a timer.
      suspended: >
        Threshold: location_suspension_review_days (default 30). Told: the suspending
        principal, escalating to ops_manager. Escape hatch: resume or close. A suspended
        location still consumes any per-location plan entitlement and the review notification
        says so, because a suspended location silently costing money is the kind of thing
        discovered during a contract renewal argument.
      closed: >
        Closed is a valid long-term state and most closed locations stay closed. The
        monitored exception is a closed location that still has future-dated assignments or
        an unclosed obligation against it, which should have been caught by the close guard
        and indicates that something was created against it afterwards. Told: ops_manager and
        the assignment owner. Escape hatch: reassign, or reopen. Threshold is immediate, not
        timed, because a future assignment at a closed location is a person who will be sent
        somewhere that no longer operates.

  - key: operating_calendar
    name: Operating Calendar
    description: When a location is open, when it is not, and the exceptions - because a national holiday list is always wrong for somebody.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: name, type: string, req: true}
      - {key: weekly_pattern, type: json, req: true, note: 'seven entries of open and close time, or a closed marker. A list of scalars per day rather than a nested object, so it stays diffable and so precedence has nothing to merge'}
      - {key: continuous_operation, type: bool, req: true, default: false, note: 'true where the location never closes, which makes the weekly pattern advisory and makes any day-boundary calculation elsewhere a bug unless it consults this flag'}
      - {key: day_boundary_time, type: time, req: true, default: '00:00', note: 'when the operating day rolls over. For a continuously operating location this is almost never midnight, and assuming midnight misattributes every overnight period to the wrong day - which shows up as an attendance dispute and a billing dispute simultaneously'}
      - {key: timezone, type: string, req: true}
      - {key: inherits_from_calendar_id, type: uuid, nullable: true, fk: operating_calendar}
    invariants:
      - A calendar may inherit from at most one parent and inheritance depth is bounded at calendar_inheritance_max_depth. Unbounded inheritance makes resolving today's hours a recursive query on a hot path.
      - day_boundary_time is mandatory and has no safe default other than midnight, which is stated as a default rather than assumed silently.
      - Changing a calendar never retroactively changes what already happened. Historical records carry the resolved hours at the time, because an attendance record re-evaluated against a calendar edited six months later is evidence somebody rewrote.
    states: [draft, active, superseded]
    initial_state: draft
    transitions:
      - {from: draft, to: active, action: publish_calendar, actor: ops_manager or tenant_admin, guard: the weekly pattern is complete for all seven days and the timezone is valid, side_effects: locations referencing it resolve against it from the effective date forward, reversibility: true}
      - {from: active, to: superseded, action: publish_calendar, actor: ops_manager or tenant_admin, guard: a replacement calendar becomes active, side_effects: historical resolution continues to use this version, reversibility: false}
      - {from: draft, to: superseded, action: discard_calendar_draft, actor: ops_manager or tenant_admin, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_calendar_stale_days (default 14). Told: the creating principal.
        Escape hatch: publish or discard. A draft calendar is harmless except that the
        location it was being written for is still resolving against something else, and the
        person who wrote it usually believes otherwise.
      active: >
        Steady state. Monitored exception: a calendar with no exception entries at all for
        calendar_exception_absence_days (default 400) while the location it serves has
        recorded activity on days a published holiday list marks as non-working. This
        indicates the exceptions were never maintained, which shows up months later as a
        billing dispute about premium rates. Told: ops_manager, annually, with the specific
        dates. Deliberately advisory - Verity does not ship a holiday list, because the
        correct list depends on the location, the workforce and the contract, and shipping a
        wrong one is worse than shipping none.
      superseded: >
        Terminal. Retained permanently, because historical records resolve against the
        version that was active at the time. Nothing pends.

  - key: calendar_exception
    name: Calendar Exception
    description: A specific date or range where a location's hours differ from its pattern - a holiday, a shutdown, an extended opening.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: calendar_id, type: uuid, req: true, fk: operating_calendar}
      - {key: starts_on, type: date, req: true}
      - {key: ends_on, type: date, req: true}
      - {key: kind, type: enum, values: [closed, reduced_hours, extended_hours, premium_period], req: true, note: premium_period is deliberately named for what it is - a period the tenant treats differently - rather than for any particular reason it might be treated differently}
      - {key: open_time, type: time, nullable: true}
      - {key: close_time, type: time, nullable: true}
      - {key: label, type: string, req: true}
      - {key: source, type: enum, values: [manual, import, inherited], req: true}
    invariants:
      - ends_on >= starts_on.
      - Overlapping exceptions on one calendar are permitted, and the narrower period wins, with same-width overlaps rejected at write time. Silently choosing between two equally specific exceptions is how a location is reported closed and open on the same day.
      - An exception may never be edited after any operational record has resolved against it. Later corrections create a new exception and the affected records are listed for review rather than silently re-resolved.
    states: [active, superseded]
    initial_state: active
    transitions:
      - {from: active, to: superseded, action: supersede_exception, actor: ops_manager or tenant_admin, guard: a replacement exception covering the same period is created and a reason is supplied, side_effects: 'operational records that resolved against the old exception are listed for review, never silently re-resolved', reversibility: false}
    stuck_state_policy:
      active: >
        Not a queue. The monitored exception is an exception in the past that was never
        applied because it was created after the date it covers - a retroactive holiday.
        Told: ops_manager, with the count of operational records that resolved against the
        old hours and would resolve differently now. Escape hatch: review those records
        explicitly. Verity never silently re-resolves history, and the notification exists
        precisely so that the manual correction is a decision rather than an accident.
      superseded: >
        Terminal. Retained so that historical resolution is reproducible. Nothing pends.

  - key: geofence
    name: Geofence
    description: A boundary around a location, with an explicit accuracy and confidence model, used as evidence about presence rather than as proof of it.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: location_id, type: uuid, req: true, fk: location}
      - {key: shape, type: enum, values: [circle, polygon], req: true}
      - {key: centre, type: geo_point, nullable: true, note: required for circle}
      - {key: radius_m, type: int, nullable: true, note: required for circle}
      - {key: polygon, type: json, nullable: true, note: 'ordered list of coordinate pairs; scalars only, per the object-valued prohibition, so it is stored as a flat ordered list'}
      - {key: tolerance_m, type: int, req: true, default: 50, note: 'the slop added to the boundary before a position is called outside. Mandatory and explicit, because the alternative is a hardcoded tolerance that is wrong at every dense urban location'}
      - {key: min_accuracy_m, type: int, req: true, default: 100, note: 'a reading less accurate than this yields inconclusive, never outside. This single default is what stops the system accusing people of lying because they were indoors'}
      - {key: purpose, type: enum, values: [presence_evidence, arrival_trigger, departure_trigger, restriction], req: true}
      - {key: effective_from, type: timestamptz, req: true}
      - {key: effective_to, type: timestamptz, nullable: true}
    invariants:
      - Exactly one of the circle fields or the polygon field is populated, matching shape. A geofence carrying both is ambiguous and is rejected.
      - A geofence evaluation returns one of inside, outside or inconclusive. It is never a boolean. Every consumer must handle three values, and this is enforced by the port contract rather than left to good intentions.
      - min_accuracy_m may never be set above geofence_usable_accuracy_m without an explicit acknowledgement recorded on the write, because a geofence with a very permissive accuracy floor returns inside almost everywhere and looks like it is working.
      - A geofence is versioned by effective_from. Editing one in place would re-evaluate historical presence evidence against a boundary that did not exist at the time.
    states: [draft, active, retired]
    initial_state: draft
    transitions:
      - {from: draft, to: active, action: activate_geofence, actor: ops_manager or tenant_admin, guard: 'geometry is valid, the location has a position, and the parameters pass the plausibility check described in the rules', side_effects: evaluations against this location start using it from effective_from, reversibility: true}
      - {from: active, to: retired, action: retire_geofence, actor: ops_manager or tenant_admin, guard: 'a replacement is active, or the consuming capability degrades to its declared unbound behaviour', side_effects: 'effective_to set, historical evaluations unchanged', reversibility: false}
      - {from: draft, to: retired, action: discard_geofence_draft, actor: ops_manager or tenant_admin, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_geofence_stale_days (default 14). Told: the creating principal.
        Escape hatch: activate or discard. The operational risk is low and the confusion risk
        is high, because somebody drew a boundary on a map and believes it is in force.
      active: >
        The single most important monitored condition in this capability. Three triggers.
        (a) A geofence returning inconclusive for more than inconclusive_rate_threshold of
        evaluations (default 0.2) over a rolling week - the boundary or the accuracy floor is
        wrong, or the location is indoors and GPS cannot serve it. (b) A geofence returning
        outside for more than outside_rate_threshold (default 0.3) - almost always a wrong
        centre point rather than a workforce that has collectively stopped turning up.
        (c) A geofence whose location position has moved since it was drawn. Told:
        ops_manager and the supervisor of that location, weekly, with the rates and a map.
        Escape hatch: adjust and version, or retire. Verity does NOT auto-tune the boundary,
        because auto-widening a geofence until it stops complaining is how presence evidence
        becomes worthless while continuing to look green.
      retired: >
        Terminal. Retained permanently so historical evidence remains reproducible against
        the boundary that was actually in force. Nothing pends.

ports:
  - port_key: party_directory
    direction: requires
    contract: Resolve owning_party_ref to a display name and permission scope, for locations belonging to a counterparty rather than to the tenant.
    cardinality: zero_or_one
    unbound_behaviour: 'owning_party_ref cannot be set and the field is not shown. Every location is treated as the tenant''s own. This is correct for a tenant that only operates its own premises and is a real limitation for one that does not, stated rather than hidden.'

  - port_key: address_resolution
    direction: requires
    contract: Normalise and geocode an address to a position with a stated accuracy, and reverse-geocode a position to a human-readable address.
    cardinality: zero_or_one
    unbound_behaviour: >
      Addresses are stored verbatim and positions must be set manually by dropping a pin. A
      location with no position cannot carry a geofence, and the geofence UI states that
      reason rather than simply being unavailable. This degradation is important to state
      plainly because it silently disables presence evidence everywhere downstream.

  - port_key: org_structure
    direction: provides
    contract: >
      Resolve the concrete membership sets behind the scope vocabulary - which locations a
      principal is assigned to, which locations roll up into which region - as an identifier
      set plus a cache-invalidation signal. This is the port core_authorization consumes to
      make own_site and own_region mean anything.
    cardinality: exactly_one

  - port_key: location_calendar
    direction: provides
    contract: 'Given a location and an instant, return whether it is operating, the operating-day it belongs to given day_boundary_time, and any exception in force with its kind and label.'
    cardinality: exactly_one

  - port_key: presence_evidence
    direction: provides
    contract: >
      Given a location, a position and a reported accuracy, return inside, outside or
      inconclusive, together with the geofence version used and the margin by which the
      verdict was reached. The margin is part of the contract because a verdict of outside by
      three metres and a verdict of outside by four kilometres are different facts and a
      consumer that cannot tell them apart will treat them identically.
    cardinality: zero_or_one

  - port_key: notification
    direction: requires
    contract: Deliver geofence-quality, stale-location and closure-conflict messages.
    cardinality: zero_or_one
    unbound_behaviour: Conditions are surfaced as console lists only. Geofence quality degradation in particular becomes invisible-by-default, which is stated in the port documentation because it is the failure this capability most needs somebody to notice.

actions:

  - key: create_location
    entity: location
    label: Add a location
    actors: [tenant_admin, ops_manager]
    preconditions: [the parent, where given, is at a strictly higher level and is not archived, code is unique within the tenant]
    inputs: [code, name, level, parent_location_id, address_text, position, timezone, calendar_id, capacity, attributes, criticality, owning_party_ref]
    creates: [location]
    updates: [parent location path index]
    events: [location.created]
    notifications: []
    undoable: true
    reversal_action: archive_location while still planned
    audit_class: always
    idempotency_key_source: tenant_id plus code. A repeat create with the same code returns the existing location, which makes a re-run of an onboarding import safe.
    offline_policy: refuse
    concurrency: >
      Unique index on (tenant_id, code). Path materialisation for a subtree is done under a
      lock on the parent, so two children added concurrently cannot both compute a path from
      a stale parent path. A move operation locks the whole subtree, which is why moves are a
      separate action rather than an edit.
    failure_modes:
      - {code: E_CONFLICT_UNIQUE, cause: code already exists, message: That code is already used by another location., note: names the other location if the creator can see it}
      - {code: E_VALIDATION, cause: parent is at the same or a lower level, message: A location cannot sit inside something smaller than itself.}
      - {code: E_VALIDATION, cause: timezone missing or unrecognised, message: Choose a timezone., note: 'never defaulted from the tenant, because a silently inherited timezone is correct until the day it is not and then breaks every shift boundary at that location at once'}
      - {code: E_PRECONDITION, cause: the parent has owning_party_ref set and this location does not, message: This action is not available in the current state., note: 'the tenant''s own hierarchy may not hang beneath a counterparty''s'}
      - {code: E_QUOTA, cause: location count limit reached, message: Plan limit reached.}
      - {code: E_DEPENDENCY, cause: address_resolution unavailable while an address was supplied, message: null, note: 'the location is created with the address stored verbatim and no position, and the creator is told that a geofence cannot be added until a position is set. Creation is never blocked on geocoding'}
    edge_cases:
      - A location created without a position. Fully valid. Positions arrive later, frequently from the first person to visit. What must not happen is a geofence being created against a null position, and that is refused at the geofence rather than by forcing a position here.
      - Two locations at the same address - separate tenancies in one building. Legal and common. The duplicate check warns and does not block, because refusing would make the model unable to describe a building with several occupiers.
      - A location whose parent is later archived. Refused at archive time by the guard on the parent, not by orphaning the child. Archiving is blocked while any child is active, and the error names the children.
      - Creating a location under a region that belongs to a different tenant. Impossible by row-level security rather than by application check, which is why the tenancy is declared rather than assumed.

  - key: move_location
    entity: location
    label: Move a location in the hierarchy
    actors: [tenant_admin, ops_manager]
    rationale: >
      Reorganisations happen and are the moment permission scopes silently change for
      everybody. Modelled as an explicit action rather than an edit precisely so the
      permission consequence is computed and shown before it happens.
    preconditions: [acting session is elevated, the new parent is at a strictly higher level, the move does not create a cycle, the subtree is not locked by another move]
    inputs: [location_id, new_parent_location_id, reason, acknowledged_scope_impact]
    creates: []
    updates: [location.parent_location_id, path for the whole subtree, scope resolution caches invalidated]
    events: [location.moved, org_structure.changed]
    notifications:
      - {to: principals whose resolved scope changes as a result, channel: in_app, when: always, template: access_scope_changed, must_include: [locations_gained, locations_lost], mandatory_operational: true}
      - {to: ops_manager, channel: in_app, when: always, template: hierarchy_changed}
    undoable: true
    reversal_action: move_location back, which is a new move rather than an undo
    confirmation_specification: 'Modal listing the principals who gain access to locations, the principals who lose it, and the counts of open work at each affected location. Requires acknowledging the scope impact. Not strictly required by kernel K06 since the action is reversible, and required anyway, because a hierarchy move is the single most common way a permission scope changes without anybody intending it.'
    audit_class: always
    idempotency_key_source: 'location_id plus new_parent_location_id. Re-issuing a completed move is a 2xx no-op.'
    offline_policy: refuse
    concurrency: >
      Takes an exclusive lock on the moving subtree and a shared lock on both parents.
      Concurrent moves within one subtree serialise. A move racing a create beneath the
      moving node blocks the create rather than producing a child with a path computed
      against the old position.
    failure_modes:
      - {code: E_VALIDATION, cause: the new parent is inside the subtree being moved, message: A location cannot be moved inside itself.}
      - {code: E_PRECONDITION, cause: the move would exceed the maximum hierarchy depth, message: This action is not available in the current state., note: names the depth limit}
      - {code: E_PRECONDITION, cause: subtree locked by another move, message: Another change to this part of the hierarchy is in progress.}
      - {code: E_VALIDATION, cause: scope impact not acknowledged, message: Confirm you have seen who gains and loses access.}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
      - {code: E_QUOTA, cause: the subtree exceeds max_move_subtree_size, message: Plan limit reached., note: 'a very large move is a migration and is scheduled rather than run while somebody waits, because path rematerialisation over a large subtree holds locks for a long time'}
    edge_cases:
      - A move that removes somebody's access to a location where they have work in progress today. Permitted, listed prominently in the confirmation, and the affected work is listed with its owner. Refusing would make reorganisation impossible; hiding it would strand somebody mid-task.
      - A move performed while an offline device holds a cached scope. The device continues on its cached scope until it reconnects, bounded by offline_grace_hours. This is the same exposure as any permission change and is stated in the security model rather than pretended away.
      - Moving a location to a parent in a different region changes which region its records roll up to for every past record as well, because roll-up is computed from the current hierarchy. Whether historical reports should follow the old hierarchy or the new one is a genuine reporting question and is flagged in open_questions rather than decided here.

  - key: evaluate_presence
    entity: geofence
    label: Evaluate whether a position is at a location
    actors: [system, integration_principal, any_authenticated]
    rationale: >
      The single most misused primitive in field operations software. Modelled explicitly so
      that its three-valued result, its accuracy floor and its margin are contractual rather
      than left to whoever implements it.
    preconditions: [an active geofence exists for the location at the evaluation instant]
    inputs: [location_id, position, reported_accuracy_m, captured_at, device_id]
    creates: [presence_evaluation record where the caller requests evidence retention]
    updates: []
    events: []
    notifications: []
    undoable: false
    confirmation_specification: 'None. A read-shaped evaluation with an optional evidence record. The controls that matter are the accuracy floor and the three-valued result, not a dialogue.'
    audit_class: read_sensitive_only
    idempotency_key_source: 'location_id plus device_id plus captured_at. The same reading evaluated twice yields the same verdict and one evidence record.'
    offline_policy: read_only
    concurrency: Pure evaluation against an immutable versioned geofence. Concurrency is irrelevant, which is itself the point of versioning geofences rather than editing them.
    failure_modes:
      - {code: E_PRECONDITION, cause: no active geofence for this location at captured_at, message: null, note: 'returns inconclusive with the reason, NOT outside. Absence of a boundary is not evidence of absence from a place'}
      - {code: E_VALIDATION, cause: reported_accuracy_m absent, message: null, note: 'refused. A position with no stated accuracy cannot be evaluated honestly and accepting one would mean guessing the accuracy, which is how the accuracy floor gets silently bypassed'}
      - {code: E_VALIDATION, cause: captured_at more than presence_staleness_minutes in the past, message: null, note: 'returns inconclusive. A twenty-minute-old fix says where somebody was, not where they are'}
      - {code: E_DEPENDENCY, cause: the location has no position, message: null, note: 'returns inconclusive with the reason, and raises the geofence-quality condition described in the stuck-state policy'}
    edge_cases:
      - "reported_accuracy_m worse than min_accuracy_m. Returns inconclusive, never outside. This is the single most consequential line in this capability: a person standing inside a building whose phone reports 300m accuracy has not left the location, and any system that records them as outside will be used to withhold pay and will be wrong."
      - A position that is inside by less than tolerance_m of the boundary. Returns inside, and the margin is reported so a consumer can distinguish comfortably-inside from just-inside. Consumers that need the distinction have it; consumers that do not can ignore it.
      - A device with location spoofing. Not detectable from the position alone. The evaluation records the device id and the reported accuracy pattern, and detection is explicitly out of scope for this capability and flagged as an open question rather than claimed.
      - Two overlapping geofences for locations in the same building. Both can return inside. This capability returns per-location verdicts and does not arbitrate; disambiguating which location somebody is at is the consuming capability's problem and usually needs a second signal.
      - Evaluation on an offline device. Performed locally against the cached geofence, and the result is marked as locally-evaluated. On sync the server re-evaluates against the authoritative geofence version and, where the verdicts differ, records both. The server verdict governs and the disagreement is retained, because a disagreement between the device and the server is exactly the evidence a dispute needs.

rules:
  - key: presence_is_three_valued
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A presence evaluation returns inside, outside or inconclusive. No consumer may coerce inconclusive to either of the other two.'
    on_conflict: not overridable
    rationale: Kernel K16 already mandates three-valued logic for expressions. This restates it at the one place where collapsing it has a direct human consequence.

  - key: accuracy_floor_before_verdict
    kind: guard
    scope: capability
    overridable_at: site
    default: 'A reading whose reported accuracy is worse than min_accuracy_m yields inconclusive. Default min_accuracy_m is 100 metres. A site may set it stricter or, with a recorded acknowledgement, looser.'
    on_conflict: most specific scope wins
    rationale: Consumer GPS indoors is routinely worse than 100 metres. Without this floor the system produces confident wrong verdicts about honest people.

  - key: geofence_plausibility_check
    kind: validation
    scope: capability
    overridable_at: tenant
    default: 'A circle geofence with radius_m below min_geofence_radius_m (default 30) or above max_geofence_radius_m (default 2000) is refused unless explicitly acknowledged. A radius below the accuracy floor is a geofence that can never return inside reliably; one above two kilometres is not a boundary.'
    on_conflict: most specific scope wins

  - key: hierarchy_depth_bound
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'The level ladder region, site, building, floor, area, unit is closed and gives a maximum depth of six. A location may skip levels but may never invert them.'
    on_conflict: not overridable
    rationale: A bounded ladder makes scope resolution a prefix match on a materialised path rather than an unbounded recursive walk on every request.

  - key: calendars_never_apply_retroactively
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A calendar or exception change never re-resolves a historical operational record. Affected records are listed for explicit review.'
    on_conflict: not overridable

  - key: day_boundary_is_explicit
    kind: validation
    scope: capability
    overridable_at: site
    default: 'day_boundary_time is mandatory on every calendar and defaults to midnight. Consumers computing an operating day must call the location_calendar port rather than assuming midnight.'
    on_conflict: most specific scope wins
    rationale: An overnight period attributed to the wrong day produces an attendance dispute and a billing dispute at the same time, from the same defect.

policy_knobs:
  - {key: geofence_usable_accuracy_m, default: 150, range: [20, 1000]}
  - {key: min_geofence_radius_m, default: 30, range: [5, 500]}
  - {key: max_geofence_radius_m, default: 2000, range: [100, 50000]}
  - {key: presence_staleness_minutes, default: 5, range: [1, 60]}
  - {key: inconclusive_rate_threshold, default: 0.2, range: [0.01, 1.0]}
  - {key: outside_rate_threshold, default: 0.3, range: [0.01, 1.0]}
  - {key: planned_location_stale_days, default: 60, range: [7, 365]}
  - {key: inactive_location_days, default: 90, range: [7, 730]}
  - {key: location_suspension_review_days, default: 30, range: [1, 365]}
  - {key: location_archive_delay_days, default: 90, range: [0, 730]}
  - {key: draft_calendar_stale_days, default: 14, range: [1, 90]}
  - {key: draft_geofence_stale_days, default: 14, range: [1, 90]}
  - {key: calendar_exception_absence_days, default: 400, range: [90, 1095]}
  - {key: calendar_inheritance_max_depth, default: 3, range: [1, 6], lowest_settable_scope: kernel}
  - {key: max_move_subtree_size, default: 500, range: [10, 10000]}

open_questions:
  - {q: 'When a location moves between regions, should historical reports roll up under the hierarchy as it was at the time, or as it is now? Both are defensible and they give different numbers for the same past quarter.', assumption: 'None. This is a genuine reporting semantics choice with a real consequence for anyone comparing quarters across a reorganisation, and it is not being invented here.', confidence: VALIDATION_REQUIRED, method: 'operator interview with a multi-region business that has reorganised, plus review of what their client reporting commitments require', priority: High, blocks: [reporting roll-up semantics, org_structure port contract]}
  - {q: 'Is device location spoofing in scope for Verity to detect, or is it accepted as a residual risk mitigated by other evidence such as a second signal or supervisor attestation?', assumption: Out of scope for detection. The evaluation records what the device reported and never claims the reading is genuine., confidence: VALIDATION_REQUIRED, method: 'review with a client whose contract makes presence evidence contractually binding, to establish what standard of evidence they actually require', priority: High, blocks: [attendance_verification evidence strength, contractual claims about presence]}
  - {q: 'Should a location belonging to a counterparty be modelled here at all, or in the party capability as one of that party''s addresses? The current model puts it here so that scope and geofencing work uniformly, at the cost of the tenant''s location list containing places the tenant does not own.', assumption: 'Here, with owning_party_ref distinguishing them and default lists filtering on it.', confidence: WORKING_ASSUMPTION, method: 'pilot with a business that works predominantly at counterparty premises, measuring whether the location list stays usable', priority: Medium}
  - {q: 'Does Verity ship any holiday list at all? Shipping none means every tenant does the work; shipping one means being wrong for some of them in a way that produces a pay dispute.', assumption: 'Ships none. The calendar exception mechanism exists and the content is the tenant''s.', confidence: WORKING_ASSUMPTION, method: 'measure how much of onboarding time is spent entering exceptions, and whether tenants would accept a suggested list they must confirm', priority: Medium, blocks: [AET-06 decision count]}
  - {q: 'DEC-K-002 bites here. If the address_resolution port can be unbound at runtime, existing geocoded positions remain but new ones cannot be produced, so a tenant''s geofence coverage silently stops growing. Is that acceptable degradation or must unbinding be blocked while geofences depend on it?', assumption: None. DEC-K-002 is unresolved., confidence: VALIDATION_REQUIRED, method: resolve DEC-K-002, priority: Medium, blocks: [DEC-K-002]}
