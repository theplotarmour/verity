key: attendance_verification
name: Attendance Verification
layer: domain
confidence: KNOWN
description: >
  The record that somebody was where they were committed to be, for how long, with evidence
  strong enough to survive being disputed. It feeds both what a counterparty is billed and
  what a person is paid, which is why it is the single most contested record in the whole
  platform and why every design decision here is about what happens when two parties
  disagree.

principles:
  - This record will be disputed. Design for the dispute, not for the happy path. Every field exists because somebody will one day ask how it was arrived at.
  - Evidence has strength, and strength is recorded rather than collapsed into a boolean. A verified-by-geofence record and a supervisor-attested record are both attendance and they are not the same fact.
  - What was claimed and what was verified are separate fields. Overwriting a claim with a verification destroys the only evidence that they differed.
  - The absence of evidence is never evidence of absence. A device with no signal produces an unverified record, not a record of non-attendance.
  - Adjustment is normal and is never silent. Corrections happen on every payroll cycle in every business; the model makes them attributable rather than pretending they will not occur.
  - The same record feeds pay and billing, and the two may legitimately differ. A person may be paid for a period a counterparty is not billed for. Forcing one number produces a system that is wrong for one of the two.

entities:

  - key: attendance_record
    name: Attendance Record
    description: One person's presence against one commitment, with what was claimed, what was verified, and what was finally agreed.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: resource_ref, type: uuid, req: true, note: 'the person, resolved through the schedulable_resource port'}
      - {key: commitment_ref, type: uuid, nullable: true, note: 'the assignment this attends against, resolved through the schedulable_demand port. Null for attendance with no scheduled commitment, which is common and must be recordable'}
      - {key: location_ref, type: uuid, nullable: true, note: resolved through the org_structure port}
      - {key: operating_day, type: date, req: true, note: 'computed from the location calendar day_boundary_time at write time and then FROZEN. Recomputing it later would move somebody''s hours between days when a calendar is edited'}
      - {key: claimed_start_at, type: timestamptz, nullable: true, note: what the person asserted}
      - {key: claimed_end_at, type: timestamptz, nullable: true}
      - {key: verified_start_at, type: timestamptz, nullable: true, note: 'what evidence supports. Deliberately a separate field from the claim - overwriting one with the other destroys the fact that they differed, which is exactly what a dispute is about'}
      - {key: verified_end_at, type: timestamptz, nullable: true}
      - {key: agreed_start_at, type: timestamptz, nullable: true, note: 'what pay and billing consume, after any adjustment. Null until the record is settled'}
      - {key: agreed_end_at, type: timestamptz, nullable: true}
      - {key: start_evidence_strength, type: enum, values: [none, self_declared, device_only, geofence_inconclusive, geofence_confirmed, biometric_confirmed, supervisor_attested, counterparty_attested], req: true, default: none, note: 'an ordered ladder. Recorded rather than collapsed to verified-or-not, because the strength is what decides who wins a dispute'}
      - {key: end_evidence_strength, type: enum, values: [none, self_declared, device_only, geofence_inconclusive, geofence_confirmed, biometric_confirmed, supervisor_attested, counterparty_attested], req: true, default: none}
      - {key: start_evidence_ref, type: string, nullable: true, note: reference through the evidence_capture port}
      - {key: end_evidence_ref, type: string, nullable: true}
      - {key: start_position_verdict, type: enum, values: [not_evaluated, inside, outside, inconclusive], req: true, default: not_evaluated, note: 'three-valued plus not-evaluated, per the presence_evidence port contract. Never a boolean'}
      - {key: end_position_verdict, type: enum, values: [not_evaluated, inside, outside, inconclusive], req: true, default: not_evaluated}
      - {key: start_margin_m, type: int, nullable: true, note: how far inside or outside the boundary. Outside by three metres and outside by four kilometres are different facts}
      - {key: end_margin_m, type: int, nullable: true}
      - {key: break_minutes, type: int, req: true, default: 0}
      - {key: payable_minutes, type: int, nullable: true, note: derived from the agreed period and the tenant rounding rule. Null until settled}
      - {key: billable_minutes, type: int, nullable: true, financial: true, note: 'derived separately from payable_minutes, because the two may legitimately differ and forcing one number is wrong for one of the parties'}
      - {key: substitution_of_resource_ref, type: uuid, nullable: true, note: set where this person covered for somebody else}
      - {key: recorded_by_principal_id, type: uuid, req: true, note: resolved through the principal_directory port. Frequently not the person the record is about}
      - {key: source, type: enum, values: [ui_mobile, ui_web, offline_replay, device_terminal, integration, supervisor_manual, system_derived], req: true}
      - {key: device_ref, type: uuid, nullable: true}
      - {key: sync_lag_minutes, type: int, nullable: true, note: 'recorded_at minus occurred_at. Retained and reportable, because a fortnight of records arriving in one burst is the shape of both a broken handset and a fabrication'}
      - {key: dispute_id, type: uuid, nullable: true, fk: attendance_dispute}
      - {key: locked_at, type: timestamptz, nullable: true, note: 'set when a downstream period closes. After this the record can only be corrected by a new adjustment, never edited'}
    invariants:
      - claimed, verified and agreed periods are three separate pairs of fields and none may be written over another. Any settlement writes agreed and leaves the other two intact.
      - agreed_end_at, where set, is after agreed_start_at.
      - billable_minutes is gated by view_financial. payable_minutes is not, because a person must be able to see their own recorded hours.
      - A record with locked_at set is immutable. Corrections after lock are new adjustment rows referencing it, so that a closed payroll period can never change underneath a payment that has already been made.
      - operating_day is frozen at write time. Recomputing it from a later calendar edit would silently move hours between days and therefore between pay periods.
      - A record may not be settled while an open dispute references it.
      - Every write is offline-queueable, and none of it is offline-editable once verified. A verified period edited on a device that has been offline for two days is an edit made against stale evidence.
    states: [open, claimed, verified, disputed, settled, locked, voided]
    initial_state: open
    transitions:
      - {from: open, to: claimed, action: record_attendance, actor: 'the person, a supervisor or a device terminal', guard: a start or an end is asserted, side_effects: 'evidence evaluated where a presence port is bound, strength recorded', reversibility: true}
      - {from: claimed, to: claimed, action: record_attendance, actor: as above, guard: the complementary end or start is asserted, side_effects: as above, reversibility: true, note: 'a self-transition, because start and end arrive separately and hours apart, and the record between them is a real and long-lived state'}
      - {from: claimed, to: verified, action: verify_attendance, actor: 'system, supervisor or counterparty through the customer_surface port', guard: 'both ends carry evidence at or above the tenant''s required strength, or a supervisor attests with a reason', side_effects: 'verified period written, the claim retained unchanged', reversibility: true}
      - {from: claimed, to: disputed, action: raise_attendance_dispute, actor: 'the person, a supervisor, or the counterparty', guard: a reason and a disputed field are named, side_effects: 'settlement blocked, both parties notified, the record frozen against settlement but not against further evidence', reversibility: true}
      - {from: verified, to: disputed, action: raise_attendance_dispute, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: disputed, to: verified, action: resolve_attendance_dispute, actor: ops_manager or tenant_owner, guard: an outcome and a reason are recorded, side_effects: an adjustment is written where the outcome changes the period, reversibility: true}
      - {from: verified, to: settled, action: settle_attendance, actor: 'supervisor, ops_manager or system_scheduler', guard: 'no open dispute, and the agreed period is set either from the verified period or from an adjustment', side_effects: 'payable and billable minutes derived, a billable outcome emitted where the sink is bound, a payroll input emitted where that port is bound', reversibility: true}
      - {from: claimed, to: settled, action: settle_attendance, actor: supervisor or ops_manager, guard: the tenant permits settling unverified attendance and a reason is recorded, side_effects: 'as above, and the resulting outcomes carry an unverified marker so a counterparty disputing them is shown the truth', reversibility: true}
      - {from: settled, to: locked, action: lock_attendance, actor: system_scheduler, guard: the containing pay or billing period has closed, side_effects: the record becomes immutable; later corrections are adjustment rows, reversibility: false}
      - {from: settled, to: disputed, action: raise_attendance_dispute, actor: as above, guard: within dispute_window_days of settlement, side_effects: settlement is not reversed; the dispute drives an adjustment instead, reversibility: true}
      - {from: open, to: voided, action: void_attendance, actor: supervisor or ops_manager, guard: a reason is supplied and nothing has been claimed, side_effects: none, reversibility: false}
      - {from: claimed, to: voided, action: void_attendance, actor: supervisor or ops_manager, guard: a reason is supplied and the acting session is elevated, side_effects: 'the person is notified that a record about them was voided, with the reason and the actor', reversibility: false}
    stuck_state_policy:
      open: >
        An open record is a commitment whose start time has passed with nothing claimed -
        somebody has not signed in. Threshold: no_claim_grace_minutes (default 15) past the
        commitment start. Told: the person first, on push, because the overwhelmingly common
        cause is that they are present and forgot; then the supervisor at twice the
        threshold; then the backfill port where one is bound. Escape hatch: claim, void, or
        let the no-show machinery in scheduling take it. Verity never auto-claims attendance
        from a person's presence at a location, because auto-claiming means the system
        asserts on somebody's behalf a fact that will later be used to pay them.
      claimed: >
        The most consequential stuck state in the platform: a start claimed and no end. Every
        hour it persists is an hour accruing against pay and billing that nobody agreed.
        Threshold: open_shift_alert_hours (default 12), then every hour after. Told: the
        person, the supervisor, and at max_open_shift_hours (default 24) the ops_manager.
        Escape hatch: the person ends it, the supervisor ends it with an attested end time, or
        the system caps it. Capping is configuration and is OFF by default: an automatic cap
        writes an end time nobody observed, and if that end time is later used to pay
        somebody less than they worked, the system has silently taken money from them. When a
        tenant does enable capping, the capped end is written with strength=none and the
        record is flagged rather than settled.
      verified: >
        Steady state until settlement. Monitored exception: verified and unsettled for longer
        than settlement_lag_days (default 7), which usually means a supervisor is not
        approving and the person will be paid late. Told: the supervisor, then ops_manager.
        Escape hatch: settle, or dispute.
      disputed: >
        A dispute with money on both sides of it. Threshold: dispute_resolution_days
        (default 5), escalating to ops_manager then tenant_owner. Told: both parties
        throughout, and both are shown the same evidence. Escape hatch: resolve with an
        outcome. Verity never auto-resolves in favour of either party and never times a
        dispute out - a dispute that expires unresolved resolves in favour of whoever wrote
        the record, which is always the stronger party.
      settled: >
        Bounded by the period close. Monitored exception: settled with a billable outcome
        that the sink has not acknowledged within outcome_ack_hours (default 4). Told:
        platform_operator. Unacknowledged billable outcomes are revenue that disappears
        silently and is only found by reconciling two systems by hand.
      locked: >
        Terminal. Immutable. Corrections are adjustment rows referencing it. Retained for the
        full audit retention period, because attendance is the evidence in any employment or
        contractual dispute and those arrive years later. Nothing pends.
      voided: >
        Terminal. Retained with the reason and the actor, never deleted, because a voided
        attendance record is precisely the thing somebody will later allege was destroyed.
        Nothing pends.

  - key: attendance_adjustment
    name: Attendance Adjustment
    description: A recorded correction to an attendance period, with who made it, why, and what it changes for pay and for billing separately.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: attendance_record_id, type: uuid, req: true, fk: attendance_record}
      - {key: adjustment_kind, type: enum, values: [correction, break_deduction, rounding, overtime_reclassification, penalty, goodwill, dispute_outcome], req: true}
      - {key: field_adjusted, type: enum, values: [start, end, break_minutes, payable_minutes, billable_minutes], req: true}
      - {key: previous_value, type: text, req: true}
      - {key: new_value, type: text, req: true}
      - {key: affects_pay, type: bool, req: true}
      - {key: affects_billing, type: bool, req: true, financial: true, note: 'separate from affects_pay deliberately. A goodwill credit to a counterparty must not silently reduce somebody''s wages'}
      - {key: reason, type: text, req: true}
      - {key: made_by_principal_id, type: uuid, req: true, note: resolved through the principal_directory port}
      - {key: made_at, type: timestamptz, req: true, immutable: true}
      - {key: approved_by_principal_id, type: uuid, nullable: true}
      - {key: person_notified_at, type: timestamptz, nullable: true, note: when the person whose hours changed was told. Mandatory for any adjustment where affects_pay is true and the change is downward}
    invariants:
      - An adjustment is append-only and is never edited. A wrong adjustment is corrected by a further adjustment, so the sequence of corrections is itself visible.
      - reason is mandatory and may not be empty or whitespace. An unexplained adjustment to somebody's hours is indistinguishable from an alteration.
      - Any adjustment with affects_pay true and a downward effect must record person_notified_at before the containing period locks. Reducing somebody's pay without telling them is not a configuration option.
      - affects_pay and affects_billing are independent. Setting one never implies the other.
      - An adjustment against a locked record is permitted and is how post-lock corrections work. An adjustment that would edit a locked record's own fields is not.
    states: [proposed, applied, reversed]
    initial_state: proposed
    transitions:
      - {from: proposed, to: applied, action: apply_adjustment, actor: 'supervisor, ops_manager or finance', guard: 'the approval_chain port is satisfied where bound and the tenant requires approval for this kind, and the person has been notified where the change is downward and affects pay', side_effects: 'the record''s agreed period or derived minutes are recomputed', reversibility: true}
      - {from: proposed, to: reversed, action: withdraw_adjustment, actor: the proposing principal or ops_manager, guard: null, side_effects: none, reversibility: false}
      - {from: applied, to: reversed, action: reverse_adjustment, actor: ops_manager or finance, guard: a reason is supplied; a NEW compensating adjustment is written rather than the original being deleted, side_effects: 'the record recomputed, both parties told', reversibility: false}
    stuck_state_policy:
      proposed: >
        A proposed adjustment is somebody's pay or somebody's invoice held up. Threshold:
        adjustment_approval_hours (default 24), and immediately if the containing period
        closes within that window. Told: the approver, then ops_manager. Escape hatch: apply
        or withdraw. Never auto-applied and never auto-withdrawn - one silently changes
        somebody's pay and the other silently discards a correction somebody thought they had
        made.
      applied: >
        Terminal in effect. Monitored exception: a pattern rather than an instance -
        adjustments applied by one principal against one person exceeding
        adjustment_pattern_alert per period (default 5). Told: ops_manager. This is
        deliberately a pattern monitor rather than a per-adjustment control, because
        individually every one of them may be legitimate and collectively they are the shape
        of both a broken clock-in process and a supervisor altering somebody's hours.
      reversed: >
        Terminal. Retained permanently. Nothing pends.

  - key: attendance_dispute
    name: Attendance Dispute
    description: A recorded disagreement about an attendance record, with the position of each side and the evidence each relies on.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: attendance_record_id, type: uuid, req: true, fk: attendance_record}
      - {key: raised_by, type: enum, values: [the_person, supervisor, counterparty, system_rule, finance], req: true}
      - {key: raised_by_principal_id, type: uuid, nullable: true}
      - {key: disputed_field, type: enum, values: [start, end, break_minutes, presence_at_all, substitution, payable_minutes, billable_minutes], req: true}
      - {key: claimed_position, type: text, req: true}
      - {key: counter_position, type: text, nullable: true}
      - {key: supporting_evidence_refs, type: json, nullable: true, note: flat list of evidence references from either side}
      - {key: outcome, type: enum, values: [undecided, upheld, rejected, partially_upheld, withdrawn], req: true, default: undecided}
      - {key: outcome_reason, type: text, nullable: true}
      - {key: resolved_by_principal_id, type: uuid, nullable: true}
      - {key: resolved_at, type: timestamptz, nullable: true}
      - {key: financial_effect_minor, type: money_minor, nullable: true, financial: true}
    invariants:
      - A dispute blocks settlement of its record but never blocks further evidence being attached. Freezing evidence collection during a dispute would mean the party who raised it controls what can be shown.
      - outcome_reason is mandatory for any outcome other than withdrawn.
      - The resolving principal may not be the raising principal. Deciding one's own dispute is not a resolution.
      - Both parties see the same evidence set. There is no evidence visible to one side only, because a dispute resolved on evidence one party could not see is not resolved.
    states: [raised, under_review, resolved, withdrawn, escalated]
    initial_state: raised
    transitions:
      - {from: raised, to: under_review, action: claim_dispute, actor: supervisor or ops_manager, guard: the claimer is not the raiser, side_effects: 'locked to the reviewer, both parties told who is looking at it', reversibility: true}
      - {from: under_review, to: raised, action: release_dispute, actor: the reviewer or system_scheduler on claim timeout, guard: null, side_effects: none, reversibility: true}
      - {from: under_review, to: resolved, action: resolve_attendance_dispute, actor: 'supervisor, ops_manager or tenant_owner', guard: 'an outcome and a reason are recorded, and the resolver is not the raiser', side_effects: an adjustment is written where the outcome changes the period; both parties told with the reason, reversibility: false}
      - {from: raised, to: withdrawn, action: withdraw_dispute, actor: the raising principal, guard: null, side_effects: settlement unblocked, reversibility: false}
      - {from: under_review, to: withdrawn, action: withdraw_dispute, actor: the raising principal, guard: null, side_effects: as above, reversibility: false}
      - {from: under_review, to: escalated, action: escalate_dispute, actor: either party or system_scheduler, guard: 'the resolution threshold has passed, or either party rejects the proposed outcome', side_effects: 'routed to ops_manager, then tenant_owner', reversibility: true}
      - {from: escalated, to: resolved, action: resolve_attendance_dispute, actor: ops_manager or tenant_owner, guard: as for resolution, side_effects: as for resolution, reversibility: false}
    stuck_state_policy:
      raised: >
        Threshold: dispute_claim_hours (default 24). Told: every supervisor in scope, then
        ops_manager. Escape hatch: claim it. An unclaimed dispute is one where the raising
        party has been told nothing at all, which is worse than being told no.
      under_review: >
        Threshold: dispute_resolution_days (default 5). Told: both parties, with the elapsed
        time, so the person waiting can see that it is moving. Escape hatch: resolve or
        escalate. The claim itself times out at dispute_claim_timeout_hours (default 48) and
        returns to raised, so a reviewer who goes on leave does not park somebody's pay
        indefinitely.
      escalated: >
        Threshold: escalated_dispute_days (default 3), then daily to tenant_owner. Told: both
        parties and the escalation chain. Escape hatch: resolve. There is no further
        escalation inside Verity and no expiry - an escalated dispute that expires resolves
        in favour of whoever wrote the record, and that party is never the person disputing
        it.
      resolved: >
        Terminal. Retained permanently with both positions, the evidence and the reason,
        because this is the document that answers the same question if it is asked again by a
        lawyer. Nothing pends.
      withdrawn: >
        Terminal. Retained, because a withdrawn dispute and a dispute that never existed are
        different facts - particularly where a pattern of withdrawals follows a conversation
        with a supervisor. Nothing pends.

ports:
  - port_key: schedulable_resource
    direction: requires
    contract: Resolve the person to a display name, their commitments, and their engagement status.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. Attendance is a fact about a person against a commitment. Without a resource provider there is nobody to attend and no commitment to attend against.

  - port_key: schedulable_demand
    direction: requires
    contract: Resolve the commitment being attended, its window and its location, and accept coverage confirmation.
    cardinality: zero_or_one
    unbound_behaviour: >
      Attendance is recorded without a commitment - a bare period at a location. Everything
      downstream still works, and nothing can be compared against what was expected, so
      lateness, early departure and no-show cease to be computable. Stated plainly because a
      tenant may not realise those three metrics come from the scheduler rather than from here.

  - port_key: presence_evidence
    direction: requires
    contract: 'Given a location, a position and a reported accuracy, return inside, outside or inconclusive with the geofence version and the margin.'
    cardinality: zero_or_one
    unbound_behaviour: >
      position verdicts remain not_evaluated and evidence strength cannot exceed
      self_declared or supervisor_attested. Attendance still works and is materially weaker,
      and every record says so through its strength field rather than looking identical to a
      verified one.

  - port_key: evidence_capture
    direction: requires
    contract: Capture and attach a photograph, a scan, a signature or a form response with tamper evidence, and queue it offline alongside the record it belongs to.
    cardinality: zero_or_one
    unbound_behaviour: 'Photographic and biometric evidence cannot be captured. Strength is capped at geofence_confirmed. Tenants whose contracts require photographic evidence cannot meet them, which is a pack publication concern rather than a runtime one.'

  - port_key: org_structure
    direction: requires
    contract: Resolve the location and its operating calendar, so that operating_day and any premium period can be computed.
    cardinality: zero_or_one
    unbound_behaviour: 'operating_day falls back to calendar date in the tenant timezone. For any continuously operating location this misattributes every overnight period, which surfaces as a pay dispute and a billing dispute from one defect. The fallback is recorded on each affected record rather than applied silently.'

  - port_key: billable_outcome_sink
    direction: requires
    contract: Accept a settled attendance period as a billable outcome with quantity, rate basis, contract reference and evidence references including the evidence strength.
    cardinality: zero_or_one
    unbound_behaviour: Attendance settles normally and records billable_minutes for later use. No billable event is created and the surface shows no billing affordance.

  - port_key: payroll_input_sink
    direction: requires
    contract: Accept a settled attendance period as a payroll input with payable minutes, the pay period, and any adjustment history.
    cardinality: zero_or_one
    unbound_behaviour: 'Attendance settles and records payable_minutes. Nothing is exported, and the export becomes a manual report. Deliberately not an error - a great many target businesses run payroll outside any software.'

  - port_key: backfill_request
    direction: requires
    contract: Signal that a commitment has no attendance claim past its grace period, so cover can be sought.
    cardinality: zero_or_one
    unbound_behaviour: The condition is escalated to the supervisor and nothing is dispatched. Every threshold still fires.

  - port_key: customer_surface
    direction: requires
    contract: Expose a permissioned projection of attendance to a counterparty and accept their attestation or dispute.
    cardinality: zero_or_one
    unbound_behaviour: 'counterparty_attested strength is unreachable and counterparties cannot raise disputes in the system. They will raise them by telephone instead, and those disputes will not appear in any report - which is the cost of leaving this unbound and is stated rather than left to be discovered.'

  - port_key: approval_chain
    direction: requires
    contract: Route adjustments and unverified settlements for approval.
    cardinality: zero_or_one
    unbound_behaviour: Adjustments apply immediately with an audit note recording that no approval chain was configured. The notification obligation for downward pay adjustments is NOT waived by an unbound approval chain.

  - port_key: notification
    direction: requires
    contract: Deliver missing-claim, open-shift, dispute and adjustment messages, treating downward pay adjustments and open-shift alerts as mandatory_operational.
    cardinality: zero_or_one
    unbound_behaviour: >
      Everything degrades to console lists. The open-shift alert in particular becomes
      invisible to the person it concerns, which means a forgotten sign-out is discovered at
      settlement rather than the same evening. This is the most costly unbound behaviour in
      this capability.

actions:

  - key: record_attendance
    entity: attendance_record
    label: Record a start or an end
    actors: [employee, supervisor, dispatcher, integration_principal]
    rationale: >
      The most frequently executed human action in the platform, performed twice a day per
      person, at a gate, in the dark, in the rain, on a cheap phone with poor signal, often
      by somebody who is not the person it concerns. If it is slow or fragile, the tenant
      reverts to a paper register and every downstream capability starves.
    preconditions:
      - The person is an active resource.
      - Where a commitment is named, it exists and has not been cancelled.
      - No conflicting open record exists for the same person at another location.
    inputs: [resource_ref, commitment_ref, location_ref, boundary, asserted_at, position, position_accuracy_m, evidence_ref, substitution_of_resource_ref, note]
    creates: [attendance_record on first assertion, presence_evaluation, evidence attachment]
    updates: [attendance_record claimed and verified fields, evidence strength, position verdict and margin]
    events: [attendance.claimed, attendance.evidence_recorded]
    notifications:
      - {to: supervisor, channel: in_app, when: 'the position verdict is outside beyond outside_margin_alert_m, or the strength is below the tenant requirement', template: attendance_needs_review, batching_policy: one digest per configured interval}
      - {to: the person, channel: push, when: a record was created about them by somebody else, template: attendance_recorded_for_you, must_include: [recorded_by, period, location], mandatory_operational: true}
    undoable: true
    reversal_action: void_attendance while unclaimed, otherwise apply_adjustment
    audit_class: always
    idempotency_key_source: >
      resource_ref plus commitment_ref plus boundary plus asserted_at truncated to the minute.
      Two taps at a gate, or a supervisor and a person recording the same arrival, produce one
      record. This is the single most important idempotency key in the platform, because
      duplicate attendance is duplicate pay and duplicate billing simultaneously.
    offline_policy: queue
    concurrency: >
      A partial unique index prevents two open records for one person at one time, so the
      person cannot be present at two locations at once. Where a second start arrives for a
      person with an open record elsewhere, it is accepted and BOTH are flagged rather than
      one being refused, because refusing the second means the person standing at the second
      location cannot record anything at all and will use paper. Which of the two is correct
      is a dispute, and the model's job is to capture both claims rather than to arbitrate at
      the gate.
    failure_modes:
      - {code: E_VALIDATION, cause: position supplied without position_accuracy_m, message: null, note: 'the position is DISCARDED and the record proceeds with strength=device_only. A position with no stated accuracy cannot be evaluated honestly, and guessing the accuracy silently bypasses the accuracy floor'}
      - {code: E_PRECONDITION, cause: the person is not an active resource, message: This action is not available in the current state., note: 'recorded anyway as an orphan claim requiring supervisor triage where the tenant enables it, because a person who turns up on their first day before their record is activated has still turned up'}
      - {code: E_CONFLICT_UNIQUE, cause: an open record already exists at another location, message: You are already signed in somewhere else., note: 'both records are retained and flagged, per the concurrency note'}
      - {code: E_VALIDATION, cause: asserted_at more than max_backdate_hours in the past, message: That is too far back to record here., note: 'the correct path is a supervisor-attested record, which carries a different evidence strength and is separately reported. Allowing arbitrary backdating on the self-service path is how a register becomes fiction'}
      - {code: E_DEPENDENCY, cause: the presence_evidence port is bound but unavailable, message: null, note: the record COMMITS with verdict not_evaluated and strength device_only. Refusing to record attendance because a geofence service is down would leave a person unable to prove they were there}
      - {code: E_RATE_LIMIT, cause: more than attendance_burst_per_device per minute, message: Too many attempts. Try again shortly., note: 'a shared terminal at shift change legitimately produces a high rate, so the limit is per device and generous, and is intended to catch a replaying integration rather than a queue of people'}
    edge_cases:
      - "Recorded offline with no signal, which is the normal case at many locations. The record and its evidence are queued as one unit. occurred_at is the device's claimed time, recorded_at is the server's, and sync_lag_minutes is retained. Records arriving in a burst days later are flagged for review, never rejected, because a broken handset and a fabrication produce the same shape and only a human can distinguish them."
      - "A device whose clock is wrong. asserted_at is recorded as claimed and a clock_skew marker is computed against the server's receipt time. It is never silently corrected, because the skew is the only evidence that the claim is unreliable."
      - Somebody covering for another person, arriving with the absent person's commitment. Recorded against the substitute with substitution_of_resource_ref set. The absent person's own record is NOT auto-created and NOT auto-voided, because whether they were absent is a separate fact that somebody must record deliberately.
      - Recorded by a supervisor on behalf of a person with no device. Fully supported, strength=supervisor_attested, and the person is notified that a record was made about them. The notification is mandatory_operational and not suppressible, because the alternative is a system where somebody's hours are recorded by another person without their knowledge.
      - "A geofence verdict of inconclusive because the person is inside a building. Recorded as inconclusive, never as outside, and the record's strength is geofence_inconclusive - which is above self_declared and below geofence_confirmed. The tenant's required strength decides whether that is sufficient, and it is a configured decision rather than an accident of GPS."
      - A start recorded with no matching end because the person's phone died. This is the claimed stuck state and its policy governs. What matters here is that the start is not voided and not capped automatically - both would destroy or fabricate evidence about a period somebody worked.
      - Attendance with no commitment at all - somebody called in at short notice before the roster caught up. Fully supported with commitment_ref null. Lateness and no-show become uncomputable for that record and it is still payable and billable, which is the correct trade.

  - key: settle_attendance
    entity: attendance_record
    label: Settle attendance for pay and billing
    actors: [supervisor, ops_manager, finance, system_scheduler]
    rationale: >
      The moment a contested record becomes two numbers that leave the system - one to a
      payslip and one to an invoice. Modelled as an explicit act so that somebody is
      accountable for both, and so that the two can differ where the contract says they do.
    preconditions:
      - The record has both a start and an end.
      - No open dispute references it.
      - Evidence strength meets the tenant requirement, or an unverified settlement is explicitly authorised with a reason.
    inputs: [attendance_record_id, agreed_start_at, agreed_end_at, break_minutes, unverified_settlement_reason]
    creates: [billable outcome where the sink is bound, payroll input where that sink is bound]
    updates: [agreed period, payable_minutes, billable_minutes, record state]
    events: [attendance.settled]
    notifications:
      - {to: the person, channel: in_app, when: the agreed period differs from their claim, template: attendance_adjusted_at_settlement, must_include: [claimed, agreed, difference, who_settled, reason], mandatory_operational: true}
      - {to: finance, channel: in_app, when: settled unverified, template: unverified_settlement, batching_policy: one digest per period}
    undoable: true
    reversal_action: raise_attendance_dispute, or apply_adjustment
    audit_class: always
    idempotency_key_source: 'attendance_record_id plus a hash of the agreed period and break minutes. A retried settlement produces one billable event and one payroll input - double-emitting either is a double payment or a double charge.'
    offline_policy: refuse
    concurrency: >
      Settlement takes the record row exclusively and emits both downstream outcomes inside
      the same transaction as the state change, so a settled record can never exist without
      its outcomes or the outcomes without it. A settlement racing a dispute: the dispute
      wins, because a settlement that proceeds over a live objection is exactly what the
      dispute mechanism exists to prevent.
    failure_modes:
      - {code: E_PRECONDITION, cause: an open dispute references the record, message: This action is not available in the current state., note: names the dispute and its reviewer}
      - {code: E_PRECONDITION, cause: evidence strength below the tenant requirement and no authorisation supplied, message: This action is not available in the current state., note: 'states the required strength and the strength actually held, so the supervisor knows what would fix it'}
      - {code: E_VALIDATION, cause: the agreed period differs from both the claim and the verified period with no adjustment recorded, message: Record why the hours differ., note: settlement may not silently invent a third period. Any difference is an adjustment with a reason}
      - {code: E_AUTHZ_FIELD, cause: billable_minutes supplied without view_financial, message: null, note: 'dropped. payable_minutes is not gated, so a supervisor without financial access can still settle somebody''s pay - which is the correct separation'}
      - {code: E_DEPENDENCY, cause: a bound sink is unavailable, message: A required service is unavailable., note: 'settlement is REFUSED rather than committing without emitting. A settled record whose outcomes never reached billing or payroll is a person unpaid or a counterparty unbilled, discovered weeks later by manual reconciliation'}
      - {code: E_PRECONDITION, cause: the containing period is already locked, message: This action is not available in the current state., note: the correct path is a post-lock adjustment}
    edge_cases:
      - Payable and billable minutes differing legitimately - a person paid for a full period while a counterparty is billed only for the covered portion, or a rounding rule applying to one and not the other. Fully supported and is the reason the two are separate fields. A model with one number is wrong for one of the two parties every time they differ.
      - Bulk settlement at period end across hundreds of records. Supported as a batch sharing one correlation_id, with each record settled individually so one failure does not roll back the rest, and a summary showing exactly which records did not settle and why. A bulk operation that reports only a count is one nobody can act on.
      - Settling unverified because a location has no signal and never will. Permitted with a reason, reported, and the resulting billable outcome carries the unverified marker so that a counterparty disputing the line is shown the truth rather than an assertion.
      - A rounding rule that always rounds in the tenant's favour. Expressible, and the model records the rounding as an explicit adjustment of kind rounding rather than folding it into the agreed period. Whether the rule is fair is not this capability's judgement; making it visible is.
      - Settlement of a record whose commitment was later cancelled. Still settles. The person attended; a cancellation after the fact does not undo that, and the billable classification is a separate question for the contract.

  - key: resolve_attendance_dispute
    entity: attendance_dispute
    label: Resolve a disputed attendance record
    actors: [supervisor, ops_manager, tenant_owner]
    preconditions: [the dispute is under_review or escalated, the resolver is not the raiser, an outcome and a reason are supplied]
    inputs: [dispute_id, outcome, outcome_reason, agreed_start_at, agreed_end_at, financial_effect_minor]
    creates: [attendance_adjustment where the outcome changes the period]
    updates: [dispute state and outcome, attendance record state]
    events: [attendance.dispute_resolved]
    notifications:
      - {to: both parties, channel: in_app_and_their_preferred_channel, when: always, template: dispute_resolved, must_include: [outcome, reason, resulting_period, resulting_pay_effect, how_to_escalate], mandatory_operational: true}
      - {to: ops_manager, channel: in_app, when: 'the outcome is upheld against the tenant''s own record', template: record_quality_signal, note: a rising rate of upheld disputes is a signal about the capture process rather than about the people}
    undoable: false
    confirmation_specification: 'Modal stating the outcome, the resulting period against the claimed and verified periods, the effect on pay and the separate effect on billing, and that both parties will be told with the reason. Requires the reason to be typed rather than selected, because a selected reason is a category and the person receiving it needs a sentence.'
    audit_class: always
    idempotency_key_source: dispute_id plus outcome plus a hash of the resulting period
    offline_policy: refuse
    concurrency: The dispute is claimed before resolution, so two reviewers cannot resolve it differently. The claim times out rather than persisting, so a reviewer on leave does not park somebody's pay.
    failure_modes:
      - {code: E_PRECONDITION, cause: the resolver raised the dispute, message: This action is not available in the current state., note: 'deciding one''s own dispute is not a resolution, and the message is deliberately not specific enough to teach a workaround'}
      - {code: E_VALIDATION, cause: outcome_reason empty, message: Write the reason. Both parties will see it.}
      - {code: E_VALIDATION, cause: outcome partially_upheld with no resulting period supplied, message: Say what the agreed hours are.}
      - {code: E_AUTHZ_FIELD, cause: financial_effect_minor supplied without view_financial, message: null, note: dropped and reported}
      - {code: E_PRECONDITION, cause: the containing period locked while the dispute was open, message: null, note: 'resolution still proceeds and produces a post-lock adjustment rather than editing the locked record. A dispute must never be blocked by a period closing, because the period closing is frequently what prompted it'}
    edge_cases:
      - A dispute upheld after the person has already been paid the lower amount. The adjustment is written against the locked record and flows to the next payroll input as a correction. The notification states plainly when the correction will be paid, because the question the person is actually asking is when, not whether.
      - A dispute raised by a counterparty against hours already billed. Resolution produces an adjustment with affects_billing true and affects_pay false, so a credit to a counterparty does not silently reduce somebody's wages. This is the whole reason the two flags are independent.
      - Both parties rejecting the proposed outcome. Escalation, not resolution. There is no mechanism inside Verity that compels agreement, and the model does not pretend otherwise - the escalated state exists so that the disagreement is visible to somebody with the authority to end it.
      - A dispute where the evidence is inconclusive on both sides, which is the common case with indoor geofences. The resolver must choose and record why. The model deliberately offers no default, because a default here is a rule about who loses when nobody can prove anything, and that rule belongs to the business rather than to the software.
      - A pattern of disputes concentrated at one location. Surfaced to ops_manager as a record-quality signal about the capture process at that location, not as a performance signal about the people there. Which of the two it is presented as determines whether the data gets fixed or the workforce gets blamed.

rules:
  - key: claim_and_verification_are_separate
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'claimed, verified and agreed periods are three independent field pairs. No write may overwrite one with another.'
    on_conflict: not overridable
    rationale: The difference between what somebody said and what the evidence shows is the entire content of a dispute. Collapsing them destroys it.

  - key: no_silent_hours_reduction
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'Any change reducing payable minutes must record a reason and must notify the person before the containing period locks.'
    on_conflict: not overridable
    rationale: Reducing somebody's pay without telling them is not a configuration option at any scope.

  - key: evidence_strength_required
    kind: policy
    scope: capability
    overridable_at: site
    default: >
      Settlement requires strength at or above self_declared. A site or a contract may
      require more - geofence_confirmed or counterparty_attested. Settling below the
      requirement is permitted with an explicit authorisation and a reason, and every such
      settlement is reported and marks its downstream outcomes.
    on_conflict: the stricter requirement wins
    rationale: Blocking absolutely produces a paper register at every location with poor signal. Permitting silently produces unevidenced billing. Permitting visibly, marking the outcome and counting it is the version that survives.

  - key: automatic_shift_capping
    kind: policy
    scope: capability
    overridable_at: tenant
    default: 'false. An open record is escalated and never automatically closed.'
    on_conflict: most specific scope wins
    rationale: An automatic cap writes an end time nobody observed. If that time is used to pay somebody less than they worked, the system has taken money from them silently.

  - key: pay_and_billing_are_independent
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'payable_minutes and billable_minutes are derived independently. An adjustment declares its effect on each separately and neither implies the other.'
    on_conflict: not overridable

  - key: operating_day_is_frozen
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'operating_day is computed once at write time from the location calendar in force then, and never recomputed.'
    on_conflict: not overridable
    rationale: Recomputing it after a calendar edit moves hours between days and therefore between pay periods, retroactively.

  - key: disputes_never_expire
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A dispute has no timeout that resolves it. It escalates indefinitely until a person decides it.'
    on_conflict: not overridable
    rationale: A dispute that expires unresolved resolves in favour of whoever wrote the record, and that party is never the one disputing it.

policy_knobs:
  - {key: no_claim_grace_minutes, default: 15, range: [0, 240]}
  - {key: open_shift_alert_hours, default: 12, range: [1, 48]}
  - {key: max_open_shift_hours, default: 24, range: [2, 168]}
  - {key: settlement_lag_days, default: 7, range: [1, 60]}
  - {key: dispute_claim_hours, default: 24, range: [1, 168]}
  - {key: dispute_claim_timeout_hours, default: 48, range: [1, 336]}
  - {key: dispute_resolution_days, default: 5, range: [1, 60]}
  - {key: escalated_dispute_days, default: 3, range: [1, 30]}
  - {key: dispute_window_days, default: 30, range: [1, 365], note: how long after settlement a dispute may still be raised}
  - {key: adjustment_approval_hours, default: 24, range: [1, 336]}
  - {key: adjustment_pattern_alert, default: 5, range: [1, 100]}
  - {key: max_backdate_hours, default: 12, range: [0, 168]}
  - {key: outside_margin_alert_m, default: 250, range: [10, 10000]}
  - {key: required_evidence_strength, default: self_declared}
  - {key: rounding_minutes, default: null, note: 'null means no rounding. Deliberately null rather than a number, because a shipped rounding rule is a shipped opinion about somebody''s pay'}
  - {key: attendance_burst_per_device_per_minute, default: 60, lowest_settable_scope: kernel}
  - {key: outcome_ack_hours, default: 4, range: [1, 168], lowest_settable_scope: kernel}

open_questions:
  - {q: 'Is biometric verification lawful and acceptable for this workforce, and under what conditions? The evidence strength ladder includes biometric_confirmed and nothing in this model establishes that it may be used, what may be stored, or whether consent obtained as a condition of engagement is meaningful consent.', assumption: 'None. The ladder value exists so that the model can express a strength it may turn out to be unable to offer, rather than the model being silently rebuilt later.', confidence: VALIDATION_REQUIRED, method: 'legal review of biometric data handling for the target workforce, plus review of what client contracts actually require as opposed to what they ask for', priority: Critical, blocks: [biometric_confirmed strength, evidence_capture retention, party identity storage]}
  - {q: 'Where evidence is inconclusive on both sides, who loses? The model deliberately offers no default, which means every such dispute needs a human decision, and there will be many of them.', assumption: 'None. A default here is a rule about who loses when nobody can prove anything, and that belongs to the business.', confidence: VALIDATION_REQUIRED, method: 'operator interviews on how these are decided today, and review of whether any client contract specifies a tie-break', priority: High, blocks: [resolve_attendance_dispute defaults, dispute volume forecasting]}
  - {q: 'Should the person be able to see the evidence strength and the position verdict on their own record? Showing it makes disputes better informed and also tells somebody precisely how closely their location is measured.', assumption: 'Yes, on the grounds that a record used to pay somebody should be legible to them.', confidence: WORKING_ASSUMPTION, method: 'review with an operator and, ideally, with the workforce; the two may disagree', priority: High}
  - {q: 'What rounding rules are lawful and customary, and should Verity ship any? The model ships null, so no rounding happens until somebody configures it, which is honest and means the product does nothing on day one that a paper register did.', assumption: Ship null and make the absence visible during onboarding., confidence: VALIDATION_REQUIRED, method: review of applicable wage rules for the target engagement kinds plus operator interviews, priority: High, blocks: [rounding_minutes default, AET-06 decision count]}
  - {q: 'A person can be recorded as present at two locations at once because both records are accepted and flagged rather than one being refused. Is accepting both the right trade, given it permits a fabricated record to be created alongside a genuine one?', assumption: 'Yes. Refusing the second means the person standing at the second location can record nothing and will use paper, which loses both records instead of capturing a contradiction.', confidence: WORKING_ASSUMPTION, method: measure how often the condition occurs in pilot and how many are genuine, priority: Medium}
