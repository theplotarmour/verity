key: evidence_capture
name: Evidence Capture
layer: core
confidence: KNOWN
description: >
  Capturing photographs, signatures, scans, positions and form responses at the moment
  something happens, binding them to what they are evidence of, and keeping them in a state
  where they can still be relied on when somebody disputes them a year later. It is used by
  almost every operational capability and it is the one that decides whether their records
  are assertions or evidence.

principles:
  - Evidence is captured on a cheap device with no connectivity, by somebody holding something in their other hand. Every design decision favours capture succeeding over capture being complete.
  - Evidence and the thing it evidences travel together. A photograph that syncs without its completion, or a completion that syncs without its photograph, is the failure that makes field evidence untrustworthy.
  - Tamper evidence is about detection, not prevention. The device is not trusted and cannot be made trustworthy, so the model records what can be checked and never claims more.
  - Metadata is part of the evidence and is captured at the moment, not derived later. When and where a photograph was taken cannot be reconstructed afterwards, and a system that infers them is manufacturing evidence.
  - Retention is driven by what the evidence is for. A completion photograph and an identity document have completely different lifetimes and completely different consequences for keeping them too long.
  - What is captured must be visible to the person it is about, wherever that is lawful, because evidence collected about somebody who cannot see it is the shape of a grievance.

entities:

  - key: evidence_item
    name: Evidence Item
    description: One captured artefact - a photograph, a signature, a scan, a position or a form response - with its metadata, its integrity information and what it is evidence of.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true, note: 'uuid v7, minted on the device so that the reference exists before the upload does'}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: kind, type: enum, values: [photograph, signature, scan_code, position, form_response, audio_note, document], req: true, immutable: true}
      - {key: subject_capability_key, type: string, req: true, immutable: true, note: which capability the evidence belongs to}
      - {key: subject_ref, type: uuid, req: true, immutable: true, note: 'the record it evidences, opaque here and resolved through the evidence_capture port'}
      - {key: requirement_key, type: string, nullable: true, immutable: true, note: which declared requirement this satisfies - for example the second of two required photographs - so that a requirement can be checked without inspecting content}
      - {key: captured_at, type: timestamptz, req: true, immutable: true, note: 'the device''s claimed capture time'}
      - {key: received_at, type: timestamptz, req: true, immutable: true}
      - {key: captured_by_principal_id, type: uuid, req: true, immutable: true}
      - {key: device_ref, type: uuid, nullable: true, immutable: true}
      - {key: position, type: geo_point, nullable: true, immutable: true, sensitive: true}
      - {key: position_accuracy_m, type: int, nullable: true, immutable: true}
      - {key: position_verdict, type: enum, values: [not_evaluated, inside, outside, inconclusive], req: true, default: not_evaluated, immutable: true, note: 'three-valued, from the presence_evidence port, never a boolean'}
      - {key: content_hash, type: string, req: true, immutable: true, note: 'SHA-256 of the stored bytes, computed on the device before upload and recomputed on receipt. A mismatch is a transfer fault or a substitution and both matter'}
      - {key: content_size_bytes, type: bigint, req: true, immutable: true}
      - {key: content_type, type: string, req: true, immutable: true}
      - {key: storage_ref, type: string, nullable: true, note: 'where the bytes are, once uploaded. Null while the item exists only as a reference on a device'}
      - {key: capture_metadata, type: json, nullable: true, immutable: true, note: 'flat scalars captured at the moment - device orientation, whether the camera was live rather than a gallery selection, battery state, whether the clock was network-synchronised. Each is weak on its own and together they are what a dispute is argued over'}
      - {key: from_live_capture, type: bool, nullable: true, immutable: true, note: 'whether the item came from a live camera rather than from a stored file. Nullable rather than false, because on many devices this genuinely cannot be determined and asserting false would be a claim the platform cannot support'}
      - {key: clock_skew_seconds, type: int, nullable: true, immutable: true, note: 'computed against the receipt time on a device with no network clock, and retained because it is the only evidence that the claimed capture time is unreliable'}
      - {key: redacted_at, type: timestamptz, nullable: true}
      - {key: redaction_reason, type: text, nullable: true}
      - {key: retention_class, type: string, req: true, note: derived from the requirement at capture and mutable only by a legal hold}
      - {key: expires_at, type: timestamptz, nullable: true}
    invariants:
      - Every field except storage_ref, the redaction fields, retention_class and expires_at is immutable. Evidence that can be edited is not evidence.
      - content_hash is computed on the device before upload and recomputed on receipt. A mismatch marks the item as integrity_failed and it is never silently accepted.
      - captured_at and received_at are both retained. The gap is the sync lag and it is queryable, because a fortnight of evidence arriving in one burst is the shape of both a broken handset and a fabrication.
      - position_verdict is three-valued plus not-evaluated. No consumer may coerce inconclusive to inside or outside.
      - An item may never be deleted while any legal hold covers it or while the record it evidences is within its own retention period. Expiry destroys content and retains the hash and the metadata, so that a later question about what existed is still answerable.
      - from_live_capture is nullable and a null is never rendered as a negative. A platform that cannot tell must say it cannot tell.
    states: [pending_upload, uploaded, verified, integrity_failed, redacted, expired]
    initial_state: pending_upload
    transitions:
      - {from: pending_upload, to: uploaded, action: upload_evidence, actor: the capturing device, guard: the bytes are received in full, side_effects: storage_ref set; the owning record is told its evidence has arrived, reversibility: false}
      - {from: uploaded, to: verified, action: verify_evidence, actor: system, guard: the recomputed hash matches the device-computed hash, side_effects: none, reversibility: false}
      - {from: uploaded, to: integrity_failed, action: verify_evidence, actor: system, guard: the recomputed hash differs, side_effects: 'the owning record is told the evidence is unverified, and the capturing principal and the supervisor are told', reversibility: true}
      - {from: integrity_failed, to: verified, action: reupload_evidence, actor: the capturing device or a supervisor, guard: a fresh upload matches the recorded hash, side_effects: 'the failed attempt is retained alongside, because a transfer that failed and then succeeded is a different history from one that never failed', reversibility: false}
      - {from: verified, to: redacted, action: redact_evidence, actor: 'supervisor, ops_manager or tenant_owner', guard: acting session is elevated and a reason is supplied, side_effects: the content is replaced or masked; the hash of the ORIGINAL is retained so the redaction itself is provable, reversibility: false}
      - {from: uploaded, to: redacted, action: redact_evidence, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: verified, to: expired, action: expire_evidence, actor: system_scheduler, guard: 'now > expires_at and no legal hold covers it', side_effects: 'content destroyed, hash and metadata retained as a tombstone', reversibility: false}
      - {from: redacted, to: expired, action: expire_evidence, actor: system_scheduler, guard: as above, side_effects: as above, reversibility: false}
      - {from: integrity_failed, to: expired, action: expire_evidence, actor: system_scheduler, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      pending_upload: >
        Evidence that exists on a device and nowhere else. It is the most fragile state in the
        platform - a lost or wiped handset destroys it permanently - and it is entirely normal
        for hours at a time. Threshold: pending_upload_alert_hours (default 12), and
        pending_upload_critical_hours (default 72) at which the owning record is marked as
        having evidence that may never arrive. Told: the capturing principal first, because
        the fix is usually to find a signal; then the supervisor. Escape hatch: upload, or
        explicitly abandon with a reason recorded on the owning record. Verity never quietly
        forgets a pending item - the reference exists server-side from the moment of capture
        precisely so that missing evidence is visible rather than invisible.
      uploaded: >
        Uploaded and unverified is a short mechanical window. Threshold:
        verification_lag_minutes (default 15). Told: platform_operator, because this is
        machinery. The owning record shows the evidence as unverified rather than as verified,
        so nothing downstream treats it as stronger than it is while the check is outstanding.
      verified: >
        Steady state for the retention period. The monitored exception is a periodic
        re-verification sweep finding a mismatch on stored content, which means the storage
        has been altered or corrupted since receipt. Told: platform_operator and tenant_owner
        simultaneously, at the highest severity, not suppressible. Escape hatch: none - it is
        either a storage fault or an intrusion and both need a human.
      integrity_failed: >
        Threshold: immediate. Told: the capturing principal, the supervisor and
        platform_operator. Escape hatch: re-upload from the device where the original still
        exists, or accept the item as unverified with a recorded decision. The item is NOT
        discarded, because a failed transfer is far more common than a substitution and
        discarding it destroys the only copy. Every downstream consumer sees it as unverified
        and the difference is carried into any dispute.
      redacted: >
        Terminal in content terms. Retained with the original hash so the redaction is
        provable. The monitored condition is a redaction rate above redaction_rate_alert,
        told to tenant_owner, because habitual redaction is either a capture process
        collecting things it should not or an attempt to edit history.
      expired: >
        Terminal. The tombstone retains the hash, the metadata and the expiry job reference
        permanently, so that a question about what once existed is answerable. Nothing pends.

  - key: evidence_requirement
    name: Evidence Requirement
    description: A declaration by a consuming capability that a particular act needs particular evidence, with what counts as satisfying it.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: requirement_key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: declaring_capability_key, type: string, req: true}
      - {key: label, type: string, req: true}
      - {key: kind, type: enum, values: [photograph, signature, scan_code, position, form_response, audio_note, document], req: true}
      - {key: min_count, type: int, req: true, default: 1}
      - {key: max_count, type: int, nullable: true}
      - {key: requires_live_capture, type: bool, req: true, default: false, note: 'whether a gallery selection is acceptable. Set true where it matters and honoured only on devices that can report it, which is stated rather than assumed'}
      - {key: requires_position, type: bool, req: true, default: false}
      - {key: min_position_accuracy_m, type: int, nullable: true}
      - {key: prompt_text, type: text, req: true, note: 'what the person is asked to capture. Mandatory, because an unlabelled camera button produces photographs of the floor'}
      - {key: retention_class, type: string, req: true}
      - {key: retention_months, type: int, nullable: true}
      - {key: subject_visible, type: bool, req: true, default: true, note: whether the person the evidence is about may see it}
      - {key: sensitive, type: bool, req: true, default: false, note: 'gated by view_sensitive when true, which is the correct setting for anything showing a person or an identity document'}
      - {key: source_pack_key, type: string, nullable: true}
    invariants:
      - min_count is at least one and max_count, where set, is at least min_count.
      - prompt_text is mandatory and non-empty. An unlabelled capture control produces evidence of nothing.
      - requires_live_capture true is honoured only where the device reports capture provenance, and where it cannot, the item records from_live_capture as null and the requirement is marked as satisfied-without-provenance rather than as satisfied.
      - retention_months is mandatory unless the retention_class is one whose lifetime is set by a policy elsewhere. Evidence with no stated lifetime is evidence that is kept forever by accident.
      - Changing a requirement never invalidates evidence already captured against it. A stricter requirement applies from its change forward and existing records are listed rather than failed.
    states: [draft, active, retired]
    initial_state: draft
    transitions:
      - {from: draft, to: active, action: publish_requirement, actor: ops_manager or tenant_admin, guard: 'prompt text is set, retention is stated, and the storage backend supports the kind', side_effects: consuming capabilities may begin declaring this requirement on their actions, reversibility: true}
      - {from: active, to: draft, action: unpublish_requirement, actor: as above, guard: no active configuration references it, side_effects: none, reversibility: true}
      - {from: active, to: retired, action: retire_requirement, actor: as above, guard: no active configuration references it, side_effects: existing evidence keeps its retention class and remains resolvable, reversibility: false}
      - {from: draft, to: retired, action: retire_requirement, actor: as above, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_requirement_stale_days (default 21). Told: the creating principal.
        Escape hatch: publish or retire. The characteristic confusion is somebody having
        specified that a photograph is now required and finding that nothing is asking for it.
      active: >
        Two monitored exceptions. (a) A requirement satisfied by override more than
        override_rate_alert of the time (default 0.2) - it is being routinely bypassed, which
        means either the requirement is impractical or the override is too easy, and both are
        worth knowing. Told: ops_manager and the declaring capability's owner, monthly. (b) A
        requirement whose captured items are overwhelmingly satisfied-without-provenance while
        requires_live_capture is true, meaning the control is nominal on the devices actually
        in use. Told: ops_manager, because the tenant may believe they have a control they do
        not have.
      retired: >
        Terminal. Retained permanently, because existing evidence resolves its retention and
        its meaning against it. Nothing pends.

  - key: capture_session
    name: Capture Session
    description: The unit of atomicity - the set of evidence captured for one act, which must arrive together with the act itself or not at all.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: subject_capability_key, type: string, req: true}
      - {key: subject_ref, type: uuid, req: true}
      - {key: opened_at, type: timestamptz, req: true}
      - {key: closed_at, type: timestamptz, nullable: true}
      - {key: item_ids, type: json, req: true, note: flat list of evidence item references belonging to this session}
      - {key: required_keys, type: json, req: true, note: flat list of requirement keys this session must satisfy}
      - {key: satisfied_keys, type: json, req: true, note: computed at close}
      - {key: override_reason, type: text, nullable: true}
      - {key: override_by_principal_id, type: uuid, nullable: true}
      - {key: device_ref, type: uuid, nullable: true}
      - {key: created_offline, type: bool, req: true, default: false}
    invariants:
      - A session and the mutation it evidences form one atomic unit in the offline queue. Neither may be replayed without the other, which is the whole reason this entity exists rather than evidence being attached individually.
      - A session may close with unsatisfied requirements only where an override reason and an overriding principal are recorded.
      - item_ids is append-only while the session is open and frozen at close.
      - A session may not be reopened. Additional evidence after close is a new session linked to the same subject, so that what was present at the moment of the act remains distinguishable from what was added afterwards.
    states: [open, closed, closed_with_override, abandoned]
    initial_state: open
    transitions:
      - {from: open, to: closed, action: close_capture_session, actor: the capturing principal or the consuming capability, guard: every required key is satisfied, side_effects: the session and its owning mutation become one replayable unit, reversibility: false}
      - {from: open, to: closed_with_override, action: close_capture_session, actor: the capturing principal, guard: an override reason is recorded and the tenant permits overriding this requirement, side_effects: 'the owning record is marked as evidence-overridden, and every downstream artefact carries that marker', reversibility: false}
      - {from: open, to: abandoned, action: abandon_capture_session, actor: the capturing principal or system_scheduler, guard: 'the owning mutation was abandoned, or the session exceeded its lifetime', side_effects: 'captured items are retained and marked orphaned rather than deleted, because somebody took the photographs', reversibility: false}
    stuck_state_policy:
      open: >
        An open session is a capture in progress on a device. Threshold:
        session_lifetime_hours (default 24), after which it is abandoned automatically and its
        items are retained as orphaned. Told: the capturing principal at half the lifetime.
        Escape hatch: close, close with an override, or abandon. The reason the lifetime exists
        is that an open session holds items in pending_upload with no owning mutation to
        replay them with, and those items are the ones most likely to be lost.
      closed: >
        Terminal. Bounded by the upload state of its items. The monitored exception is a closed
        session whose owning mutation replayed successfully while one of its items is still
        pending upload - the act is recorded and its evidence is not yet present. Told: the
        supervisor, because a completion showing as evidenced when the photograph has not
        arrived is exactly the gap a dispute finds.
      closed_with_override: >
        Terminal. Every downstream artefact carries the override marker. The monitored
        condition is the rate, which is the requirement''s own active policy. Nothing
        individually pends.
      abandoned: >
        Terminal. Its items are retained as orphaned with their own retention, and the orphaned
        set is reported monthly to ops_manager, because orphaned evidence is either somebody's
        wasted effort or evidence of an act that was never recorded, and the second is worth
        looking at.

ports:
  - port_key: evidence_capture
    direction: provides
    contract: >
      Open a capture session against a subject, declare its requirements, accept items,
      close the session atomically with the caller's own mutation, and later resolve an item
      reference to its content, its metadata, its integrity state and its verdict. The
      atomicity of the close with the caller's mutation is part of the contract, not an
      implementation note - a provider that accepts evidence independently of the act does not
      satisfy it.
    cardinality: exactly_one

  - port_key: presence_evidence
    direction: requires
    contract: 'Given a location, a position and a reported accuracy, return inside, outside or inconclusive with the geofence version and the margin.'
    cardinality: zero_or_one
    unbound_behaviour: >
      position items are stored with their coordinates and accuracy and position_verdict stays
      not_evaluated. Every requirement demanding a position is satisfiable by capturing one and
      no verdict is produced, so a consumer wanting a verdict receives not_evaluated rather
      than a guess.

  - port_key: principal_directory
    direction: requires
    contract: Resolve the capturing principal and device to display names and trust state.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. Evidence with no attributable capturer is not evidence, and the identity of the person who took a photograph is frequently the first thing a dispute asks about.

  - port_key: audit_sink
    direction: requires
    contract: Record capture, upload, verification failure, redaction and expiry as audit events within the calling transaction.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. An evidence store whose accesses and redactions are not audited is a store whose contents cannot be relied on.

  - port_key: authorization_decision
    direction: requires
    contract: Determine whether a reader may see an item, applying the sensitive gate and the subject-visibility rule.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. Evidence includes photographs of people and identity documents, and serving it unprojected would make this the platform's largest disclosure surface.

  - port_key: notification
    direction: requires
    contract: Deliver pending-upload, integrity-failure and orphaned-evidence messages.
    cardinality: zero_or_one
    unbound_behaviour: 'Conditions surface as console lists. The pending-upload alert in particular becomes invisible to the person holding the device, which is the one person who can fix it - so this degradation directly increases permanent evidence loss.'

actions:

  - key: capture_evidence
    entity: evidence_item
    label: Capture evidence
    actors: [employee, supervisor, consumer, customer_contact]
    rationale: >
      Performed on a cheap device, outdoors, one-handed, usually with no signal. It has to
      succeed under all of those conditions, and the design consequence is that capture and
      upload are separate acts with the reference existing server-side from the first moment.
    preconditions: [a capture session is open, the requirement resolves, the device has storage]
    inputs: [session_id, requirement_key, kind, content, captured_at, position, position_accuracy_m, capture_metadata]
    creates: [evidence_item in pending_upload, a server-side reference]
    updates: [session item list]
    events: [evidence.captured]
    notifications: []
    undoable: true
    reversal_action: discard the item while the session is still open, which is recorded rather than silent
    audit_class: always
    idempotency_key_source: >
      the device-minted item id. Minted on the device before the bytes exist, so a retried
      upload of the same capture is one item. This is why the id is a device-minted uuid v7
      rather than a server-allocated one - the reference has to exist before connectivity does.
    offline_policy: queue
    concurrency: >
      Items are appended to an open session and do not contend. The server-side reference is
      created optimistically from the device-minted id on the first sync opportunity, so that a
      device holding evidence is visible to a supervisor before the bytes arrive. Capture never
      blocks on any server round trip.
    failure_modes:
      - {code: E_PRECONDITION, cause: the session is closed or abandoned, message: This action is not available in the current state., note: 'the item is retained on the device as orphaned and offered for attachment to a new session, because somebody took the photograph'}
      - {code: E_VALIDATION, cause: the kind does not match the requirement, message: field-specific}
      - {code: E_VALIDATION, cause: position required and not available on the device, message: null, note: the item is CAPTURED without a position and the requirement is marked unsatisfied. Refusing the capture because a position could not be obtained loses the photograph as well as the position}
      - {code: E_QUOTA, cause: device storage exhausted, message: There is no space left on this device., note: the surface offers to upload pending items first and states how many are waiting. This is a real and frequent condition on the devices in use and it is where evidence is most often lost}
      - {code: E_VALIDATION, cause: content exceeds max_item_bytes, message: null, note: 'the item is downscaled on the device to the configured maximum and BOTH the original hash and the downscaled hash are recorded, so the transformation is disclosed rather than hidden. An undisclosed transformation would make every hash comparison meaningless'}
    edge_cases:
      - "Captured with no connectivity, which is the normal case. The item exists on the device with its hash computed locally and its server-side reference created at the next sync opportunity. Both timestamps are retained, and the gap is the single most useful field for judging a disputed capture."
      - A device whose clock is wrong. captured_at is recorded as claimed and clock_skew_seconds is computed against the first server contact. It is never silently corrected, because the skew is the only evidence that the claimed time is unreliable, and correcting it would manufacture a timestamp.
      - A photograph selected from a gallery rather than taken live. Recorded with from_live_capture false where the device reports it, and null where it cannot. A requirement demanding live capture is marked satisfied-without-provenance rather than satisfied, so that the tenant knows whether the control is real on the devices they actually issue.
      - Capture of a signature. Stored as an image plus the stroke metadata where the device provides it, because the stroke timing is far stronger evidence than the resulting picture and it costs almost nothing to keep.
      - A person refusing to be photographed. There is no mechanism to compel it. The requirement goes unsatisfied and the override path with a reason is what records why, which is the correct outcome - a system that has no way to record a refusal produces staff who photograph people who said no.
      - Capture against a subject that has been deleted or cancelled since the session opened. The items are retained as orphaned rather than discarded, and reported. Somebody took them, and destroying them because a record was cancelled removes the evidence of what was actually there.

  - key: upload_evidence
    entity: evidence_item
    label: Upload captured evidence
    actors: [the capturing device, system]
    rationale: >
      Separated from capture because the two happen at completely different times and under
      completely different conditions. Modelling them as one act is what produces systems that
      lose evidence whenever a device is out of signal.
    preconditions: [the item exists in pending_upload, the device holds the content, connectivity is available]
    inputs: [item_id, content, device_computed_hash]
    creates: []
    updates: [storage_ref, item state]
    events: [evidence.uploaded]
    notifications:
      - {to: the capturing principal and the supervisor, channel: in_app, when: the item has been pending beyond the alert threshold and has now arrived, template: evidence_arrived_late, batching_policy: daily digest}
    undoable: false
    confirmation_specification: 'None. There is no human in this path; uploads are performed by the device in the background. The kernel K06 requirement is met by the hash comparison, which is a stronger control than any confirmation - it detects a substitution that a confirmation would not.'
    audit_class: always
    idempotency_key_source: 'item_id. A retried upload of the same item is a no-op once the hash matches, which matters because retry over an unreliable connection is the normal path rather than the exception.'
    offline_policy: queue
    concurrency: >
      Uploads are per item and independent. A partially uploaded item is resumable by byte
      range; a resumed upload that produces a different hash is treated as integrity_failed
      rather than as a fresh upload, because a changed hash on a resumed transfer is exactly
      what a substitution looks like.
    failure_modes:
      - {code: E_CONFLICT_VERSION, cause: the recomputed hash differs from the device-computed hash, message: null, note: the item moves to integrity_failed and the content IS retained. Discarding it would destroy the only copy over what is far more often a transfer fault than a substitution}
      - {code: E_QUOTA, cause: tenant storage quota exceeded, message: Plan limit reached., note: 'the item stays pending on the device and the tenant_owner is told, because the alternative is silently losing evidence to a billing condition'}
      - {code: E_DEPENDENCY, cause: storage backend unavailable, message: null, note: 'retried with backoff. The item stays pending and its pending clock keeps running, so a long backend outage surfaces as pending-upload alerts rather than as silence'}
      - {code: E_PRECONDITION, cause: the item was expired or redacted while pending, message: null, note: 'the upload is refused and the device is told to discard, and the fact that content existed and was not stored is recorded on the tombstone'}
      - {code: E_RATE_LIMIT, cause: a device uploading beyond the per-device rate, message: null, note: throttled rather than refused. A device syncing a fortnight of backlog is legitimate and must not be blocked; it must simply not saturate the connection for everybody else at that location}
    edge_cases:
      - A device uploading a fortnight of backlog after a long outage. Throttled, ordered oldest first, and the owning mutations replay with their sessions atomically. Ordering newest first would leave the oldest and most disputed evidence until last, which is exactly backwards.
      - An upload arriving after the owning record has been completed and even invoiced. Accepted and attached. The record is updated to show that its evidence is now present, and where a billable outcome was emitted with an evidence-overridden marker, that marker is NOT retrospectively cleared, because the invoice went out saying what it said.
      - A handset lost before uploading. The pending items become permanently unrecoverable at the critical threshold and the owning records are marked as having evidence that will never arrive. This is recorded plainly rather than being allowed to look like evidence that was never required.
      - Two devices uploading the same item id, which can only happen if a device image was cloned. The first upload wins, the second is compared by hash, and a mismatch raises a security alert rather than an integrity one, because identical ids with different content is not a transfer fault.
      - Upload of an item whose session was abandoned. Accepted and stored as orphaned. The bytes exist and somebody captured them, and the abandoned session is the record of why they are not attached to anything.

  - key: redact_evidence
    entity: evidence_item
    label: Redact evidence
    actors: [supervisor, ops_manager, tenant_owner]
    rationale: >
      Evidence routinely captures more than was intended - a bystander in a photograph, a
      document in the background, a face where only a serial number was wanted. Redaction has
      to exist, and it has to be impossible to use as a way of editing history.
    preconditions: [acting session is elevated, a reason is supplied, no legal hold forbids alteration]
    inputs: [item_id, reason, redaction_kind]
    creates: []
    updates: [content replaced or masked, redaction fields set]
    events: [evidence.redacted]
    notifications:
      - {to: the capturing principal, channel: in_app, when: always, template: your_evidence_redacted, must_include: [subject_reference, reason, actor_display_name]}
      - {to: tenant_owner, channel: in_app, when: the redaction rate exceeds the alert threshold, template: redaction_rate_high}
    undoable: false
    confirmation_specification: 'Modal stating what the item is evidence of, that the original content will be destroyed and cannot be recovered, that the original hash will be retained so the redaction is provable, and who will be told. Requires typing the reason rather than selecting it. Required because the content cannot be recovered.'
    audit_class: security
    idempotency_key_source: item_id plus target state. A replayed redaction is a no-op and does not re-notify.
    offline_policy: refuse
    concurrency: >
      Redaction takes the item exclusively and writes the audit row in the same transaction. A
      redaction racing an expiry: expiry wins if it lands first and the redaction becomes a
      no-op against a tombstone, which is correct - the content is gone either way and the
      difference is only in the reason recorded.
    failure_modes:
      - {code: E_PRECONDITION, cause: a legal hold covers the item, message: This action is not available in the current state., note: 'names the hold. A hold prevents alteration as well as deletion, and this is the one place the two are the same thing'}
      - {code: E_VALIDATION, cause: reason empty, message: Write the reason. It is recorded permanently.}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
      - {code: E_PRECONDITION, cause: the item is still pending upload, message: This action is not available in the current state., note: 'there is nothing stored to redact, and the correct act is to instruct the device to discard, which is a different action with a different record'}
    edge_cases:
      - Redacting a photograph that is the only evidence supporting an invoiced line. Permitted, and the owning record is marked as having had its evidence redacted, so that a subsequent dispute is answered with the truth rather than with an apparent absence. Preventing the redaction would make the platform unable to comply with a legitimate request; hiding its consequence would be worse.
      - A redaction request arising from a data-subject request. Handled here for the content and by core_audit for the audit rows, and the two are deliberately separate because their retention obligations differ. The conflict between a request and an active legal hold resolves in favour of the hold, and both the request and the conflict are recorded.
      - Masking rather than destroying - blurring a face while keeping the rest of a photograph. Supported as a redaction kind, and it produces a new content hash while retaining the original hash, so the transformation is provable and the original is not recoverable from the record.
      - Redaction of an item that has already expired. A no-op against the tombstone, recorded, because somebody asked and the fact that they asked is itself worth keeping.
      - Bulk redaction across a set - every photograph from one shift. Supported as a batch sharing a correlation id and one reason, and counted as many redactions rather than one for the rate monitor, because the monitor exists to make volume visible and a batch would otherwise hide it.

rules:
  - key: evidence_and_act_are_atomic
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A capture session and the mutation it evidences form one unit in the offline queue. Neither replays without the other.'
    on_conflict: not overridable
    rationale: Evidence that syncs without its act, or an act that syncs without its evidence, is the failure that makes all field evidence untrustworthy.

  - key: capture_never_blocks_on_the_server
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Item identifiers are minted on the device and capture completes locally. No capture path requires a server round trip.'
    on_conflict: not overridable

  - key: integrity_failure_retains_content
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'An item whose hash does not verify is marked integrity_failed and its content is retained. It is never discarded.'
    on_conflict: not overridable
    rationale: A transfer fault is far more common than a substitution, and discarding destroys the only copy of something somebody captured.

  - key: metadata_is_captured_not_derived
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'captured_at, position, accuracy and capture provenance are recorded as the device reported them. None is inferred, corrected or defaulted server-side.'
    on_conflict: not overridable
    rationale: A system that infers when or where a photograph was taken is manufacturing evidence.

  - key: unknown_provenance_is_never_rendered_as_negative
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'from_live_capture null renders as unknown, never as false, and a requirement met by an item of unknown provenance is satisfied-without-provenance rather than satisfied.'
    on_conflict: not overridable

  - key: transformations_are_disclosed
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Any downscaling, compression or masking records both the original and the resulting hash. An undisclosed transformation is forbidden.'
    on_conflict: not overridable
    rationale: An undisclosed transformation makes every hash comparison in the system meaningless.

  - key: evidence_override
    kind: policy
    scope: capability
    overridable_at: site
    default: 'Permitted with a mandatory reason, recorded on the owning record and carried into every downstream artefact including any billable outcome. A site may forbid it per requirement.'
    on_conflict: the stricter setting wins
    rationale: >
      Forbidding it absolutely produces staff who complete work outside the system when a
      camera fails. Permitting it silently produces unevidenced billing. Permitting it
      visibly, marking every artefact it touches, and counting the rate is the version that
      survives contact with a wet Tuesday.

  - key: subject_visibility
    kind: policy
    scope: capability
    overridable_at: tenant
    default: 'true. Evidence about a person is visible to that person. A tenant may set it false per requirement where there is a stated reason, which is recorded.'
    on_conflict: most specific scope wins
    rationale: Evidence collected about somebody who cannot see it is the shape of a grievance, and the default should be the one that does not produce grievances.

policy_knobs:
  - {key: pending_upload_alert_hours, default: 12, range: [1, 168]}
  - {key: pending_upload_critical_hours, default: 72, range: [1, 720]}
  - {key: verification_lag_minutes, default: 15, range: [1, 1440], lowest_settable_scope: kernel}
  - {key: session_lifetime_hours, default: 24, range: [1, 168]}
  - {key: override_rate_alert, default: 0.2, range: [0.01, 1.0]}
  - {key: redaction_rate_alert, default: 0.01, range: [0.0001, 1.0]}
  - {key: max_item_bytes, default: 5000000, range: [100000, 100000000]}
  - {key: device_upload_rate_limit_kbps, default: null, note: 'null means unthrottled. A device syncing a long backlog must not be blocked, and whether it should be throttled depends entirely on the connection at that location'}
  - {key: draft_requirement_stale_days, default: 21, range: [1, 180]}
  - {key: default_retention_months, default: null, note: 'deliberately null. Every requirement states its own retention, because a completion photograph and an identity document have completely different lifetimes and a shipped default would silently apply the wrong one to whichever the tenant configured second'}

open_questions:
  - {q: 'What tamper-evidence claim can Verity honestly make? The device is not trusted, the hash is computed on the device, and a compromised device can produce a consistent hash for fabricated content. The model records what can be checked and claims nothing more, and no claim has been agreed for use in contracts or marketing.', assumption: 'The claim is limited to detecting alteration AFTER receipt, plus a body of weak corroborating metadata. It is explicitly not a claim that the content is genuine.', confidence: VALIDATION_REQUIRED, method: 'legal review of what standard of evidence client contracts and any court would require, alongside the same question raised in core_audit', priority: Critical, blocks: [any contractual or marketing claim about evidence, attendance dispute resolution]}
  - {q: 'Is capturing photographs of people lawful and acceptable across the target workforce and their counterparties, and under what consent? Several requirements in other capabilities imply photographing people, and nothing in this model establishes the basis for it.', assumption: 'None. subject_visible defaults true, which is a mitigation and not a basis.', confidence: VALIDATION_REQUIRED, method: 'legal review, plus review of what client contracts actually require as opposed to what they ask for', priority: Critical, blocks: [attendance_verification biometric question, party identity document storage]}
  - {q: 'Should evidence be retained by the tenant or by the counterparty whose work it evidences, where a contract makes the counterparty the owner of the record? The model stores everything tenant-scoped and takes no position on contractual ownership.', assumption: Tenant-scoped storage with counterparty visibility through a surface. Ownership is not modelled., confidence: VALIDATION_REQUIRED, method: contract review with a pilot customer whose agreements mention record ownership, priority: High}
  - {q: 'What is the right response to a device that is lost with pending evidence? The model marks the owning records as having evidence that will never arrive, which is honest and leaves those records permanently weaker with no remedy.', assumption: 'Marked and left. No re-capture workflow is modelled, because re-capturing evidence of something that happened last week is manufacturing it.', confidence: WORKING_ASSUMPTION, method: measure how often it occurs in pilot and what operators do, priority: Medium}
  - {q: 'Should default_retention_months ship with any value at all? Null means every requirement must state its own, which is correct and means a misconfigured requirement has no lifetime rather than a wrong one - and evidence with no lifetime is kept forever by accident.', assumption: 'Null, with publication refusing a requirement that states no retention. The tension is that the refusal is the only thing standing between the tenant and indefinite retention.', confidence: VALIDATION_REQUIRED, method: legal review of retention obligations per evidence kind, priority: High, blocks: [AET-06 decision count, storage cost model]}
