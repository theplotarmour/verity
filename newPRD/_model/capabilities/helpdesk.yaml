key: helpdesk
name: Helpdesk
layer: domain
confidence: KNOWN
description: >
  Somebody reports a problem, it reaches whoever can deal with it, and they are kept
  informed until it is resolved. It is the front door: it accepts anything, including things
  that are not problems and things that belong somewhere else, and its job is to route,
  answer and account for every one of them. Conversion to work is a port, so the helpdesk
  never becomes a second work management system.

principles:
  - Accept everything. A front door that refuses malformed reports produces reports by telephone, and a telephone call is in no report.
  - The first response is the promise. Most of the perceived quality of a helpdesk is the time to a human acknowledgement, not the time to a fix, and the model measures the two separately because they are different obligations.
  - Conversation is the record. A ticket whose correspondence lives in somebody's mailbox is a ticket nobody else can pick up, and the handover is exactly when it matters.
  - Reopening is expected. A resolution the reporter disagrees with is not a new problem, and forcing a new ticket destroys the link between the two.
  - Routing must be explainable and overridable. A queue somebody cannot see the reason for is a queue they will bypass.
  - Merging and splitting are commercial and operational acts with consequences for measurement, and doing either silently corrupts every response-time figure.

entities:

  - key: ticket
    name: Ticket
    description: One reported matter, with who reported it, what it is about, who is dealing with it and how it ended.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: reference, type: string, req: true, unique_scope: tenant, immutable: true, note: the short code quoted on the telephone}
      - {key: subject, type: string, req: true}
      - {key: body, type: text, nullable: true}
      - {key: reporter_party_ref, type: uuid, nullable: true, note: 'resolved through the party_directory port. Null for an anonymous or unidentified report, which must remain acceptable'}
      - {key: reporter_contact_raw, type: string, nullable: true, sensitive: true, note: 'the address or number the report arrived from, kept verbatim even where a party was matched, because the match may be wrong and the reply has to go back where it came from'}
      - {key: channel, type: enum, values: [portal, email, telephone, messaging, walk_in, staff_raised, integration, monitoring_signal], req: true}
      - {key: location_ref, type: uuid, nullable: true}
      - {key: subject_ref, type: uuid, nullable: true, note: 'what it is about, resolved through the work_subject port. Opaque here'}
      - {key: category_id, type: uuid, nullable: true, fk: ticket_category}
      - {key: priority, type: enum, values: [low, normal, high, urgent], req: true, default: normal}
      - {key: priority_source, type: enum, values: [reporter_stated, category_default, rule_derived, manually_set], req: true, note: where the priority came from. A reporter-stated urgency and a rule-derived one are different facts and treating them identically means every ticket is urgent}
      - {key: queue_id, type: uuid, nullable: true, fk: queue}
      - {key: assignee_principal_id, type: uuid, nullable: true}
      - {key: routing_explanation, type: text, nullable: true, note: 'why it landed where it did. Mandatory where routing was automatic, because a queue nobody can see the reason for is a queue they will bypass'}
      - {key: first_response_at, type: timestamptz, nullable: true}
      - {key: resolved_at, type: timestamptz, nullable: true}
      - {key: closed_at, type: timestamptz, nullable: true}
      - {key: resolution_kind, type: enum, values: [not_recorded, resolved, no_fault_found, not_our_responsibility, duplicate, withdrawn_by_reporter, no_response_from_reporter], nullable: true, note: 'deliberately includes the honest endings. A system offering only resolved records resolved for everything, including the ones nobody could reproduce'}
      - {key: resolution_note, type: text, nullable: true}
      - {key: converted_work_refs, type: json, nullable: true, note: flat list of work references raised from this ticket through the work_generation port}
      - {key: merged_into_ticket_id, type: uuid, nullable: true, fk: ticket}
      - {key: reopen_of_ticket_id, type: uuid, nullable: true, fk: ticket}
      - {key: reopen_count, type: int, req: true, default: 0}
      - {key: satisfaction_score, type: int, nullable: true}
      - {key: last_reporter_contact_at, type: timestamptz, nullable: true, note: 'used by the awaiting-reporter policy, which is the largest source of tickets that never end'}
    invariants:
      - resolved_at requires resolution_kind to be set and not not_recorded. A resolution with no kind records only that somebody pressed a button.
      - routing_explanation is mandatory whenever queue_id or assignee was set by a rule rather than by a person.
      - merged_into_ticket_id is set exactly in state merged, and a merged ticket never carries its own response-time measurements forward, because counting one matter twice inflates every figure.
      - reporter_contact_raw is retained verbatim even where a party matched, and is gated by view_sensitive.
      - A ticket may reference several converted work items and owns none of them. Closing a ticket never closes work, and completing work never closes a ticket.
    states: [new, triaged, awaiting_assignee, awaiting_reporter, awaiting_third_party, resolved, closed, merged, reopened]
    initial_state: new
    transitions:
      - {from: new, to: triaged, action: triage_ticket, actor: 'employee, supervisor or system', guard: a category and a queue are set, side_effects: 'the sla_clock is started where bound, routing explanation recorded', reversibility: true}
      - {from: triaged, to: awaiting_assignee, action: assign_ticket, actor: 'supervisor, dispatcher, system or the assignee themselves', guard: an assignee is set, side_effects: the assignee is told, reversibility: true}
      - {from: awaiting_assignee, to: triaged, action: unassign_ticket, actor: supervisor or the assignee, guard: a reason is supplied, side_effects: 'returns to the queue; the clock keeps running, because losing an assignee does not pause a promise to a reporter', reversibility: true}
      - {from: awaiting_assignee, to: awaiting_reporter, action: request_information, actor: the assignee, guard: a message is sent to the reporter, side_effects: 'the sla_clock pauses ONLY where the contract permits pausing for this reason, which the contract capability decides', reversibility: true}
      - {from: awaiting_reporter, to: awaiting_assignee, action: observe_reporter_reply, actor: system or the assignee, guard: 'the reporter responded, or the assignee resumes without them', side_effects: clock resumes, reversibility: true}
      - {from: awaiting_assignee, to: awaiting_third_party, action: escalate_externally, actor: the assignee, guard: a third party and a reason are recorded, side_effects: 'clock pauses only where permitted; the elapsed third-party time is tracked separately, because it is the number that moves a supplier conversation', reversibility: true}
      - {from: awaiting_third_party, to: awaiting_assignee, action: observe_third_party_response, actor: system or the assignee, guard: null, side_effects: clock resumes, reversibility: true}
      - {from: awaiting_assignee, to: resolved, action: resolve_ticket, actor: the assignee, guard: 'a resolution kind and a note are supplied, and the reporter is told', side_effects: 'the sla_clock stops, the reporter is invited to confirm or reopen', reversibility: true}
      - {from: awaiting_reporter, to: resolved, action: resolve_ticket, actor: the assignee, guard: resolution kind is no_response_from_reporter and the awaiting window has elapsed, side_effects: as above, reversibility: true}
      - {from: triaged, to: resolved, action: resolve_ticket, actor: employee or supervisor, guard: as for the assignee path, side_effects: as above, reversibility: true, note: 'a great many tickets are answered at triage by whoever picked them up, and forcing an assignment step first adds a hop that nobody wants'}
      - {from: resolved, to: closed, action: close_ticket, actor: 'system_scheduler, the reporter or the assignee', guard: 'the reporter confirmed, or the confirmation window elapsed', side_effects: the ticket becomes immutable except for reopening, reversibility: false}
      - {from: resolved, to: reopened, action: reopen_ticket, actor: 'the reporter through the customer_surface port, or staff', guard: a reason is supplied and now is within the reopen window, side_effects: 'a NEW ticket is created with reopen_of set and this one''s reopen_count incremented; the clock on the new ticket starts fresh and the link preserves the history', reversibility: false}
      - {from: closed, to: reopened, action: reopen_ticket, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: new, to: merged, action: merge_ticket, actor: employee or supervisor, guard: a target ticket is named and a reason is supplied, side_effects: correspondence and reporters are carried to the target; this ticket contributes no response-time measurement, reversibility: true}
      - {from: triaged, to: merged, action: merge_ticket, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: awaiting_assignee, to: merged, action: merge_ticket, actor: as above, guard: as above, side_effects: as above, reversibility: true}
    stuck_state_policy:
      new: >
        An untriaged ticket is a report nobody has looked at, and the first-response clock is
        running against it. Threshold: triage_target_minutes (default 30 in working hours,
        priority-adjusted). Told: every principal watching the default queue, then the
        supervisor. Escape hatch: triage, or merge as a duplicate. Verity never auto-triages
        into a queue on a low-confidence rule match; where the rule is uncertain it lands in
        the default queue with the uncertainty stated, because a confidently wrong routing is
        worse than an unrouted ticket somebody can see.
      triaged: >
        Triaged and unassigned. Threshold: assignment_target_minutes (default 60,
        priority-adjusted). Told: the queue watchers, then the supervisor. Escape hatch:
        assign, or resolve directly. The specific monitored case is a queue with no active
        watcher at all, which is reported against the queue rather than against each ticket -
        otherwise one unwatched queue produces a hundred identical alerts.
      awaiting_assignee: >
        The working state. Threshold: no update of any kind for stale_ticket_hours (default 24,
        shorter at higher priority), or the approaching breach position from the sla_clock
        where one is bound, whichever comes first. Told: the assignee, then the supervisor.
        Escape hatch: update, resolve, or hand back. An assignee absent or on leave is the
        common cause, which is why the notification carries their availability where the
        resource port resolves it.
      awaiting_reporter: >
        The largest source of tickets that never end, and the one most often mishandled.
        Threshold: reporter_chase_days (default 3), with at most
        max_reporter_chases (default 2) reminders, then resolution as no_response_from_reporter
        after awaiting_reporter_days (default 10). Told: the reporter, then the assignee.
        This is the ONE place the model permits an automatic resolution, and it is permitted
        only because the alternative - an unbounded queue of tickets waiting on people who
        have moved on - makes every other metric meaningless. It resolves as
        no_response_from_reporter, never as resolved, so the distinction survives into every
        report, and the reporter is told that it has been closed and how to reopen.
      awaiting_third_party: >
        Threshold: third_party_chase_days (default 3), escalating to the supervisor and then to
        whoever owns the supplier relationship. Told: the assignee and the relationship owner.
        Escape hatch: chase, resolve without them, or escalate commercially. The elapsed
        third-party time is reported separately and cumulatively per third party, because that
        total is the only number that changes a supplier's behaviour.
      resolved: >
        Resolved and unclosed is a reporter who has not confirmed. Threshold:
        confirmation_window_days (default 5), after which it closes automatically. Told: the
        reporter once, at resolution, with how to reopen. Automatic closure here is safe
        because reopening remains available for the full reopen window, so nothing is lost.
      reopened: >
        Terminal on this ticket; the successor carries the matter. The monitored condition is a
        chain longer than reopen_chain_alert (default 1), told immediately to the supervisor
        and to the category owner, because a second reopen means the resolution approach is
        wrong and a third attempt at the same approach will not fix it.
      merged: >
        Terminal. Retained permanently with its correspondence and its link to the target,
        because a reporter who quotes the merged reference must still be findable by it, and
        because merging is the easiest way to make a response-time figure look better than it
        is - which is why merged tickets contribute no measurement and the merge rate is
        monitored.
      closed: >
        Terminal unless reopened. The one thing still pending is satisfaction where the tenant
        collects it. A closed ticket whose converted work is still open is reported to the
        supervisor, because a reporter told their matter is closed while the work is
        outstanding will telephone, and they will be right to.

  - key: ticket_message
    name: Ticket Message
    description: One communication on a ticket, inbound or outbound, internal or visible to the reporter, with what was actually sent.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: ticket_id, type: uuid, req: true, fk: ticket}
      - {key: direction, type: enum, values: [inbound, outbound, internal_note], req: true}
      - {key: visibility, type: enum, values: [reporter_visible, internal_only], req: true, note: 'MANDATORY with no default. An internal note posted as reporter-visible is the single most damaging mistake available on a helpdesk, and a default makes it a matter of habit rather than of choice'}
      - {key: channel, type: enum, values: [portal, email, messaging, telephone_note, in_person_note, system], req: true}
      - {key: body, type: text, req: true}
      - {key: author_principal_id, type: uuid, nullable: true}
      - {key: author_party_ref, type: uuid, nullable: true}
      - {key: sent_at, type: timestamptz, req: true}
      - {key: delivery_state, type: enum, values: [not_applicable, queued, delivered, failed, bounced], req: true, default: not_applicable}
      - {key: attachment_refs, type: json, nullable: true, note: through the evidence_capture port}
      - {key: counts_as_first_response, type: bool, req: true, default: false, note: 'computed at write. An automated acknowledgement does NOT count, because a reporter can tell the difference and the metric exists to measure what they experience'}
      - {key: redacted_at, type: timestamptz, nullable: true}
      - {key: redacted_by_principal_id, type: uuid, nullable: true}
    invariants:
      - visibility is mandatory and has no default at any layer.
      - A message is immutable once sent. Content that must be removed is redacted, which retains the fact of the message and its metadata and replaces the body, because deleting correspondence from a ticket makes the thread unreadable and the deletion undetectable.
      - counts_as_first_response is true only for an outbound, reporter_visible message authored by a principal rather than by the system.
      - An inbound message never changes ticket state by itself except to move awaiting_reporter back to awaiting_assignee. Automatic state changes driven by inbound mail are how an out-of-office reply reopens forty tickets.
    states: [drafted, sent, delivered, failed, redacted]
    initial_state: drafted
    transitions:
      - {from: drafted, to: sent, action: post_message, actor: 'employee, supervisor or the reporter', guard: 'visibility is set and, for an outbound message, a delivery channel resolves', side_effects: 'the ticket is updated, the clock and first-response state are recomputed', reversibility: false}
      - {from: sent, to: delivered, action: observe_delivery, actor: system, guard: the channel reports delivery, side_effects: none, reversibility: false}
      - {from: sent, to: failed, action: observe_delivery, actor: system, guard: the channel reports failure or a bounce, side_effects: 'the assignee is told, because a reply that never arrived looks to them like a reporter ignoring them', reversibility: true}
      - {from: failed, to: sent, action: retry_message, actor: employee or system, guard: 'an alternative channel is chosen, or the address is corrected', side_effects: none, reversibility: false}
      - {from: sent, to: redacted, action: redact_message, actor: supervisor or ops_manager, guard: acting session is elevated and a reason is supplied, side_effects: 'the body is replaced, the metadata and the fact of the message are retained', reversibility: false}
      - {from: delivered, to: redacted, action: redact_message, actor: as above, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      drafted: >
        A drafted reply is an answer somebody wrote and did not send. Threshold:
        draft_message_stale_hours (default 4). Told: the author only. Escape hatch: send or
        discard. This is a small thing that matters, because the reporter is waiting and the
        assignee believes they have replied.
      sent: >
        Bounded by delivery confirmation where the channel supports it. Threshold:
        delivery_confirm_hours (default 2). Told: the assignee, because an unconfirmed reply
        is indistinguishable to them from a reporter who has not answered.
      failed: >
        Threshold: immediate. Told: the assignee with the failure reason, because the correct
        action is to try another channel or telephone, and the assignee is the only person who
        can decide which. Escape hatch: retry on another channel. A failed message never
        silently retries on the same address, because the address is usually the problem.
      delivered: >
        Terminal. Retained permanently. Nothing pends.
      redacted: >
        Terminal. Retained permanently as a redacted message. The monitored condition is a
        redaction rate above redaction_rate_alert, told to ops_manager, because habitual
        redaction is either a data-handling problem upstream or an attempt to edit history.

  - key: queue
    name: Queue
    description: A named destination for tickets, with who watches it, what it accepts and what happens when nobody is watching.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true}
      - {key: is_default, type: bool, req: true, default: false, note: 'exactly one queue per tenant is the default, and it is where anything unroutable lands rather than nowhere'}
      - {key: watcher_role_keys, type: json, req: true, note: 'flat list of role keys whose holders see this queue. Roles rather than people, per kernel K10 - a queue watched by a named person dies when that person leaves'}
      - {key: accepts_categories, type: json, nullable: true, note: flat list of category keys. Null means anything}
      - {key: accepts_locations, type: json, nullable: true}
      - {key: business_hours_calendar_ref, type: uuid, nullable: true, note: 'the calendar response targets are measured against for this queue, resolved through the location_calendar port'}
      - {key: fallback_queue_id, type: uuid, nullable: true, fk: queue, note: 'where tickets go when nobody here responds within the queue''s own threshold'}
      - {key: auto_assign_strategy, type: enum, values: [none, round_robin, least_loaded, first_claim], req: true, default: none, note: none is the default deliberately. Automatic assignment to somebody who is unavailable is worse than a visible unassigned queue}
    invariants:
      - Exactly one queue per tenant has is_default true, enforced at write. A tenant with no default queue silently drops anything unroutable, and a tenant with two has a routing outcome nobody can predict.
      - watcher_role_keys may not be empty. A queue nobody watches is a place tickets go to be forgotten, and the emptiness is detectable at configuration time rather than at 3am.
      - fallback_queue_id may not create a cycle among queues, checked at write.
      - A queue may not be deleted while any non-terminal ticket references it. It is retired, and its tickets are moved explicitly.
    states: [active, retired]
    initial_state: active
    transitions:
      - {from: active, to: retired, action: retire_queue, actor: supervisor or ops_manager, guard: 'no non-terminal ticket references it, or every one has been moved, and it is not the default queue', side_effects: 'removed from routing, historical tickets still resolve', reversibility: false}
    stuck_state_policy:
      active: >
        The monitored conditions are about the queue rather than its tickets. (a) A queue whose
        watcher roles currently have no active holder - nobody is watching, which is invisible
        from inside any individual ticket. Told: ops_manager, immediately on the condition
        arising rather than on a timer, because it arises the moment somebody leaves. (b) A
        queue whose oldest untriaged ticket exceeds the triage target by
        queue_backlog_multiple (default 3). Told: the watchers and the supervisor. (c) A
        default queue receiving more than default_queue_share of all tickets (default 0.3),
        which means routing rules are not matching and everything is falling through to the
        catch-all - a configuration problem that presents as a workload problem.
      retired: >
        Terminal. Retained so historical tickets resolve to where they were handled. Nothing
        pends.

  - key: ticket_category
    name: Category
    description: What a ticket is about, carrying the default priority, the target queue, the response targets and the conversion behaviour.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true}
      - {key: parent_category_id, type: uuid, nullable: true, fk: ticket_category}
      - {key: default_queue_id, type: uuid, nullable: true, fk: queue}
      - {key: default_priority, type: enum, values: [low, normal, high, urgent], req: true, default: normal}
      - {key: first_response_target_minutes, type: int, nullable: true}
      - {key: resolution_target_minutes, type: int, nullable: true}
      - {key: converts_to_work_type_ref, type: uuid, nullable: true, note: 'what kind of work this category typically becomes, resolved through the work_generation port'}
      - {key: requires_subject, type: bool, req: true, default: false}
      - {key: owner_principal_id, type: uuid, nullable: true, note: 'who is accountable for the quality of outcomes in this category, which is who hears about a reopen chain'}
      - {key: reporter_selectable, type: bool, req: true, default: true, note: whether a reporter may choose it. Some categories are staff-only classifications and offering them to reporters produces mis-categorised tickets that route badly}
    invariants:
      - Category depth is bounded at category_max_depth and may not contain a cycle.
      - first_response_target_minutes and resolution_target_minutes are advisory here; where an sla_contract applies, the contract governs and the difference between the two is reported rather than silently resolved.
      - A category with converts_to_work_type_ref set requires the work_generation port to be bound before it can be selected, checked at configuration rather than at conversion.
    states: [active, retired]
    initial_state: active
    transitions:
      - {from: active, to: retired, action: retire_category, actor: supervisor or ops_manager, guard: no non-terminal ticket references it and no child category is active, side_effects: 'removed from pickers, historical tickets still resolve', reversibility: false}
    stuck_state_policy:
      active: >
        Monitored exceptions. (a) A category whose reopen rate exceeds
        category_reopen_alert (default 0.15) over a quarter - the resolutions in this category
        are not sticking, which is the most actionable quality signal a helpdesk produces.
        Told: the category owner and ops_manager. (b) A category whose own targets differ from
        the applicable contract targets, which means somebody is measured against one number
        and promised another. Told: the category owner and the contract owner. (c) A category
        used on fewer than category_floor of tickets (default 0.005) over a year, which is
        clutter in a picker that a reporter has to read.
      retired: >
        Terminal. Retained. Nothing pends.

ports:
  - port_key: measurable_event
    direction: provides
    contract: Emit ticket lifecycle events a service level measures against - raised, first response, resolved, reopened - with the category, the location and the priority.
    cardinality: zero_or_many

  - port_key: party_directory
    direction: requires
    contract: Resolve the reporter to a display name, their contactable channels with consent, their entitlement and their permission scope.
    cardinality: zero_or_one
    unbound_behaviour: >
      Reporters are a raw contact string with no consent record and no history. Replies still
      go back to the address the report came from, which is the essential behaviour. What is
      lost is entitlement checking, reporter history and any contract-based routing, and a
      reporter cannot be recognised across two reports.

  - port_key: sla_clock
    direction: requires
    contract: Start, pause, resume and stop clocks for first response and resolution against a contract target, and report the breach position.
    cardinality: zero_or_one
    unbound_behaviour: >
      Category targets are used as advisory internal goals. Nothing breaches, nothing escalates
      contractually, and timestamps are recorded throughout so targets can be applied
      retroactively. The surface shows targets as internal goals rather than as commitments,
      because presenting an internal goal as a contractual promise is how a helpdesk report
      becomes evidence against the tenant.

  - port_key: work_generation
    direction: requires
    contract: Raise a unit of work of a stated type against a subject and location, and report its progress and completion back.
    cardinality: zero_or_one
    unbound_behaviour: >
      Tickets are resolved by conversation alone. Anything requiring a visit is tracked in the
      ticket body, which works for an advisory helpdesk and not for one whose tickets become
      site visits. The category configuration refuses conversion settings while unbound, so the
      limitation surfaces at configuration rather than at 8am with a reporter waiting.

  - port_key: work_subject
    direction: requires
    contract: Resolve a subject reference to a label, a location and a state, so a ticket can be about a specific thing.
    cardinality: zero_or_one
    unbound_behaviour: Tickets carry no subject and are about a location or nothing. Categories requiring a subject cannot be used, and history-by-subject - the question of whether this thing has broken before - is unavailable.

  - port_key: org_structure
    direction: requires
    contract: Resolve locations, queue scoping and the business-hours calendar for response measurement.
    cardinality: zero_or_one
    unbound_behaviour: 'Tickets carry no location, queues cannot be scoped by location, and response targets are measured in wall time rather than business hours. The last of these silently makes every target roughly three times harder, and it is stated on every measurement rather than assumed.'

  - port_key: customer_surface
    direction: requires
    contract: Expose a ticket to its reporter, accept replies, confirmations and reopens from them, and show them their own history.
    cardinality: zero_or_one
    unbound_behaviour: >
      Reporters interact only through whatever channel they used. They cannot see status,
      cannot confirm a resolution and cannot reopen in the system, so the confirmation window
      closes on silence and reopens arrive as new tickets by telephone. Every reopen metric
      under-reports by an unknown amount, which is stated rather than left to be inferred.

  - port_key: notification
    direction: requires
    contract: Deliver acknowledgements, updates, chases, resolutions and reopens across the reporter's consenting channels, and internal alerts to queues and assignees.
    cardinality: zero_or_one
    unbound_behaviour: 'Nothing is sent and nothing is received. A helpdesk with no notification provider accepts tickets raised by staff, works them in the console and communicates outside the system, which loses the correspondence record that is most of the value.'

  - port_key: evidence_capture
    direction: requires
    contract: Store and resolve attachments on messages, including photographs sent by reporters.
    cardinality: zero_or_one
    unbound_behaviour: Attachments cannot be stored. Reporters describing a problem in words rather than showing it makes triage materially harder, and it is not a blocker.

actions:

  - key: raise_ticket
    entity: ticket
    label: Report something
    actors: [consumer, customer_contact, employee, supervisor, integration_principal]
    rationale: >
      The front door. It must accept anything from anywhere, including reports with no
      category, no location, no identifiable reporter and no coherent description, because the
      alternative is a telephone call that appears in no report at all.
    preconditions: [the tenant is not suspended, a subject line or a body is present]
    inputs: [subject, body, reporter_party_ref, reporter_contact_raw, channel, location_ref, subject_ref, category_id, stated_priority, attachment_refs]
    creates: [ticket, an inbound ticket_message carrying the original report verbatim]
    updates: []
    events: [ticket.raised]
    notifications:
      - {to: 'the resolved queue''s watchers', channel: in_app_and_push, when: always, template: new_ticket, must_include: [reference, subject, priority, reporter], batching_policy: 'digest per queue per configured interval, except urgent which is immediate'}
      - {to: the reporter, channel: 'the channel they used, or their consenting channel', when: the tenant sends acknowledgements, template: ticket_acknowledged, must_include: [reference, how_to_add_information], cost_class: utility, note: this acknowledgement explicitly does NOT count as the first response}
    undoable: true
    reversal_action: merge_ticket as a duplicate, or resolve with kind withdrawn_by_reporter
    audit_class: always
    idempotency_key_source: >
      channel plus the inbound provider message id where one exists, otherwise
      reporter_contact_raw plus a hash of the subject and body plus the hour bucket. The
      provider-id form is what stops a mail retry creating four tickets for one report, which
      is the most common duplicate on a helpdesk.
    offline_policy: queue
    concurrency: >
      Tickets do not contend. Two reports of the same matter both become tickets and are merged
      by a person, deliberately, because two reports of one symptom are sometimes two matters
      and only a human can tell.
    failure_modes:
      - {code: E_VALIDATION, cause: neither subject nor body present, message: Say what the problem is., note: 'the only refusal on this path, and even it accepts a subject alone or a body alone'}
      - {code: E_PRECONDITION, cause: the chosen category requires a subject and none is supplied, message: null, note: 'the ticket is CREATED without the category rather than refused, and triage sets it. Refusing a report because a classification is incomplete is exactly the behaviour that sends people to the telephone'}
      - {code: E_RATE_LIMIT, cause: more than raise_burst per source per hour, message: Too many attempts. Try again shortly., note: 'catches a mail loop, which otherwise produces thousands of tickets overnight. The limit is per source address and generous enough that a genuine reporter never meets it'}
      - {code: E_QUOTA, cause: open ticket limit reached, message: Plan limit reached.}
      - {code: E_DEPENDENCY, cause: the party directory is bound but unavailable, message: null, note: 'the ticket is CREATED with the raw contact and no party match, and matching is retried. A report must never be lost because a directory is down'}
    edge_cases:
      - An automated message loop - an out-of-office replying to an acknowledgement which triggers another acknowledgement. Caught by the rate limit and by never acknowledging a message whose headers indicate it is automated. This single behaviour prevents the classic overnight helpdesk flood.
      - A reporter stating that everything is urgent. Recorded as priority_source=reporter_stated, and the effective priority is whatever the category or rule says unless a person overrides it. Treating a stated urgency as the actual priority means every ticket is urgent within a month and the field stops meaning anything.
      - A report arriving from an address matching two parties. No party is matched and the raw contact is retained. Guessing between two parties produces a ticket visible to the wrong customer, which is a disclosure rather than an inconvenience.
      - A monitoring signal raising a ticket automatically. Fully supported through channel=monitoring_signal, and idempotent on the signal's own identifier so that a flapping condition produces one ticket rather than one per flap. The ticket carries the signal's own recovery notification when it clears, and does not auto-resolve - a condition clearing is not the same as somebody having dealt with it.
      - A walk-in report typed by staff on behalf of somebody. reporter_party_ref is the reporter and the author of the inbound message is the staff member, so the correspondence reads correctly and the response-time measurement still starts from the report.

  - key: post_message
    entity: ticket_message
    label: Reply on a ticket
    actors: [employee, supervisor, consumer, customer_contact, integration_principal]
    rationale: >
      The correspondence is the record, and the single most damaging mistake available on a
      helpdesk is an internal note that reaches the reporter. Visibility is therefore mandatory
      with no default anywhere.
    preconditions: [the ticket is not merged, visibility is stated, an outbound message has a resolvable channel]
    inputs: [ticket_id, direction, visibility, body, channel, attachment_refs]
    creates: [ticket_message]
    updates: [ticket state where an inbound reply resumes it, first_response_at, clock position]
    events: [ticket.message_posted, ticket.first_response_recorded]
    notifications:
      - {to: the reporter, channel: 'the ticket''s channel or their consenting channel', when: the message is outbound and reporter_visible, template: ticket_update, cost_class: utility}
      - {to: the assignee, channel: in_app_and_push, when: the message is inbound, template: reporter_replied, mandatory_operational: true}
    undoable: false
    confirmation_specification: 'For any message marked reporter_visible, the compose surface states plainly who will receive it and on which channel, and the send control is visually distinct from the internal-note control. Required because the action is irreversible - a sent message cannot be recalled, and redaction removes the body from the record without removing it from the recipient.'
    audit_class: always
    idempotency_key_source: 'ticket_id plus author plus a hash of the body plus the minute bucket, or the provider message id for an inbound message. A double-tapped send produces one message, which matters because a duplicated reply reads as impatience'
    offline_policy: queue
    concurrency: >
      Messages are appended and do not contend. first_response_at is set by a conditional
      write on null, so two simultaneous replies cannot both claim it and the earliest wins.
      Where an internal note and an outbound reply are posted at the same moment, both persist
      and only the outbound one can set the first response.
    failure_modes:
      - {code: E_VALIDATION, cause: visibility not stated, message: Choose whether the customer sees this., note: 'refused rather than defaulted at every layer. This is the one field in the capability with no default anywhere, deliberately'}
      - {code: E_PRECONDITION, cause: no deliverable channel for an outbound reporter-visible message, message: There is no way to reach this reporter., note: 'the message is saved as an internal note with the reason, so the work of writing it is not lost'}
      - {code: E_PRECONDITION, cause: 'the reporter''s channel is suppressed or has withdrawn consent', message: This action is not available in the current state., note: saved as an internal note. Sending anyway would breach a withdrawal that this platform records elsewhere and must honour here}
      - {code: E_PRECONDITION, cause: the ticket is merged, message: This action is not available in the current state., note: 'names the target ticket, because the reply belongs there'}
      - {code: E_DEPENDENCY, cause: the notification provider is unavailable, message: null, note: the message COMMITS and delivery is queued. A reply lost because a provider was down is a reply the assignee believes they sent}
    edge_cases:
      - An internal note posted with reporter_visible by mistake. Not preventable by the model beyond making visibility mandatory and the two controls visually distinct. Redaction removes it from the record and cannot remove it from the recipient, and the model says so rather than implying otherwise.
      - An inbound reply arriving on a resolved ticket within the confirmation window. It reopens the ticket only where the tenant configures that; otherwise it posts and notifies the assignee without changing state. Automatic reopening on any inbound message is how a thank-you note reopens a closed ticket.
      - An inbound message from an address other than the reporter's - somebody copied in. Posted with the author party unmatched and flagged, and it does not resume a paused clock, because a third party replying is not the reporter responding.
      - A very long inbound thread quoting the entire history. Stored verbatim and rendered collapsed. Truncating inbound content loses the one line at the bottom that contains the actual answer.
      - An outbound message whose delivery fails after the ticket has been resolved on the strength of it. The failure is reported to the assignee and the ticket is NOT auto-reopened, because the resolution may well be correct and only the notification failed; but the resolution notification is retried on an alternative channel, because a reporter who never learns their ticket was resolved will raise another.

  - key: convert_to_work
    entity: ticket
    label: Turn a ticket into work
    actors: [employee, supervisor, dispatcher]
    rationale: >
      The boundary that stops the helpdesk becoming a second work management system. The
      ticket keeps the conversation and the promise to the reporter; the work capability owns
      scheduling, evidence and completion, and neither closes the other.
    preconditions: [the work_generation port is bound, a work type resolves from the category or is chosen, a location or subject is present]
    inputs: [ticket_id, work_type_ref, subject_ref, location_ref, priority, instructions]
    creates: [a work item through the work_generation port, an internal note recording the conversion]
    updates: [converted_work_refs]
    events: [ticket.converted_to_work]
    notifications:
      - {to: the reporter, channel: their consenting channel, when: the tenant tells reporters about scheduled work, template: work_arranged, must_include: [reference, what_happens_next], cost_class: utility}
      - {to: dispatcher, channel: in_app, when: always, template: work_from_ticket}
    undoable: true
    reversal_action: cancel the work item through the port, which does not close the ticket
    audit_class: always
    idempotency_key_source: 'ticket_id plus work_type_ref plus subject_ref. A double conversion produces one work item, which matters because two visits for one report is a wasted journey and an argument about which one to bill'
    offline_policy: refuse
    concurrency: The ticket row is locked while the work reference is appended, so two concurrent conversions produce one work item and the second caller is shown the existing reference rather than an error.
    failure_modes:
      - {code: E_PRECONDITION, cause: the work_generation port is unbound, message: This action is not available in the current state., note: 'the category configuration should already have prevented reaching here, and the check is repeated because a port can be unbound after configuration'}
      - {code: E_VALIDATION, cause: no work type resolves and none was chosen, message: Choose what kind of work is needed.}
      - {code: E_PRECONDITION, cause: the category requires a subject and none is present, message: Say what this is about.}
      - {code: E_DEPENDENCY, cause: the work capability is unavailable, message: A required service is unavailable., note: conversion is REFUSED rather than recorded optimistically. A ticket showing converted work that does not exist is a reporter who has been promised a visit nobody is arranging}
      - {code: E_QUOTA, cause: more than max_conversions_per_ticket, message: Plan limit reached., note: a ticket generating twenty work items is usually a mis-scoped report and is worth stopping to look at}
    edge_cases:
      - Converting one ticket into several work items - a report covering three separate problems. Supported, and each work reference is tracked. The ticket resolves only when the reporter is satisfied, not when the work completes, which is why the two are deliberately not coupled.
      - Work completing while the ticket is still awaiting the reporter. The ticket is not auto-resolved. Work being done and a reporter being satisfied are different facts, and a helpdesk that closes on the first produces a stream of reopens.
      - Converting a ticket whose reporter is a counterparty with a contract that makes the work chargeable. The chargeability flows from the work capability and its billing sink, not from here. The helpdesk records that work was raised and never decides what it is worth.
      - A ticket closed while its converted work is still open. Permitted and reported to the supervisor, because a reporter told their matter is closed while the visit is still outstanding will telephone and will be right to.
      - Conversion of a duplicate ticket that was later merged. The work reference travels to the merge target, so the surviving ticket carries the whole picture and the merged one records that it did so.

rules:
  - key: accept_everything
    kind: policy
    scope: capability
    overridable_at: null
    default: 'A report is refused only where it contains neither a subject nor a body. Missing category, location, subject, reporter identity and priority are all acceptable and are resolved at triage.'
    on_conflict: not overridable
    rationale: A front door that refuses malformed reports produces reports by telephone, and a telephone call appears in no report.

  - key: visibility_is_mandatory
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'ticket_message.visibility has no default at any scope and must be stated on every message.'
    on_conflict: not overridable
    rationale: An internal note reaching the reporter is the single most damaging mistake available on a helpdesk, and a default makes it a matter of habit rather than of choice.

  - key: automated_acknowledgement_is_not_a_first_response
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'counts_as_first_response is true only for an outbound, reporter-visible message authored by a principal.'
    on_conflict: not overridable
    rationale: A reporter can tell the difference between a machine and a person, and the metric exists to measure what they experience.

  - key: stated_priority_is_not_priority
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A reporter''s stated urgency is recorded as priority_source=reporter_stated and never sets the effective priority by itself.'
    on_conflict: not overridable
    rationale: Treating stated urgency as actual priority means every ticket is urgent within a month.

  - key: messages_are_immutable_and_redactable
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A sent message is never edited or deleted. Content that must be removed is redacted, retaining the fact of the message and its metadata.'
    on_conflict: not overridable

  - key: inbound_mail_never_drives_state_alone
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'An inbound message may only move awaiting_reporter to awaiting_assignee. No other state change is driven by inbound content, and messages identified as automated drive nothing.'
    on_conflict: not overridable
    rationale: An out-of-office reply reopening forty tickets is the classic failure of mail-driven helpdesks.

  - key: auto_resolution_only_on_reporter_silence
    kind: policy
    scope: capability
    overridable_at: tenant
    default: >
      The only automatic resolution permitted is no_response_from_reporter after
      awaiting_reporter_days with at most max_reporter_chases reminders, and the reporter is
      told and may reopen for the full reopen window. No other state auto-resolves at any age.
    on_conflict: most specific scope wins
    rationale: >
      An unbounded queue of tickets waiting on people who have moved on makes every other
      metric meaningless. The resolution kind preserves the distinction into every report, so
      nothing is disguised as a fix.

  - key: merged_tickets_contribute_no_measurement
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A merged ticket contributes no first-response or resolution measurement. The surviving ticket carries the earliest report time of the merged set.'
    on_conflict: not overridable
    rationale: Merging is otherwise the easiest way to make a response-time figure look better than it is.

policy_knobs:
  - {key: triage_target_minutes, default: 30, range: [1, 1440]}
  - {key: assignment_target_minutes, default: 60, range: [1, 2880]}
  - {key: stale_ticket_hours, default: 24, range: [1, 720]}
  - {key: reporter_chase_days, default: 3, range: [1, 60]}
  - {key: max_reporter_chases, default: 2, range: [0, 10]}
  - {key: awaiting_reporter_days, default: 10, range: [1, 180]}
  - {key: third_party_chase_days, default: 3, range: [1, 60]}
  - {key: confirmation_window_days, default: 5, range: [1, 90]}
  - {key: reopen_window_days, default: 30, range: [0, 365]}
  - {key: reopen_chain_alert, default: 1, range: [1, 10]}
  - {key: category_reopen_alert, default: 0.15, range: [0.01, 1.0]}
  - {key: category_floor, default: 0.005, range: [0.0, 1.0]}
  - {key: queue_backlog_multiple, default: 3, range: [1, 50]}
  - {key: default_queue_share, default: 0.3, range: [0.01, 1.0]}
  - {key: draft_message_stale_hours, default: 4, range: [1, 168]}
  - {key: delivery_confirm_hours, default: 2, range: [1, 72]}
  - {key: redaction_rate_alert, default: 0.01, range: [0.0001, 1.0]}
  - {key: category_max_depth, default: 3, range: [1, 6], lowest_settable_scope: kernel}
  - {key: max_conversions_per_ticket, default: 10, range: [1, 100]}
  - {key: raise_burst_per_source_per_hour, default: 50, lowest_settable_scope: kernel}
  - {key: send_acknowledgement, default: true}
  - {key: inbound_reply_reopens_resolved, default: false}

open_questions:
  - {q: 'Should the first-response measurement stop at the first human reply regardless of content, or only at a substantive one? Measuring any reply is objective and is trivially gamed by a one-word acknowledgement, which is what happens the week after the metric is published.', assumption: Any principal-authored reporter-visible message. Objective and gameable., confidence: VALIDATION_REQUIRED, method: operator interviews plus observation of what reporters actually experience as a response, priority: High, blocks: [first response metric definition, sla_contract measure_kind semantics]}
  - {q: 'Should the reporter see the internal notes on their own ticket if they request their data? The messages are about them and were written on the understanding that they were internal, and both readings are defensible.', assumption: None. The model marks visibility per message and takes no position on a subject-access request., confidence: VALIDATION_REQUIRED, method: legal review alongside the erasure and retention questions raised by core_audit, priority: High, blocks: [core_audit erasure question, customer_surface projection]}
  - {q: 'Is auto-resolution on reporter silence acceptable to counterparties whose contracts include response obligations? The model permits exactly one automatic resolution and it may still amount to closing a matter the counterparty considers open.', assumption: Permitted with the distinct resolution kind and a reopen window. Not validated against any actual contract., confidence: VALIDATION_REQUIRED, method: contract review with a pilot customer, priority: High}
  - {q: 'How should a ticket relate to a contract when the reporter is a contact at an organisation with several contracts and several sites? Entitlement, targets and chargeability may all differ, and the model resolves a single contract through the party directory without saying how the ambiguity is broken.', assumption: None., confidence: VALIDATION_REQUIRED, method: operator interviews with a business serving multi-site counterparties, priority: High, blocks: [sla_contract scope resolution, chargeability]}
  - {q: 'Should routing rules be expressible by tenants as expressions, or only as category-and-location mappings? Expressions route better and produce a routing_explanation nobody can read, which is precisely the failure the explanation field exists to prevent.', assumption: Category and location mappings only. Expression-based routing is deliberately absent., confidence: VALIDATION_REQUIRED, method: measure how many pilot tenants need routing the mappings cannot express, priority: Medium}
