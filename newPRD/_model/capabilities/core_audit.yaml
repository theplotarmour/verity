key: core_audit
name: Audit
layer: core
confidence: KNOWN
description: >
  The immutable record of what happened, who did it, from where, and what the data
  looked like before and after. Audit is not logging. Logging is for engineers and may
  be sampled, truncated and discarded. Audit is evidence, is never sampled, and its
  absence is itself a finding.

evidence_basis:
  - claim: Tamper evidence for an append-only record is achieved by hashing each record and periodically publishing a signed digest that also contains the signature of the previous digest, forming a chain of custody that makes retroactive modification detectable.
    sources:
      - "AWS CloudTrail log file integrity validation - built on SHA-256 for hashing and SHA-256 with RSA for signing; each hourly digest contains the hashes of the log files for that hour plus the digital signature of the previous digest file, creating a chain of custody. https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html"
      - "Custom implementations of the same validation are documented, which is evidence the scheme is reproducible rather than proprietary. https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-custom-validation.html"
    confidence: KNOWN
    implication: Verity adopts the same shape - per-record hash, periodic signed digest chaining the previous digest - rather than inventing a scheme. A hash chain alone proves internal consistency; it does not prove the chain was not rebuilt wholesale, which is what the periodic signature and external anchoring address.

principles:
  - An audit row is written in the same transaction as the change it records. An audit write that can fail independently of the business write produces a system whose audit trail is a suggestion.
  - Audit rows are append-only. There is no update path and no delete path exposed to any principal, including platform_operator. Retention expiry is executed by a job that is itself audited.
  - Reading the audit is itself an audited act. An investigator browsing an audit trail leaves a trace, because otherwise the audit trail cannot answer who looked at whose records.
  - Audit is permission-projected on read but never on write. A field the reader cannot see is omitted from the rendered row, but it was recorded. Redacting at write time would mean the tenant can configure their way out of having evidence.
  - The audit trail records the actor AND the authority under which they acted - the role binding, the delegation, the impersonation grant. Actor alone is insufficient - "the manager approved it" and "somebody covering for the manager approved it" are different facts.

entities:

  - key: audit_record
    name: Audit Record
    description: One immutable statement that something happened.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true, note: uuid v7 so that the primary key is time-ordered and the table is append-friendly without a separate sequence}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: audit_class, type: enum, values: [always, read_sensitive_only, security], req: true, immutable: true}
      - {key: actor_type, type: enum, values: [user, service_account, system_scheduler, external_webhook], req: true, immutable: true}
      - {key: actor_principal_id, type: uuid, nullable: true, immutable: true, note: resolved through the principal_directory port; null for system_scheduler}
      - {key: authority_kind, type: enum, values: [role_binding, delegation, impersonation, system, integration_credential], req: true, immutable: true, note: 'the answer to "under what authority", which actor alone does not give'}
      - {key: authority_ref, type: uuid, nullable: true, immutable: true, note: 'the binding, delegation or impersonation grant id, resolved through the authorization_decision port'}
      - {key: on_behalf_of_principal_id, type: uuid, nullable: true, immutable: true, note: the delegator or the impersonated principal; non-null exactly when authority_kind is delegation or impersonation}
      - {key: verb, type: enum, req: true, immutable: true, note: from the closed vocabulary verb set}
      - {key: capability_key, type: string, req: true, immutable: true}
      - {key: entity_key, type: string, req: true, immutable: true}
      - {key: subject_id, type: uuid, nullable: true, immutable: true, note: 'null for actions whose subject is the tenant itself, such as a configuration change'}
      - {key: subject_label_at_time, type: string, nullable: true, immutable: true, note: 'a denormalised human label captured at write time. Deliberately frozen - resolving the label at read time would show the CURRENT name, which is how an audit trail quietly rewrites history when a record is renamed'}
      - {key: before, type: json, nullable: true, immutable: true, note: present for the always and security classes on any state change or field change; absent for creates}
      - {key: after, type: json, nullable: true, immutable: true, note: absent for deletes}
      - {key: changed_field_keys, type: json, nullable: true, immutable: true, note: extracted at write time so that the common query - who touched this field - does not require scanning json}
      - {key: reason, type: text, nullable: true, immutable: true, note: 'required by the verb where the vocabulary marks it so, for example a rejected approval'}
      - {key: source, type: enum, values: [ui_web, ui_mobile, offline_replay, api, automation_rule, scheduler, integration], req: true, immutable: true}
      - {key: correlation_id, type: uuid, req: true, immutable: true}
      - {key: causation_id, type: uuid, nullable: true, immutable: true}
      - {key: occurred_at, type: timestamptz, req: true, immutable: true, note: 'business time - when the actor says it happened, which for an offline replay is when they did it on the device'}
      - {key: recorded_at, type: timestamptz, req: true, immutable: true, note: system time - when the server accepted it. The two differ on offline replay and the gap is itself evidence}
      - {key: ip, type: inet, nullable: true, immutable: true, sensitive: true}
      - {key: device_id, type: uuid, nullable: true, immutable: true, note: resolved through the principal_directory port}
      - {key: geo, type: geo_point, nullable: true, immutable: true, sensitive: true, note: 'captured only where the action declares evidence capture; never captured silently, because silent location capture of a workforce is both a legal and a trust problem'}
      - {key: record_hash, type: string, req: true, immutable: true, note: SHA-256 over the canonical serialisation of every other field in this row plus the previous row hash for this tenant}
      - {key: previous_record_hash, type: string, nullable: true, immutable: true, note: null only for the first row of a tenant}
      - {key: retention_class, type: enum, values: [audit_2y, audit_7y, legal_hold], req: true, note: 'derived from audit_class at write time and mutable ONLY by a legal hold, which is the single exception to immutability on this entity and is itself audited'}
    invariants:
      - No update path and no delete path is exposed for any field except retention_class, and that field may only move toward legal_hold or back to its derived value when the hold is released.
      - on_behalf_of_principal_id is non-null exactly when authority_kind is delegation or impersonation. Any other combination is a modelling error and is rejected at write time.
      - before and after are recorded as the raw stored values, never as the permission-projected values. Projection happens on read. Recording the projection would mean the evidence depends on who happened to be looking when it was written.
      - The audit write participates in the same database transaction as the business write. There is no queue, no fire-and-forget and no best-effort path.
      - record_hash is computed over a canonical serialisation with a declared field order and a declared null encoding. An undeclared serialisation makes the chain unverifiable by anyone but the writer, which defeats its purpose.
    states: [recorded, sealed, held, expired]
    initial_state: recorded
    transitions:
      - {from: recorded, to: sealed, action: seal_digest, actor: system_scheduler, guard: the row is included in a published signed digest, side_effects: the row becomes independently verifiable by any holder of the public key, reversibility: false}
      - {from: recorded, to: held, action: apply_legal_hold, actor: tenant_owner or platform_operator, guard: a hold reference is supplied, side_effects: 'retention_class set to legal_hold, the row is exempt from the retention job', reversibility: true}
      - {from: sealed, to: held, action: apply_legal_hold, actor: tenant_owner or platform_operator, guard: as above, side_effects: as above, reversibility: true}
      - {from: held, to: sealed, action: release_legal_hold, actor: tenant_owner or platform_operator, guard: the hold reference is closed and the releasing principal is not the subject of the hold, side_effects: retention_class returns to its derived value, reversibility: false}
      - {from: sealed, to: expired, action: expire_by_retention, actor: system_scheduler, guard: 'now > recorded_at + retention years for the class, and the row is not held', side_effects: 'the row content is destroyed and a tombstone carrying only the id, the hash and the expiry job reference remains, so the chain still verifies', reversibility: false}
    stuck_state_policy:
      recorded: >
        A row that is never sealed cannot be independently verified, so a backlog here is a
        loss of evidentiary quality rather than a loss of data. Threshold: any row unsealed
        for longer than four digest intervals (digest_interval_minutes, default 60). Told:
        platform_operator, because digest publication is platform machinery and a tenant
        can do nothing about it. Escape hatch: run the digest job manually. The audit
        remains readable and admissible-as-internal-record throughout; what is lost while
        the backlog persists is the ability to prove the chain to a third party.
      sealed: >
        The normal steady state for the whole retention period. The monitored exception is
        a verification failure - a periodic re-verification sweep recomputes hashes over a
        sample and over the full chain on a slower cadence. A mismatch is the single
        highest-severity alert the platform can raise, goes to platform_operator and to the
        affected tenant_owner simultaneously, and is deliberately not suppressible or
        snoozable. Escape hatch: none. A hash mismatch is not a thing to be dismissed; it
        is either a storage fault or an intrusion, and both require a human.
      held: >
        A legal hold with no end is how an audit archive becomes permanently unmanageable
        and how a data-subject erasure request becomes impossible to answer. Threshold:
        hold_review_days (default 180). Told: the principal who applied the hold and
        tenant_owner. Escape hatch: release_legal_hold. Verity never auto-releases a hold -
        an automatic release is a spoliation risk - but it never stops asking either.
      expired: >
        Terminal. The tombstone is retained permanently so the hash chain still verifies
        across the gap; a chain with a hole in it cannot be distinguished from a chain
        somebody cut. Nothing pends.

  - key: audit_digest
    name: Audit Digest
    description: A periodically published, signed summary of a window of audit records, chaining the previous digest. This is what makes tamper evidence provable to a third party rather than merely asserted.
    owner: platform
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: window_start, type: timestamptz, req: true, immutable: true}
      - {key: window_end, type: timestamptz, req: true, immutable: true}
      - {key: record_count, type: bigint, req: true, immutable: true}
      - {key: first_record_hash, type: string, req: true, immutable: true}
      - {key: last_record_hash, type: string, req: true, immutable: true}
      - {key: merkle_root, type: string, req: true, immutable: true, note: 'over the record hashes in the window, so a single row can be proved to belong to the window without disclosing the rest of the window'}
      - {key: previous_digest_signature, type: string, nullable: true, immutable: true, note: null only for the first digest of a tenant; this is the field that makes the digests a chain rather than a set}
      - {key: signature, type: string, req: true, immutable: true}
      - {key: signing_key_id, type: string, req: true, immutable: true}
      - {key: published_at, type: timestamptz, req: true, immutable: true}
      - {key: external_anchor_ref, type: string, nullable: true, immutable: true, note: an optional reference to a location outside Verity control where the digest was also published; without an external anchor the chain proves internal consistency only}
    invariants:
      - Digests are never regenerated. A failed digest run produces a NEW digest covering the extended window, never a replacement for the failed one, because a replaceable digest is not evidence.
      - The signing key is held outside the application's own credential store and is never accessible to any tenant principal or to application code paths that can write audit rows. A system that can both write the record and sign the proof proves nothing.
      - window_end of digest N equals window_start of digest N+1 exactly. Gaps and overlaps both break verification and are detected by the verification sweep.
    states: [published, verified, failed_verification]
    initial_state: published
    transitions:
      - {from: published, to: verified, action: verify_digest, actor: system_scheduler, guard: recomputed merkle root and chained signature both match, side_effects: verification timestamp recorded, reversibility: true}
      - {from: verified, to: failed_verification, action: verify_digest, actor: system_scheduler, guard: any recomputation mismatches, side_effects: highest-severity alert raised to platform_operator and tenant_owner, reversibility: false}
      - {from: published, to: failed_verification, action: verify_digest, actor: system_scheduler, guard: any recomputation mismatches, side_effects: as above, reversibility: false}
    stuck_state_policy:
      published: >
        A digest that is published but never verified means nobody has checked the chain.
        Threshold: verification_lag_hours (default 24). Told: platform_operator. Escape
        hatch: run verification manually. Verification is deliberately a separate scheduled
        job from publication and ideally runs under different credentials, because a single
        process that both publishes and verifies is checking its own homework.
      verified: >
        Steady state. Re-verified on a rolling cadence - full_chain_verify_days (default 7)
        for the recent window, and the entire chain on a monthly cadence. A digest that has
        not been re-verified within twice its cadence is reported as unverified rather than
        assumed good, because "it verified once, months ago" is a weaker statement than
        most people reading a green tick will assume.
      failed_verification: >
        This is an incident, not a queue. There is no timeout and no escalation ladder,
        because escalation is immediate and to the top on entry. The state persists until a
        human closes the incident with a recorded finding. The escape hatch is deliberately
        manual and deliberately effortful.

  - key: legal_hold
    name: Legal Hold
    description: A named, referenced, time-bounded suspension of retention expiry over a defined set of audit records and the entities they concern.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: reference, type: string, req: true, note: 'the external matter reference - a case number, a regulator notice, an internal investigation id'}
      - {key: scope_expression, type: text, req: true, note: 'an Expression selecting the records under hold - by subject, by actor, by capability, by date window; statically cost-bounded like every other expression'}
      - {key: applied_by_principal_id, type: uuid, req: true, note: resolved through the principal_directory port}
      - {key: applied_at, type: timestamptz, req: true, immutable: true}
      - {key: expected_release_at, type: timestamptz, nullable: true}
      - {key: released_at, type: timestamptz, nullable: true}
      - {key: released_by_principal_id, type: uuid, nullable: true}
      - {key: release_reason, type: text, nullable: true}
      - {key: affected_record_count, type: bigint, note: computed at apply time and recomputed on each review}
    invariants:
      - The principal who applies a hold may not release it if they are also within its scope_expression as an actor. Self-releasing a hold over one's own actions is the exact scenario the control exists to prevent.
      - A hold may widen but may never narrow while active. Narrowing is release plus re-apply, so the audit shows records leaving the hold rather than showing a hold quietly shrinking.
      - Applying a hold never modifies the held records other than their retention_class. A hold that rewrote records would destroy the thing it is protecting.
    states: [active, under_review, released]
    initial_state: active
    transitions:
      - {from: active, to: under_review, action: observe_hold_review_due, actor: system_scheduler, guard: 'now > applied_at + hold_review_days, or now > expected_release_at', side_effects: notification to the applier and tenant_owner, reversibility: true}
      - {from: under_review, to: active, action: confirm_hold, actor: tenant_owner or the applying principal, guard: reason supplied, side_effects: review clock reset, reversibility: true}
      - {from: active, to: released, action: release_legal_hold, actor: tenant_owner or platform_operator, guard: 'releaser is not within scope_expression as an actor, and a release reason is supplied', side_effects: held records return to their derived retention class and become eligible for expiry, reversibility: false}
      - {from: under_review, to: released, action: release_legal_hold, actor: tenant_owner or platform_operator, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      released: >
        Terminal. The hold is over and the records it covered have returned to their derived
        retention class, which means the retention job may now expire them. Nothing pends.
        The row is retained permanently as the record of what was held, by whom, for which
        matter and for how long, because that is what a later dispute asks about.
      active: >
        Reviewed at hold_review_days (default 180), which moves it to under_review rather
        than releasing it. Told: the applier and tenant_owner. There is no automatic
        release at any threshold.
      under_review: >
        A review nobody answers is the normal failure. Threshold: hold_review_grace_days
        (default 30), after which it escalates to tenant_owner weekly and appears in the
        tenant health surface. Escape hatch: confirm_hold or release_legal_hold. The hold
        remains fully in force throughout - an unanswered review never weakens the hold,
        because the consequence of accidental deletion is unrecoverable and the consequence
        of over-retention is storage cost.

ports:
  - port_key: principal_directory
    direction: requires
    contract: Resolve an actor reference to a display name and status, and resolve a device reference to a label, for rendering an audit row that is readable years after the person left.
    cardinality: exactly_one
    unbound_behaviour: >
      FORBIDDEN. An audit trail that cannot name the actor is not an audit trail. Note that
      resolution failure at READ time - the principal was deleted by a retention job - is a
      different matter and is handled by subject_label_at_time-style denormalisation on the
      actor as well.

  - port_key: authorization_decision
    direction: requires
    contract: Given an audit row and a reader, return which fields of before and after the reader may see, and whether the reader may see the row at all.
    cardinality: exactly_one
    unbound_behaviour: >
      FORBIDDEN. Without permission projection the audit trail becomes the platform's
      largest data-exfiltration surface - it contains the before and after of every field
      including the ones the reader is gated out of.

  - port_key: audit_sink
    direction: provides
    contract: >
      Accept an audit record within the caller's transaction. The contract is deliberately
      synchronous and transactional. A provider that accepts asynchronously does not satisfy
      it, and this is what conformance test PC-01 checks.
    cardinality: exactly_one

  - port_key: audit_query
    direction: provides
    contract: A permission-projected, paginated, filterable read over audit records, plus an export path that is itself audited.
    cardinality: exactly_one

  - port_key: evidence_capture
    direction: requires
    contract: Resolve a reference to a captured photo, signature, scan or geolocation so that an audit row concerning an evidenced action can link to the evidence rather than duplicate it.
    cardinality: zero_or_one
    unbound_behaviour: Audit rows record that evidence was declared and record its content hash, but cannot render or link it. The hash is still recorded, so evidence produced later can be matched against what was claimed at the time.

  - port_key: notification
    direction: requires
    contract: Deliver verification-failure and hold-review messages.
    cardinality: zero_or_one
    unbound_behaviour: >
      Alerts are written to the platform health surface and to the tenant health surface
      and are not delivered to a channel. Verification failure is deliberately NOT
      swallowed - if it cannot be delivered it is escalated by making the tenant's audit
      surface display it persistently until acknowledged.

actions:

  - key: write_audit_record
    confirmation_specification: 'None. There is no human in this path - every call originates from another capability''s write. The kernel K06 requirement is met by a stronger control than a confirmation: an audit write that cannot happen rolls back the business write.'
    entity: audit_record
    label: Record that something happened
    actors: [system, integration_principal]
    rationale: >
      Modelled as an explicit action because its transactional and hashing semantics are
      product commitments, not implementation detail. Every other capability's audit_class
      declaration resolves to a call to this action.
    preconditions: [the calling business write is inside an open transaction, audit_class is supplied, actor and authority are resolved]
    inputs: [audit_class, actor, authority, verb, capability_key, entity_key, subject_id, before, after, reason, source, correlation_id, causation_id, occurred_at, ip, device_id, geo]
    creates: [audit_record]
    updates: []
    events: []
    notifications: []
    undoable: false
    audit_class: always
    idempotency_key_source: 'correlation_id plus verb plus subject_id plus a monotonic sequence within the transaction. A retried transaction that rolls back leaves no audit row, and a retried transaction that commits writes exactly one, because the audit row commits with it.'
    offline_policy: queue
    concurrency: >
      The hash chain requires a total order per tenant, which is a serialisation point. It
      is taken per tenant rather than globally, so one busy tenant cannot stall another.
      Rows arriving concurrently within a tenant are ordered by the sequence assigned inside
      the chaining lock; the lock is held for the hash computation only, not for the
      business transaction. Under sustained contention the chain is segmented by tenant and
      by day, with each segment's first row chaining the previous segment's last, which
      bounds the contention without breaking verification.
    failure_modes:
      - {code: E_INTERNAL, cause: the audit write fails for any reason, message: Something went wrong. The team has been notified., note: 'THE BUSINESS TRANSACTION ROLLS BACK. This is the single most consequential decision in this capability - an action that cannot be recorded does not happen. The alternative, committing the business write and losing the audit row, produces a system whose audit trail silently has holes exactly where something went wrong'}
      - {code: E_VALIDATION, cause: on_behalf_of_principal_id present without a delegation or impersonation authority_kind, message: null, note: 'internal contract violation, raised to platform_operator'}
      - {code: E_PRECONDITION, cause: called outside a transaction, message: null, note: 'a programming error, caught in test rather than in production, and the reason the port contract specifies synchronous transactional delivery'}
    edge_cases:
      - "Offline replay: occurred_at is the device's claimed business time, recorded_at is server time, and source is offline_replay. The gap between them is retained and is queryable, because a fortnight-old attendance record arriving in one burst is the shape of a fraud pattern and the shape of a phone that was broken. Verity records the fact and does not judge it."
      - A device clock claiming an occurred_at in the future. Recorded as claimed, flagged with a clock_skew marker computed against recorded_at, and never silently corrected. Correcting it would destroy the only evidence that the device's clock was wrong.
      - A high-volume automation writing thousands of rows in one transaction, for example a bulk import. Rows are chained in a single pass inside the transaction and one digest window absorbs them. The audit query surface must therefore support collapsing a correlation_id into one summary row that expands, or a bulk import makes the audit trail unreadable for that day.
      - A field marked sensitive appears in before and after. It is recorded in full. Projection happens on read. This is stated explicitly because the instinct to redact at write time is strong and is wrong.
      - An action whose subject is deleted later by a retention job. subject_label_at_time preserves the human meaning of the row. The audit row is never cascade-deleted - stated in the kernel's deletion semantics and restated here because it is the single most common thing an implementer gets wrong.
      - Two capabilities recording the same business event from both sides, for example a work order completion and a billing event. Both rows are written and share a correlation_id. Deduplicating them would lose the fact that two different subsystems observed it.

  - key: query_audit
    notifications: []
    confirmation_specification: 'None. The only thing this action creates is the audit row recording the read, and confirming a search box would make the audit surface unusable. The controls here are the rate limit and the fact that the read is itself recorded.'
    entity: audit_record
    label: Search the audit trail
    actors: [auditor, tenant_owner, tenant_admin, platform_operator, platform_support]
    preconditions: [the reader holds view on audit_record at a scope, the query declares a bounded time window]
    inputs: [time_window, actor_filter, subject_filter, capability_filter, verb_filter, field_filter, free_text, cursor]
    creates: [audit_record_of_the_read_itself]
    updates: []
    events: []
    undoable: false
    audit_class: security
    idempotency_key_source: 'not applicable - a read. The audit row recording the read is keyed on the request correlation_id.'
    offline_policy: read_only
    concurrency: Reads never block writes. The query runs against a read path that cannot take a lock the writer needs, because an investigator running a wide query must never be able to stall the transactions being audited.
    failure_modes:
      - {code: E_VALIDATION, cause: 'unbounded time window, or a window wider than max_query_window_days', message: Choose a date range of at most N days., note: 'an unbounded audit query on a large tenant is a denial of service against that tenant''s own database'}
      - {code: E_AUTHZ_SCOPE, cause: 'the reader''s scope excludes the subject', message: Not found., note: 'rows outside scope are omitted from results entirely; the result count must not reveal how many were omitted, so counts are also projected'}
      - {code: E_RATE_LIMIT, cause: export-shaped querying - repeated wide queries paginating an entire history, message: Too many attempts. Try again shortly., note: 'this pattern is exfiltration wearing a search box, and the rate limit is the control. Legitimate bulk access is export_audit, which is separately gated and separately notified'}
      - {code: E_INTERNAL, cause: projection cannot be computed because the authorization_decision port is unavailable, message: A required service is unavailable., note: FAILS CLOSED. No rows are returned unprojected}
    edge_cases:
      - The reader can see a row but not one of its changed fields. The row is returned with that key absent from before and after, and changed_field_keys still lists the key. This is deliberate - knowing THAT a salary changed is a different disclosure from knowing what it changed to, and an auditor needs the former.
      - An auditor with tenant scope querying actions performed by platform_support under impersonation. Fully visible, including the ticket reference. Support access that a customer cannot audit is not support access.
      - Querying an actor who has since been deactivated. The row still renders with the actor's name as recorded. The current status is shown alongside as no-longer-active, not substituted for the historical name.
      - A query whose free-text term matches content inside a before or after payload the reader cannot see. The row must not match. Matching would turn the search box into an oracle for reading gated fields one guess at a time.
      - Querying across a retention boundary. Expired rows return as tombstones showing that a row existed and was expired by which job, never as an empty result, because an empty result is indistinguishable from nothing having happened.

  - key: export_audit
    confirmation_specification: 'Modal stating the row count, the window, which fields will be withheld and under which gate, and that the workspace owner will be told. Requires typing the stated purpose. Required because an export leaves the system and cannot be recalled.'
    entity: audit_record
    label: Export audit records
    actors: [auditor, tenant_owner, platform_operator]
    rationale: An auditor's deliverable is usually a file handed to somebody outside the system. Forcing that through screenshots is how evidence loses its integrity.
    preconditions: [acting session is elevated, a bounded time window, a stated purpose]
    inputs: [time_window, filters, format, purpose, include_digest_proof]
    creates: [export_job, audit_record_of_the_export]
    updates: []
    events: [audit.exported]
    notifications:
      - {to: tenant_owner, channel: email_and_in_app, when: always, template: audit_exported, must_include: [actor_display_name, row_count, window, purpose], mandatory_legal: true}
    undoable: false
    audit_class: security
    idempotency_key_source: 'requesting principal plus a hash of (window, filters, format) plus the hour bucket. A double-click produces one export and one notification.'
    offline_policy: refuse
    concurrency: One export per principal at a time. A second request queues rather than running concurrently, because two large exports from one tenant is the same load profile as an incident.
    failure_modes:
      - {code: E_VALIDATION, cause: purpose empty, message: State why you are exporting. It is recorded and shown to the workspace owner.}
      - {code: E_QUOTA, cause: export exceeds max_export_rows, message: Plan limit reached., note: 'narrow the window rather than raising the limit; an export of the entire history is a migration, not an audit'}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
      - {code: E_DEPENDENCY, cause: digest proof requested but the covering digests are unverified, message: A required service is unavailable., note: an export claiming to carry proof must not ship with unverified digests; it may ship without the proof if the requester accepts that explicitly}
    edge_cases:
      - The export is permission-projected exactly as the query is. An export cannot be a way around field gating, which means two auditors with different permissions exporting the same window get different files, and each file states which fields were withheld and under which gate so the recipient knows the file is partial.
      - include_digest_proof attaches the merkle inclusion proofs and the covering signed digests so a third party can verify the extract without access to Verity. Without this, an exported CSV is an assertion.
      - An export requested over a window containing held records. Permitted. A legal hold prevents deletion, not reading.
      - An export that would contain the exporter's own actions. Permitted and flagged in the notification, because self-exclusion would be a bigger problem than self-inclusion.

  - key: apply_legal_hold
    entity: legal_hold
    label: Place a legal hold
    actors: [tenant_owner, platform_operator]
    preconditions: [acting session is elevated, a matter reference is supplied, the scope expression passes static analysis]
    inputs: [reference, scope_expression, expected_release_at, reason]
    creates: [legal_hold]
    updates: [retention_class on every matching audit_record]
    events: [legal_hold.applied]
    notifications:
      - {to: tenant_owner, channel: email_and_in_app, when: always, template: legal_hold_applied, mandatory_legal: true}
      - {to: platform_operator, channel: in_app, when: always, template: tenant_legal_hold, note: the platform must know which tenants carry holds before it runs any deletion machinery}
    undoable: true
    reversal_action: release_legal_hold
    audit_class: security
    idempotency_key_source: 'tenant_id plus reference plus a hash of scope_expression. Re-applying an identical hold is a 2xx no-op.'
    offline_policy: refuse
    concurrency: >
      The retention job takes a shared lock that the hold application takes exclusively, so
      a hold cannot land while rows within its scope are mid-expiry. Losing that race in the
      other direction - expiry running first - is the failure this lock exists to prevent
      and it is unrecoverable.
    failure_modes:
      - {code: E_VALIDATION, cause: scope_expression fails static analysis or exceeds the cost ceiling, message: field-specific, note: an unbounded hold expression that scans the entire history is refused at save time rather than timing out}
      - {code: E_VALIDATION, cause: reference empty, message: A matter reference is required.}
      - {code: E_QUOTA, cause: the hold would cover more than max_hold_rows, message: Plan limit reached., note: 'a hold over everything is a retention policy change, not a hold, and must be recognised as such'}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
    edge_cases:
      - A hold applied to rows that are already expired. Those rows cannot be recovered; the action succeeds for the rest and states plainly how many rows were already gone. Silently succeeding would let somebody believe evidence exists that does not.
      - A hold whose scope expression matches rows written AFTER the hold was applied. Supported and is the normal case for an ongoing matter. The expression is evaluated at write time as well as at apply time, which means a hold makes every subsequent audit write slightly more expensive - a cost stated here rather than discovered in production.
      - A hold applied by a principal who is themselves under investigation. Permitted to apply, forbidden to release. The asymmetry is deliberate.
      - Interaction with a data-subject erasure request. A legal hold wins. The erasure request is recorded as received and as blocked, with the hold reference, so the obligation and the conflict are both documented rather than one silently overriding the other.

  - key: verify_digest
    confirmation_specification: 'None. Verification changes no business data; it creates a verification result and an audit row. A confirmation would discourage the one action this capability most wants people to perform.'
    entity: audit_digest
    label: Verify the audit chain
    actors: [system_scheduler, auditor, platform_operator]
    rationale: A tamper-evident scheme that is never checked provides no evidence at all. The check is the product, not the hash.
    preconditions: [at least one digest exists for the tenant]
    inputs: [tenant_id, window, depth]
    creates: [verification_result, audit_record_of_the_verification]
    updates: [audit_digest state]
    events: [audit.verification_completed, audit.verification_failed]
    notifications:
      - {to: platform_operator and tenant_owner, channel: all_available, when: on_failure, template: audit_verification_failed, mandatory_legal: true, note: not suppressible and not snoozable}
    undoable: false
    audit_class: security
    idempotency_key_source: tenant_id plus digest id plus the verification run id
    offline_policy: refuse
    concurrency: Verification is read-only against audit rows and takes no lock. Multiple concurrent verifications of the same digest are harmless and produce the same result, which is a property worth having because it means a suspicious auditor can re-run it themselves.
    failure_modes:
      - {code: E_INTERNAL, cause: recomputed hash does not match record_hash, message: null, note: 'the highest-severity finding the platform can produce. The row, its neighbours, the digest and the signing key id are all captured into an incident record before anything else happens'}
      - {code: E_INTERNAL, cause: digest signature does not verify against the recorded signing_key_id, message: null, note: 'distinguishes a data problem from a key problem, which matters because a rotated-and-lost key is a process failure and a mismatched signature is not'}
      - {code: E_PRECONDITION, cause: a gap between window_end of digest N and window_start of digest N+1, message: null, note: 'a chain with a gap is a chain somebody could have cut. Treated as failure, never as a warning'}
      - {code: E_DEPENDENCY, cause: signing key material unavailable, message: A required service is unavailable., note: 'verification is deferred, NOT reported as passing. An unverifiable chain and a verified chain must never render identically'}
    edge_cases:
      - Verification across a retention boundary where rows have expired to tombstones. The tombstone retains the record hash, so the chain still verifies. This is why expiry destroys content but never the hash.
      - Verification of a tenant that has been migrated between database clusters. The chain must survive migration, which means the canonical serialisation may not depend on physical storage order or on any cluster-local identifier. Stated as a constraint on the serialisation, because it is easy to violate accidentally.
      - An auditor running verification themselves rather than trusting the scheduled run. Explicitly supported and is the point of publishing the scheme. The auditor's run is itself audited, which is not a deterrent but is a fact they should be told before they run it.
      - Verification during an active legal hold. Unaffected. Holds change retention, not content.

rules:
  - key: audit_write_is_transactional
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'An audit record is written in the same database transaction as the change it records. If the audit write fails, the business write rolls back.'
    on_conflict: not overridable
    rationale: The alternative produces an audit trail with holes precisely where something went wrong, which is worse than no audit trail because it looks complete.

  - key: audit_is_append_only
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'No principal, including platform_operator, holds edit or delete on audit_record. Retention expiry is executed by a job whose own execution is audited.'
    on_conflict: not overridable

  - key: reading_audit_is_audited
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Every audit query and export writes an audit record of class security.'
    on_conflict: not overridable
    rationale: Without this the audit trail cannot answer who looked at whose records, which is the second question every investigation asks.

  - key: projection_on_read_not_on_write
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'before and after are stored raw and projected at read time against the reader''s permissions.'
    on_conflict: not overridable

  - key: retention_years_by_class
    kind: policy
    scope: capability
    overridable_at: tenant
    default: 'always and security retain 7 years; read_sensitive_only retains 2 years. A tenant may LENGTHEN retention. A tenant may not shorten it below the shipped default.'
    on_conflict: 'the longer retention wins, which is the only safe resolution and is stated rather than left to implementation'
    rationale: Values are taken from the vocabulary's audit_classes, which is where they are declared once. The asymmetry - lengthen yes, shorten no - is what stops retention configuration becoming a deletion tool.

  - key: geo_capture_is_never_silent
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'The geo field is populated only for actions that explicitly declare evidence capture, and the capturing surface must have told the person. Ambient location capture is forbidden regardless of tenant configuration.'
    on_conflict: not overridable

policy_knobs:
  - {key: digest_interval_minutes, default: 60, range: [15, 1440], lowest_settable_scope: kernel}
  - {key: verification_lag_hours, default: 24, range: [1, 168], lowest_settable_scope: kernel}
  - {key: full_chain_verify_days, default: 7, range: [1, 90], lowest_settable_scope: kernel}
  - {key: hold_review_days, default: 180, range: [30, 1095]}
  - {key: hold_review_grace_days, default: 30, range: [1, 180]}
  - {key: max_query_window_days, default: 90, range: [1, 400]}
  - {key: max_export_rows, default: 500000, range: [1000, 10000000]}
  - {key: max_hold_rows, default: 5000000}
  - {key: audit_retention_years_always, default: 7, range: [7, 25], note: may only be raised}
  - {key: audit_retention_years_read, default: 2, range: [2, 25], note: may only be raised}
  - {key: external_anchor_enabled, default: false, note: 'publishing the digest signature somewhere outside Verity''s control; off by default because it has a cost and a dependency, on for tenants with an evidentiary requirement'}

open_questions:
  - {q: 'Is an external anchor required for the tamper-evidence claim to be meaningful to an Indian court or to a client''s auditor? A self-published chain proves internal consistency but is signed by the party being audited.', assumption: A self-published signed chain is sufficient for commercial dispute and client audit; it is probably not sufficient where Verity itself is the party in question., confidence: VALIDATION_REQUIRED, method: 'legal review of evidentiary standards under the Indian Evidence Act and the Information Technology Act for electronic records, plus one interview with a client-side auditor', priority: High, blocks: [external_anchor_ref, the tamper-evidence claim in any marketing or contractual statement]}
  - {q: 'What is the correct interaction between a data-subject erasure request and a 7-year audit retention obligation? The model currently records the conflict rather than resolving it.', assumption: 'Erasure removes the personal data from the operational entities and leaves the audit rows intact with the actor pseudonymised. Whether that satisfies the obligation is a legal question, not an engineering one.', confidence: VALIDATION_REQUIRED, method: legal review against the Digital Personal Data Protection framework as it applies to the target customer segment, priority: Critical, blocks: [retention job design, principal deactivation, party merge]}
  - {q: 'Does the per-tenant hash chain serialisation point survive the write volume of the largest target tenant at shift-change, when several thousand attendance records land within a minute?', assumption: Yes with per-tenant-per-day chain segmentation as described in the concurrency note., confidence: WORKING_ASSUMPTION, method: 'load test at 10x the p95 shift-change burst observed in pilot, measuring transaction latency at the chaining lock', priority: High}
  - {q: 'Should the audit trail be readable by the SUBJECT of a record about them - can a worker see every audit row concerning their own attendance?', assumption: 'None. This is a genuine product and labour-relations choice with strong arguments both ways, and it is not being decided here.', confidence: VALIDATION_REQUIRED, method: 'operator interview plus review of what the target customers'' own client contracts require them to be able to show', priority: High, blocks: [audit_query default grants, worker-facing surfaces]}
  - {q: 'Where is the signing key held, and who can rotate it? The invariant says outside the application credential store; it does not say where, because that is an infrastructure decision that has not been made.', assumption: None., confidence: VALIDATION_REQUIRED, method: infrastructure design review, priority: High, blocks: [audit_digest.signing_key_id, verify_digest failure modes]}
