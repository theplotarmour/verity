key: reporting
name: Reporting
layer: core
confidence: KNOWN
description: >
  Answering questions about what has happened, with numbers that reconcile to the records
  they came from and that mean the same thing to two people reading them. It is a projection
  over entities and events with a permission-aware query layer, never a capability that owns
  data, and its central problem is that every number in it is a definition somebody must
  agree to before it is a figure anybody can act on.

principles:
  - Every report answers a decision question. A report with no decision behind it is a dashboard, and the kernel excludes dashboards for exactly that reason.
  - A metric is a definition before it is a number. Two people reading the same figure and meaning different things is worse than neither having the figure.
  - Numbers must reconcile to the records beneath them. A figure that cannot be drilled to its rows is a figure that will be disbelieved the first time it is inconvenient.
  - Permission projection applies to aggregates as strictly as to rows. A count is a disclosure about records the reader cannot open.
  - A report states its own freshness and its own definition version. A number without both is a number that cannot be compared to the same number from last quarter.
  - Exports leave the system and cannot be recalled. They are gated, audited, watermarked with who took them, and never a way around a field gate.

entities:

  - key: metric_definition
    name: Metric Definition
    description: One agreed meaning for one number - what it counts, over what, excluding what, and who agreed to it.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true}
      - {key: decision_question, type: text, req: true, note: 'the question this number is for, phrased as an operator would ask it. Mandatory - a metric with no decision behind it is decoration, and the kernel excludes decoration'}
      - {key: source_capability_key, type: string, req: true}
      - {key: source_entity_or_event, type: string, req: true}
      - {key: aggregation, type: enum, values: [count, sum, average, median, percentile, ratio, rate, distinct_count, duration], req: true}
      - {key: percentile, type: decimal, nullable: true}
      - {key: measure_field, type: string, nullable: true}
      - {key: filter_expression, type: text, nullable: true, note: 'an Expression, statically cost-bounded like every other'}
      - {key: exclusions, type: json, nullable: true, note: 'flat list of exclusion keys - excluded SLA measurements, excluded billable outcomes, voided orders. Every exclusion elsewhere in the platform is visible here, because a number that silently omits excluded records is a number that flatters'}
      - {key: time_basis, type: enum, values: [occurred_at, recorded_at, operating_day, period_end], req: true, note: 'MANDATORY with no default. The same events counted by business time and by system time give different answers whenever anything arrives late, which in a field operation is constantly'}
      - {key: grain, type: enum, values: [day, week, month, quarter, year], req: true}
      - {key: denominator_definition, type: text, nullable: true, note: 'required for ratio and rate, because a ratio whose denominator is unstated is two different numbers'}
      - {key: target_value, type: decimal, nullable: true}
      - {key: direction_of_good, type: enum, values: [higher, lower, target_band, none], req: true, default: none, note: 'without this a number cannot be rendered with any indication of whether it is good, and every surface then invents its own'}
      - {key: owner_principal_id, type: uuid, req: true, note: who agreed to this definition and answers for it}
      - {key: version_number, type: int, req: true, default: 1}
      - {key: agreed_at, type: timestamptz, nullable: true}
      - {key: sensitive, type: bool, req: true, default: false}
      - {key: financial, type: bool, req: true, default: false}
    invariants:
      - decision_question is mandatory and non-empty. A metric that cannot name the decision it informs is a dashboard tile, and the kernel excludes dashboards.
      - time_basis is mandatory with no default at any scope. Counting by business time and by system time gives different answers whenever anything arrives late, and an unstated basis means two people comparing the same metric are comparing different things.
      - aggregation=ratio or rate requires denominator_definition, and percentile requires percentile.
      - A definition is never edited after any report has published a figure from it. A change is a new version, and every published figure records the version it was computed under, so a comparison across a definition change is detectable rather than misleading.
      - financial or sensitive definitions are gated on read by the same verbs that gate their underlying fields. A metric is not a way around a field gate.
    states: [draft, agreed, superseded, retired]
    initial_state: draft
    transitions:
      - {from: draft, to: agreed, action: agree_metric, actor: 'the owner plus one other principal holding view over the source, or tenant_owner alone', guard: 'the decision question, time basis and, where required, the denominator are all stated', side_effects: the metric becomes usable in reports and its version is fixed, reversibility: true}
      - {from: agreed, to: draft, action: revise_metric, actor: the owner, guard: no published figure references this version, side_effects: none, reversibility: true}
      - {from: agreed, to: superseded, action: agree_metric, actor: as above, guard: a later version is agreed, side_effects: published figures keep their version; comparisons across the boundary are flagged, reversibility: false}
      - {from: agreed, to: retired, action: retire_metric, actor: the owner or tenant_admin, guard: no active report references it, side_effects: historical figures remain resolvable, reversibility: false}
      - {from: draft, to: retired, action: retire_metric, actor: as above, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        A metric in draft is a number somebody wants and nobody has agreed the meaning of.
        Threshold: draft_metric_stale_days (default 21). Told: the owner. Escape hatch: agree
        or retire. The characteristic failure is a definition drafted during a disagreement
        about a figure and abandoned once the immediate argument ended, leaving the
        disagreement unresolved and available to recur.
      agreed: >
        Steady state. Three monitored conditions. (a) A metric whose computed value moves by
        more than definition_shift_alert (default 0.5) between consecutive periods with no
        underlying volume change, which usually means a filter that has stopped matching after
        a configuration change elsewhere. Told: the owner. (b) A metric never queried for
        unused_metric_days (default 180) - somebody agreed a definition nobody uses, which is
        cost and clutter. (c) A metric whose exclusions now remove more than
        exclusion_share_alert of its population (default 0.1), which means the number is
        increasingly a statement about what was excluded. Told: the owner and tenant_owner,
        because that is the condition under which a metric quietly stops describing reality.
      superseded: >
        Terminal. Retained permanently, because every published figure computed under it must
        remain reproducible. This is the whole reason definitions are versioned rather than
        edited. Nothing pends.
      retired: >
        Terminal. Retained for the same reason. Nothing pends.

  - key: report
    name: Report
    description: A named, permission-projected, drillable answer to a question, with its metrics, its dimensions and its delivery.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true}
      - {key: decision_question, type: text, req: true}
      - {key: metric_keys, type: json, req: true, note: flat list}
      - {key: dimension_keys, type: json, nullable: true, note: 'flat list of grouping dimensions, each resolving through a capability port rather than by joining its tables'}
      - {key: default_period, type: enum, values: [today, this_week, this_month, last_month, this_quarter, last_quarter, rolling_30, rolling_90, custom], req: true}
      - {key: audience_role_keys, type: json, req: true, note: 'who this report is for, expressed as roles. A report addressed to a person dies when they leave, exactly as a notification does'}
      - {key: drill_target, type: string, nullable: true, note: 'which entity a figure drills into. Mandatory for any metric a person will be asked to act on, because a number nobody can drill is a number they will disbelieve'}
      - {key: schedule_cron, type: string, nullable: true}
      - {key: schedule_channel, type: enum, values: [none, in_app, email, export_only], req: true, default: none}
      - {key: freshness_target_minutes, type: int, req: true, default: 60}
      - {key: row_limit, type: int, req: true, default: 1000}
      - {key: owner_principal_id, type: uuid, req: true}
      - {key: source_pack_key, type: string, nullable: true}
    invariants:
      - decision_question is mandatory. A report that cannot name its decision is a dashboard.
      - audience is expressed as roles, never as principals, for the same reason notification audiences are.
      - A report is executed under the scope of whoever runs it. A scheduled report is executed and delivered per recipient under that recipient's own scope, never once under its author's scope and then distributed.
      - Every metric in a report shares a compatible time_basis, or the report declares which basis it presents and states it on every rendering. Mixing bases silently within one report is how two figures on one page disagree.
      - drill_target is mandatory for any metric with direction_of_good other than none, because those are the numbers somebody will be asked about.
    states: [draft, published, broken, archived]
    initial_state: draft
    transitions:
      - {from: draft, to: published, action: publish_report, actor: 'the owner, ops_manager or tenant_admin', guard: 'every metric is agreed, the decision question is stated, and every metric with a direction has a drill target', side_effects: the report appears for its audience roles and its schedule begins, reversibility: true}
      - {from: published, to: broken, action: observe_definition_change, actor: system, guard: 'a referenced metric was retired, or a dimension no longer resolves after a capability change', side_effects: the owner and the audience are told; the report shows the reason rather than a wrong number, reversibility: true}
      - {from: broken, to: published, action: repair_report, actor: the owner, guard: the broken references are replaced or removed, side_effects: none, reversibility: true}
      - {from: published, to: draft, action: unpublish_report, actor: the owner or tenant_admin, guard: null, side_effects: schedule stops, reversibility: true}
      - {from: published, to: archived, action: archive_report, actor: the owner or tenant_admin, guard: null, side_effects: 'schedule stops, historical runs remain resolvable', reversibility: false}
      - {from: broken, to: archived, action: archive_report, actor: as above, guard: null, side_effects: as above, reversibility: false}
      - {from: draft, to: archived, action: archive_report, actor: as above, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_report_stale_days (default 21). Told: the owner. Escape hatch: publish
        or archive. Low urgency and the specific confusion is an audience who were told a
        report exists and cannot find it.
      published: >
        Steady state. Two monitored conditions. (a) A scheduled report whose last run failed or
        did not occur - the audience received nothing and silence is indistinguishable from a
        report showing no change. Threshold: one missed schedule. Told: the owner and
        platform_operator, because the cause is usually machinery. (b) A published report never
        opened by anybody in its audience for unopened_report_days (default 90), which is a
        report nobody wanted, and where it is scheduled it is also messaging cost for nothing.
      broken: >
        A broken report is showing nothing or, worse, showing a figure computed without a
        removed component. Threshold: immediate. Told: the owner and every audience role,
        naming the specific broken element. Escape hatch: repair or archive. It is deliberately
        NOT auto-repaired by dropping the broken metric, because a report that quietly loses a
        column changes what it means and the audience will read it as though it did not.
      archived: >
        Terminal. Historical runs remain resolvable, because a figure quoted in a meeting six
        months ago must remain reproducible. Nothing pends.

  - key: report_run
    name: Report Run
    description: One execution of one report for one reader at one moment, with the figures it produced, the definitions it used and how fresh its data was.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: report_id, type: uuid, req: true, fk: report}
      - {key: run_for_principal_id, type: uuid, req: true, note: whose scope the figures were computed under. Two people running the same report legitimately see different numbers and the run records whose they are}
      - {key: scope_fingerprint, type: string, req: true}
      - {key: period_start, type: timestamptz, req: true}
      - {key: period_end, type: timestamptz, req: true}
      - {key: metric_versions, type: json, req: true, note: the exact definition version behind every figure. Without this a number cannot be compared to the same number from last quarter}
      - {key: figures, type: json, req: true}
      - {key: rows_returned, type: int, req: true}
      - {key: rows_suppressed_by_permission, type: int, req: true, note: 'recorded but NEVER rendered to the reader, because showing it discloses how many records exist outside their scope. It exists so that a persistently non-zero value is visible to an operator as an index-versus-permission divergence'}
      - {key: rows_suppressed_by_small_population, type: int, req: true, default: 0, note: cells suppressed because the population was too small to render without identifying an individual}
      - {key: data_as_of, type: timestamptz, req: true, note: 'the freshness of the underlying data, stated on every rendering'}
      - {key: executed_at, type: timestamptz, req: true, immutable: true}
      - {key: duration_ms, type: int, req: true}
      - {key: trigger, type: enum, values: [interactive, scheduled, api, export], req: true}
      - {key: exported, type: bool, req: true, default: false}
    invariants:
      - A run is immutable. Re-running produces a new run, so a figure quoted from a run remains reproducible even after the underlying data changes.
      - rows_suppressed_by_permission is recorded and is never rendered to the reader. A count of what was withheld is a disclosure about records outside their scope.
      - metric_versions and data_as_of are both mandatory and both rendered. A number without its definition version and its freshness cannot be compared to anything.
      - Figures are computed under run_for_principal_id's scope and never under the report author's or a scheduler's service identity.
      - A run whose figures were suppressed by small population states that suppression occurred without stating where, because stating where reintroduces the disclosure.
    states: [running, completed, failed, expired]
    initial_state: running
    transitions:
      - {from: running, to: completed, action: run_report, actor: a person or system_scheduler, guard: every metric resolved and the permission projection completed, side_effects: 'figures stored; where scheduled, delivered per recipient', reversibility: false}
      - {from: running, to: failed, action: run_report, actor: as above, guard: 'a metric could not be resolved, the source was unavailable, or the row limit was exceeded', side_effects: 'the reader sees the reason rather than a partial figure, and the owner is told', reversibility: true}
      - {from: completed, to: expired, action: expire_run, actor: system_scheduler, guard: 'now > executed_at plus run_retention_days', side_effects: the figures are destroyed and the run metadata retained, reversibility: false}
      - {from: failed, to: expired, action: expire_run, actor: system_scheduler, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      running: >
        A report running far beyond its expected duration is consuming query capacity that
        operational work needs. Threshold: run_timeout_seconds (default 60 interactive, 600
        scheduled). Told: the reader, in place, with the option to narrow the period. Escape
        hatch: cancel, narrow, or move to an export. A reporting query that can starve
        operational transactions is the reason interactive runs carry a much shorter timeout
        than scheduled ones.
      completed: >
        Terminal until retention. Nothing pends.
      failed: >
        Threshold: immediate. Told: the reader with the specific reason, and the owner where
        the failure is a definition or dimension problem rather than a transient one. Escape
        hatch: narrow the period, repair the report, or retry. A failed run must never render
        as an empty result, because an empty result reads as nothing happened.
      expired: >
        Terminal. Metadata retained so that the fact a report was run, by whom and when,
        survives even after its figures are gone. Nothing pends.

  - key: report_export
    name: Export
    description: A copy of a report's figures or rows leaving the system, with who took it, why, and what was withheld.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: run_id, type: uuid, req: true, fk: report_run}
      - {key: requested_by_principal_id, type: uuid, req: true}
      - {key: purpose, type: text, req: true, note: 'mandatory. An export with no stated purpose is one nobody can assess afterwards, and export is the platform''s principal exfiltration route'}
      - {key: format, type: enum, values: [csv, xlsx, pdf, json], req: true}
      - {key: row_count, type: int, req: true}
      - {key: withheld_field_keys, type: json, nullable: true, note: 'which fields were removed by the reader''s own gates, stated IN the exported file so a recipient knows the file is partial'}
      - {key: watermark, type: string, req: true, note: 'the exporting principal, the tenant and the timestamp, rendered into the file. A file that circulates without its provenance is one nobody can trace back'}
      - {key: requested_at, type: timestamptz, req: true, immutable: true}
      - {key: completed_at, type: timestamptz, nullable: true}
      - {key: download_count, type: int, req: true, default: 0}
      - {key: expires_at, type: timestamptz, req: true, note: the generated file expires. An export link that lives forever is a permanent copy of the data outside every control}
    invariants:
      - purpose is mandatory and non-empty.
      - An export is projected exactly as the run was. It is never a route around a field gate, and the fields withheld are named in the file so the recipient knows it is partial.
      - Every export writes an audit record of class always, per the vocabulary's treatment of export as an exfiltration vector.
      - The generated file expires and the link is single-tenant and non-guessable. Export links that persist are the most common way tenant data ends up permanently outside the platform.
      - An export inherits the small-population suppression of its run. Exporting is not a way to obtain the cells the interface suppressed.
    states: [requested, generating, available, expired, failed]
    initial_state: requested
    transitions:
      - {from: requested, to: generating, action: export_report, actor: a person, guard: 'a purpose is supplied, the acting session is elevated where the report is financial or sensitive, and the row count is within the limit', side_effects: 'the owner of the report and, for financial or sensitive reports, tenant_owner are told', reversibility: true}
      - {from: generating, to: available, action: observe_export_complete, actor: system, guard: the file is produced, side_effects: the requester is told and the expiry clock starts, reversibility: false}
      - {from: generating, to: failed, action: observe_export_complete, actor: system, guard: generation failed, side_effects: the requester is told with the reason, reversibility: true}
      - {from: available, to: expired, action: expire_export, actor: system_scheduler, guard: 'now > expires_at', side_effects: the file is destroyed; the export record and its audit row are retained permanently, reversibility: false}
    stuck_state_policy:
      requested: >
        Threshold: export_queue_lag_minutes (default 5). Told: platform_operator. A requester
        waiting on an export will re-request, which is why the request is idempotent on the run
        and the parameters.
      generating: >
        Threshold: export_generation_minutes (default 15). Told: the requester and
        platform_operator. Escape hatch: cancel and narrow. A very large export is usually a
        report that should have been narrowed, and the surface says so rather than grinding.
      available: >
        Bounded by expires_at. The monitored condition is an available export never downloaded
        for undownloaded_export_days (default 3), which is either somebody who changed their
        mind or a file generated by an automation nobody is consuming - both worth knowing,
        because both are copies of data sitting outside the record.
      failed: >
        Threshold: immediate. Told: the requester with the reason. Escape hatch: narrow and
        retry. Nothing else pends.
      expired: >
        Terminal. The file is gone and the record of who exported what, when and why is
        retained permanently. Nothing pends.

ports:
  - port_key: reporting_source
    direction: requires
    contract: >
      Expose an entity or event stream for aggregation with its scope fields denormalised, its
      field gates declared, and its exclusion markers visible. Every capability that wants to be
      reportable declares this rather than reporting reaching into its tables.
    cardinality: zero_or_many
    unbound_behaviour: >
      Nothing is reportable. Reports exist, resolve no metrics, and say so. Deliberately not an
      error, because a tenant may install reporting ahead of the capabilities that will feed it,
      and a capability may deliberately decline to be reportable.

  - port_key: change_feed
    direction: requires
    contract: A durable, ordered stream of changes with a cursor, so aggregates can be maintained incrementally and their freshness measured.
    cardinality: zero_or_one
    unbound_behaviour: >
      Aggregates are computed on demand against the operational store rather than maintained
      incrementally. Correct, materially slower, and it puts reporting queries on the same
      database as operational transactions - which is why interactive runs carry a short timeout
      and why the row limit exists. This is the same change feed search and integrations
      require, and its absence from the composition model is flagged in all three.

  - port_key: authorization_decision
    direction: requires
    contract: Resolve a reader's scope filter for each source and project both rows and aggregates.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. An aggregate over records a reader may not see is a disclosure that is harder to notice than a row, because nobody expects a total to leak.

  - port_key: org_structure
    direction: requires
    contract: Resolve location and region dimensions and their hierarchy for roll-up.
    cardinality: zero_or_one
    unbound_behaviour: 'Location and region dimensions are unavailable and every report is tenant-wide. For a multi-site tenant this removes the comparison that most reports exist to make.'

  - port_key: audit_sink
    direction: requires
    contract: Record runs of sensitive or financial reports and every export.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. Export is an exfiltration vector that the vocabulary already marks always-audited, and an unaudited export surface removes the only trace.

  - port_key: notification
    direction: requires
    contract: Deliver scheduled reports, broken-report and failed-run messages, and export notifications.
    cardinality: zero_or_one
    unbound_behaviour: Scheduling is unavailable and reports are interactive only. Everything else works, and the absence removes the mechanism by which a report reaches somebody who was not already looking for it.

actions:

  - key: agree_metric
    entity: metric_definition
    label: Agree what a number means
    actors: [ops_manager, finance, tenant_owner, tenant_admin]
    rationale: >
      Modelled as an explicit act of agreement rather than as saving a definition, because the
      failure this capability exists to prevent is two people reading one figure and meaning
      different things. The agreement is the product; the query is an implementation detail.
    preconditions: [the decision question is stated, the time basis is stated, a denominator is stated where the aggregation requires one, the source is reportable]
    inputs: [key, label, decision_question, source, aggregation, measure_field, filter_expression, exclusions, time_basis, grain, denominator_definition, target_value, direction_of_good]
    creates: [metric_definition]
    updates: [previous version superseded]
    events: [reporting.metric_agreed]
    notifications:
      - {to: the owners of every report referencing the previous version, channel: in_app, when: this supersedes an agreed version, template: metric_definition_changed, must_include: [what_changed, which_reports, that_historical_figures_keep_the_old_version]}
    undoable: true
    reversal_action: agree a further version restoring the previous definition
    audit_class: always
    idempotency_key_source: tenant_id plus key plus a hash of the definition. Re-agreeing an identical definition is a no-op and does not supersede.
    offline_policy: refuse
    concurrency: >
      Definitions are versioned rather than updated, so concurrent agreements produce an
      ordered sequence and the later supersedes. Published figures reference the version they
      were computed under, so no historical figure is ever changed by a definition change - the
      property that makes a quarter-on-quarter comparison honest.
    failure_modes:
      - {code: E_VALIDATION, cause: decision_question empty, message: 'What decision is this number for?', note: 'refused. This is the one field that separates a metric from a dashboard tile, and the kernel excludes dashboards'}
      - {code: E_VALIDATION, cause: time_basis not stated, message: Choose whether this counts by when it happened or when it was recorded., note: 'never defaulted. The two give different answers whenever anything arrives late, which in a field operation is constantly'}
      - {code: E_VALIDATION, cause: a ratio or rate with no denominator definition, message: Say what this is a proportion of.}
      - {code: E_VALIDATION, cause: the filter expression fails static analysis or exceeds the cost ceiling, message: field-specific, note: rejected at save rather than timing out during a board meeting}
      - {code: E_PRECONDITION, cause: a published figure references the version being revised, message: This action is not available in the current state., note: 'the correct path is a new version, and the message says so'}
      - {code: E_AUTHZ_FIELD, cause: the definition aggregates a financial field and the agreeing principal lacks view_financial, message: null, note: refused. Agreeing the meaning of a number you cannot see is agreeing to something you have not read}
    edge_cases:
      - Two metrics with similar labels and different definitions - a completion rate counted by occurrence and another counted by recording. Both are legitimate and both must exist, and the decision question is what distinguishes them for a reader. The model does not prevent near-duplicates; it makes their difference legible.
      - A metric whose exclusions grow over time until the number describes mostly what was excluded. The exclusion share monitor exists for this, and it is the condition under which a metric quietly stops describing reality while continuing to look healthy.
      - A metric agreed by one person where the tenant has only one. Permitted; the guard requires two principals or tenant_owner alone, and a single-person tenant has tenant_owner. Requiring two in a business of one makes the capability unusable, which is the failure mode the kernel warns about for over-configured onboarding.
      - Agreeing a metric over a source that later becomes unreportable when a capability is disabled. The metric survives, reports referencing it break, and the audience is told. Silently dropping it would change every report that used it without anybody noticing.
      - A definition change that makes this quarter incomparable with last. Historical figures keep their version and any rendering that spans the boundary is flagged. This is the single most useful property of versioning definitions and the reason it is worth the machinery.

  - key: run_report
    entity: report_run
    label: Run a report
    actors: [any_authenticated, system_scheduler, integration_principal]
    preconditions: [the report is published, every metric is agreed, the reader holds view over at least one source]
    inputs: [report_id, period_start, period_end, dimension_filters, run_for_principal_id]
    creates: [report_run]
    updates: []
    events: [reporting.run_completed, reporting.run_failed]
    notifications:
      - {to: each recipient in the audience roles, channel: schedule_channel, when: the run is scheduled, template: scheduled_report, must_include: [data_as_of, period], batching_policy: one per recipient per schedule}
      - {to: the report owner, channel: in_app, when: the run failed, template: report_run_failed, must_include: [reason]}
    undoable: false
    confirmation_specification: 'None for an interactive run. A run creates only its own immutable record and reads projected data. The controls that matter are the scope projection, the row limit and the timeout.'
    audit_class: read_sensitive_only
    idempotency_key_source: report_id plus run_for_principal_id plus period plus scope_fingerprint plus the minute bucket. A double-click produces one run.
    offline_policy: read_only
    concurrency: >
      Runs are reads and do not contend with each other. They can contend with operational
      transactions where the change feed is unbound and aggregates are computed against the
      operational store, which is why interactive runs carry a short timeout and a row limit -
      a reporting query that starves the transaction that pays the wages is a worse outcome
      than a slow report.
    failure_modes:
      - {code: E_AUTHZ_SCOPE, cause: 'the reader''s scope excludes some or all of the population', message: null, note: 'rows and aggregates are both projected, the suppressed count is recorded and NOT shown, and where nothing remains the report renders an explicit no-data-within-your-access state rather than zeros. Zeros are a statement that nothing happened'}
      - {code: E_QUOTA, cause: the result exceeds row_limit, message: null, note: the run FAILS rather than truncating. A truncated report renders as a complete one and is acted on as though it were}
      - {code: E_PRECONDITION, cause: a metric definition is not agreed or has been retired, message: null, note: the report is marked broken and the reason is shown rather than a figure computed without that component}
      - {code: E_DEPENDENCY, cause: a reporting source is unavailable, message: null, note: 'the run fails. A partial report is more dangerous than none, because the missing part is invisible'}
      - {code: E_RATE_LIMIT, cause: a principal running very large reports repeatedly, message: Too many attempts. Try again shortly., note: 'this is the export-shaped access pattern seen in reporting, and it is limited for the same reason it is limited in search'}
      - {code: E_INTERNAL, cause: the run exceeds its timeout, message: null, note: cancelled with the option to narrow. The reader is told what to change rather than being told it failed}
    edge_cases:
      - A scheduled report delivered to five recipients with different scopes. Executed five times, once per recipient under their own scope, and each receives their own figures. Running once under the author's scope and distributing would disclose to every recipient everything the author can see, which is the single most likely disclosure in a reporting capability.
      - A cell computed over a population small enough to identify an individual - one person's attendance at a location with one worker. Suppressed per the small-population rule, and the run states that suppression occurred without stating where. Stating where reintroduces the disclosure by elimination.
      - A report spanning a metric definition change. Figures either side of the boundary are rendered with their versions and the boundary is marked. Presenting them as one series would be a comparison of two different numbers with one label.
      - A run against data whose freshness is behind the target. data_as_of is stated on the rendering, always. A figure quoted in a meeting from data that was two hours stale is defensible if the staleness was visible and indefensible if it was not.
      - An integration principal running reports on a schedule. Permitted within its own scope, rate-limited more tightly than a human, and always audited, for the same reason as in search - a service account paginating aggregates is an efficient way to reconstruct a dataset.

  - key: export_report
    entity: report_export
    label: Export a report
    actors: [any_authenticated, auditor, finance]
    rationale: >
      An export leaves the system permanently and cannot be recalled. Everything about this
      action is designed so that the copy is traceable and so that exporting is never a way
      around a gate the interface applied.
    preconditions:
      - A completed run exists for this reader.
      - A purpose is stated.
      - The acting session is elevated where the report is financial or sensitive.
      - The row count is within the export limit.
    inputs: [run_id, format, purpose]
    creates: [report_export, a generated file]
    updates: []
    events: [reporting.exported]
    notifications:
      - {to: the report owner, channel: in_app, when: always, template: report_exported, must_include: [who, purpose, row_count]}
      - {to: tenant_owner, channel: in_app_and_email, when: the report is financial or sensitive, template: sensitive_export, must_include: [who, purpose, row_count, withheld_fields], mandatory_legal: true}
    undoable: false
    confirmation_specification: 'Modal stating the row count, which fields are withheld under which gate and that this will be written into the file, that the workspace owner will be told for a financial or sensitive report, and when the download link expires. Requires typing the purpose rather than selecting it. Required because a file that has left cannot be recalled.'
    audit_class: always
    idempotency_key_source: run_id plus format plus the requesting principal plus the hour bucket. A double-click produces one file and one notification.
    offline_policy: refuse
    concurrency: One export per principal at a time; a second queues. Two large exports from one tenant have the same load profile as an incident.
    failure_modes:
      - {code: E_VALIDATION, cause: purpose empty, message: State why you are exporting. It is recorded and shown to the workspace owner.}
      - {code: E_AUTHN, cause: the report is financial or sensitive and the session is not elevated, message: Confirm your identity to continue.}
      - {code: E_QUOTA, cause: the row count exceeds max_export_rows, message: Plan limit reached., note: 'narrow the period. An export of an entire history is a migration and belongs to a different, separately authorised path'}
      - {code: E_PRECONDITION, cause: the run has expired, message: This action is not available in the current state., note: 're-run first, so that the exported figures are computed under the reader''s current scope rather than a stale one'}
      - {code: E_RATE_LIMIT, cause: repeated exports of overlapping periods, message: Too many attempts. Try again shortly., note: this pattern is a bulk extraction assembled from pieces and it is limited for that reason}
    edge_cases:
      - An export by a reader whose gates withheld fields. The file states which fields were withheld and under which gate. A recipient reading a partial file as complete is how a decision gets made on data somebody was deliberately not shown.
      - Two readers exporting the same report and receiving different files. Correct and expected, and the watermark identifies whose file each is. Without it two partial files circulate and neither can be attributed.
      - An export link forwarded outside the tenant. The link expires and is non-guessable, and the watermark in the file identifies who took it. The model cannot prevent forwarding and makes the copy attributable, which is the honest limit of what it can do.
      - An auditor exporting an entire period as evidence. Supported and is a legitimate primary use, and it is exactly the same path with the same audit record as any other export. There is no privileged export that avoids the trail.
      - An export requested for a run whose small-population cells were suppressed. The suppression carries into the file. Exporting is never a route to the cells the interface withheld.

rules:
  - key: every_metric_names_its_decision
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'decision_question is mandatory on every metric and every report. A metric or report that cannot name the decision it informs is refused.'
    on_conflict: not overridable
    rationale: The kernel excludes dashboards on exactly this ground - a view with no primary task is decoration and everybody pays for it.

  - key: time_basis_is_explicit
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'time_basis has no default at any scope and must be stated on every metric.'
    on_conflict: not overridable
    rationale: Counting by business time and by system time gives different answers whenever anything arrives late, and an unstated basis means two people comparing one metric are comparing different things.

  - key: definitions_are_versioned_never_edited
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A metric definition with any published figure is superseded rather than edited, and every figure records the version it was computed under.'
    on_conflict: not overridable

  - key: scheduled_reports_run_per_recipient
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A scheduled report is executed once per recipient under that recipient''s own scope. It is never executed once and distributed.'
    on_conflict: not overridable
    rationale: Running once under the author's scope and distributing discloses to every recipient everything the author can see, and it is the single most likely disclosure in a reporting capability.

  - key: aggregates_are_projected_like_rows
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'Counts, sums and every other aggregate are computed only over records the reader may see. The count of suppressed records is recorded and never rendered.'
    on_conflict: not overridable

  - key: truncation_is_forbidden
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A run exceeding its row limit fails with the reason. It never returns a truncated result.'
    on_conflict: not overridable
    rationale: A truncated report renders identically to a complete one and is acted on as though it were complete.

  - key: export_is_never_a_route_around_a_gate
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'An export carries the same field projection and the same small-population suppression as its run, names the withheld fields in the file, is watermarked with its requester, expires, and is audited.'
    on_conflict: not overridable

  - key: small_population_suppression
    kind: policy
    scope: capability
    overridable_at: tenant
    default: >
      A cell computed over fewer than min_population_for_cell distinct subjects (default 5) is
      suppressed, and the run states that suppression occurred without stating where. A tenant
      may raise the threshold and may not lower it below 2.
    on_conflict: the higher threshold wins
    rationale: >
      A per-person figure presented as an aggregate is a performance record about an individual
      wearing the costume of a report, and in a small team almost every breakdown becomes one.

policy_knobs:
  - {key: draft_metric_stale_days, default: 21, range: [1, 180]}
  - {key: draft_report_stale_days, default: 21, range: [1, 180]}
  - {key: unused_metric_days, default: 180, range: [7, 730]}
  - {key: unopened_report_days, default: 90, range: [7, 730]}
  - {key: definition_shift_alert, default: 0.5, range: [0.01, 100]}
  - {key: exclusion_share_alert, default: 0.1, range: [0.001, 1.0]}
  - {key: freshness_target_minutes, default: 60, range: [1, 1440]}
  - {key: run_timeout_seconds_interactive, default: 60, range: [5, 600]}
  - {key: run_timeout_seconds_scheduled, default: 600, range: [30, 7200]}
  - {key: default_row_limit, default: 1000, range: [10, 100000]}
  - {key: max_export_rows, default: 100000, range: [100, 5000000]}
  - {key: min_population_for_cell, default: 5, range: [2, 100]}
  - {key: run_retention_days, default: 400, range: [30, 2555], note: 'longer than a year deliberately, so a figure quoted in an annual review remains reproducible'}
  - {key: export_link_expiry_hours, default: 24, range: [1, 168]}
  - {key: export_queue_lag_minutes, default: 5, range: [1, 120], lowest_settable_scope: kernel}
  - {key: export_generation_minutes, default: 15, range: [1, 240]}
  - {key: undownloaded_export_days, default: 3, range: [1, 60]}

open_questions:
  - {q: 'What are the revenue, margin and utilisation definitions? Several capabilities have raised the same question from their own side - how a comp is treated, whether a return is a reversal or a negative transaction, how revenue is recognised across a period boundary - and this capability is where those answers become numbers people act on. None of them is answered anywhere.', assumption: None. The model provides the machinery for agreeing definitions and contains no definitions., confidence: VALIDATION_REQUIRED, method: 'a single accounting review resolving the comp, return, recognition and write-off treatments together, since answering them separately produces figures that do not reconcile', priority: Critical, blocks: [order comp treatment, order return treatment, billing revenue recognition, inventory valuation reporting]}
  - {q: 'Is small-population suppression at 5 correct, and does it make reporting unusable for the smallest tenants? A business with four people has no breakdown that survives the threshold, which means the capability does almost nothing for exactly the customers who most need simple answers.', assumption: 'Threshold 5, lowerable to 2 but never to 1. It will make most breakdowns unusable in a very small tenant.', confidence: VALIDATION_REQUIRED, method: 'model the effect at the p10 tenant size, and decide whether suppression should apply to person-dimension breakdowns only rather than to all', priority: High, blocks: [min_population_for_cell, small-tenant usefulness]}
  - {q: 'Should reporting run against the operational database at all? Where the change feed is unbound it does, which puts an unbounded aggregate query on the same store as the transaction that records somebody arriving for work.', assumption: 'Yes, bounded by a short timeout and a row limit. That is a mitigation rather than an answer.', confidence: VALIDATION_REQUIRED, method: load test an aggregate at the p95 tenant size concurrently with a shift-change attendance burst, priority: Critical, blocks: [change_feed specification, performance budget]}
  - {q: 'Who may see a report that breaks down performance by individual? The model gates it by permission and applies small-population suppression, and takes no position on whether individual performance reporting should exist, which is a labour-relations question rather than a technical one.', assumption: None. The machinery permits it and the model expresses no view., confidence: VALIDATION_REQUIRED, method: 'operator interviews and a review of what the target customers'' own obligations require, alongside the same question raised by core_audit about subject visibility', priority: High}
  - {q: 'Does the tenant need reports at all in v1, or would a small number of fixed, pack-shipped answers serve better than a definition-agreement mechanism? The machinery here is substantial and its value depends entirely on tenants having questions the pack did not anticipate.', assumption: None. This capability may be over-specified for the target segments and is deliberately not being trimmed on a guess., confidence: VALIDATION_REQUIRED, method: measure how many pilot tenants create a metric of their own within a quarter, priority: High}
