key: people
name: People
layer: domain
confidence: KNOWN
description: >
  The workforce as an operational resource - who is engaged, what they are qualified to do,
  when those qualifications expire, how long they may work, and what documents evidence
  all of it. This capability answers "may this person do this work here today". It is not
  payroll and it is not a human resources suite.

principles:
  - A person's identity lives in party and their ability to sign in lives in core_identity_session. This capability holds only the engagement and the competence. Three copies of a phone number is the failure this separation prevents.
  - A qualification without an expiry is a qualification nobody will ever re-check. Expiry is mandatory even where the value is "never", because "never" is then a recorded decision rather than an omission.
  - Working-hour limits are a safety and contractual constraint, not a reporting metric. They are evaluated before an assignment is accepted, not discovered afterwards in a report.
  - Engagement kinds differ enormously and Verity models the shape rather than the label. Whether somebody is permanent, contracted, agency-supplied or engaged by the day changes what is checked, and the check is configuration.
  - A person who cannot be assigned must have exactly one legible reason. Five overlapping conditions each individually blocking produces a dispatcher who stops trusting the software.

entities:

  - key: workforce_member
    name: Workforce Member
    description: One person's engagement with the tenant - the operational record, not the identity record.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: party_ref, type: uuid, req: true, note: 'the person, resolved through the party_directory port. Deliberately not a foreign key - party is another capability and kernel K04 forbids a concrete cross-capability reference'}
      - {key: member_code, type: string, req: true, unique_scope: tenant, note: 'the short identifier used on rosters, on reports and out loud'}
      - {key: engagement_kind, type: enum, values: [direct_permanent, direct_fixed_term, contracted, supplied_by_third_party, engaged_per_period], req: true, note: 'shapes, not labels. Which shape a tenant calls what is a terminology map concern'}
      - {key: supplying_party_ref, type: uuid, nullable: true, note: 'required when engagement_kind is supplied_by_third_party, resolved through the party_directory port'}
      - {key: primary_location_ref, type: uuid, nullable: true, note: resolved through the org_structure port; drives the site partition and the default scope of who can see this record}
      - {key: engaged_from, type: date, req: true}
      - {key: engaged_to, type: date, nullable: true}
      - {key: notice_period_days, type: int, nullable: true}
      - {key: cost_rate_minor, type: money_minor, nullable: true, financial: true, note: the cost to the tenant per unit of the rate basis. Gated by view_financial and never offline_editable}
      - {key: cost_rate_basis, type: enum, values: [per_hour, per_day, per_period, per_assignment], nullable: true, financial: true}
      - {key: max_hours_per_day, type: decimal, nullable: true}
      - {key: max_hours_per_week, type: decimal, nullable: true}
      - {key: min_rest_hours_between_assignments, type: decimal, nullable: true}
      - {key: max_consecutive_days, type: int, nullable: true}
      - {key: availability_pattern, type: json, nullable: true, note: 'a flat weekly pattern of scalars, per the object-valued prohibition. Exceptions live on absence records rather than being nested here'}
      - {key: emergency_contact_ref, type: uuid, nullable: true, sensitive: true, note: another party resolved through the party_directory port}
      - {key: bank_reference_ref, type: string, nullable: true, financial: true, sensitive: true, note: 'a reference to a stored payment instrument held by the integrations capability, never the account number. This capability must never hold a payment credential'}
      - {key: exit_reason, type: text, nullable: true}
      - {key: rehire_eligible, type: enum, values: [unknown, yes, no], req: true, default: unknown}
    invariants:
      - unique(tenant_id, party_ref) among non-ended members. One person has one engagement at a time with one tenant. A person genuinely holding two concurrent engagement kinds is two members with a recorded relationship, so that hours limits can be evaluated across both rather than separately.
      - engaged_to, where set, must be on or after engaged_from.
      - supplying_party_ref is non-null exactly when engagement_kind is supplied_by_third_party.
      - Financial fields are gated by view_financial and are never offline_editable, per the kernel rule. A cost rate edited on a device that has been offline for two days is a rate set against stale information and it flows straight into billing.
      - A member may not be assigned work while in any state other than active. This is one condition, evaluated in one place, so that the reason a person is unassignable is always singular and legible.
    states: [onboarding, active, on_leave, suspended, notice, ended]
    initial_state: onboarding
    transitions:
      - {from: onboarding, to: active, action: activate_member, actor: 'ops_manager, supervisor or tenant_admin', guard: 'every qualification the tenant marks mandatory_for_engagement is held and unexpired, and engaged_from is on or before today', side_effects: the member becomes schedulable and is published through the schedulable_resource port, reversibility: true}
      - {from: active, to: on_leave, action: start_absence, actor: 'the member, supervisor or ops_manager', guard: an absence record covering today exists, side_effects: 'existing future assignments within the absence window are flagged to the dispatcher, never silently released', reversibility: true}
      - {from: on_leave, to: active, action: end_absence, actor: 'the member, supervisor or ops_manager', guard: no absence record covers today, side_effects: none, reversibility: true}
      - {from: active, to: suspended, action: suspend_member, actor: ops_manager or tenant_admin, guard: acting session elevated and a reason is supplied, side_effects: 'unschedulable immediately, future assignments flagged, the schedulable_resource port reports unavailable with a reason code but never the reason text', reversibility: true}
      - {from: on_leave, to: suspended, action: suspend_member, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: suspended, to: active, action: reinstate_member, actor: ops_manager or tenant_admin, guard: acting session elevated and a reason is supplied, side_effects: none, reversibility: true}
      - {from: active, to: notice, action: give_notice, actor: 'the member, ops_manager or tenant_admin', guard: an end date is supplied, side_effects: assignments beyond the end date are flagged to the dispatcher with the count and the dates, reversibility: true}
      - {from: notice, to: active, action: withdraw_notice, actor: ops_manager or tenant_admin, guard: a reason is supplied, side_effects: none, reversibility: true}
      - {from: notice, to: ended, action: end_engagement, actor: ops_manager or tenant_admin, guard: 'now is on or after engaged_to, and every assignment beyond that date has been reassigned or explicitly abandoned', side_effects: 'unschedulable, removed from the schedulable_resource port, operational history retained and attributed', reversibility: false}
      - {from: suspended, to: ended, action: end_engagement, actor: ops_manager or tenant_admin, guard: as above, side_effects: as above, reversibility: false}
      - {from: onboarding, to: ended, action: end_engagement, actor: ops_manager or tenant_admin, guard: never activated, side_effects: none, reversibility: false}
    stuck_state_policy:
      onboarding: >
        The most consequential queue in this capability. A member stuck in onboarding is a
        person who believes they have a job and whom the dispatcher cannot assign, and the
        two facts usually meet at 5am on the first day. Threshold:
        onboarding_stale_days (default 7), and immediately once engaged_from has passed while
        still onboarding. Told: the recruiting principal and the supervisor of the primary
        location, and the notification names the SPECIFIC missing qualification or document
        rather than saying onboarding is incomplete. Escape hatch: supply what is missing,
        or activate with a recorded override where the tenant's rule permits overriding, or
        end the engagement. Verity never auto-activates, because activating without a
        mandatory qualification is exactly the failure the qualification exists to prevent.
      active: >
        Steady state. Three monitored exceptions. (a) A member with a qualification expiring
        within qualification_warning_days who has assignments beyond the expiry - a person
        scheduled to do work they will not be permitted to do. Told: the member, the
        supervisor and the dispatcher, at 60, 30 and 7 days. (b) A member who has exceeded a
        working-hour limit in the trailing period - reported even though the limit is
        enforced at assignment time, because retrospective breaches arrive through absence
        cover and manual overrides. Told: the supervisor and ops_manager, daily. (c) A member
        with no assignment for unassigned_member_days (default 30) while their engagement
        kind implies regular work. Told: ops_manager, as a list. This is usually somebody who
        left without anyone recording it, and every per-head metric is wrong until it is
        resolved.
      on_leave: >
        Bounded by the absence record, which always has an end date. The monitored exception
        is leave that overruns its recorded end by absence_overrun_days (default 3) with no
        extension recorded. Told: the supervisor. Escape hatch: extend the absence, or return
        the member to active, or move to suspended pending an explanation. Verity does not
        auto-return a member to active on the recorded end date, because a member who is
        automatically made schedulable and then does not appear produces an unstaffed
        commitment, which is the outcome this capability exists to avoid.
      suspended: >
        Threshold: member_suspension_review_days (default 21) - deliberately shorter than the
        equivalent review elsewhere, because a suspended person is usually unpaid and the cost
        of a forgotten suspension falls on them. Told: the suspending principal and
        ops_manager, escalating to tenant_owner at twice the threshold. Escape hatch:
        reinstate or end. No automatic resolution in either direction.
      notice: >
        Bounded by engaged_to. The monitored exception is assignments existing beyond the
        end date, reported continuously rather than on a timer, with the count and the dates,
        to the dispatcher. Escape hatch: reassign them. At 7 days before the end date, and
        again at 1 day, the dispatcher is told regardless of whether anything has changed,
        because the failure mode is silence rather than disagreement.
      ended: >
        Terminal. The record is retained permanently and remains the attribution target for
        every hour worked, every piece of work completed and every document signed. Nothing
        pends. Re-engagement creates a NEW member row rather than reviving this one, so the
        gap is visible - which also means the rehire identity question filed against
        core_identity_session bites here too.

  - key: qualification
    name: Qualification
    description: A competence, certification, clearance or check that a person holds, with a validity period and evidence.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: member_id, type: uuid, req: true, fk: workforce_member}
      - {key: qualification_type_id, type: uuid, req: true, fk: qualification_type}
      - {key: reference, type: string, nullable: true, sensitive: true, note: 'the issuing body''s reference. Sensitive because it is frequently a personal identifier'}
      - {key: issued_on, type: date, nullable: true}
      - {key: valid_from, type: date, req: true}
      - {key: valid_to, type: date, nullable: true, note: 'null means it does not expire, which is legal only where the qualification_type declares never_expires. Otherwise a null here is a validation error rather than a permanent qualification'}
      - {key: evidence_ref, type: string, nullable: true, note: reference through the evidence_capture port to the stored document}
      - {key: verified_by_principal_id, type: uuid, nullable: true, note: resolved through the principal_directory port}
      - {key: verified_at, type: timestamptz, nullable: true}
      - {key: verification_method, type: enum, values: [none, document_seen, issuer_checked, third_party_attested], req: true, default: none, note: 'issuer_checked is materially stronger than document_seen and the two must never be conflated, because a forged document passes one and not the other'}
    invariants:
      - valid_to is required unless the qualification_type declares never_expires. A qualification with an unexplained open-ended validity is one nobody will ever re-check.
      - valid_to >= valid_from.
      - A qualification marked mandatory_for_engagement by its type may not be missing while the member is active. Enforced at activation and re-evaluated on expiry.
      - verification_method=none is permitted and is always visible wherever the qualification is shown. An unverified qualification that renders identically to a verified one is worse than no record.
    states: [claimed, verified, expiring, expired, revoked]
    initial_state: claimed
    transitions:
      - {from: claimed, to: verified, action: verify_qualification, actor: 'supervisor, ops_manager or tenant_admin', guard: 'a verification method other than none is recorded, and evidence is attached where the type requires it', side_effects: the qualification begins to count toward assignment eligibility, reversibility: true}
      - {from: verified, to: claimed, action: unverify_qualification, actor: ops_manager or tenant_admin, guard: a reason is supplied, side_effects: 'eligibility withdrawn, affected assignments listed to the dispatcher', reversibility: true}
      - {from: verified, to: expiring, action: observe_expiry_window, actor: system_scheduler, guard: 'valid_to is not null and now > valid_to minus qualification_warning_days', side_effects: 'the member, supervisor and dispatcher are told, and assignments beyond valid_to are listed', reversibility: true}
      - {from: expiring, to: verified, action: renew_qualification, actor: 'supervisor, ops_manager or tenant_admin', guard: a new valid_to is supplied with evidence where the type requires it, side_effects: 'the warning clears; the renewal is a new version of this row rather than a second row, so the history reads as one continuous qualification', reversibility: true}
      - {from: expiring, to: expired, action: observe_expiry, actor: system_scheduler, guard: 'now > valid_to', side_effects: 'eligibility withdrawn immediately, assignments beyond now that required it are flagged to the dispatcher as at risk, never silently cancelled', reversibility: true}
      - {from: verified, to: expired, action: observe_expiry, actor: system_scheduler, guard: 'now > valid_to and the warning window was never observed', side_effects: as above, reversibility: true}
      - {from: expired, to: verified, action: renew_qualification, actor: 'supervisor, ops_manager or tenant_admin', guard: as for renewal from expiring, side_effects: 'eligibility restored from the new valid_from, never backdated over the gap', reversibility: true}
      - {from: verified, to: revoked, action: revoke_qualification, actor: ops_manager or tenant_admin, guard: acting session elevated and a reason is supplied, side_effects: eligibility withdrawn immediately and every affected assignment is escalated rather than merely listed, reversibility: false}
      - {from: claimed, to: revoked, action: revoke_qualification, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: expiring, to: revoked, action: revoke_qualification, actor: as above, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      claimed: >
        An unverified claim is the normal state of a qualification typed in from a photograph
        on a phone, and it counts for nothing. The risk is that everyone assumes it counts.
        Threshold: claimed_qualification_stale_days (default 14). Told: the supervisor of the
        member's primary location. Escape hatch: verify or delete. The member's own record
        shows the qualification as not yet verified in the same place the dispatcher sees it,
        so the two never hold different beliefs about it.
      verified: >
        Steady state, bounded by valid_to where one exists. The monitored exception is a
        qualification of a type whose issuer can be checked directly but whose
        verification_method is only document_seen, for longer than
        weak_verification_review_days (default 180). Told: ops_manager, as a list, quarterly.
        Advisory, because upgrading a verification usually requires the issuer's cooperation
        and the tenant may have no way to get it.
      expiring: >
        Bounded by valid_to. The point of the state is that somebody acts before it lapses.
        Notifications at 60, 30 and 7 days, and daily in the final week, to the member, the
        supervisor and - only where assignments exist beyond the expiry - the dispatcher.
        Escape hatch: renew, or accept the lapse and let the assignments be reassigned.
        Verity never auto-renews and never extends a validity period on the strength of a
        renewal being in progress, because a qualification that is being renewed is not a
        qualification that is valid.
      expired: >
        Threshold: immediate. An expired mandatory qualification makes the member
        unassignable, which is a live operational problem rather than a queue. Told: the
        dispatcher and the supervisor at the moment of expiry, with the specific assignments
        at risk. Escalation continues daily until renewed, revoked, or the member is moved
        out of active. Escape hatch: renew, or reassign the work. The one thing that must not
        happen is the assignment silently proceeding, which is why the expiry withdraws
        eligibility immediately rather than at the next assignment attempt.
      revoked: >
        Terminal. Retained permanently as the record that the qualification was held and was
        withdrawn, with the reason, because that is precisely the question asked after an
        incident. Nothing pends.

  - key: qualification_type
    name: Qualification Type
    description: The definition of a kind of competence - how long it lasts, whether it may be self-declared, whether it blocks engagement, and what evidence it needs.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true}
      - {key: never_expires, type: bool, req: true, default: false}
      - {key: default_validity_months, type: int, nullable: true}
      - {key: mandatory_for_engagement, type: bool, req: true, default: false}
      - {key: evidence_required, type: bool, req: true, default: true}
      - {key: self_declarable, type: bool, req: true, default: false, note: whether the member may claim it themselves. A self-declarable qualification that is also mandatory_for_engagement is a contradiction and is rejected}
      - {key: renewal_lead_days, type: int, req: true, default: 60}
      - {key: source_pack_key, type: string, nullable: true}
    invariants:
      - never_expires and default_validity_months are mutually exclusive.
      - A type that is mandatory_for_engagement may not be self_declarable. Allowing a person to self-certify the thing that gates their engagement removes the gate.
      - Deleting a type is not offered while any qualification references it. Types are archived, because an incident review needs to resolve what a historical qualification meant.
    states: [active, archived]
    initial_state: active
    transitions:
      - {from: active, to: archived, action: archive_qualification_type, actor: ops_manager or tenant_admin, guard: no active member depends on it as mandatory_for_engagement, side_effects: 'removed from pickers, existing qualifications continue to resolve', reversibility: false}
    stuck_state_policy:
      active: >
        Not a queue. The monitored exception is a type marked mandatory_for_engagement that
        no active member holds, which means either it was created and never applied or every
        member is out of compliance - two very different situations that look identical in a
        list. Told: ops_manager, with which of the two it is. Escape hatch: apply it, relax
        it, or archive it.

  - key: absence
    name: Absence
    description: A recorded period during which a member is not available, whatever the reason.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: member_id, type: uuid, req: true, fk: workforce_member}
      - {key: absence_kind, type: enum, values: [planned_leave, unplanned_absence, medical, statutory, unpaid, training, other], req: true}
      - {key: starts_at, type: timestamptz, req: true}
      - {key: ends_at, type: timestamptz, req: true}
      - {key: is_part_period, type: bool, req: true, default: false}
      - {key: reason_text, type: text, nullable: true, sensitive: true, note: sensitive because a reason for a medical absence is health information. The KIND is visible to a dispatcher; the reason is not}
      - {key: evidence_ref, type: string, nullable: true, sensitive: true}
      - {key: notified_at, type: timestamptz, nullable: true, note: 'when the member told the tenant, which is a different fact from when the absence started and is the fact that matters for an unplanned absence'}
      - {key: approved_by_principal_id, type: uuid, nullable: true}
      - {key: affects_availability, type: bool, req: true, default: true, note: 'false for a training absence that still counts as engaged. Explicit because the alternative is inferring it from the kind, which is wrong for at least one tenant'}
    invariants:
      - ends_at > starts_at.
      - Overlapping absences for one member are rejected at write time. Two overlapping absences make "is this person available" unanswerable without a precedence rule nobody has agreed.
      - reason_text and evidence_ref are gated by view_sensitive. A dispatcher needs to know somebody is absent and does not need to know why.
      - An absence may not be deleted once any assignment decision was taken against it. It is cancelled, which leaves the record of the decision intact.
    states: [requested, approved, active, completed, cancelled, rejected]
    initial_state: requested
    transitions:
      - {from: requested, to: approved, action: approve_absence, actor: supervisor or ops_manager, guard: 'the approver is not the member, unless the tenant permits self-approval for this kind', side_effects: 'assignments in the window are flagged to the dispatcher, and the backfill port is notified where one is bound', reversibility: true}
      - {from: requested, to: rejected, action: reject_absence, actor: supervisor or ops_manager, guard: a reason is supplied, side_effects: the member is told with the reason, reversibility: true}
      - {from: approved, to: active, action: observe_absence_start, actor: system_scheduler, guard: 'now >= starts_at', side_effects: the member moves to on_leave and the schedulable_resource port reports unavailable, reversibility: false}
      - {from: requested, to: active, action: record_unplanned_absence, actor: 'the member, supervisor or dispatcher', guard: absence_kind is unplanned_absence or medical and starts_at is now or in the past, side_effects: 'immediate unavailability, backfill port notified, approval becomes retrospective', reversibility: false, note: the path that matters most operationally. Somebody not turning up cannot wait for an approval workflow}
      - {from: active, to: completed, action: observe_absence_end, actor: system_scheduler, guard: 'now >= ends_at', side_effects: the member returns to active unless another absence covers now, reversibility: false}
      - {from: approved, to: cancelled, action: cancel_absence, actor: 'the member, supervisor or ops_manager', guard: a reason is supplied, side_effects: the member becomes available again; assignments released to cover the absence are NOT automatically taken back, reversibility: false}
      - {from: active, to: cancelled, action: cancel_absence, actor: supervisor or ops_manager, guard: a reason is supplied and the acting principal is not the member, side_effects: as above, reversibility: false}
    stuck_state_policy:
      requested: >
        An unanswered leave request is the most common quiet grievance in a workforce.
        Threshold: absence_approval_hours (default 48), or immediately if starts_at is within
        that window. Told: the approving supervisor, escalating to ops_manager, and the
        member is shown that it is still awaiting an answer rather than being left to guess.
        Escape hatch: approve or reject. Verity never auto-approves and never auto-rejects. A
        request that reaches its start date unanswered stays requested and is escalated
        loudly, because the member will act on their own assumption either way and the
        dispatcher needs to know which.
      approved: >
        Bounded by starts_at. The monitored exception is an approved absence whose window
        overlaps an assignment that was never reassigned, reported continuously to the
        dispatcher rather than on a timer, because the cost lands on the day.
      active: >
        Bounded by ends_at. The monitored exception is overrun - see the on_leave stuck policy
        on workforce_member, which is where the operationally significant thresholds live and
        is deliberately not duplicated here.
      completed: >
        Terminal. Retained. Nothing pends.
      cancelled: >
        Terminal. Retained with the reason, because a cancelled absence and an absence that
        never existed are different facts when somebody asks why cover was arranged.
      rejected: >
        Terminal. Retained with the reason. Nothing pends. A rejection is not a queue, but the
        rate of rejection by approver is a reportable metric, because an approver who rejects
        everything and an approver who approves everything are both problems.

ports:
  - port_key: party_directory
    direction: requires
    contract: Resolve party_ref, supplying_party_ref and emergency_contact_ref to display names, contactable channels and permission scope.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. A workforce member is an engagement OF a person. Without the person there is nothing to engage, and duplicating the person here is the failure this capability is designed around.

  - port_key: org_structure
    direction: requires
    contract: Resolve primary_location_ref and the site partition, and expose the location hierarchy so that a member's visibility can be scoped.
    cardinality: zero_or_one
    unbound_behaviour: 'primary_location_ref cannot be set. Every member is visible at tenant scope only, which is a materially weaker privacy posture than the model intends and is stated as such, because a workforce list visible to every supervisor in a large tenant is a disclosure.'

  - port_key: schedulable_resource
    direction: provides
    contract: >
      Publish each active member as a resource with availability, capacity, a qualification
      set and calendar exceptions. The contract carries a reason CODE when a member is
      unavailable and never the reason TEXT, because the text may be health information and
      the scheduler has no business reading it.
    cardinality: zero_or_many

  - port_key: evidence_capture
    direction: requires
    contract: Store and resolve qualification documents and absence evidence with tamper evidence, returning references rather than content.
    cardinality: zero_or_one
    unbound_behaviour: >
      Qualifications may be recorded with verification_method=document_seen and no attached
      document. Any qualification_type with evidence_required=true cannot be verified at all,
      so its members cannot be activated. This is a hard degradation and the pack must either
      bind the port or ship no evidence-required types.

  - port_key: approval_chain
    direction: requires
    contract: Route absence requests and qualification overrides for approval, resolving approvers from role and scope.
    cardinality: zero_or_one
    unbound_behaviour: 'Absences are approved by any principal holding approve on absence at a scope covering the member, and qualification overrides are recorded with the overriding principal and a mandatory reason. The audit note records that no chain was configured.'

  - port_key: backfill_request
    direction: requires
    contract: Signal that a member has become unavailable for a period during which they hold commitments, so cover can be sought.
    cardinality: zero_or_one
    unbound_behaviour: 'Assignments in the affected window are flagged to the dispatcher as a list and nothing is dispatched. The list is produced whether or not anyone is watching it, which is weaker than a dispatch but is not silence.'

  - port_key: notification
    direction: requires
    contract: Deliver expiry warnings, absence decisions, onboarding-incomplete and hours-breach messages.
    cardinality: zero_or_one
    unbound_behaviour: Everything degrades to console lists. Qualification expiry in particular becomes invisible-by-default, which is the single most consequential degradation in this capability and is stated in the port doc.

actions:

  - key: engage_member
    entity: workforce_member
    label: Engage someone
    actors: [tenant_admin, ops_manager, supervisor]
    preconditions: [the party exists and is not blocked, no non-ended member already exists for this party in this tenant, engaged_from is supplied]
    inputs: [party_ref, member_code, engagement_kind, supplying_party_ref, primary_location_ref, engaged_from, engaged_to, availability_pattern, hours_limits]
    creates: [workforce_member, qualification rows in state claimed for every mandatory type]
    updates: []
    events: [workforce_member.engaged]
    notifications:
      - {to: the engaging principal and the supervisor of the primary location, channel: in_app, when: always, template: onboarding_started, must_include: [member_display_name, missing_mandatory_qualifications]}
    undoable: true
    reversal_action: end_engagement while still onboarding
    audit_class: always
    idempotency_key_source: 'tenant_id plus party_ref plus engaged_from. A re-run of an onboarding import returns the existing member rather than creating a second engagement.'
    offline_policy: refuse
    concurrency: Unique index over (tenant_id, party_ref) among non-ended rows. A concurrent second engagement loses and resolves to the idempotent return above.
    failure_modes:
      - {code: E_CONFLICT_UNIQUE, cause: an active engagement already exists for this party, message: This person is already engaged., note: offers the existing record}
      - {code: E_PRECONDITION, cause: the party is blocked, message: This action is not available in the current state.}
      - {code: E_VALIDATION, cause: engagement_kind is supplied_by_third_party with no supplying party, message: Choose the supplying organisation.}
      - {code: E_AUTHZ_FIELD, cause: cost rate supplied without view_financial, message: null, note: the field is dropped and the creator is told which fields were not saved}
      - {code: E_QUOTA, cause: headcount limit reached, message: Plan limit reached.}
      - {code: E_DEPENDENCY, cause: party_directory unavailable, message: A required service is unavailable., note: 'engagement is blocked rather than proceeding with a dangling reference, because a member whose person cannot be resolved cannot be paid, contacted or identified'}
    edge_cases:
      - Engaging somebody who previously ended an engagement with this tenant. A new member row is created and the old one is retained. The new record shows the previous engagement and its rehire_eligible value prominently, because that is the fact the person engaging needs and it is exactly the fact a fresh record hides.
      - Engaging somebody who is simultaneously engaged by a different tenant. Entirely legal and invisible - the two tenants cannot see each other. This means working-hour limits are enforceable only within one tenant, which is a real limitation with a safety dimension and is flagged in open_questions rather than papered over.
      - Engagement with engaged_from in the future. The member sits in onboarding and does not become active until that date, and the onboarding stuck policy does not start its clock until then.
      - Engaging with no mandatory qualifications defined at all. Activation succeeds immediately. This is correct for a tenant that has not configured any, and the surface says so rather than implying the person was checked.

  - key: verify_qualification
    entity: qualification
    label: Verify a qualification
    actors: [supervisor, ops_manager, tenant_admin]
    preconditions: [the qualification is in state claimed, a verification method other than none is chosen, evidence is attached where the type requires it]
    inputs: [qualification_id, verification_method, evidence_ref, valid_from, valid_to, reference]
    creates: []
    updates: [qualification state, verified_by_principal_id, verified_at]
    events: [qualification.verified]
    notifications:
      - {to: the member and the dispatcher, channel: in_app, when: the verification unblocks assignment eligibility, template: eligibility_changed}
    undoable: true
    reversal_action: unverify_qualification
    audit_class: always
    idempotency_key_source: qualification_id plus verification_method plus valid_to
    offline_policy: refuse
    concurrency: >
      Optimistic on the qualification row. Two supervisors verifying the same qualification
      concurrently converge because the write is idempotent on the same inputs and conflicts
      with E_CONFLICT_VERSION when the validity dates differ, which is a disagreement about
      the document rather than a race.
    failure_modes:
      - {code: E_VALIDATION, cause: valid_to null on a type that expires, message: Enter the expiry date., note: 'never defaulted from default_validity_months without showing the computed date for confirmation, because a silently computed expiry is one nobody will check against the document'}
      - {code: E_PRECONDITION, cause: evidence required by the type is absent, message: Attach the document.}
      - {code: E_VALIDATION, cause: valid_to in the past, message: This has already expired., note: 'accepted with an explicit acknowledgement, because recording a historically valid qualification is legitimate when reconstructing a record'}
      - {code: E_DEPENDENCY, cause: evidence_capture unavailable, message: A required service is unavailable., note: 'verification with document_seen is refused when the type requires evidence, and permitted when it does not'}
    edge_cases:
      - Verification by the member themselves. Refused for any type that is not self_declarable, and refused always for a mandatory_for_engagement type, which by invariant cannot be self-declarable anyway. The two rules are deliberately redundant.
      - A qualification verified against a document that later proves forged. Handled by revoke_qualification rather than by unverify, because revocation escalates the affected assignments and unverification only lists them. The distinction is the whole reason both actions exist.
      - Verifying with issuer_checked when the issuer's system is unavailable. Not permitted to record issuer_checked on the strength of an intention. The supervisor records document_seen and the weak-verification list picks it up later.
      - A renewal that arrives before the current validity ends. Recorded as a new version of the same qualification row with a continuous history, not a second row, so that "has this person held this continuously" is answerable - which is the question an incident review actually asks.

  - key: record_unplanned_absence
    entity: absence
    label: Record that somebody is not coming in
    actors: [supervisor, dispatcher, ops_manager, employee]
    rationale: >
      The action that everything downstream hangs off. It happens under time pressure, often
      by phone, often by somebody who is not the absent person, and it must be possible in
      under ten seconds on a bad connection.
    preconditions: [the member exists and is in state active or on_leave, no overlapping absence exists]
    inputs: [member_id, absence_kind, starts_at, ends_at, notified_at, reason_text, evidence_ref]
    creates: [absence]
    updates: [workforce_member state, schedulable_resource availability]
    events: [absence.recorded, member.became_unavailable]
    notifications:
      - {to: dispatcher, channel: push_and_in_app, when: the member holds commitments in the window, template: member_unavailable, must_include: [member_display_name, window, affected_commitment_count], priority: high, mandatory_operational: true}
      - {to: the supervisor of each affected location, channel: in_app, when: as above, template: member_unavailable}
    undoable: true
    reversal_action: cancel_absence
    audit_class: always
    idempotency_key_source: 'member_id plus starts_at truncated to the minute. Two people phoning in the same absence within the same minute produce one record, which is a genuine and frequent occurrence at shift change.'
    offline_policy: queue
    concurrency: >
      Overlap detection is performed under a lock on the member row, so two concurrent
      absences for one person cannot both commit. The loser is shown the winner's absence
      rather than a generic conflict, because the two records are usually the same absence
      reported twice and the person recording it needs to see that immediately.
    failure_modes:
      - {code: E_CONFLICT_UNIQUE, cause: an overlapping absence already exists, message: There is already an absence recorded for this period., note: shows the existing record}
      - {code: E_VALIDATION, cause: ends_at before starts_at, message: The end has to be after the start.}
      - {code: E_PRECONDITION, cause: the member is in state ended, message: This action is not available in the current state.}
      - {code: E_AUTHZ_FIELD, cause: reason_text supplied by a principal without view_sensitive, message: null, note: the field is dropped and the recorder is told. A dispatcher recording an absence by phone should not be able to write health information into a field they cannot read back}
      - {code: E_DEPENDENCY, cause: the backfill_request port is bound but unavailable, message: null, note: 'the absence still commits and the backfill signal is queued for retry. An absence that fails to record because a downstream service is down leaves a commitment looking staffed when it is not, which is the worst available outcome'}
    edge_cases:
      - Recorded offline by a supervisor with no signal. Queued, and the member is marked unavailable locally so the supervisor's own view is correct. On sync the backfill signal fires late, which is stated on the record - the gap between notified_at and recorded_at is retained and is exactly what a later dispute about cover examines.
      - Recorded by somebody other than the member, which is the normal case. The recording principal is captured separately from the member, and the member is notified that an absence was recorded for them - because an absence recorded against the wrong person is common at shift change and only the wrongly-marked person will notice.
      - An absence recorded for a period that has already partly elapsed and during which the person actually worked. The overlap with recorded presence is detected and surfaced rather than silently resolved. Verity does not decide whether the attendance or the absence is the truth; it presents both and makes somebody choose, because that choice has a pay consequence.
      - An absence whose kind is medical recorded by a dispatcher. The kind is visible, the reason is not writable by them, and the member and supervisor are told so that the sensitive detail can be added by somebody permitted to hold it.
      - Cancelling an absence after cover was arranged. The cover is NOT automatically released. The dispatcher is told and decides, because releasing a reliever who has already travelled to a location is a cost somebody has to own deliberately.

rules:
  - key: mandatory_qualification_blocks_activation
    kind: guard
    scope: capability
    overridable_at: tenant
    default: 'A member may not move to active while any qualification_type marked mandatory_for_engagement is missing, unverified or expired. A tenant may permit an override, which requires a reason, is time-boxed to override_max_days (default 14) and is reported weekly until resolved.'
    on_conflict: most specific scope wins, and an override is never implicit

  - key: working_hour_limits_evaluated_before_assignment
    kind: guard
    scope: capability
    overridable_at: site
    default: >
      An assignment that would breach max_hours_per_day, max_hours_per_week,
      min_rest_hours_between_assignments or max_consecutive_days is refused at assignment
      time. A site may set stricter limits. Relaxing below the member's own recorded limits
      is never permitted at any scope.
    on_conflict: the stricter limit always wins
    rationale: >
      Evaluated before acceptance rather than reported afterwards, because a breach
      discovered in a report is a breach that already happened to a person. The
      one-directional overridability - stricter yes, looser no - is what stops a
      configuration change becoming a safety change.

  - key: single_legible_blocking_reason
    kind: policy
    scope: kernel
    overridable_at: null
    default: >
      Where several conditions would make a member unassignable, the schedulable_resource
      port reports ONE reason, chosen by a fixed precedence - engagement state, then expired
      mandatory qualification, then absence, then hours limit. The full set is available on
      request but is never the default answer.
    on_conflict: not overridable
    rationale: A dispatcher shown five simultaneous blocking reasons stops reading them. One reason, always the most fundamental, is what keeps the message trusted.

  - key: absence_reason_is_sensitive
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'absence.reason_text and absence.evidence_ref are gated by view_sensitive. absence_kind is not. A scheduler learns that somebody is unavailable and never why.'
    on_conflict: not overridable

  - key: self_approval_of_absence
    kind: policy
    scope: capability
    overridable_at: tenant
    default: 'false for every kind. A tenant may enable self-approval per absence kind, which is legitimate for a small operation where the approver and the absent person are the same individual.'
    on_conflict: most specific scope wins

  - key: qualification_expiry_is_not_extended_by_renewal_in_progress
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A qualification being renewed is not a qualification that is valid. Eligibility is withdrawn on expiry regardless of renewal state.'
    on_conflict: not overridable

policy_knobs:
  - {key: onboarding_stale_days, default: 7, range: [1, 60]}
  - {key: unassigned_member_days, default: 30, range: [7, 365]}
  - {key: member_suspension_review_days, default: 21, range: [1, 180]}
  - {key: absence_overrun_days, default: 3, range: [1, 30]}
  - {key: absence_approval_hours, default: 48, range: [1, 336]}
  - {key: qualification_warning_days, default: 60, range: [7, 365]}
  - {key: claimed_qualification_stale_days, default: 14, range: [1, 90]}
  - {key: weak_verification_review_days, default: 180, range: [30, 730]}
  - {key: override_max_days, default: 14, range: [1, 90]}
  - {key: default_max_hours_per_day, default: null, note: 'null means no limit is enforced unless the member or the site sets one. Deliberately null rather than a number, because a shipped default here would be a shipped opinion about a matter that is contractual and jurisdictional'}
  - {key: default_min_rest_hours, default: null, note: as above}

open_questions:
  - {q: 'Working-hour limits are enforceable only within one tenant. A person engaged by two tenants on the same platform can be scheduled beyond any safe limit and neither tenant can see it. Is that acceptable, and if not, what cross-tenant signal is lawful and commercially tolerable?', assumption: 'None. This has a genuine safety dimension and any cross-tenant visibility is also a disclosure of one tenant''s workforce to another.', confidence: VALIDATION_REQUIRED, method: 'legal review of working-time obligations for the target engagement kinds, plus a commercial review of whether tenants would accept an anonymous aggregate signal', priority: Critical, blocks: [working_hour_limits rule, schedulable_resource port contract, party platform-scoping question]}
  - {q: 'What is the correct default for max hours and minimum rest? The model deliberately ships null, which means no limit is enforced until somebody configures one. That is honest and it also means the shipped product enforces nothing on day one.', assumption: Ship null and make the absence of a limit visible in the onboarding checklist rather than guessing a number., confidence: VALIDATION_REQUIRED, method: review of the contractual and statutory limits actually applicable across the target segments; the answer probably differs by engagement kind, priority: High, blocks: [default_max_hours_per_day, AET-06 decision count]}
  - {q: 'Does a qualification belong to the person or to the engagement? The current model attaches it to the member, so a person re-engaged after a gap re-enters their qualifications. Attaching it to the party would carry them across engagements and across tenants, which is more useful and is also a disclosure.', assumption: 'Attached to the member, which is the conservative choice.', confidence: WORKING_ASSUMPTION, method: 'pilot with a business that re-engages seasonally, measuring the re-entry cost', priority: Medium, blocks: [rehire identity continuity question in core_identity_session]}
  - {q: 'Should absence approval be able to consider the operational consequence - who else is off, whether cover exists - or is that a separate scheduling concern? Showing an approver the cover position makes approvals better and makes the decision partly about the roster rather than about the person.', assumption: 'The approver is shown the count of affected commitments, and nothing about other people''s absences.', confidence: WORKING_ASSUMPTION, method: usability test with a supervisor approving leave during a busy period, priority: Medium}
  - {q: 'The engagement_kind enum is a set of shapes, and whether these five shapes cover the target market has not been validated. A sixth shape discovered later is a breaking enum change under the versioning rules.', assumption: 'Five shapes, with other deliberately absent so that a missing shape is discovered rather than absorbed.', confidence: VALIDATION_REQUIRED, method: operator interviews across all five target segments, priority: High}
