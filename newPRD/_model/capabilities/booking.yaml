key: booking
name: Booking
layer: domain
confidence: KNOWN
description: >
  A counterparty or a consumer reserving a future slot against a resource, and everything
  that happens between the reservation and the slot - reminders, rescheduling, cancellation,
  non-attendance, deposits and waiting lists. It sits on top of scheduling rather than
  duplicating it: scheduling owns availability and assignment, booking owns the commitment
  made to the person who booked.

principles:
  - A hold is not a booking. The interval between choosing a slot and confirming it is where double-booking happens, and it is modelled explicitly with an expiry rather than left to a transaction.
  - The person who booked and the person the booking is for are frequently different, and both need to be reachable. Collapsing them loses the one who actually turns up.
  - Non-attendance is a fact with a cost, not a moral failure. It is recorded, its cost is configurable, and a system that punishes it by default will be configured wrongly by somebody.
  - A reminder is a cost as well as a courtesy. Channel, timing and volume are configuration, because messaging is real money in this market and an over-reminding default spends it.
  - Cancellation terms are contract-shaped, not code-shaped. What is refundable, when, and to whom differs by business and must be a rule with a shipped default.
  - Overbooking is a legitimate strategy and a dangerous default. It is expressible, off by default, and never silently applied.

entities:

  - key: booking
    name: Booking
    description: One reserved slot against a resource for a subject, with who booked it, who it is for, and its commercial terms.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: reference, type: string, req: true, unique_scope: tenant, immutable: true, note: the short code the person quotes when they telephone}
      - {key: booked_by_party_ref, type: uuid, nullable: true, note: 'who made the booking, resolved through the party_directory port. Null for an anonymous consumer booking that has not yet been resolved to a party'}
      - {key: subject_party_ref, type: uuid, nullable: true, note: 'who the booking is FOR, which is frequently not who made it. Separate field, because the reminder must reach the person who turns up and the receipt must reach the person who pays'}
      - {key: contact_channel_ref, type: uuid, nullable: true, note: 'which channel to use, resolved through the party_directory port with consent honoured'}
      - {key: location_ref, type: uuid, nullable: true, note: resolved through the org_structure port}
      - {key: offering_ref, type: uuid, nullable: true, note: 'what is being booked, resolved through the bookable_offering port. Opaque - this capability never learns what kind of thing it is'}
      - {key: requested_resource_ref, type: uuid, nullable: true, note: 'a specific resource the person asked for, resolved through the schedulable_resource port. Null means any suitable resource'}
      - {key: starts_at, type: timestamptz, req: true}
      - {key: ends_at, type: timestamptz, req: true}
      - {key: party_size, type: int, req: true, default: 1, note: how many the booking is for. A generic count; what is being counted belongs to the pack}
      - {key: channel, type: enum, values: [staff_entered, self_service_web, self_service_app, telephone, messaging, integration, walk_in], req: true, note: walk_in exists because a booking created at the moment of arrival is still a booking and excluding it makes every utilisation figure wrong}
      - {key: deposit_required_minor, type: money_minor, nullable: true, financial: true}
      - {key: deposit_paid_minor, type: money_minor, nullable: true, financial: true}
      - {key: deposit_reference, type: string, nullable: true, financial: true, note: the payment reference from the integrations capability. This capability never holds a payment credential}
      - {key: cancellation_policy_id, type: uuid, nullable: true, fk: cancellation_policy}
      - {key: cancellation_deadline_at, type: timestamptz, nullable: true, note: 'computed from the policy at confirmation and then frozen, because a person is told this date and it must not move'}
      - {key: notes, type: text, nullable: true}
      - {key: access_requirements, type: text, nullable: true, sensitive: true, note: 'anything the person needs in order to attend. Sensitive by default because it frequently discloses a health or personal circumstance, and it must still reach the person delivering the service'}
      - {key: source_waitlist_id, type: uuid, nullable: true, fk: waitlist_entry}
      - {key: rescheduled_from_booking_id, type: uuid, nullable: true, fk: booking}
      - {key: reschedule_count, type: int, req: true, default: 0}
      - {key: no_show_recorded_at, type: timestamptz, nullable: true}
      - {key: arrived_at, type: timestamptz, nullable: true}
    invariants:
      - ends_at > starts_at.
      - At least one of booked_by_party_ref and contact_channel_ref must be present at confirmation. A confirmed booking nobody can be reached about is a slot that will be held for somebody who never appears.
      - deposit_paid_minor may never exceed deposit_required_minor. An overpayment is a payment record, not a booking field.
      - Financial fields are gated by view_financial and are never offline_editable.
      - cancellation_deadline_at is frozen at confirmation. Recomputing it when a policy changes would move a deadline a person has already been told.
      - access_requirements is gated by view_sensitive on read AND is always available to the assigned resource at the time of service, because withholding it from the person delivering the service defeats its purpose.
    states: [held, pending_confirmation, confirmed, reminded, arrived, in_service, completed, cancelled, no_show, expired]
    initial_state: held
    transitions:
      - {from: held, to: pending_confirmation, action: confirm_booking, actor: 'the booking party, staff or integration', guard: the hold is unexpired and a deposit is required but not yet paid, side_effects: the slot remains held while payment is attempted, reversibility: true}
      - {from: held, to: confirmed, action: confirm_booking, actor: as above, guard: 'the hold is unexpired and no deposit is required, or the deposit is paid', side_effects: 'an assignment is requested through the scheduling port, cancellation_deadline_at frozen, confirmation sent', reversibility: true}
      - {from: pending_confirmation, to: confirmed, action: confirm_booking, actor: system on payment confirmation, guard: the deposit is paid, side_effects: as above, reversibility: true}
      - {from: held, to: expired, action: observe_hold_expiry, actor: system_scheduler, guard: 'now > hold expiry', side_effects: the slot is released and any waitlist for that slot is notified, reversibility: false}
      - {from: pending_confirmation, to: expired, action: observe_payment_window_expiry, actor: system_scheduler, guard: the payment window elapsed without confirmation, side_effects: as above, reversibility: false}
      - {from: confirmed, to: reminded, action: send_reminder, actor: system_scheduler, guard: a reminder step is due and the contact channel consents, side_effects: delivery recorded; a distinct state so that the reminder is emitted exactly once per step and so the un-reminded set is queryable, reversibility: false}
      - {from: confirmed, to: arrived, action: record_arrival, actor: 'staff, the person through a self-service surface, or a device', guard: null, side_effects: the assigned resource is told, reversibility: true}
      - {from: reminded, to: arrived, action: record_arrival, actor: as above, guard: null, side_effects: as above, reversibility: true}
      - {from: arrived, to: in_service, action: start_service, actor: staff or the assigned resource, guard: null, side_effects: the underlying assignment moves to in progress, reversibility: false}
      - {from: confirmed, to: in_service, action: start_service, actor: as above, guard: null, side_effects: as above, reversibility: false, note: 'arrival is frequently never recorded separately, and forcing it would produce a step people skip and data nobody trusts'}
      - {from: reminded, to: in_service, action: start_service, actor: as above, guard: null, side_effects: as above, reversibility: false}
      - {from: in_service, to: completed, action: complete_booking, actor: staff or the assigned resource, guard: null, side_effects: 'a billable outcome is emitted where the sink is bound, the deposit is applied or released per the policy', reversibility: false}
      - {from: confirmed, to: cancelled, action: cancel_booking, actor: 'the booking party, staff or the subject party', guard: a reason is supplied, side_effects: 'the slot is released, the waitlist for that slot is notified, the deposit is treated per the cancellation policy, the assignment is released', reversibility: false}
      - {from: reminded, to: cancelled, action: cancel_booking, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: arrived, to: cancelled, action: cancel_booking, actor: staff, guard: 'a reason is supplied and the acting principal is staff, not the booking party', side_effects: as above, reversibility: false, note: 'cancelling after arrival is the tenant''s failure rather than the person''s, and the deposit treatment differs accordingly'}
      - {from: pending_confirmation, to: cancelled, action: cancel_booking, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: confirmed, to: no_show, action: record_no_show, actor: staff or system_scheduler, guard: now is past starts_at plus no_show_grace_minutes and no arrival was recorded, side_effects: 'the slot is released, the deposit is treated per the policy, the person is told', reversibility: true}
      - {from: reminded, to: no_show, action: record_no_show, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: no_show, to: arrived, action: reverse_no_show, actor: staff, guard: 'the person appeared late, or the no-show was recorded in error, and a reason is supplied', side_effects: any no-show charge raised is reversed as a new adjustment rather than deleted, reversibility: false}
    stuck_state_policy:
      completed: >
        Terminal. The one thing still pending is downstream: where a billable_outcome_sink is
        bound, a completed booking whose outcome has not been acknowledged within
        outcome_ack_hours (default 4) is reported to platform_operator. Also monitored is a
        completed booking with an unapplied or unreleased deposit, told to finance, because a
        deposit held after the service is delivered is the tenant holding somebody's money
        for no reason.
      cancelled: >
        Terminal. Retained with the reason, the cancelling role, the charge position and the
        disclosure text that was in force, because that is what a charge dispute is settled
        with. The monitored exception is a calculated charge never collected or never waived
        for charge_settlement_days (default 14), told to finance - an uncollected charge and a
        forgiven one are different facts and leaving it ambiguous means the tenant does not
        know which policy it is actually running.
      expired: >
        Terminal. A hold or a pending payment that lapsed. Retained, because the rate of
        expiry against the rate of confirmation is the honest measure of whether a booking
        flow works, and because an expired payment attempt may still settle late at the
        provider - in which case the payment arrives with no booking behind it and finance is
        told rather than the money being silently absorbed. Nothing else pends.
      held: >
        A hold is the shortest-lived state in the platform and the one that causes the most
        damage when it leaks. Every stuck hold is a slot that appears unavailable and is not
        booked. Threshold: hold_expiry_minutes (default 10), enforced by the scheduler, and a
        platform alert where any hold survives more than twice that - which means the expiry
        sweep is not running and inventory is silently disappearing. Told: platform_operator
        for the sweep failure. Escape hatch: expire manually. Nobody is notified about an
        individual hold, because the person holding it is in the middle of a form.
      pending_confirmation: >
        Waiting on a payment that may never complete. Threshold: payment_window_minutes
        (default 15). Told: the booking party once, mid-window, with a resume link. Escape
        hatch: complete payment, or let it expire. Deliberately NOT held indefinitely - a
        booking whose payment is pending forever is a slot nobody can have.
      confirmed: >
        Steady state until the slot. Two monitored exceptions. (a) A confirmed booking with
        no underlying assignment for assignment_lag_minutes (default 30) - the person has a
        confirmation and nobody is allocated to deliver it. Told: the dispatcher, and this is
        the single most damaging quiet failure in the capability. (b) A confirmed booking
        whose contact channel has become suppressed or unreachable, meaning no reminder can
        be sent. Told: staff, so that a telephone call can substitute.
      reminded: >
        Bounded by the slot. Monitored exception: a reminder whose delivery was never
        confirmed. It does not retry on the same channel; it falls through to the next
        channel in the configured ladder, and where none remains the booking is listed to
        staff as unreachable. Silently retrying an undeliverable channel spends money and
        changes nothing.
      arrived: >
        The person is present and waiting. Threshold: waiting_alert_minutes (default 15) past
        starts_at. Told: the assigned resource and the location supervisor. Escape hatch:
        start the service, or tell the person what is happening. This state exists precisely
        so that somebody waiting is visible rather than being invisible between confirmed and
        in_service.
      in_service: >
        Bounded by ends_at. Monitored exception: in service beyond overrun_alert_minutes past
        ends_at (default 30), which delays every subsequent booking on that resource. Told:
        the location supervisor, with the count of bookings behind it. Escape hatch: complete,
        or extend explicitly so that subsequent bookings are rescheduled deliberately rather
        than each running late in turn.
      no_show: >
        Not a queue. The reversal window stays open for no_show_reversal_hours (default 4) -
        short, because a late arrival is a same-day event. Monitored condition is a pattern:
        a location whose no-show rate exceeds no_show_rate_alert (default 0.15) over a month,
        reported to ops_manager with the reminder delivery rate alongside, because the two
        together tell you whether the problem is the people or the reminders.

  - key: waitlist_entry
    name: Waitlist Entry
    description: Somebody who wants a slot that is not available, with what they will accept and how long they will wait for it.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: party_ref, type: uuid, nullable: true, note: resolved through the party_directory port}
      - {key: contact_channel_ref, type: uuid, req: true}
      - {key: location_ref, type: uuid, nullable: true}
      - {key: offering_ref, type: uuid, nullable: true}
      - {key: earliest_acceptable_at, type: timestamptz, req: true}
      - {key: latest_acceptable_at, type: timestamptz, req: true}
      - {key: acceptable_weekdays, type: json, nullable: true, note: flat list of scalars}
      - {key: party_size, type: int, req: true, default: 1}
      - {key: priority_rank, type: int, req: true, default: 0, note: 'position in the queue. Explicit rather than derived from creation order, so that a legitimate reordering is a recorded act rather than an invisible one'}
      - {key: offered_booking_id, type: uuid, nullable: true, fk: booking}
      - {key: offer_expires_at, type: timestamptz, nullable: true}
      - {key: offers_declined, type: int, req: true, default: 0}
      - {key: expires_at, type: timestamptz, req: true, note: 'when the entry lapses. Mandatory, because a waiting list with no expiry becomes a list of people who no longer want anything and the conversion rate collapses'}
    invariants:
      - latest_acceptable_at > earliest_acceptable_at.
      - expires_at is mandatory and may not be later than latest_acceptable_at. Waiting for a slot after the last acceptable time is not waiting.
      - An entry may hold at most one live offer. Offering two slots to one person and having them accept both is a double booking created by the waiting list itself.
      - priority_rank changes are audited with a reason. An unexplained reordering of a queue is the single fastest way to lose trust in a waiting list.
    states: [waiting, offered, converted, declined_out, expired, withdrawn]
    initial_state: waiting
    transitions:
      - {from: waiting, to: offered, action: offer_waitlist_slot, actor: system, guard: a matching slot became available and this entry is the highest-ranked match, side_effects: a HELD booking is created against the slot and the person is offered it with an expiry, reversibility: true}
      - {from: offered, to: converted, action: confirm_booking, actor: the waiting party or staff, guard: the offer is unexpired, side_effects: the held booking is confirmed and the entry closes, reversibility: false}
      - {from: offered, to: waiting, action: observe_offer_expiry, actor: system_scheduler, guard: the offer expired or was declined, side_effects: 'the held booking is released, offers_declined incremented, the next entry is offered', reversibility: true}
      - {from: waiting, to: declined_out, action: decline_waitlist, actor: the waiting party or system, guard: 'offers_declined exceeds max_waitlist_declines, or the person opts out', side_effects: the person is told they have been removed and how to rejoin, reversibility: true, note: removal after repeated declines is configurable and is never silent - being dropped from a queue without being told is worse than never being offered}
      - {from: declined_out, to: waiting, action: rejoin_waitlist, actor: the party or staff, guard: null, side_effects: 'priority_rank is reset to the end of the queue, which is stated to the person when they rejoin', reversibility: true}
      - {from: waiting, to: expired, action: observe_waitlist_expiry, actor: system_scheduler, guard: 'now > expires_at', side_effects: the person is told the entry has lapsed, reversibility: false}
      - {from: offered, to: expired, action: observe_waitlist_expiry, actor: system_scheduler, guard: 'now > expires_at', side_effects: the held booking is released and the person is told, reversibility: false}
      - {from: waiting, to: withdrawn, action: withdraw_waitlist, actor: the party or staff, guard: null, side_effects: none, reversibility: false}
      - {from: offered, to: withdrawn, action: withdraw_waitlist, actor: as above, guard: null, side_effects: the held booking is released, reversibility: false}
    stuck_state_policy:
      waiting: >
        A waiting list that never offers anything is a list of disappointed people. Threshold:
        an entry waiting past waitlist_silent_days (default 14) with no offer, reported not to
        the person but to ops_manager as a demand signal - a location with a persistent
        waiting list has a capacity decision to make and the list is the evidence for it.
        Escape hatch: none needed at the entry level; the fix is capacity or a shorter
        expires_at.
      offered: >
        Bounded by offer_expires_at, and the held booking behind it is consuming a slot the
        whole time. Threshold: waitlist_offer_minutes (default 60 where the slot is more than
        a day away, 15 where it is sooner - because a slot tomorrow morning cannot be held for
        an hour). Told: the offered party once at half the window. Escape hatch: accept,
        decline, or let it expire. Never auto-accepted: committing somebody to attend
        something because they did not reply is a booking that becomes a no-show.
      converted: >
        Terminal. Retained, because the conversion rate of a waiting list is what tells a
        business whether to add capacity. Nothing pends.
      declined_out: >
        Threshold: none. The person has been told and may rejoin. Monitored condition is a
        pattern - a location where more than declined_out_rate_alert of entries end this way
        (default 0.2), which usually means offers are being made for slots that do not match
        what people asked for. Told: ops_manager.
      expired: >
        Terminal. Retained. The expiry rate against the offer rate is the honest measure of
        whether a waiting list is working. Nothing pends.
      withdrawn: >
        Terminal. Retained, because a withdrawal and an expiry are different facts about
        demand. Nothing pends.

  - key: cancellation_policy
    name: Cancellation Policy
    description: What happens to a deposit and to any charge when a booking is cancelled, rescheduled or not attended, expressed as thresholds rather than as code.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true}
      - {key: free_cancellation_hours, type: int, req: true, default: 24, note: notice before starts_at within which cancellation costs nothing}
      - {key: late_cancellation_charge_percent, type: int, req: true, default: 0, financial: true}
      - {key: no_show_charge_percent, type: int, req: true, default: 0, financial: true}
      - {key: deposit_percent, type: int, req: true, default: 0, financial: true}
      - {key: deposit_refundable_before_hours, type: int, nullable: true, financial: true}
      - {key: free_reschedules, type: int, req: true, default: 1}
      - {key: reschedule_charge_percent, type: int, req: true, default: 0, financial: true}
      - {key: applies_to_channels, type: json, nullable: true, note: flat list of booking channels. A telephone booking and a self-service booking may legitimately carry different terms}
      - {key: disclosure_text, type: text, req: true, note: 'the exact wording shown to the person at the moment of booking. Mandatory, because a charge that was never disclosed is a charge that will be reversed'}
    invariants:
      - Percentages are between 0 and 100.
      - disclosure_text is mandatory and non-empty. A cancellation charge nobody was shown is not enforceable and will be reversed at the first complaint.
      - A policy is never edited after a booking references it. A change is a new policy, and existing bookings keep the terms they were shown.
      - Financial fields are gated by view_financial. disclosure_text is not, because the person booking must always be able to read it.
    states: [draft, active, archived]
    initial_state: draft
    transitions:
      - {from: draft, to: active, action: publish_cancellation_policy, actor: 'ops_manager, finance or tenant_owner', guard: disclosure_text is non-empty and any non-zero charge has a corresponding deposit or payment mechanism bound, side_effects: the policy becomes selectable for new bookings, reversibility: true}
      - {from: active, to: draft, action: unpublish_cancellation_policy, actor: as above, guard: no future booking references it, side_effects: none, reversibility: true}
      - {from: active, to: archived, action: archive_cancellation_policy, actor: as above, guard: no future booking references it, side_effects: 'removed from pickers, existing bookings keep their terms', reversibility: false}
      - {from: draft, to: archived, action: archive_cancellation_policy, actor: as above, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_policy_stale_days (default 14). Told: the creating principal. Escape
        hatch: publish or archive. The specific risk is that somebody has written stricter
        terms in response to a run of non-attendance and believes they are in force.
      active: >
        Monitored exception: a policy with a non-zero charge percentage that has never
        actually resulted in a charge over charge_never_applied_days (default 90). Either the
        charge is not being applied when it should be, or it exists only as a deterrent. Both
        are worth knowing, and the second is a legitimate strategy that should be a deliberate
        choice rather than an accident. Told: finance, quarterly, advisory.
      archived: >
        Terminal. Retained permanently, because existing and historical bookings resolved
        their terms against it and a charge dispute is settled by reading the exact wording
        that was shown. Nothing pends.

ports:
  - port_key: bookable_offering
    direction: requires
    contract: >
      Resolve an offering reference to a display label, a duration, a required qualification
      set, a capacity and a price basis. The offering is opaque here - this capability never
      learns what kind of thing is being booked.
    cardinality: zero_or_one
    unbound_behaviour: >
      Bookings carry no offering and are pure time reservations against a resource. Duration
      must be entered manually rather than derived, and no price can be computed, which means
      deposits and cancellation charges cannot be calculated as percentages. The policy fields
      that depend on a price are hidden rather than shown as zero.

  - port_key: schedulable_resource
    direction: requires
    contract: Resolve resource availability for the requested window and hold or assign a resource against a confirmed booking.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. A booking is a reservation of somebody's or something's time. With no resource provider there is nothing to reserve and every booking would be an unbacked promise.

  - port_key: schedulable_demand
    direction: provides
    contract: Publish a confirmed booking as a unit of demand with its window, location, required qualifications and count, and withdraw it on cancellation.
    cardinality: zero_or_many

  - port_key: party_directory
    direction: requires
    contract: Resolve the booking party and the subject party to display names and contactable channels, honouring per-channel consent and suppression.
    cardinality: zero_or_one
    unbound_behaviour: >
      Bookings hold a free-text contact name and a single contact string with no consent
      record and no suppression check. Reminders are still sent, which means they may be sent
      to somebody who asked not to be contacted. Because that is a real compliance exposure
      rather than a degraded feature, the pack must either bind the port or disable automated
      reminders, and pack publication checks for exactly that combination.

  - port_key: org_structure
    direction: requires
    contract: Resolve the location and its operating calendar, so that bookable windows respect opening hours.
    cardinality: zero_or_one
    unbound_behaviour: Bookings can be made at any time, including when a location is closed. Staff will catch most of these and some will reach a person who arrives at a closed door. Stated plainly rather than left implicit.

  - port_key: billable_outcome_sink
    direction: requires
    contract: Accept a completed booking, a late cancellation charge or a non-attendance charge as a billable outcome with its basis and its disclosure text.
    cardinality: zero_or_one
    unbound_behaviour: 'Bookings complete and their charges are calculated and recorded as outstanding amounts. Nothing is invoiced. Charges are visible as a list so they can be collected elsewhere, rather than being silently dropped.'

  - port_key: payment_authorisation
    direction: requires
    contract: Take, hold, capture, release and refund a deposit against a booking, returning a reference. This capability never holds a payment credential.
    cardinality: zero_or_one
    unbound_behaviour: >
      Deposits cannot be taken. Any cancellation policy with a non-zero deposit_percent cannot
      be published, and existing bookings referencing one treat the deposit as unpaid. Charges
      are still calculated and recorded as amounts owed rather than collected.

  - port_key: customer_surface
    direction: requires
    contract: Expose a permissioned projection to the booking party for self-service booking, rescheduling and cancellation.
    cardinality: zero_or_one
    unbound_behaviour: All bookings are staff-entered or arrive by integration. Self-service channels are unavailable and the channel enum values for them are never produced. Everything else works.

  - port_key: notification
    direction: requires
    contract: Deliver confirmations, reminders, reschedules, cancellations and waiting-list offers, honouring consent, quiet hours and cost class.
    cardinality: zero_or_one
    unbound_behaviour: >
      Nothing is sent. Confirmations and reminders become the responsibility of whoever took
      the booking, by telephone. For a self-service booking there is no telephone call, so a
      self-service booking with no notification provider is a booking the person has no
      record of - which is why binding this port is a publication requirement for any pack
      enabling self-service channels.

actions:

  - key: hold_slot
    entity: booking
    label: Hold a slot while somebody decides
    actors: [consumer, customer_contact, employee, dispatcher, integration_principal]
    rationale: >
      The interval between choosing a slot and confirming it is where double-booking happens.
      Modelling the hold explicitly, with an expiry and a release, is the difference between
      a booking system that works under concurrency and one that works in a demonstration.
    preconditions: [the requested window is available through the resource port, the location is operating where a calendar is bound, the party size does not exceed the offering capacity]
    inputs: [offering_ref, location_ref, requested_resource_ref, starts_at, ends_at, party_size, channel]
    creates: [booking in state held, a hold against the resource through the scheduling port]
    updates: []
    events: [booking.held]
    notifications: []
    undoable: true
    reversal_action: observe_hold_expiry, or cancel_booking
    audit_class: always
    idempotency_key_source: >
      session or client-supplied hold token plus offering_ref plus starts_at. A person tapping
      a slot twice on a slow connection gets one hold rather than two, which matters because
      two holds from one person consume two slots and the second is invisible to them.
    offline_policy: refuse
    concurrency: >
      The hold is taken as a real reservation against the resource inside the transaction,
      using the same exclusion constraint the scheduler uses for assignments, so two people
      cannot hold overlapping slots on one resource. Holds carry an expiry and are swept; the
      sweep is what makes the constraint safe to rely on, and a failed sweep silently removes
      inventory, which is why it has its own platform alert.
    failure_modes:
      - {code: E_CONFLICT_UNIQUE, cause: the slot was taken between the availability query and the hold, message: That time has just been taken., note: 'the response includes the nearest alternatives, because the person''s next action is always to pick another time and making them start again is how a self-service booking is abandoned'}
      - {code: E_PRECONDITION, cause: the location is closed at that time, message: This action is not available in the current state., note: names the operating hours}
      - {code: E_VALIDATION, cause: party_size exceeds the offering capacity, message: field-specific}
      - {code: E_QUOTA, cause: the party already holds max_concurrent_holds, message: Plan limit reached., note: 'prevents one client tying up an entire day''s inventory by opening many tabs, which is both an honest mistake and an attack'}
      - {code: E_RATE_LIMIT, cause: hold_burst per source exceeded, message: Too many attempts. Try again shortly.}
      - {code: E_DEPENDENCY, cause: the resource provider is unavailable, message: A required service is unavailable., note: the hold is REFUSED. Holding a slot without being able to verify availability produces confirmed bookings with no resource behind them}
    edge_cases:
      - A hold placed and then abandoned, which is the majority outcome for self-service. It expires and the slot returns. No notification is sent, because the person is in the middle of something else and a message about an abandoned form is noise.
      - Two people holding adjacent slots that together exceed a resource's capacity for the period. Capacity is the resource provider's concern and is enforced there. This capability holds against the resource and trusts the exclusion constraint, rather than reimplementing capacity logic that would then disagree with the scheduler.
      - A hold surviving its expiry because the sweep is not running. Detected by the held stuck-state policy as a platform alert. This is deliberately a platform alert and not a tenant one - inventory silently disappearing is invisible from inside the tenant, who simply sees fewer available slots.
      - A staff member holding a slot on the telephone while the person decides. Identical mechanism, longer expiry configured per channel, because a telephone conversation legitimately takes longer than a web form and a ten-minute hold that expires mid-call is worse than no hold.
      - Holding a slot for a waiting-list offer. The hold is created by the waiting-list machinery rather than by a person, with the offer expiry as the hold expiry, so a waiting-list offer cannot be made against a slot somebody else can take in the meantime.

  - key: confirm_booking
    entity: booking
    label: Confirm a booking
    actors: [consumer, customer_contact, employee, dispatcher, integration_principal, system]
    preconditions: [the hold is unexpired, a contact channel or party is present, any required deposit is paid or the payment window is open]
    inputs: [booking_id, booked_by_party_ref, subject_party_ref, contact_channel_ref, notes, access_requirements, deposit_reference]
    creates: [demand through the schedulable_demand port]
    updates: [booking state, cancellation_deadline_at frozen, the hold converted to a reservation]
    events: [booking.confirmed]
    notifications:
      - {to: 'the booking party and, where different, the subject party', channel: their consenting channel, when: always, template: booking_confirmed, must_include: [reference, window, location, cancellation_terms_disclosure_text, how_to_cancel], cost_class: utility, mandatory_operational: true}
      - {to: dispatcher, channel: in_app, when: no resource could be assigned, template: booking_unassigned, priority: high}
    undoable: true
    reversal_action: cancel_booking
    audit_class: always
    idempotency_key_source: booking_id. Confirming an already-confirmed booking is a 2xx no-op that does not re-send the confirmation, which matters because a re-sent confirmation reads as a duplicate booking to the person receiving it.
    offline_policy: refuse
    concurrency: >
      Confirmation converts an existing hold rather than acquiring a new reservation, so the
      slot was already exclusive from the moment of the hold. This is the whole reason the
      hold exists as a state - a system that reserves at confirmation time has a race between
      choosing and confirming that no amount of transaction isolation removes, because the
      person is thinking in the middle of it.
    failure_modes:
      - {code: E_PRECONDITION, cause: the hold has expired, message: That time is no longer held. Please choose again., note: 'the nearest alternatives are offered, including the original slot if it happens to still be free'}
      - {code: E_VALIDATION, cause: neither a party nor a contact channel supplied, message: We need a way to reach you.}
      - {code: E_PRECONDITION, cause: a deposit is required and the payment failed, message: This action is not available in the current state., note: 'the booking moves to pending_confirmation and the hold is retained for the payment window rather than being released immediately, because releasing on the first payment failure loses the slot for somebody who is retrying their card'}
      - {code: E_DEPENDENCY, cause: the notification provider is unavailable, message: null, note: the booking is CONFIRMED and the confirmation message is queued. Refusing to confirm because a message could not be sent would mean the person tries again and creates a second booking}
      - {code: E_PRECONDITION, cause: the contact channel is suppressed or has refused consent for this purpose, message: This action is not available in the current state., note: 'refused for a self-service booking, because a confirmed booking that cannot be confirmed to the person is a slot held for somebody who does not know they hold it. Permitted for a staff-entered booking, where the staff member is expected to tell them directly, and recorded as such'}
    edge_cases:
      - The booking party and the subject party being different, which is the normal case for a booking made on somebody else's behalf. Both are notified where both have consenting channels, the confirmation to the booker and the reminder to the subject. Sending everything to the booker is how the person who actually turns up never receives a reminder.
      - Confirmation arriving after the slot has started, from a queued integration message. Accepted and immediately flagged, because refusing it would leave the record absent entirely and somebody may well be standing there.
      - A booking confirmed with no resource assignable. Confirmed, and the dispatcher is told immediately at high priority. The alternative - refusing the confirmation - means turning away a person for a slot that is nominally available, and the tenant would rather know and fix it. This is the confirmed stuck policy's first monitored exception and it is the most damaging quiet failure here.
      - access_requirements supplied by a person through a self-service surface. Stored gated by view_sensitive and always released to the assigned resource at the time of service. A field that the person delivering the service cannot read is a field that should not have been collected.
      - Confirmation of a booking created from a waiting-list offer. The entry converts in the same transaction, so a person cannot both convert an offer and have the entry remain live to be offered another slot.

  - key: cancel_booking
    entity: booking
    label: Cancel a booking
    actors: [consumer, customer_contact, employee, dispatcher, supervisor]
    preconditions: [the booking is not already terminal, a reason is supplied]
    inputs: [booking_id, reason, cancelled_by_role, waive_charge, waive_reason]
    creates: [a charge record where the policy produces one]
    updates: [booking state, the reservation released, the deposit treated per policy, the waiting list for that slot notified]
    events: [booking.cancelled, booking.slot_released]
    notifications:
      - {to: 'the booking party and, where different, the subject party', channel: their consenting channel, when: always, template: booking_cancelled, must_include: [reference, window, charge_applied_or_not, refund_position, who_cancelled], cost_class: utility, mandatory_operational: true}
      - {to: the highest-ranked matching waiting-list entries, channel: their consenting channel, when: a waiting list exists for the released slot, template: slot_available, batching_policy: 'one offer at a time, in rank order, never a broadcast'}
      - {to: the assigned resource, channel: push, when: within resource_notice_hours of the slot, template: booking_cancelled_short_notice}
    undoable: false
    confirmation_specification: 'Modal stating the charge that will apply under the disclosed policy, the refund position on any deposit, and whether the person will be told. For a self-service cancellation the disclosure text shown at booking is repeated verbatim, because a charge the person is seeing for the first time at cancellation is a charge that will be disputed and reversed.'
    audit_class: always
    idempotency_key_source: booking_id plus target state. A repeated cancellation is a 2xx no-op that does not re-notify and does not double-charge.
    offline_policy: queue
    concurrency: >
      Cancellation releases the reservation and notifies the waiting list inside the same
      transaction, so the slot cannot be released without the queue being offered it, and the
      offer creates a hold rather than merely a message. Cancellation racing an arrival: the
      arrival wins, because somebody is physically present.
    failure_modes:
      - {code: E_VALIDATION, cause: reason empty, message: Give a reason.}
      - {code: E_PRECONDITION, cause: the booking is already completed, message: This action is not available in the current state., note: the correct path is a refund or credit through billing}
      - {code: E_AUTHZ_SCOPE, cause: a consumer cancelling a booking that is not theirs, message: Not found.}
      - {code: E_AUTHZ_FIELD, cause: waive_charge set by a principal without view_financial, message: null, note: the waiver is dropped and the charge applies. A person who cannot see money should not be able to forgive it}
      - {code: E_DEPENDENCY, cause: the payment provider is unavailable for a refund, message: null, note: the cancellation COMMITS and the refund is queued with its reference. A cancellation blocked by a payment outage leaves a slot held for a person who has already left}
    edge_cases:
      - Cancellation by staff after arrival, which is the tenant's failure rather than the person's. The policy's charge is never applied on this path, regardless of timing, and the model enforces that by the actor guard on the transition rather than by expecting a staff member to remember to waive it.
      - Cancellation inside the free window but for a booking that was already rescheduled twice. The reschedule count and the cancellation are separate terms, and the model applies both independently rather than compounding them, because a compounded charge is one nobody predicted from the disclosure.
      - A cancellation that releases a slot nobody is waiting for and which is too soon to refill. Recorded, and the lost-slot cost is visible in reporting. This is what a business actually wants to know about late cancellation, more than the charge itself.
      - Cancelling one booking of several made together by one party. Each booking is independent; there is no group cancellation in this model, and a person cancelling a group has to cancel each. This is a deliberate simplification and is flagged in open_questions rather than presented as a feature.
      - Cancellation of a booking whose deposit was captured under a policy that has since been archived. The archived policy still governs, because bookings keep the terms they were shown. This is why policies are archived and never deleted.

rules:
  - key: hold_before_confirm
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A booking is created as a hold with an expiry, taking a real reservation against the resource. Confirmation converts an existing hold. No path creates a confirmed booking without first holding.'
    on_conflict: not overridable
    rationale: A system that reserves only at confirmation has a race between choosing and confirming that transaction isolation cannot remove, because a person is thinking in the middle of it.

  - key: disclosure_before_charge
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'A cancellation or non-attendance charge may only be applied where the policy''s disclosure_text was shown at the time of booking and is recorded against that booking.'
    on_conflict: not overridable
    rationale: A charge the person is seeing for the first time at cancellation will be disputed and reversed, and the reversal costs more than the charge.

  - key: terms_are_frozen_at_confirmation
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'cancellation_deadline_at and the disclosed terms are frozen at confirmation. A later policy change never applies to an existing booking.'
    on_conflict: not overridable

  - key: staff_cancellation_never_charges
    kind: guard
    scope: capability
    overridable_at: null
    default: 'A cancellation whose acting role is staff, after the person has arrived, applies no charge regardless of timing.'
    on_conflict: not overridable

  - key: overbooking
    kind: policy
    scope: capability
    overridable_at: site
    default: '0. No overbooking. A site may set an overbooking percentage per offering, in which case every booking taken above capacity is marked as such and the surface shows the exposure.'
    on_conflict: most specific scope wins
    rationale: Overbooking is a legitimate strategy against non-attendance and a dangerous default. Off by default, expressible, and never silently applied.

  - key: reminder_schedule
    kind: policy
    scope: capability
    overridable_at: site
    default: 'One reminder at 24 hours before the slot on the party''s consenting channel. Additional steps are configurable per offering.'
    on_conflict: most specific scope wins
    rationale: Messaging is real money in this market. An over-reminding default spends the tenant's money on every booking and trains people to ignore the messages.

  - key: waitlist_offers_are_sequential
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A released slot is offered to one waiting-list entry at a time in rank order, as a held booking with an expiry. It is never broadcast to the whole list.'
    on_conflict: not overridable
    rationale: Broadcasting a single slot to a list produces one winner and many people who were told about something they cannot have, which converts a waiting list from an asset into a grievance.

policy_knobs:
  - {key: hold_expiry_minutes, default: 10, range: [1, 120], per_surface: true, note: 'telephone and staff channels default longer, because a conversation takes longer than a form'}
  - {key: payment_window_minutes, default: 15, range: [1, 120]}
  - {key: max_concurrent_holds, default: 3, range: [1, 20]}
  - {key: assignment_lag_minutes, default: 30, range: [1, 1440]}
  - {key: no_show_grace_minutes, default: 15, range: [0, 240]}
  - {key: no_show_reversal_hours, default: 4, range: [1, 72]}
  - {key: no_show_rate_alert, default: 0.15, range: [0.01, 1.0]}
  - {key: waiting_alert_minutes, default: 15, range: [1, 240]}
  - {key: overrun_alert_minutes, default: 30, range: [1, 480]}
  - {key: waitlist_offer_minutes, default: 60, range: [5, 1440]}
  - {key: waitlist_silent_days, default: 14, range: [1, 180]}
  - {key: max_waitlist_declines, default: 3, range: [1, 20]}
  - {key: declined_out_rate_alert, default: 0.2, range: [0.01, 1.0]}
  - {key: resource_notice_hours, default: 12, range: [1, 168]}
  - {key: charge_never_applied_days, default: 90, range: [7, 730]}
  - {key: draft_policy_stale_days, default: 14, range: [1, 90]}
  - {key: hold_burst_per_source_per_minute, default: 20, lowest_settable_scope: kernel}
  - {key: charge_settlement_days, default: 14, range: [1, 180]}
  - {key: outcome_ack_hours, default: 4, range: [1, 168], lowest_settable_scope: kernel}

open_questions:
  - {q: 'Should a group of bookings made together be cancellable and reschedulable as a group? The model treats each booking as independent, which is simpler and means a person who booked four slots must cancel four times.', assumption: Independent bookings. A group construct is deliberately absent rather than half-modelled., confidence: VALIDATION_REQUIRED, method: 'operator interviews on how often multi-slot bookings occur in the target segments, and observation of what people attempt in a self-service flow', priority: High, blocks: [booking group modelling, cancellation charge compounding]}
  - {q: 'Is holding a real reservation at hold time correct, or should holds be soft - visible to the holder and available to others until confirmed? A real hold is safe and lets a small number of abandoned holds consume a day''s inventory; a soft hold maximises inventory and produces confirmations that fail.', assumption: Real hold with a short expiry and a concurrent-hold limit., confidence: WORKING_ASSUMPTION, method: measure abandonment rate and slot utilisation in pilot with both settings, priority: High}
  - {q: 'What reminder cadence is both effective and affordable? Every additional reminder step multiplies messaging cost across every booking, and the market is price-sensitive. Effectiveness data for the target segments does not exist in this model.', assumption: 'One reminder at 24 hours. Chosen for cost, not for evidence of effectiveness.', confidence: VALIDATION_REQUIRED, method: 'controlled comparison of no-show rate across reminder cadences in pilot, priced against the messaging cost per booking', priority: High, blocks: [reminder_schedule default, unit economics]}
  - {q: 'Should a person be able to see, at the moment of booking, that they are being booked into an overbooked slot? Disclosure is honest and destroys the strategy; non-disclosure is standard practice in several industries and is the reason overbooking works.', assumption: None. The model records overbooked bookings as such internally and does not specify what the person is shown., confidence: VALIDATION_REQUIRED, method: legal review plus a commercial decision by the product owner, priority: Medium}
  - {q: 'Who owns the non-attendance charge decision when the booking was made by one party for another - the person who did not attend, or the party who booked and pays? The model charges against the booking and does not resolve which party bears it.', assumption: None., confidence: VALIDATION_REQUIRED, method: 'operator interviews, particularly for business-to-business bookings where an organisation books for its own people', priority: High, blocks: [charge attribution, billing party resolution]}
