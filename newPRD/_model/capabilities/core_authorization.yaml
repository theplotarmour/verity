key: core_authorization
name: Authorization
layer: core
confidence: KNOWN
description: >
  Permission evaluation, role binding, scope resolution, delegation, impersonation and
  the audit stream for permission change. This capability answers "what may this
  principal do". It never answers "who is this principal" — that is core_identity_session,
  and the two are kept apart deliberately so that a bug in one cannot be a bug in both.

principles:
  - Evaluation order is fixed by the kernel and is not configurable - authenticate, entity_check, action_check, scope_check, field_projection, rule_conditions. A capability that wants a different order is asking for a different security model.
  - Permissions are additive across roles. A principal holding two roles receives the union. Explicit DENY entries are evaluated last and win. This is what makes role explosion avoidable - a new responsibility is a second role, not a cloned role with one row changed.
  - Denial at scope returns 404, never 403. Confirming that a record exists outside your scope is itself the leak.
  - Field denial removes the key from the payload. It must never appear as null, because null is indistinguishable from empty and a client that cannot distinguish them will render "no salary recorded" over a salary it was not allowed to see.
  - A grant is always bounded by a scope binding. A role without a scope binding grants nothing. There is no implicit "everything" scope for a tenant-bound principal.
  - Delegation is time-boxed, revocable, non-transitive and separately audited. A delegate may never delegate onward.

entities:

  - key: role
    name: Role
    description: A named bundle of permission grants, instantiated per tenant, mapped to one or more platform role archetypes.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true, note: stable machine key; the display label is separately overridable by the terminology map so renaming a role in the UI never breaks a pack binding}
      - {key: label, type: string, req: true}
      - {key: archetypes, type: json, req: true, note: array of role_archetype keys from the vocabulary; drives pack-shipped default grants and MFA requirements}
      - {key: is_system, type: bool, req: true, default: false, note: system roles may be cloned but never deleted or edited}
      - {key: source_pack_key, type: string, nullable: true, note: 'which pack shipped this role, null for tenant-authored roles; used to decide upgrade behaviour'}
      - {key: source_capability_version, type: string, nullable: true, note: 'the capability version the grants were authored against, per the composition override model'}
      - {key: assignable_scopes, type: json, req: true, note: which scope kinds may be bound when this role is granted to a principal}
      - {key: requires_mfa, type: bool, req: true, default: false}
      - {key: requires_elevation_for, type: json, note: 'array of action keys that demand an elevated session beyond the kernel-mandated set; a tenant may add, never remove'}
      - {key: created_at, type: timestamptz, req: true, immutable: true}
      - {key: created_by_principal_id, type: uuid, req: true, note: 'resolved through the principal_directory port; deliberately not a foreign key, per kernel K04'}
    invariants:
      - A role with zero grants is legal and is how a placeholder role is staged, but it may not be bound to any principal until it has at least one grant. A bound empty role is indistinguishable to a user from a broken permission system.
      - archetypes may never be empty. An archetype-less role cannot receive pack defaults and cannot be reasoned about by any other capability.
      - A role carrying the tenant_owner archetype may not be deleted while it is the only such role with an active binding.
    states: [draft, active, archived]
    initial_state: draft
    transitions:
      - {from: draft, to: active, action: publish_role, actor: tenant_admin, guard: at least one grant exists and every grant references an entity present in the tenant manifest, side_effects: role becomes bindable, reversibility: true}
      - {from: active, to: draft, action: unpublish_role, actor: tenant_admin, guard: zero active bindings, side_effects: none, reversibility: true}
      - {from: active, to: archived, action: archive_role, actor: tenant_admin, guard: zero active bindings and is_system is false, side_effects: 'role removed from the grant picker, existing audit references still resolve', reversibility: false}
      - {from: draft, to: archived, action: archive_role, actor: tenant_admin, guard: is_system is false, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        A role left in draft is a permission change somebody started and abandoned, and it
        is invisible in every list that matters because draft roles are excluded from the
        grant picker. Threshold: draft_role_stale_days (default 14). Told: the creating
        principal, then tenant_admin. Escape hatch: publish or archive. Verity never
        auto-publishes a draft role — publishing is a security decision and an abandoned
        draft is evidence that somebody was unsure, which is the worst possible reason to
        proceed automatically.
      active: >
        Two monitored degenerate forms. (a) An active role with zero bindings for
        unbound_role_days (default 90) is reported to tenant_admin as a candidate for
        archival, because unused roles are how a permission review becomes unreadable.
        (b) An active role whose source_capability_version is behind the installed
        capability version AND whose grants reference an entity, action or field that no
        longer exists. This is reported as a BROKEN override per the composition model's
        upgrade semantics, blocks the upgrade in staging, and is never silently dropped.
        Escape hatch for (b) - repair the grant, or explicitly accept the narrowing with a
        recorded reason.

  - key: permission_grant
    name: Permission Grant
    description: One row of (verb x entity x field_set x scope x condition) attached to a role. The atom of the whole authorization model.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: role_id, type: uuid, req: true, fk: role}
      - {key: effect, type: enum, values: [allow, deny], req: true, default: allow, note: deny is evaluated last and wins; it exists so a broad allow can be carved out without cloning a role}
      - {key: verb, type: enum, req: true, note: from the closed vocabulary verb set only}
      - {key: entity_key, type: string, req: true, note: 'the entity this grant applies to, or the literal * for a capability-wide grant'}
      - {key: capability_key, type: string, req: true}
      - {key: field_set_mode, type: enum, values: [all, all_except_gated, explicit], req: true, default: all_except_gated}
      - {key: field_list, type: json, nullable: true, note: 'required when field_set_mode is explicit, forbidden otherwise'}
      - {key: scope, type: enum, req: true, note: from the closed vocabulary scope set only}
      - {key: condition_expression, type: text, nullable: true, note: 'an Expression (K16), sandboxed, side-effect-free, statically cost-bounded, evaluated last'}
      - {key: created_at, type: timestamptz, req: true, immutable: true}
      - {key: created_by_principal_id, type: uuid, req: true, note: resolved through the principal_directory port}
    invariants:
      - field_set_mode=explicit requires a non-empty field_list. field_set_mode in (all, all_except_gated) requires field_list to be null. A grant that carries both is ambiguous and is rejected at write time, not resolved by precedence.
      - A grant with verb in (view_financial, view_sensitive) is a field-level gate, never an entity-level gate. Emitting it with field_set_mode=all is a modelling error and is rejected.
      - scope=platform may only appear on a role whose archetypes include platform_operator or platform_support. Enforced at write time so a tenant administrator cannot mint a cross-tenant grant even by direct API call.
      - A condition_expression may only traverse relationships the evaluating principal could traverse unaided. Otherwise configuration becomes a data-exfiltration channel - kernel K16.
    states: [active, archived]
    initial_state: active
    transitions:
      - {from: active, to: archived, action: remove_grant, actor: tenant_admin, guard: the removal does not leave the tenant with zero principals able to perform an action the kernel requires somebody to be able to perform, side_effects: permission cache invalidated for every principal holding the owning role, reversibility: false, note: grants are archived rather than deleted so that an audit row referencing the grant id still resolves to what the grant actually said}
    stuck_state_policy:
      active: >
        A grant cannot be stuck as such, but two conditions on an active grant are
        operational exceptions. (a) A grant referencing an entity_key or field that is not
        in the resolved tenant manifest - a dangling grant. Detected by the manifest
        reconciliation sweep, reported as drift, never silently ignored, because a dangling
        grant is usually the residue of a capability being disabled and it will start
        granting again the moment that capability is re-enabled. (b) A grant whose
        condition_expression has failed evaluation more than expression_failure_threshold
        times in 24h (default 100). A failing expression must NOT be treated as false and
        must not be treated as true - the request fails closed with E_INTERNAL and the
        tenant_admin plus platform_operator are told, because a permission expression that
        is neither true nor false is the exact situation kernel K16 mandates explicit
        three-valued handling for.

  - key: role_binding
    name: Role Binding
    description: The grant of one role to one principal, bounded by concrete scope values. This is where "supervisor" becomes "supervisor of these three locations".
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: principal_id, type: uuid, req: true, note: resolved through the principal_directory port}
      - {key: role_id, type: uuid, req: true, fk: role}
      - {key: scope_bindings, type: json, req: true, note: 'concrete values per scope kind, for example own_site resolves to a list of site references obtained through the org_structure port; empty means the role grants nothing'}
      - {key: granted_by_principal_id, type: uuid, req: true, note: resolved through the principal_directory port}
      - {key: granted_at, type: timestamptz, req: true, immutable: true}
      - {key: expires_at, type: timestamptz, nullable: true, note: null means indefinite; a bounded binding is the mechanism behind temporary cover}
      - {key: reason, type: text, nullable: true, note: required when the role carries an archetype in the elevated set}
      - {key: revoked_at, type: timestamptz, nullable: true}
      - {key: revoked_by_principal_id, type: uuid, nullable: true}
    invariants:
      - unique(principal_id, role_id, tenant_id) among non-revoked bindings. Two live bindings of the same role to the same principal cannot differ meaningfully, because scope bindings are a union.
      - A binding whose scope_bindings are empty for every scope kind the role's grants require is rejected at write time with a message naming the missing scope. Silently granting nothing is the single most confusing failure a new administrator can produce.
      - expires_at in the past is not a valid write. Retroactive revocation is revoke_binding with a reason, not a backdated expiry, because the two produce different audit narratives.
    states: [active, expiring, expired, revoked]
    initial_state: active
    transitions:
      - {from: active, to: expiring, action: observe_expiry_window, actor: system_scheduler, guard: 'expires_at is not null and now > expires_at - binding_expiry_warning_days', side_effects: notification to the grantee and the granter, reversibility: true, note: a distinct state rather than a computed flag so the notification can be emitted exactly once and so the expiring set is queryable}
      - {from: expiring, to: active, action: extend_binding, actor: tenant_admin, guard: acting session elevated, side_effects: expires_at moved forward, reversibility: true}
      - {from: expiring, to: expired, action: observe_expiry, actor: system_scheduler, guard: 'now > expires_at', side_effects: 'permission cache invalidated, live sessions re-resolve on their next mutating request', reversibility: false}
      - {from: active, to: expired, action: observe_expiry, actor: system_scheduler, guard: 'now > expires_at and the warning window was never observed, for example because the binding was created with a short life', side_effects: as above, reversibility: false}
      - {from: active, to: revoked, action: revoke_binding, actor: tenant_admin, guard: not the last binding conferring tenant_owner archetype in this tenant, side_effects: 'permission cache invalidated immediately, in-flight approvals reassigned per approval_fallback', reversibility: false}
      - {from: expiring, to: revoked, action: revoke_binding, actor: tenant_admin, guard: as above, side_effects: as above, reversibility: false}
      - {from: expired, to: revoked, action: revoke_binding, actor: tenant_admin, guard: null, side_effects: none beyond recording an explicit revocation over a lapse, reversibility: false, note: permitted so that a lapsed binding can be explicitly closed out during an access review rather than left ambiguous}
    stuck_state_policy:
      revoked: >
        Terminal. The binding confers nothing and nothing pends. Retained permanently so an
        audit row naming this binding as the authority under which an action was taken still
        resolves to what the binding actually granted. Re-granting is always a new row.
      active: >
        A permanent binding is normal. The monitored exception is a binding that has never
        been exercised - the principal has never successfully performed any action the role
        uniquely grants - for unused_binding_days (default 90). Told: tenant_admin, as a
        quarterly access-review list rather than a notification, because access review is a
        periodic activity and turning it into a stream of alerts guarantees it is ignored.
        No automatic revocation. Verity does not remove someone's access because they have
        not used it, since the day they need it is exactly the day it must work.
      expiring: >
        Bounded by construction - expires_at is set. The exception is nobody responding to
        the warning. Threshold: binding_expiry_warning_days (default 7) with a second
        reminder at 1 day. Told: the grantee and the granting principal, escalating to
        tenant_admin at expiry. Escape hatch: extend_binding, or let it lapse deliberately.
        Verity never auto-extends. A binding that silently renews itself is not a
        time-boxed grant; it is a permanent grant with extra steps.
      expired: >
        A lapsed binding should be resolved, not left. It confers nothing, so there is no
        security exposure, but a person whose cover expired mid-shift is an operational
        problem that looks to them like the software breaking. Threshold - expired
        bindings older than expired_binding_review_days (default 30) appear in the access
        review with the count of permission denials that binding would have prevented,
        which is the number that tells an administrator whether the lapse mattered. Escape
        hatch - re-grant a new binding, or revoke to close it out. A new grant is a new
        row; expired bindings are never resurrected, so the access history reads as two
        distinct periods.

  - key: delegation
    name: Delegation
    description: A time-boxed, revocable, non-transitive transfer of a subset of one principal's authority to another, for cover during absence.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: from_principal_id, type: uuid, req: true, note: resolved through the principal_directory port}
      - {key: to_principal_id, type: uuid, req: true, note: resolved through the principal_directory port}
      - {key: verb_subset, type: json, req: true, note: 'which verbs are delegated; may never exceed what the delegator holds at the moment of evaluation, not at the moment of creation'}
      - {key: entity_subset, type: json, nullable: true, note: 'null means every entity the delegator can act on, narrowed by verb_subset'}
      - {key: scope_narrowing, type: json, nullable: true, note: 'an optional narrowing of the delegator''s scope bindings, never a widening'}
      - {key: starts_at, type: timestamptz, req: true}
      - {key: ends_at, type: timestamptz, req: true}
      - {key: reason, type: text, req: true}
      - {key: revoked_at, type: timestamptz, nullable: true}
    invariants:
      - ends_at > starts_at, and ends_at - starts_at may not exceed max_delegation_days. An unbounded delegation is a role binding wearing a disguise, and should be modelled as one so that it appears in an access review.
      - A delegated authority is evaluated against what the delegator holds AT REQUEST TIME. If the delegator loses a permission, the delegate loses it in the same instant. Snapshotting the delegator's permissions at creation time would outlive the delegator's own access, which is the classic delegation privilege-retention bug.
      - Delegation is not transitive. A principal acting under a delegation may not create a delegation. Enforced at write time.
      - verb_subset may never contain administer. Delegating the ability to reconfigure the entity type itself is not cover for an absence; it is a permanent transfer and must be modelled as a role binding.
    states: [scheduled, active, ended, revoked]
    initial_state: scheduled
    transitions:
      - {from: scheduled, to: active, action: observe_delegation_start, actor: system_scheduler, guard: 'now >= starts_at and the delegator still holds every verb in verb_subset', side_effects: 'delegate notified, delegator notified, banner shown to the delegate', reversibility: false}
      - {from: scheduled, to: revoked, action: revoke_delegation, actor: from_principal or tenant_admin, guard: null, side_effects: none, reversibility: false}
      - {from: active, to: ended, action: observe_delegation_end, actor: system_scheduler, guard: 'now >= ends_at', side_effects: 'permission cache invalidated, both parties notified, a summary of what was done under the delegation is delivered to the delegator', reversibility: false}
      - {from: active, to: revoked, action: revoke_delegation, actor: 'from_principal, to_principal or tenant_admin', guard: null, side_effects: 'as ended, plus the revocation reason', reversibility: false, note: the delegate may revoke their own delegation; refusing that would mean a person cannot decline authority they did not ask for}
    stuck_state_policy:
      revoked: >
        Terminal. Retained for the audit retention period, for the same reason as an ended
        delegation - actions taken under it must remain attributable to both parties.
        Nothing pends.
      scheduled: >
        A delegation scheduled and then forgotten activates at a moment nobody is
        expecting. Threshold: any delegation scheduled to start more than
        max_delegation_lead_days ahead (default 90) is refused at creation rather than
        monitored, because the delegator's own permissions will very likely have changed by
        then. Between now and that limit, the delegate is reminded 24h before start. Told:
        both parties. Escape hatch: revoke_delegation.
      active: >
        Bounded by ends_at, which is mandatory. The monitored exception is a delegation
        being exercised far more than the cover implies - more than
        delegation_activity_alert actions in a day (default 200) - which usually means a
        cover arrangement has silently become the operating model. Told: tenant_admin, once
        per delegation, with a suggestion to make it a role binding so it appears in the
        access review. No automatic action, because the work is legitimate and blocking it
        mid-shift would be worse than the governance problem it solves.
      ended: >
        Terminal in effect. Retained for the audit retention period so that actions taken
        under it remain attributable to both the delegate and the delegator, which is the
        whole point of recording a delegation rather than temporarily editing a role.
        Nothing pends.

ports:
  - port_key: principal_directory
    direction: requires
    contract: >
      Resolve a principal reference to a display name, an authentication status, the set of
      role archetypes it holds, and whether its current session is elevated. Provide a
      change feed so that a principal being suspended or deactivated invalidates cached
      authorization decisions.
    cardinality: exactly_one
    unbound_behaviour: >
      FORBIDDEN. Authorization without identity is meaningless. Declared explicitly rather
      than assumed so that the dependency appears in the composition graph, and so that a
      pack cannot be published that omits it.
    typical_providers: [core_identity_session]

  - port_key: org_structure
    direction: requires
    contract: >
      Resolve the concrete membership sets behind the scope vocabulary - which locations a
      principal is assigned to, which teams they manage, which regions those locations roll
      up into, which department they belong to. Must expose the resolution as a set of
      identifiers plus a cache-invalidation signal, never as a query the caller composes,
      because a caller composing the query would need to know the provider's schema.
    cardinality: zero_or_one
    unbound_behaviour: >
      Every scope except own, tenant and platform resolves to the EMPTY set, which denies
      rather than permits. A tenant with no org structure capability installed can express
      "your own records" and "the whole tenant" and nothing in between. The UI does not
      offer the unresolvable scopes in the grant picker rather than offering them and
      having them silently deny - an offered scope that grants nothing is the most
      expensive kind of confusion because it looks like it worked.

  - port_key: party_directory
    direction: requires
    contract: Resolve a party reference to a display name, contactable channels and a permission scope, for the own_customer and own_vendor scopes.
    cardinality: zero_or_one
    unbound_behaviour: The own_customer and own_vendor scopes resolve to the empty set and are not offered in the grant picker. External portal roles cannot be granted until a party directory is bound.

  - port_key: approval_chain
    direction: requires
    contract: Submit a permission change for approval, resolve approvers from role and scope, record the decision with a reason.
    cardinality: zero_or_one
    unbound_behaviour: >
      Permission changes execute immediately with an audit note recording that no approval
      chain was configured. Deliberately not an error - a two-person business cannot
      four-eyes its own administrator, and refusing to operate would make the platform
      unusable for the smallest customers, who are the majority.

  - port_key: authorization_decision
    direction: provides
    contract: >
      Given a principal, a tenant, a verb, an entity, an optional subject and a requested
      field set, return allow or deny, the projected field set, and the reason code. The
      reason code is for the audit stream and for support tooling; it is never returned to
      an external caller, because a reason code is a description of the permission model.
    cardinality: exactly_one

  - port_key: permission_change_feed
    direction: provides
    contract: An ordered stream of permission-affecting changes - grant added, grant removed, binding granted, binding revoked, delegation started, delegation ended - for consumers that cache authorization decisions.
    cardinality: zero_or_many

actions:

  - key: evaluate_permission
    confirmation_specification: 'None. This is the hot path of the entire platform and creates only a conditional audit row. A confirmation here would be a dialogue on every request.'
    entity: role_binding
    label: Evaluate a permission decision
    actors: [integration_principal, any_authenticated]
    rationale: >
      Modelled as an explicit action rather than left implicit, because it is the single
      most frequently executed operation in the platform and its failure modes, caching
      semantics and audit behaviour are load-bearing product decisions rather than
      implementation details.
    preconditions: [session is valid and not revoked, tenant is not suspended]
    inputs: [principal_id, tenant_id, verb, capability_key, entity_key, subject_id_optional, requested_field_set]
    creates: [audit_row_when_the_verb_or_field_is_gated]
    updates: []
    events: []
    notifications: []
    undoable: false
    audit_class: read_sensitive_only
    idempotency_key_source: 'not applicable - the action is a pure read with no effect other than a conditional audit row, and the audit row is keyed on the request correlation_id so a retried request does not double-log'
    offline_policy: read_only
    concurrency: >
      Decisions are computed from a snapshot of the principal's effective grants taken at
      the start of the request and held for the duration of that request only. A permission
      revoked mid-request does not retroactively fail the request. A permission revoked
      between requests takes effect on the next request. There is no permission cache with
      a TTL longer than one request on the server; the client-side cache is advisory,
      used only to decide which affordances to render, and is never trusted for a decision.
    failure_modes:
      - {code: E_AUTHZ_ENTITY, cause: no grant for this verb on this entity in any bound role, message: You do not have access to this record type., note: 'safe to be specific here - the entity type is not secret, only the records are'}
      - {code: E_AUTHZ_SCOPE, cause: grant exists but the subject is outside every bound scope, message: Not found., note: 'deliberately 404. The response must also be timing-indistinguishable from a genuine miss, which means the scope check must not short-circuit before the existence check in a way an attacker can measure'}
      - {code: E_AUTHZ_FIELD, cause: requested field is gated by view_financial or view_sensitive and the principal holds neither, message: null, note: the field is omitted from the payload; the response is 200}
      - {code: E_INTERNAL, cause: 'a condition_expression evaluated to neither true nor false - null propagation, missing context, or a traversal the principal cannot perform', message: Something went wrong. The team has been notified., note: 'FAILS CLOSED. Kernel K16 mandates explicit three-valued logic. Treating unknown as false would silently deny; treating it as true would silently permit. Neither is acceptable, so the request fails and somebody is told'}
      - {code: E_DEPENDENCY, cause: org_structure port bound but unavailable, message: A required service is unavailable., note: FAILS CLOSED. A scope that cannot be resolved denies. The alternative - falling back to a wider scope - is a privilege escalation triggered by an outage}
      - {code: E_RATE_LIMIT, cause: a single principal generating more than evaluation_rate_limit decisions per minute, message: Too many attempts. Try again shortly., note: 'this limit exists to catch a runaway integration, and it is deliberately generous; a human cannot reach it'}
    edge_cases:
      - Two roles grant the same verb at different scopes. The result is the UNION of the scopes, never the intersection. Intersection would make adding a role able to reduce access, which no administrator expects.
      - One role allows and another denies the same verb. DENY wins, evaluated last. This is the only non-additive rule and it is stated in the kernel rather than being configurable.
      - A DENY grant at a narrower scope than an ALLOW. The deny applies only within its own scope. A deny on own_site does not cancel an allow at tenant scope outside that location.
      - The principal holds no bindings at all. Every entity check denies. The surface shows an explicit "no access has been granted to you yet" state naming who to contact, not an empty dashboard, because an empty dashboard reads as a broken product.
      - A subject that does not exist and a subject outside scope must be indistinguishable in status code, body and response time. This is tested explicitly, not assumed, because the natural implementation - look up, then check scope - leaks existence through timing.
      - Evaluation during an impersonated session uses the impersonated principal's permissions, intersected with any redaction the impersonation grant carries. A platform_support impersonation redacts financial fields even where the impersonated principal could read them, so support cannot see a customer's margins.
      - A grant referencing a capability that is currently disabled in the tenant manifest evaluates to deny, not to error. Disabling a capability must not produce 500s across the console.

  - key: create_role
    entity: role
    label: Create a role
    actors: [tenant_admin, tenant_owner]
    preconditions: [acting session is elevated, key is unique within the tenant, every archetype named exists in the vocabulary]
    inputs: [key, label, archetypes, assignable_scopes, requires_mfa, clone_from_role_id_optional]
    creates: [role, permission_grant_rows_when_cloning]
    updates: []
    events: [role.created]
    notifications: []
    undoable: true
    reversal_action: archive_role
    audit_class: security
    idempotency_key_source: 'tenant_id plus role.key. Re-creating an existing key returns the existing role with 200 rather than erroring, which makes pack installation and re-installation safe.'
    offline_policy: refuse
    concurrency: Unique index on (tenant_id, key). A losing concurrent create resolves to the idempotent 200 above.
    failure_modes:
      - {code: E_CONFLICT_UNIQUE, cause: key already exists with different content, message: A role with this key already exists.}
      - {code: E_VALIDATION, cause: archetypes empty or contains an unknown archetype, message: field-specific}
      - {code: E_AUTHZ_FIELD, cause: the creator names an archetype they do not themselves hold, message: null, note: 'the archetype picker is projected to what the creator holds, and the server re-checks. This is the primary privilege-escalation path in any role system and it is closed at write time rather than at bind time'}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
      - {code: E_QUOTA, cause: tenant role count limit reached, message: Plan limit reached., note: 'the limit exists because role explosion is the failure mode this model is designed to avoid, and an unbounded count is evidence it is happening'}
    edge_cases:
      - Cloning a system role copies its grants and clears is_system. The clone records which system role and which capability version it was cloned from, so that when the system role gains a grant in a later version the clone can be reported as diverged rather than silently left behind.
      - A role created while a capability is disabled may reference entities that are not currently in the manifest. This is permitted and the role stays in draft; publish_role is what enforces manifest consistency. Refusing at creation would make staging a pack impossible.

  - key: add_grant
    entity: permission_grant
    label: Add a permission to a role
    actors: [tenant_admin, tenant_owner]
    preconditions:
      - Acting session is elevated.
      - The acting principal already holds the verb being granted, at a scope at least as wide, on the same entity.
      - The role is not is_system.
    inputs: [role_id, effect, verb, capability_key, entity_key, field_set_mode, field_list, scope, condition_expression]
    creates: [permission_grant]
    updates: [permission cache invalidated for every principal bound to the role]
    events: [permission.granted]
    notifications:
      - {to: every principal holding a binding to this role, channel: in_app, when: the grant widens their access, template: access_changed, batching_policy: 'one message per role change, not one per grant, and suppressed entirely for draft roles'}
      - {to: auditor, channel: none, when: always, template: null, note: the auditor consumes the permission_change_feed rather than notifications}
    undoable: true
    reversal_action: remove_grant
    audit_class: security
    idempotency_key_source: 'role_id plus a hash of (effect, verb, entity_key, capability_key, field_set_mode, field_list, scope, condition_expression). Identical grants are collapsed rather than duplicated, so a re-run of a pack installation does not accumulate rows.'
    offline_policy: refuse
    concurrency: >
      Grants are append-only within a role and are never edited in place - editing a grant
      is remove plus add, so the audit shows what changed rather than showing that
      something changed. Two concurrent adds of different grants both succeed. Two
      concurrent adds of the same grant collapse via the idempotency key.
    failure_modes:
      - {code: E_AUTHZ_ENTITY, cause: the granter does not themselves hold this verb at this scope, message: You cannot grant access you do not have., note: 'no-privilege-escalation is the load-bearing rule of this entire capability. It is checked against the granter''s permissions at request time, not against their archetype, because archetypes are a labelling convenience and permissions are the truth'}
      - {code: E_VALIDATION, cause: field_set_mode explicit with empty field_list, message: Choose at least one field.}
      - {code: E_VALIDATION, cause: 'condition_expression fails static analysis - unknown identifier, exceeds the cost ceiling, or traverses a relationship the grantee could not traverse', message: field-specific, note: 'rejected at save time rather than timing out at runtime, per kernel K16. The error names the offending token and the ceiling that was exceeded'}
      - {code: E_PRECONDITION, cause: role is is_system, message: System roles cannot be edited. Clone it first.}
      - {code: E_PRECONDITION, cause: scope=platform requested by a tenant-bound principal, message: This action is not available in the current state., note: deliberately vague. A specific message would teach a tenant administrator that a cross-tenant scope exists}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
    edge_cases:
      - Adding a DENY grant that makes an existing ALLOW unreachable. Permitted, and the UI shows which existing grants it neutralises before saving. Refusing would be wrong - carving out is exactly what deny is for - but doing it silently produces a role nobody can reason about.
      - Adding a grant to a role bound to the acting principal themselves. Permitted, and separately flagged in the audit stream as a self-grant, because self-granting is legitimate for an owner and is the first thing an investigator looks for.
      - A grant referencing an entity that a later capability upgrade removes. Reported as a BROKEN override, blocks the upgrade in staging, and lists the tenant, the exact grant and the change that broke it. Never silently dropped - the composition model is explicit about this.
      - Adding a grant while a bulk permission import is running. The import takes an advisory lock per role; the interactive add waits rather than interleaving, because a half-applied permission set is a security state nobody has reasoned about.

  - key: grant_role
    entity: role_binding
    label: Give someone a role
    actors: [tenant_admin, tenant_owner]
    preconditions:
      - Acting session is elevated.
      - The acting principal holds every verb the role grants, at a scope at least as wide.
      - The target principal has an active membership in this tenant.
      - Every scope binding names a value the acting principal can themselves reach.
    inputs: [principal_id, role_id, scope_bindings, expires_at_optional, reason]
    creates: [role_binding]
    updates: [permission cache invalidated for the target principal]
    events: [binding.granted]
    notifications:
      - {to: target_principal, channel: in_app_and_email_or_whatsapp, when: always, template: role_granted, must_include: [role_label, scope_summary, granter_display_name, expiry_if_any], mandatory_operational: true}
      - {to: tenant_owner, channel: in_app, when: 'the role carries tenant_admin, finance or tenant_owner archetype', template: privileged_role_granted}
    undoable: true
    reversal_action: revoke_binding
    audit_class: security
    idempotency_key_source: 'tenant_id plus principal_id plus role_id. A repeat grant merges scope bindings as a union and extends expires_at to the later of the two, rather than creating a second row.'
    offline_policy: refuse
    concurrency: Unique index over non-revoked (principal_id, role_id, tenant_id). The merge described above resolves the race deterministically regardless of arrival order because union and max are both commutative.
    failure_modes:
      - {code: E_AUTHZ_SCOPE, cause: 'a named scope value is outside the granter''s own scope', message: Not found., note: the location the granter cannot reach must not be confirmed to exist. The picker shows only reachable values and the server re-checks}
      - {code: E_VALIDATION, cause: 'scope_bindings empty for a scope kind the role''s grants require', message: Choose at least one location for this role., note: names the specific scope kind. Granting a role that resolves to nothing is the most common new-administrator mistake and the error must teach rather than reject}
      - {code: E_PRECONDITION, cause: target principal has no active membership, message: This person is not in this workspace.}
      - {code: E_PRECONDITION, cause: role requires MFA and the target principal is not enrolled, message: This role requires two-factor authentication. Ask them to set it up first., note: 'the binding is created in a pending state rather than refused outright only if the tenant policy allows it; the shipped default refuses, because a privileged role held by an unprotected account is the exposure this rule exists to prevent'}
      - {code: E_AUTHZ_ENTITY, cause: the granter does not hold every verb the role grants, message: You cannot grant access you do not have.}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
    edge_cases:
      - Granting a role to oneself. Permitted for tenant_owner, refused for everyone else, and always flagged in the audit stream. A tenant_owner who cannot grant themselves a role cannot recover a workspace after an administrator leaves.
      - A binding with expires_at set for cover during an absence. At expiry the permission cache is invalidated but live sessions are NOT revoked. The person keeps working and simply cannot perform the covered actions any more, receiving a specific message rather than a generic denial.
      - Granting a role whose scope bindings reference locations that are later archived. The binding survives; the archived values resolve to nothing. This is reported in the access review rather than fixed automatically, because automatically widening a scope to compensate is an escalation.
      - Two administrators granting different scope values of the same role concurrently. The union merge means both sets apply. This is deliberately permissive - the alternative, last-write-wins, silently discards one administrator's decision.
      - Granting a role to an integration_principal. Permitted, but the binding may never carry a scope derived from a human relationship such as own_team, because a service account has no manager and the scope would resolve to the empty set forever. Refused at write time with a message naming the offending scope.

  - key: revoke_binding
    creates: []
    entity: role_binding
    label: Take away a role
    actors: [tenant_admin, tenant_owner]
    preconditions: [acting session is elevated, not the last binding conferring tenant_owner in this tenant, reason supplied]
    inputs: [binding_id, reason]
    updates: [role_binding.revoked_at, permission cache invalidated immediately]
    events: [binding.revoked]
    notifications:
      - {to: target_principal, channel: in_app_and_email_or_whatsapp, when: always, template: role_revoked, must_include: [role_label, actor_display_name, reason, timestamp], mandatory_operational: true}
    undoable: false
    confirmation_specification: 'Modal naming the role, the person, the count of their in-flight approvals that depend on it, and the count of their future assignments that require it. Required because undoable is false.'
    audit_class: security
    idempotency_key_source: binding_id. Revocation is monotonic and replay is a 2xx no-op that does not re-notify.
    offline_policy: refuse
    concurrency: Last-owner protection is evaluated under a row lock over the tenant's owner bindings inside the write transaction, for the same write-skew reason as the identity capability's last-owner rule.
    failure_modes:
      - {code: E_PRECONDITION, cause: last binding conferring tenant_owner, message: This is the only owner of this workspace. Transfer ownership first.}
      - {code: E_VALIDATION, cause: reason empty, message: Give a reason. It is recorded and shown to the person.}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
    edge_cases:
      - Revocation takes effect on the target's next request. Existing sessions are not revoked, because losing a role is not losing identity, and forcing a re-login for a routine permission change trains people to expect random logouts.
      - In-flight approvals assigned to the revoked binding are reassigned per the approval_fallback policy and never silently stall. If no fallback resolves, the revocation still succeeds and the stalled approvals are listed to the tenant_admin, because blocking a revocation on a workflow is how a departing employee keeps access.
      - Revoking a binding a person is actively using produces a specific message on their next action naming what changed and who changed it, not a generic denial. A permission that vanishes without explanation is indistinguishable from a bug and generates a support ticket every time.
      - Revoking the binding of a principal who is currently being impersonated by platform_support. The impersonation session immediately loses the permission too, since impersonation is an intersection and never a union.

  - key: create_delegation
    entity: delegation
    label: Delegate authority during an absence
    actors: [any_authenticated_with_delegable_authority]
    rationale: >
      Absence is normal and unplanned absence is normal too. Without a first-class
      delegation the workaround is credential sharing, which destroys attribution for every
      action taken. Modelling delegation is how the audit trail survives a manager going on
      leave.
    preconditions:
      - The delegator is not themselves acting under a delegation.
      - ends_at minus starts_at does not exceed max_delegation_days.
      - verb_subset contains no administer verb.
      - The delegate has an active membership in this tenant.
    inputs: [to_principal_id, verb_subset, entity_subset, scope_narrowing, starts_at, ends_at, reason]
    creates: [delegation]
    updates: []
    events: [delegation.created]
    notifications:
      - {to: to_principal, channel: in_app_and_push, when: always, template: delegation_offered, must_include: [from_display_name, verb_summary, window, reason]}
      - {to: 'the delegator''s manager where the org_structure port resolves one', channel: in_app, when: the delegated verbs include approve, template: approval_authority_delegated}
    undoable: true
    reversal_action: revoke_delegation
    audit_class: security
    idempotency_key_source: 'from_principal_id plus to_principal_id plus starts_at plus a hash of verb_subset. Re-submitting the same delegation returns the existing row.'
    offline_policy: refuse
    concurrency: >
      Overlapping delegations from the same delegator to different delegates are permitted
      and their effects union. Overlapping delegations to the SAME delegate are collapsed
      into one by the idempotency key when identical, and rejected with E_CONFLICT_UNIQUE
      when they differ, because two different answers to "what may this person do on your
      behalf right now" is not a state anyone can reason about.
    failure_modes:
      - {code: E_VALIDATION, cause: window exceeds max_delegation_days, message: 'A delegation can last at most N days. For anything longer, grant a role.', note: the message names the correct alternative rather than only refusing}
      - {code: E_PRECONDITION, cause: the delegator is acting under a delegation, message: You cannot pass on authority that was delegated to you.}
      - {code: E_VALIDATION, cause: verb_subset contains administer, message: Configuration authority cannot be delegated.}
      - {code: E_AUTHZ_ENTITY, cause: verb_subset contains a verb the delegator does not hold, message: You cannot delegate access you do not have.}
      - {code: E_CONFLICT_UNIQUE, cause: a different overlapping delegation to the same delegate already exists, message: You already have a different delegation to this person in this period.}
    edge_cases:
      - The delegator loses a permission while the delegation is active. The delegate loses it in the same instant, because evaluation is against the delegator's live permissions rather than a snapshot. This is stated in the invariants because the snapshot design is the intuitive one and it is wrong.
      - The delegator is suspended or deactivated. All their active delegations are revoked immediately with reason=delegator_unavailable, and both parties plus the tenant_admin are told. A delegation outliving its delegator is a permission with no owner.
      - The delegate is already more privileged than the delegator. The delegation grants nothing new and is refused at creation with a message saying so, rather than being created as a no-op that somebody will later assume is doing something.
      - Actions performed under a delegation are attributed to the delegate AND record the delegation id and the delegator. Both names appear in the audit and in any approval record. Attributing only to the delegate loses accountability; attributing only to the delegator is a lie.
      - A delegation spanning a capability being disabled. The delegated verbs on that capability simply resolve to deny, matching the behaviour of a normal grant against a disabled capability.
      - The delegate declines. Modelled as revoke_delegation by to_principal, not as a separate rejection state, so that there is one revocation path and one audit shape.

  - key: start_impersonation
    entity: role_binding
    label: Act as another principal
    actors: [platform_operator, platform_support]
    rationale: >
      Support cannot resolve "the button is greyed out for me" without seeing what the user
      sees. Impersonation is the alternative to asking a customer for their password, which
      is what happens when the platform does not provide it.
    preconditions:
      - A ticket reference is supplied.
      - Tenant admin consent is recorded, or a contract clause permitting support access is in force for this tenant.
      - The session is time-boxed to impersonation_max_minutes.
      - The acting operator's own session is elevated.
    inputs: [target_principal_id, tenant_id, ticket_reference, justification, requested_minutes]
    creates: [impersonation_session]
    updates: []
    events: [impersonation.started]
    notifications:
      - {to: tenant_admin, channel: email_and_in_app, when: always, template: support_access_started, must_include: [operator_display_name, ticket_reference, target_display_name, window], mandatory_legal: true}
      - {to: target_principal, channel: in_app, when: 'tenant policy notify_impersonated_user is true, which is the shipped default', template: support_acting_as_you}
    undoable: true
    reversal_action: end_impersonation
    audit_class: security
    idempotency_key_source: operator principal_id plus target principal_id plus ticket_reference plus the minute bucket of the request
    offline_policy: refuse
    concurrency: One live impersonation per operator at a time. A second request ends the first with reason=superseded rather than running two, because an operator acting as two people simultaneously makes the audit unreadable.
    failure_modes:
      - {code: E_PRECONDITION, cause: no consent and no contract clause, message: This workspace has not permitted support access., note: 'consent is per tenant and time-boxed, and expires; a permanent consent is not offered'}
      - {code: E_VALIDATION, cause: ticket reference missing or malformed, message: A ticket reference is required.}
      - {code: E_PRECONDITION, cause: target principal holds tenant_owner and the operator is platform_support rather than platform_operator, message: This action is not available in the current state., note: impersonating an owner is restricted to the higher archetype because an owner sees everything}
      - {code: E_AUTHN, cause: operator session not elevated, message: Confirm your identity to continue.}
      - {code: E_RATE_LIMIT, cause: more than impersonation_daily_limit sessions per operator per day, message: Too many attempts. Try again shortly., note: a limit that is generous for genuine support work and tight enough that bulk browsing is visible}
    edge_cases:
      - "Permissions under impersonation are the INTERSECTION of the target's permissions and the operator's own impersonation profile. platform_support carries a redaction of every field marked financial, so support sees the layout and the workflow without seeing the numbers. This is why impersonation is modelled here rather than in the identity capability - it is a permission construct."
      - Every mutating action performed under impersonation is written to the audit with both principal ids and the ticket reference, and is additionally rendered in the tenant's own audit view with an unmistakable marker. A support action a customer cannot see in their own audit trail is indistinguishable from an intrusion.
      - Elevation is unavailable under impersonation, because elevation requires a credential the operator does not hold. High-risk actions are therefore structurally impossible during support access rather than merely forbidden by a rule that could be misconfigured.
      - The impersonation window lapses mid-action. The action in flight completes and the session then ends; there is no partial write. The operator is returned to their own console with a summary of what they did.
      - The target principal is suspended during the impersonation. The impersonation ends immediately, because impersonating a principal who cannot themselves act would grant the operator authority the target does not have.
      - Impersonation is never available for an integration_principal. There is no user experience to reproduce, so the only reason to impersonate a service account is to use its credentials, which is exactly what must not happen.

rules:
  - key: no_privilege_escalation
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'A principal may never grant, delegate or bind a permission they do not themselves hold at a scope at least as wide, evaluated at request time against their live effective permissions rather than against their archetype.'
    on_conflict: not overridable
    rationale: This single rule is what makes the additive model safe. Without it, any administrator can reach any permission in two steps.

  - key: deny_wins
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'Grants are additive across roles. Explicit deny entries are evaluated last and win, regardless of the scope width of the competing allow.'
    on_conflict: not overridable

  - key: fail_closed_on_unknown
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'A permission decision that is neither definitively allow nor definitively deny fails the request with E_INTERNAL and raises an alert. It is never coerced to either value.'
    on_conflict: not overridable
    rationale: Kernel K16 mandates three-valued logic with explicit null semantics. This rule is what that mandate means at the decision boundary.

  - key: scope_denial_is_404
    kind: policy
    scope: kernel
    overridable_at: null
    default: 'Denial at the scope layer returns 404 with a body and a response time indistinguishable from a genuine miss. Denial at the entity layer returns 403.'
    on_conflict: not overridable

  - key: mfa_required_for_privileged_roles
    kind: validation
    scope: capability
    overridable_at: tenant
    default: 'A role carrying tenant_owner, tenant_admin, finance, platform_operator or platform_support archetype may only be bound to a principal with mfa_enrolled. A tenant may make this stricter by adding archetypes; it may not remove one.'
    on_conflict: the more restrictive override wins

  - key: approval_required_for_privileged_grant
    kind: policy
    scope: capability
    overridable_at: tenant
    default: 'false. Permission changes execute immediately.'
    expression: 'if tenant_config.approval_required_for_privileged_grant and role.archetypes intersects privileged_set then route through the approval_chain port'
    rationale: >
      Businesses legitimately differ. A two-person operation cannot four-eyes anything and
      requiring it would make the product unusable; a larger operation with a compliance
      obligation needs it. Shipped default is off, per kernel K07's requirement that every
      overridable rule ships a default so onboarding does not become a consulting project.
    on_conflict: most specific scope wins, no merging

policy_knobs:
  - {key: max_delegation_days, default: 30, range: [1, 180]}
  - {key: max_delegation_lead_days, default: 90, range: [1, 365]}
  - {key: delegation_activity_alert, default: 200, range: [10, 100000]}
  - {key: binding_expiry_warning_days, default: 7, range: [1, 60]}
  - {key: expired_binding_review_days, default: 30, range: [1, 365]}
  - {key: unused_binding_days, default: 90, range: [30, 730]}
  - {key: unbound_role_days, default: 90, range: [30, 730]}
  - {key: draft_role_stale_days, default: 14, range: [1, 90]}
  - {key: expression_failure_threshold, default: 100, range: [1, 10000]}
  - {key: evaluation_rate_limit_per_minute, default: 6000, lowest_settable_scope: kernel}
  - {key: impersonation_max_minutes, default: 60, range: [5, 480], lowest_settable_scope: kernel}
  - {key: impersonation_daily_limit, default: 25, lowest_settable_scope: kernel}
  - {key: notify_impersonated_user, default: true}
  - {key: approval_required_for_privileged_grant, default: false}
  - {key: tenant_role_limit, default: 100, range: [10, 1000], note: a soft governance limit; hitting it is evidence of role explosion rather than of growth}

open_questions:
  - {q: 'Does DEC-K-001 permit tenant-defined entities? If a tenant may add entities at runtime, permission_grant.entity_key can no longer be validated against a fixed manifest at write time, and the grant picker becomes a runtime-dynamic surface.', assumption: None. This is the gating decision and is deliberately not being answered here., confidence: VALIDATION_REQUIRED, method: resolve DEC-K-001, priority: Critical, blocks: [permission_grant.entity_key validation, publish_role guard, grant picker UI, upgrade break-detection]}
  - {q: 'Is field-level permission expressed per field, or per named field group? Per field is precise and produces an unusable administration screen once an entity has forty fields. Per group is usable and coarser.', assumption: The model supports per field. Whether the shipped administration UI exposes per field or only per group is a product decision that is not being made here., confidence: VALIDATION_REQUIRED, method: 'usability test with an operations manager configuring a role from scratch, measuring time to correct configuration', priority: High}
  - {q: 'How is a permission decision cached at the edge without making revocation slow? A per-request evaluation is correct and may not survive the read volume of a list screen rendering fifty rows with per-row affordances.', assumption: Per-request evaluation with a per-request memo. No cross-request cache in v1., confidence: WORKING_ASSUMPTION, method: 'load test a list screen at the p95 row count observed in pilot tenants, then decide whether a short TTL cache with an invalidation feed is required', priority: High, blocks: [performance budget, permission_change_feed consumers]}
  - {q: 'Should a tenant be able to author a condition_expression at all, or only choose from expressions a pack ships? Expressions are the most powerful and most dangerous configuration surface in the platform.', assumption: 'Pack-shipped expressions only in v1, with tenant authoring behind a platform flag.', confidence: WORKING_ASSUMPTION, method: pilot; measure how many tenant requirements the pack-shipped set fails to express, priority: Medium}
  - {q: 'What is the correct behaviour when a tenant revokes support-access consent DURING an active impersonation session?', assumption: The session ends at the next request boundary rather than mid-action., confidence: WORKING_ASSUMPTION, method: legal review of the support access clause plus one operator interview, priority: Medium}
  - {q: 'DEC-K-002 asks whether ports rebind at runtime. If org_structure can be unbound while role bindings reference its scope values, every affected binding silently narrows to nothing. Is that acceptable degradation, or must unbinding be blocked while bindings depend on it?', assumption: None. This is DEC-K-002 biting directly., confidence: VALIDATION_REQUIRED, method: resolve DEC-K-002, priority: High, blocks: [org_structure unbound_behaviour, role_binding.scope_bindings]}
