key: sla_contract
name: Contracts and Service Levels
layer: domain
confidence: KNOWN
description: >
  What was agreed with a counterparty, what performance it obliges, how the clock against
  that obligation runs, and what happens in money when it is missed. This capability owns
  the clock. Everything else asks it to start, pause, resume and stop, and never computes
  elapsed time for itself.

principles:
  - The contract is the authority on whether a clock pauses. Operational capabilities propose a pause reason; only the contract ratifies it. A work order that can pause its own clock can meet any target.
  - A target is measured against a calendar, not against wall time. Four business hours and four hours are different numbers, and getting this wrong understates every breach.
  - Breach is computed continuously, not at closure. A breach discovered when the work finishes is a breach nobody could have prevented.
  - Penalties and credits are recorded as obligations, never applied automatically to money. Applying a credit without a human is how a system issues a refund nobody authorised.
  - A contract change never rewrites history. Targets and calendars are versioned, and a measurement always resolves against the version in force when the clock started.
  - Performance reporting must reconcile to the penalty calculation exactly. Two numbers for the same quarter is how a commercial relationship ends.

entities:

  - key: contract
    name: Contract
    description: The agreement with a counterparty - its period, its scope, its commercial terms and the service levels it obliges.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: reference, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: counterparty_ref, type: uuid, req: true, note: resolved through the party_directory port}
      - {key: title, type: string, req: true}
      - {key: starts_on, type: date, req: true}
      - {key: ends_on, type: date, nullable: true}
      - {key: auto_renew, type: bool, req: true, default: false}
      - {key: renewal_notice_days, type: int, nullable: true}
      - {key: scope_location_refs, type: json, nullable: true, note: 'flat list of location references this contract covers, resolved through the org_structure port. Null means the whole tenant, which is explicit rather than implied by an empty list'}
      - {key: scope_expression, type: text, nullable: true, note: an Expression narrowing which records fall under this contract where locations are insufficient. Statically cost-bounded}
      - {key: billing_basis, type: enum, values: [fixed_periodic, per_outcome, per_unit_time, per_resource_period, hybrid, none], req: true, financial: true}
      - {key: currency, type: string, req: true, financial: true}
      - {key: value_minor, type: money_minor, nullable: true, financial: true}
      - {key: penalty_cap_minor, type: money_minor, nullable: true, financial: true, note: 'the ceiling on penalties in a measurement period. Mandatory in practice and nullable in the model, because a contract genuinely without a cap exists and pretending otherwise would force a fictional number'}
      - {key: operating_calendar_ref, type: uuid, nullable: true, note: 'the calendar targets are measured against, resolved through the location_calendar port. A contract calendar frequently differs from the location''s own operating hours'}
      - {key: document_ref, type: string, nullable: true, note: reference to the signed document through the evidence_capture port}
      - {key: owner_principal_id, type: uuid, nullable: true, note: resolved through the principal_directory port}
      - {key: version_number, type: int, req: true, default: 1}
      - {key: supersedes_contract_id, type: uuid, nullable: true, fk: contract}
    invariants:
      - ends_on, where set, is on or after starts_on.
      - auto_renew true requires renewal_notice_days. A contract that renews itself with no notice period is one nobody can get out of.
      - Financial fields are gated by view_financial and are never offline_editable.
      - A contract is never edited after activation. A change is a new version superseding the old, because a target edited mid-period changes what was already measured.
      - scope_expression may only traverse relationships the evaluating principal can traverse, per kernel K16.
      - Two active contracts may not claim the same record under overlapping scope. Overlap is detected at activation and refused, because a record under two contracts has two targets and two penalty regimes.
    states: [draft, pending_signature, active, suspended, expiring, expired, terminated]
    initial_state: draft
    transitions:
      - {from: draft, to: pending_signature, action: submit_contract, actor: 'ops_manager, finance or tenant_owner', guard: 'at least one service_level exists or billing_basis is none, and the scope does not overlap another active contract', side_effects: none, reversibility: true}
      - {from: pending_signature, to: draft, action: return_contract_to_draft, actor: 'ops_manager, finance or tenant_owner', guard: null, side_effects: none, reversibility: true}
      - {from: pending_signature, to: active, action: activate_contract, actor: finance or tenant_owner, guard: 'acting session is elevated, starts_on has been reached or is today, and the signed document is attached or its absence is explicitly acknowledged', side_effects: clocks begin resolving against this contract; existing open records within scope are listed rather than retroactively bound, reversibility: true}
      - {from: active, to: suspended, action: suspend_contract, actor: finance or tenant_owner, guard: acting session is elevated and a reason is supplied, side_effects: 'new clocks do not start; running clocks CONTINUE, because suspending a commercial relationship does not stop the obligation on work already accepted', reversibility: true}
      - {from: suspended, to: active, action: resume_contract, actor: finance or tenant_owner, guard: a reason is supplied, side_effects: none, reversibility: true}
      - {from: active, to: expiring, action: observe_renewal_window, actor: system_scheduler, guard: 'ends_on is within renewal_notice_days, or within contract_expiry_warning_days where no notice period is set', side_effects: 'the owner, finance and the counterparty relationship owner are told', reversibility: true}
      - {from: expiring, to: active, action: renew_contract, actor: finance or tenant_owner, guard: 'a new ends_on is supplied, or a superseding contract is activated', side_effects: none, reversibility: true}
      - {from: expiring, to: expired, action: observe_expiry, actor: system_scheduler, guard: 'now > ends_on', side_effects: 'no new clocks start; running clocks CONTINUE to their conclusion and are still measured, because work accepted under a contract is still owed', reversibility: true}
      - {from: active, to: expired, action: observe_expiry, actor: system_scheduler, guard: 'now > ends_on and the warning window was never observed', side_effects: as above, reversibility: true}
      - {from: expired, to: active, action: renew_contract, actor: finance or tenant_owner, guard: 'acting session is elevated, a new period is supplied and a reason for the retrospective renewal is recorded', side_effects: the gap period is recorded explicitly and work performed during it is listed for commercial review rather than silently absorbed, reversibility: false}
      - {from: active, to: terminated, action: terminate_contract, actor: tenant_owner, guard: 'acting session is elevated, a reason and an effective date are supplied', side_effects: 'as expiry, plus the counterparty relationship owner is told and open obligations are listed', reversibility: false}
      - {from: suspended, to: terminated, action: terminate_contract, actor: tenant_owner, guard: as above, side_effects: as above, reversibility: false}
      - {from: expiring, to: terminated, action: terminate_contract, actor: tenant_owner, guard: as above, side_effects: as above, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_contract_stale_days (default 30). Told: the drafting principal and
        the contract owner. Escape hatch: submit or discard. Low urgency, and the specific
        risk is that work is already being performed against terms that exist only in a
        draft, so the notification asks whether any work is already under way.
      pending_signature: >
        The state where work is most often already happening. Threshold:
        signature_chase_days (default 14), then weekly. Told: the contract owner and finance,
        and the notification carries the count of records already created within the
        contract's scope, because that count is the argument for chasing. Escape hatch:
        activate with the document absence acknowledged, or return to draft. Verity never
        auto-activates on the strength of work having started.
      active: >
        Steady state. Three monitored exceptions. (a) A contract with no service_level and a
        billing_basis other than none - it obliges money without obliging performance, which
        is legitimate and worth confirming once. (b) A contract whose penalty accrual in the
        current measurement period has passed penalty_warning_fraction of its cap (default
        0.5). Told: finance, the contract owner and ops_manager, because at that point the
        operational fix is still possible and after the cap it is not. (c) A contract whose
        scope resolves to zero records for scope_dry_days (default 60) - almost always a
        scope expression that stopped matching after a reorganisation, and it silently means
        nothing is being measured.
      suspended: >
        Threshold: contract_suspension_review_days (default 30). Told: finance and the
        contract owner, escalating to tenant_owner. Escape hatch: resume or terminate. A
        suspended contract with running clocks is the specific condition worth naming in the
        notification, because people assume suspension stops everything and it does not.
      expiring: >
        Bounded by ends_on. Notifications at the renewal notice date, then at half the
        remaining time, then weekly, then daily in the final week. Told: the contract owner,
        finance, and the relationship owner. Escape hatch: renew, supersede, or let it
        expire deliberately. Verity never auto-renews even where auto_renew is true - it
        creates the successor in draft and tells somebody, because an automatically renewed
        contract at unchanged prices is a commercial decision made by a scheduler.
      expired: >
        Not terminal in effect, because running clocks continue and work already accepted is
        still owed. The monitored exception is work still being performed within an expired
        contract's scope, reported daily to the contract owner and finance with the count and
        the value, because that work is being done for terms nobody has agreed. Escape hatch:
        renew retrospectively, activate a successor, or stop the work.
      terminated: >
        Terminal. Retained permanently. Running clocks that were live at termination are
        measured to their conclusion and reported, because the obligation existed when the
        work was accepted. Nothing further pends.

  - key: service_level
    name: Service Level
    description: One measurable obligation - what is measured, from what event to what event, against which calendar, to what target, with what consequence.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: contract_id, type: uuid, req: true, fk: contract}
      - {key: key, type: string, req: true}
      - {key: label, type: string, req: true}
      - {key: measure_kind, type: enum, values: [elapsed_to_first_response, elapsed_to_resolution, elapsed_to_arrival, coverage_fraction, availability_fraction, count_within_period, quality_score], req: true, note: a closed set of shapes. What is being responded to or resolved is never named here - the subject arrives through the measurable_event port}
      - {key: start_event_key, type: string, req: true, note: 'the event that starts the clock, matched against the event catalogue'}
      - {key: stop_event_key, type: string, nullable: true, note: null for measures that are fractions over a period rather than durations}
      - {key: target_value, type: decimal, req: true}
      - {key: target_unit, type: enum, values: [minutes, hours, business_hours, days, business_days, percent, count], req: true, note: business_hours and hours are deliberately distinct. Conflating them understates every breach and the difference is frequently a factor of three}
      - {key: calendar_ref, type: uuid, nullable: true, note: 'which calendar business_hours resolve against; falls back to the contract calendar and then to the location calendar, and which one was used is recorded on each measurement'}
      - {key: applies_when_expression, type: text, nullable: true, note: 'an Expression narrowing which records this level measures - by priority, by location, by category. Statically cost-bounded'}
      - {key: pausable_reason_keys, type: json, req: true, note: the ONLY reasons that may pause this clock. Empty means the clock never pauses. This is the field that makes the contract the authority on pausing rather than the operational capability}
      - {key: max_pause_minutes, type: int, nullable: true, note: 'a ceiling on total paused time per measurement, because an unbounded pause makes any target meetable'}
      - {key: measurement_period, type: enum, values: [per_record, daily, weekly, monthly, quarterly], req: true}
      - {key: aggregation, type: enum, values: [each_record, percentile, mean, worst_case, count_of_breaches], req: true, note: how per-record outcomes roll up. A 95th-percentile target and an every-record target are different obligations and are frequently written ambiguously in the underlying agreement}
      - {key: percentile, type: decimal, nullable: true, note: required when aggregation is percentile}
      - {key: grace_value, type: decimal, nullable: true, note: 'a tolerance before breach, expressed in target_unit'}
      - {key: version_number, type: int, req: true, default: 1}
    invariants:
      - aggregation=percentile requires percentile to be set and between 0 and 100 exclusive.
      - measure_kind values that are durations require stop_event_key. Fraction and count measures require it to be null.
      - pausable_reason_keys may be empty and may never be null. An empty list is the explicit statement that this clock does not pause, which is a materially different contract from one where nobody configured the field.
      - A service level is never edited after its contract activates. A change is a new version, and every measurement records the version it resolved against.
      - target_unit=business_hours requires a resolvable calendar at measurement time. A business-hours target with no calendar is measured in wall hours, which silently makes it three times harder to breach and is therefore refused rather than degraded.
    states: [draft, active, superseded]
    initial_state: draft
    transitions:
      - {from: draft, to: active, action: activate_contract, actor: finance or tenant_owner, guard: the owning contract activates and the level passes validation, side_effects: clocks begin to be created for matching records, reversibility: true}
      - {from: active, to: superseded, action: supersede_service_level, actor: finance or tenant_owner, guard: 'a new version is activated, or the contract terminates', side_effects: existing running clocks continue against THIS version; new clocks use the successor, reversibility: false}
      - {from: draft, to: superseded, action: discard_service_level_draft, actor: 'ops_manager, finance or tenant_owner', guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: tied to the owning contract's draft policy rather than to its own timer,
        because a service level in draft under an active contract is the real problem and it
        is detected by the contract's own no-service-level monitor. Told: the contract owner.
        Escape hatch: activate with the contract, or discard.
      active: >
        Two monitored exceptions. (a) A level whose breach rate exceeds
        chronic_breach_fraction (default 0.2) over two consecutive measurement periods - the
        target is unachievable with the current operation, and continuing to accrue penalties
        against it is a commercial conversation rather than an operational one. Told: the
        contract owner, finance and ops_manager. (b) A level that has produced zero
        measurements for measurement_dry_days (default 30) while its contract is active,
        which means applies_when_expression matches nothing and the obligation is invisible.
        Told: the contract owner. The second is the more dangerous of the two, because a
        target that is never measured reports as never breached.
      superseded: >
        Terminal. Retained permanently, because running measurements resolved against it and
        a completed measurement must remain explicable years later. Nothing pends.

  - key: sla_measurement
    name: SLA Measurement
    description: One clock against one record against one service level - when it started, what paused it, when it stopped, and whether it breached.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: service_level_id, type: uuid, req: true, fk: service_level}
      - {key: service_level_version, type: int, req: true, note: frozen at start. A later version never re-measures a running or completed clock}
      - {key: subject_ref, type: uuid, req: true, note: 'the record being measured, resolved through the measurable_event port. Opaque here'}
      - {key: subject_capability_key, type: string, req: true}
      - {key: location_ref, type: uuid, nullable: true}
      - {key: calendar_ref_used, type: uuid, nullable: true, note: 'which calendar was actually resolved, recorded because the fallback chain has three steps and a dispute about elapsed business hours always begins with which calendar was used'}
      - {key: started_at, type: timestamptz, req: true}
      - {key: target_at, type: timestamptz, nullable: true, note: 'the deadline, computed at start against the calendar and then FROZEN. Recomputing it as the calendar changes would move a deadline that a person has already been told'}
      - {key: stopped_at, type: timestamptz, nullable: true}
      - {key: total_paused_minutes, type: int, req: true, default: 0}
      - {key: elapsed_measured, type: decimal, nullable: true, note: 'elapsed in the level''s target_unit, excluding paused time and non-operating time'}
      - {key: outcome, type: enum, values: [running, paused, met, breached, breached_and_continuing, cancelled, not_applicable], req: true, default: running, note: breached_and_continuing exists because a breached clock keeps running - the work is still owed and the eventual elapsed time matters for the size of the consequence}
      - {key: breach_at, type: timestamptz, nullable: true}
      - {key: breach_margin, type: decimal, nullable: true, note: 'by how much, in target_unit. Signed, so a met measurement records how close it came - which is what tells an operations manager a target is about to become chronic'}
      - {key: excluded, type: bool, req: true, default: false}
      - {key: exclusion_reason, type: text, nullable: true}
      - {key: excluded_by_principal_id, type: uuid, nullable: true}
    invariants:
      - target_at is computed once at start and frozen. A deadline that moves after somebody has been told it is not a deadline.
      - service_level_version is frozen at start.
      - A measurement may only be paused for a reason in its level's pausable_reason_keys. A pause with any other reason is rejected, which is the mechanism that makes the contract the authority.
      - total_paused_minutes may never exceed the level's max_pause_minutes where one is set. Beyond the ceiling the clock resumes regardless of the pause state.
      - excluded=true requires exclusion_reason and excluded_by_principal_id. An unexplained exclusion is the single easiest way to make a performance report say whatever is wanted.
      - A measurement is append-only after it stops. Corrections are exclusions or disputes, never edits, because the measurement is the evidence in a penalty calculation.
    states: [running, paused, stopped, excluded, disputed]
    initial_state: running
    transitions:
      - {from: running, to: paused, action: pause_clock, actor: the measured capability through the port, guard: the reason is in pausable_reason_keys and max_pause_minutes is not exhausted, side_effects: 'accrual stops, the pause reason and actor are recorded', reversibility: true}
      - {from: paused, to: running, action: resume_clock, actor: 'the measured capability through the port, or system_scheduler on the pause ceiling', guard: null, side_effects: 'accrual resumes; where the ceiling forced it, that is recorded distinctly from a voluntary resume', reversibility: true}
      - {from: running, to: stopped, action: stop_clock, actor: the measured capability through the port, guard: the stop event occurred, side_effects: 'elapsed computed, outcome set to met or breached, a penalty obligation raised where breached', reversibility: true}
      - {from: paused, to: stopped, action: stop_clock, actor: as above, guard: the stop event occurred while paused, side_effects: as above, reversibility: true, note: 'legitimate and common - a record is resolved while awaiting a third party, and refusing the stop would leave a clock running on completed work'}
      - {from: running, to: excluded, action: exclude_measurement, actor: 'ops_manager, finance or tenant_owner', guard: acting session is elevated and a reason is supplied, side_effects: 'the measurement is removed from aggregation and from penalty calculation, and is retained and reported', reversibility: true}
      - {from: stopped, to: excluded, action: exclude_measurement, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: excluded, to: stopped, action: reinstate_measurement, actor: finance or tenant_owner, guard: acting session is elevated and a reason is supplied, side_effects: returns to aggregation; any penalty recalculation is raised as a new obligation rather than silently applied, reversibility: false}
      - {from: stopped, to: disputed, action: dispute_measurement, actor: 'the counterparty through the customer_surface port, or ops_manager', guard: a reason is supplied, side_effects: 'the dependent penalty obligation is held, not cancelled', reversibility: true}
      - {from: disputed, to: stopped, action: resolve_measurement_dispute, actor: finance or tenant_owner, guard: an outcome and a reason are recorded, side_effects: 'the penalty obligation is released, adjusted or cancelled explicitly', reversibility: false}
    stuck_state_policy:
      running: >
        A running clock is normal. The monitored exception is the one that matters most in
        this capability: a clock that has passed target_at and is still running. It moves to
        outcome=breached_and_continuing and escalates on the level's own escalation tiers,
        because at that point the size of the eventual consequence is still controllable.
        Told: the record owner, the location supervisor, then ops_manager, then the contract
        owner. A second exception is a clock running longer than
        runaway_clock_multiple times its target (default 10), which almost always means the
        stop event never fired - a port failure rather than an operational failure - and it
        is reported to platform_operator as well, because the two look identical from a
        report and have completely different fixes.
      paused: >
        The state most open to abuse, because pausing is how a target becomes meetable.
        Threshold: the level's max_pause_minutes where set, and otherwise
        pause_review_hours (default 24). Told: the record owner and ops_manager, with the
        pause reason and who applied it. Escape hatch: resume, or let the ceiling force it.
        A pause pattern - one reason accounting for more than pause_reason_concentration of
        all paused minutes (default 0.6) - is reported to the contract owner, because that is
        either a genuine systemic dependency worth renegotiating or a habit.
      stopped: >
        Terminal in measurement terms. The monitored exception is a breached measurement
        whose penalty obligation has not been raised within obligation_lag_minutes (default
        15), which means the penalty machinery is not running and a performance report will
        disagree with the penalty calculation. Told: platform_operator and finance. Two
        numbers for the same quarter is how a commercial relationship ends, so this monitor
        exists specifically to catch the divergence early.
      excluded: >
        Threshold: excluded measurements are reviewed in aggregate each measurement period
        rather than individually. Where exclusions exceed exclusion_rate_alert of
        measurements in a period (default 0.05), the contract owner, finance and tenant_owner
        are told with the reasons grouped and the principals named. Escape hatch: reinstate,
        or accept. Exclusions are the easiest way to make a performance report say what is
        wanted, and the control is visibility rather than prohibition, because genuine
        exclusions are real and refusing them would make the report equally dishonest in the
        other direction.
      disputed: >
        Threshold: measurement_dispute_days (default 10), escalating to tenant_owner. Told:
        both the counterparty, where a surface is bound, and finance. Escape hatch: resolve.
        The dependent penalty is HELD rather than cancelled while disputed, so that a dispute
        neither costs the tenant money prematurely nor lets it escape by delay.

  - key: penalty_obligation
    name: Penalty Obligation
    description: A recorded consequence of a breach - what is owed, to whom, under which term, and whether it has been applied.
    owner: tenant
    tenancy: tenant_scoped
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: contract_id, type: uuid, req: true, fk: contract}
      - {key: service_level_id, type: uuid, req: true, fk: service_level}
      - {key: measurement_period_start, type: date, req: true}
      - {key: measurement_period_end, type: date, req: true}
      - {key: breach_count, type: int, req: true}
      - {key: measured_value, type: decimal, req: true, note: 'the aggregated value that breached, so the obligation is self-explaining without recomputation'}
      - {key: target_value, type: decimal, req: true}
      - {key: calculated_amount_minor, type: money_minor, req: true, financial: true}
      - {key: capped_amount_minor, type: money_minor, req: true, financial: true, note: 'after the contract penalty cap, recorded separately so the difference between owed and payable is visible'}
      - {key: obligation_kind, type: enum, values: [credit_to_counterparty, deduction_from_invoice, service_credit_in_kind, recharge_to_supplier, none], req: true, financial: true}
      - {key: measurement_ids, type: json, req: true, note: 'flat list of the measurements that produced it, so a counterparty challenging the number can be shown every record behind it'}
      - {key: approved_by_principal_id, type: uuid, nullable: true}
      - {key: applied_reference, type: string, nullable: true, note: 'the credit note or invoice adjustment the billing capability created, recorded here so the two systems reconcile'}
      - {key: waived_reason, type: text, nullable: true}
    invariants:
      - An obligation is never applied to money by this capability. It is raised, approved and then handed to the billing capability, which is the only place money moves.
      - capped_amount_minor may never exceed the contract's penalty_cap_minor for the period, aggregated across all obligations in that period.
      - measurement_ids is mandatory and non-empty. A penalty number a counterparty cannot trace to individual records is a number they will refuse to accept.
      - Waiving requires a reason and is separately reported. A silently waived penalty is indistinguishable from one that was never calculated.
      - Financial fields are gated by view_financial.
    states: [calculated, pending_approval, approved, applied, waived, disputed]
    initial_state: calculated
    transitions:
      - {from: calculated, to: pending_approval, action: submit_penalty, actor: system_scheduler, guard: the measurement period has closed and no dependent measurement is disputed, side_effects: finance is notified, reversibility: true}
      - {from: pending_approval, to: approved, action: approve_penalty, actor: finance or tenant_owner, guard: acting session is elevated, side_effects: none, reversibility: true}
      - {from: approved, to: applied, action: apply_penalty, actor: finance or system, guard: the billing capability accepts it and returns a reference, side_effects: 'applied_reference recorded; this is the only point at which money is affected, and it happens in the billing capability', reversibility: false}
      - {from: pending_approval, to: waived, action: waive_penalty, actor: finance or tenant_owner, guard: acting session is elevated and a reason is supplied, side_effects: 'the counterparty is told where a surface is bound, because a waiver is a commercial concession and hiding it wastes it', reversibility: false}
      - {from: approved, to: waived, action: waive_penalty, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: calculated, to: disputed, action: dispute_penalty, actor: 'the counterparty through the customer_surface port, or finance', guard: a reason is supplied, side_effects: approval blocked pending resolution, reversibility: true}
      - {from: pending_approval, to: disputed, action: dispute_penalty, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: disputed, to: calculated, action: resolve_penalty_dispute, actor: finance or tenant_owner, guard: an outcome and a reason are recorded; where measurements were excluded the obligation is recalculated, side_effects: none, reversibility: false}
    stuck_state_policy:
      calculated: >
        Threshold: penalty_submission_days (default 3) after the measurement period closes.
        Told: finance. Escape hatch: submit. A calculated obligation that is never submitted
        means a performance report showing breaches and an invoice showing no credit, which
        the counterparty will notice before the tenant does.
      pending_approval: >
        Threshold: penalty_approval_days (default 7), escalating to tenant_owner. Told:
        finance and the contract owner. Escape hatch: approve or waive. Never auto-approved
        and never auto-waived - one moves money without authorisation and the other silently
        abandons a contractual obligation.
      approved: >
        Approved and unapplied is the state where the two systems diverge. Threshold:
        penalty_application_hours (default 48). Told: finance and platform_operator. Escape
        hatch: apply, or return to pending_approval. This is the same divergence the stopped
        measurement policy watches for, caught one stage later.
      disputed: >
        Threshold: penalty_dispute_days (default 14), escalating to tenant_owner. Told: both
        parties. Escape hatch: resolve. No expiry, for the same reason as attendance
        disputes - an expiring dispute resolves in favour of whoever raised the number.
      applied: >
        Terminal. Retained permanently with its applied_reference, which is the join between
        this capability's performance record and the billing capability's money record.
        Nothing pends.
      waived: >
        Terminal. Retained with the reason and the waiving principal. The monitored condition
        is a pattern - waivers exceeding waiver_rate_alert of obligations (default 0.3) over a
        year, reported to tenant_owner, because habitual waiving means either the targets are
        wrong or the penalty regime is not real, and both are worth knowing deliberately
        rather than discovering during a renegotiation.

ports:
  - port_key: party_directory
    direction: requires
    contract: Resolve the counterparty to a display name, contactable channels and permission scope.
    cardinality: exactly_one
    unbound_behaviour: FORBIDDEN. A contract is an agreement with somebody. Without a party directory there is no counterparty and no scope for a customer surface.

  - port_key: measurable_event
    direction: requires
    contract: >
      Subscribe to start and stop events from any capability, and resolve a subject reference
      to a display label, a location, a priority and its current state. The subject is opaque
      throughout - this capability never learns what kind of record it is measuring.
    cardinality: zero_or_many
    unbound_behaviour: >
      No measurements are created. Contracts still exist, still hold their terms, and measure
      nothing. The surface states that no measurable source is bound rather than showing a
      performance report of zero breaches, because a report of zero breaches with nothing
      measured is the most dangerous artefact this capability could produce.

  - port_key: sla_clock
    direction: provides
    contract: >
      Start, pause, resume and stop a clock against a subject, and report the current breach
      position and remaining time. A pause is accepted only where the reason appears in the
      service level's pausable_reason_keys, and a rejected pause returns the permitted
      reasons so the caller can present them.
    cardinality: exactly_one

  - port_key: location_calendar
    direction: requires
    contract: 'Given a calendar and an instant, return whether it is operating, so that business-hours targets can be computed.'
    cardinality: zero_or_one
    unbound_behaviour: >
      business_hours and business_days targets cannot be measured and their service levels
      cannot be activated. Wall-clock targets are unaffected. The refusal is deliberate: a
      business-hours target silently measured in wall hours is roughly three times harder to
      breach, so the tenant would see excellent performance against a target nobody is
      actually meeting.

  - port_key: org_structure
    direction: requires
    contract: Resolve contract scope locations and the location of each measured subject.
    cardinality: zero_or_one
    unbound_behaviour: 'Contract scope falls back to the whole tenant or to the scope expression alone. Location-specific service levels cannot be expressed, and any contract relying on them cannot be activated rather than being activated with a scope that quietly covers everything.'

  - port_key: financial_document_sink
    direction: requires
    contract: Accept an approved penalty obligation and produce the corresponding credit or adjustment, returning a reference.
    cardinality: zero_or_one
    unbound_behaviour: >
      Obligations are calculated, approved and recorded, and never applied. They appear as an
      outstanding list with their totals so a human can apply them elsewhere. This is
      deliberately not an error - a tenant may run billing outside Verity and still want the
      measurement.

  - port_key: customer_surface
    direction: requires
    contract: Expose a permissioned performance projection to the counterparty, and accept measurement and penalty disputes from them.
    cardinality: zero_or_one
    unbound_behaviour: 'Performance is internal only. Counterparties will request reports by email and dispute by telephone, and neither will appear in any record - which is the cost of leaving this unbound and is stated rather than discovered.'

  - port_key: approval_chain
    direction: requires
    contract: Route penalty approvals, waivers, measurement exclusions and contract activation for approval.
    cardinality: zero_or_one
    unbound_behaviour: Actions execute with the acting principal recorded and an audit note that no chain was configured. Exclusions and waivers are still counted and reported, because the rate is the control that matters more than the individual approval.

  - port_key: notification
    direction: requires
    contract: Deliver breach, approaching-breach, renewal, penalty and dispute messages.
    cardinality: zero_or_one
    unbound_behaviour: Everything degrades to console lists. Approaching-breach in particular becomes invisible, which converts this capability from a prevention tool into a reporting tool.

actions:

  - key: start_clock
    entity: sla_measurement
    label: Start a service-level clock
    actors: [system, integration_principal]
    rationale: >
      Modelled explicitly because the deadline computed here is told to people and to
      counterparties, and because the calendar fallback chain has three steps whose outcome
      must be recorded rather than recomputed later.
    preconditions: [an active contract covers the subject, an active service level matches it, no running measurement already exists for this subject and level]
    inputs: [service_level_id, subject_ref, subject_capability_key, location_ref, started_at]
    creates: [sla_measurement]
    updates: []
    events: [sla.clock_started]
    notifications:
      - {to: 'the subject''s owner', channel: in_app, when: 'the level''s target is inside notify_short_target_minutes', template: tight_deadline, must_include: [target_at, level_label]}
    undoable: true
    reversal_action: exclude_measurement
    audit_class: always
    idempotency_key_source: 'service_level_id plus subject_ref plus started_at. At-least-once event delivery means the start event WILL arrive twice, and two clocks on one record produce two breaches and two penalties for one failure.'
    offline_policy: refuse
    concurrency: >
      A partial unique index over (service_level_id, subject_ref) among running and paused
      measurements. A duplicate start returns the existing measurement rather than erroring,
      because the caller is an event consumer whose correct behaviour on a duplicate is to
      carry on.
    failure_modes:
      - {code: E_PRECONDITION, cause: no active contract covers the subject, message: null, note: 'no measurement is created and the fact is recorded against the subject as unmeasured, so that a record outside all contracts is visible rather than silently unmeasured'}
      - {code: E_PRECONDITION, cause: target_unit is business_hours and no calendar resolves, message: null, note: REFUSED rather than falling back to wall hours. The fallback would make the target roughly three times easier and the resulting report would show excellent performance against a target nobody is meeting}
      - {code: E_CONFLICT_UNIQUE, cause: a running measurement already exists, message: null, note: returns the existing measurement}
      - {code: E_VALIDATION, cause: started_at more than clock_backdate_limit_minutes in the past, message: null, note: 'accepted with the backdating recorded, because offline replay legitimately produces late start events and refusing them would leave the record unmeasured entirely'}
      - {code: E_DEPENDENCY, cause: the calendar service is unavailable, message: null, note: 'the measurement is created with target_at null and a recompute is queued. A clock with no deadline still records elapsed time, and the deadline can be established later; refusing the clock entirely would lose the start time'}
    edge_cases:
      - Two service levels on one contract both matching one subject - a first-response target and a resolution target. Both measurements are created and run concurrently. This is the normal case and the reason the unique index is per level rather than per subject.
      - A start event arriving for a subject whose contract activated after the subject was created. The measurement starts from the event time, not from the contract activation, and contract activation lists pre-existing open records rather than retroactively binding them. Retroactively starting clocks on work already in progress creates breaches nobody could have prevented.
      - Offline replay delivering a start event days late. The clock starts at the claimed occurred_at and the target is computed from there, so a deadline may already have passed at the moment the clock is created. It records as breached immediately, which is correct - the obligation existed regardless of when the system heard about it.
      - A subject that moves location mid-measurement, changing which calendar applies. The calendar resolved at start is frozen, and the move is recorded on the measurement. Re-resolving would move a deadline somebody has already been told.
      - The contract is suspended while the clock runs. The clock continues. Suspending a commercial relationship does not discharge an obligation on work already accepted, and this is stated in the transition side effects rather than left to inference.

  - key: pause_clock
    entity: sla_measurement
    label: Pause a service-level clock
    actors: [system, supervisor, ops_manager]
    rationale: >
      The most contested operation in this capability. Pausing is how an unachievable target
      becomes achievable, so the authority to pause belongs to the contract and not to the
      operation being measured.
    preconditions: [the measurement is running, the reason key appears in the level's pausable_reason_keys, the pause ceiling is not exhausted]
    inputs: [measurement_id, reason_key, note, paused_at]
    creates: [a pause interval on the measurement]
    updates: [measurement state, total_paused_minutes accrual]
    events: [sla.clock_paused]
    notifications:
      - {to: ops_manager, channel: in_app, when: the pause reason concentration threshold is exceeded for this level, template: pause_pattern, batching_policy: weekly digest}
    undoable: true
    reversal_action: resume_clock
    audit_class: always
    idempotency_key_source: measurement_id plus reason_key plus paused_at truncated to the minute
    offline_policy: refuse
    concurrency: >
      Pause and resume are applied under the measurement row lock and the accrual is computed
      from interval boundaries rather than from a running total, so a lost update cannot
      silently credit paused minutes. Two concurrent pauses collapse to one interval.
    failure_modes:
      - {code: E_PRECONDITION, cause: the reason is not in pausable_reason_keys, message: This action is not available in the current state., note: 'the response includes the permitted reasons so the caller can present them. This refusal is the mechanism that makes the contract the authority on pausing, and it is the single most important guard in this capability'}
      - {code: E_PRECONDITION, cause: max_pause_minutes is already exhausted, message: This action is not available in the current state., note: names the ceiling and the minutes already used}
      - {code: E_PRECONDITION, cause: the measurement is already paused, message: null, note: 2xx no-op}
      - {code: E_PRECONDITION, cause: the measurement has stopped, message: This action is not available in the current state.}
      - {code: E_VALIDATION, cause: paused_at before started_at or in the future, message: null, note: 'clamped to now with the clamping recorded, because a pause backdated before the clock started would produce negative elapsed time'}
    edge_cases:
      - A pause reason that the operational capability considers legitimate and the contract does not. Refused, and the refusal is surfaced to the operator with the permitted reasons. This is the designed friction - the alternative is a work order that can pause its own clock and therefore meet any target.
      - The pause ceiling being reached while the underlying blocker persists. The clock resumes automatically and the forced resume is recorded distinctly from a voluntary one. The operator is told, because from their point of view a blocked record has just started accruing against a deadline again and they need to escalate rather than wait.
      - Several pauses in one measurement. Fully supported; intervals accumulate. The concentration monitor looks at reasons across measurements rather than within one, because one long pause and six short ones for the same reason are the same finding.
      - Pausing a measurement whose subject is in a state the operational capability considers active. Permitted - pausing is a contractual statement about the clock, not an operational statement about the work, and conflating them is why the two are separate capabilities.
      - A pause applied while the counterparty is watching a live status through the customer surface. The pause and its reason category are visible to them, the free-text note is not. A clock that visibly stops with no reason shown is worse for trust than one that keeps running.

  - key: exclude_measurement
    entity: sla_measurement
    label: Exclude a measurement from performance
    actors: [ops_manager, finance, tenant_owner]
    rationale: >
      Genuine exclusions exist - a counterparty-caused delay, a force majeure day, a
      duplicate record. They are also the easiest way to make a performance report say
      whatever is wanted, so the model permits them and makes the rate impossible to hide.
    preconditions: [acting session is elevated, a reason is supplied, the measurement is not part of an already-applied penalty obligation]
    inputs: [measurement_id, exclusion_reason]
    creates: []
    updates: [measurement excluded flag, dependent aggregations recomputed, dependent obligations recalculated as new versions]
    events: [sla.measurement_excluded]
    notifications:
      - {to: finance and the contract owner, channel: in_app, when: always, template: measurement_excluded, must_include: [level_label, subject_reference, reason, actor_display_name]}
      - {to: tenant_owner, channel: in_app, when: the period exclusion rate exceeds exclusion_rate_alert, template: exclusion_rate_high, must_include: [rate, reasons_grouped, principals_named]}
    undoable: true
    reversal_action: reinstate_measurement
    audit_class: always
    idempotency_key_source: measurement_id plus target excluded state
    offline_policy: refuse
    concurrency: >
      Exclusion recomputes dependent aggregations under a lock on the measurement period, so
      an exclusion landing while a penalty is being calculated cannot produce a penalty
      computed from a set that no longer exists. Where an obligation was already submitted, a
      new version of it is raised rather than the original being edited.
    failure_modes:
      - {code: E_VALIDATION, cause: reason empty, message: Give a reason. It is shown to finance and the contract owner.}
      - {code: E_PRECONDITION, cause: the measurement belongs to an applied penalty obligation, message: This action is not available in the current state., note: 'the correct path is a credit or an adjustment through billing, because the money has already moved and un-excluding it here would make the two systems disagree'}
      - {code: E_AUTHN, cause: session not elevated, message: Confirm your identity to continue.}
      - {code: E_PRECONDITION, cause: the measurement is disputed, message: This action is not available in the current state., note: 'excluding a disputed measurement would resolve the dispute by removing its subject, which is not a resolution'}
    edge_cases:
      - Bulk exclusion of a whole day, for instance a site closure caused by the counterparty. Supported as a batch sharing one reason and one correlation_id, and it counts as many exclusions rather than one for the purposes of the rate alert - because the rate alert exists to make the volume visible and a batch would otherwise hide it.
      - Excluding a measurement that is currently the only one in its period. The aggregation becomes undefined rather than perfect. A period with every measurement excluded reports as not measured, never as fully met, because a performance report of one hundred percent with nothing measured is the artefact this capability most needs to avoid producing.
      - Exclusion by the principal whose own operation caused the breach. Permitted where they hold the role, and the notification names them. The control is that finance and the contract owner always see it, not that the operation is prevented from asking.
      - A counterparty who can see performance through the surface noticing an exclusion. Exclusions are visible in the counterparty projection with their reason category, because a performance figure that silently improved is the fastest way to lose a contract argument.

rules:
  - key: contract_is_the_authority_on_pausing
    kind: guard
    scope: kernel
    overridable_at: null
    default: 'A clock pauses only for a reason listed in its service level''s pausable_reason_keys. No operational capability may pause a clock for any other reason at any scope.'
    on_conflict: not overridable
    rationale: A capability that can pause its own clock can meet any target, and every SLA report becomes meaningless.

  - key: business_hours_require_a_calendar
    kind: validation
    scope: kernel
    overridable_at: null
    default: 'A service level with target_unit business_hours or business_days cannot be activated, and its clock cannot start, without a resolvable calendar. There is no fallback to wall time.'
    on_conflict: not overridable
    rationale: Silently measuring a business-hours target in wall hours makes it roughly three times harder to breach and produces a report showing excellent performance against a target nobody meets.

  - key: deadlines_are_frozen_at_start
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'target_at and service_level_version are computed once when the clock starts and are never recomputed.'
    on_conflict: not overridable

  - key: penalties_are_obligations_not_money
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'This capability never moves money. It raises an obligation, which is approved by a human and then applied by the billing capability, which returns a reference.'
    on_conflict: not overridable
    rationale: Automatically applying a credit is a system issuing a refund nobody authorised.

  - key: breached_clocks_keep_running
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A measurement that passes its target moves to breached_and_continuing and keeps accruing until its stop event. It is not closed at the moment of breach.'
    on_conflict: not overridable
    rationale: The work is still owed, and how late it eventually was determines the size of the consequence and the honesty of the report.

  - key: no_auto_renewal
    kind: policy
    scope: capability
    overridable_at: tenant
    default: 'Even where auto_renew is true, the system creates a successor contract in draft and notifies. It never activates a renewal without a person.'
    on_conflict: most specific scope wins
    rationale: An automatically renewed contract at unchanged prices is a commercial decision made by a scheduler.

  - key: exclusions_are_visible_not_prohibited
    kind: policy
    scope: capability
    overridable_at: tenant
    default: 'Exclusions are permitted with a reason, are reported individually to finance and the contract owner, are counted, and are visible to the counterparty where a surface is bound.'
    on_conflict: most specific scope wins
    rationale: Genuine exclusions are real. Prohibiting them makes the report dishonest in the other direction. Visibility is the control that works in both.

policy_knobs:
  - {key: contract_expiry_warning_days, default: 60, range: [1, 365]}
  - {key: draft_contract_stale_days, default: 30, range: [1, 180]}
  - {key: signature_chase_days, default: 14, range: [1, 90]}
  - {key: contract_suspension_review_days, default: 30, range: [1, 365]}
  - {key: scope_dry_days, default: 60, range: [7, 365]}
  - {key: measurement_dry_days, default: 30, range: [1, 365]}
  - {key: chronic_breach_fraction, default: 0.2, range: [0.01, 1.0]}
  - {key: penalty_warning_fraction, default: 0.5, range: [0.1, 1.0]}
  - {key: pause_review_hours, default: 24, range: [1, 720]}
  - {key: pause_reason_concentration, default: 0.6, range: [0.1, 1.0]}
  - {key: runaway_clock_multiple, default: 10, range: [2, 1000]}
  - {key: obligation_lag_minutes, default: 15, range: [1, 1440], lowest_settable_scope: kernel}
  - {key: exclusion_rate_alert, default: 0.05, range: [0.001, 1.0]}
  - {key: waiver_rate_alert, default: 0.3, range: [0.01, 1.0]}
  - {key: penalty_submission_days, default: 3, range: [0, 60]}
  - {key: penalty_approval_days, default: 7, range: [1, 90]}
  - {key: penalty_application_hours, default: 48, range: [1, 720]}
  - {key: penalty_dispute_days, default: 14, range: [1, 180]}
  - {key: measurement_dispute_days, default: 10, range: [1, 180]}
  - {key: clock_backdate_limit_minutes, default: 4320, range: [0, 43200]}
  - {key: notify_short_target_minutes, default: 240, range: [1, 10080]}

open_questions:
  - {q: 'When a service level target is expressed in an underlying agreement ambiguously - "resolve within four hours" without stating whether that is every record or a percentile - which reading does Verity default to? The two are materially different obligations and the model forces a choice at configuration time.', assumption: None. aggregation is a required field with no default precisely so the ambiguity surfaces during configuration rather than during a penalty argument., confidence: VALIDATION_REQUIRED, method: review a sample of real agreements from the target segments and count how many are ambiguous on this point, priority: High, blocks: [service_level.aggregation default, AET-06 decision count]}
  - {q: 'Should a counterparty be able to see a live clock, or only completed performance? Live visibility is what a modern service relationship expects and it also means every operational delay is watched in real time, which changes behaviour in ways that are not all good.', assumption: None. The customer_surface port supports both and the model does not choose., confidence: VALIDATION_REQUIRED, method: operator interviews and a pilot with one counterparty given live visibility, priority: High}
  - {q: 'Does a breach on a paused-then-resumed clock get measured against the original frozen target_at, or against a target extended by the paused time? The model freezes target_at and excludes paused time from elapsed, which means a heavily paused record can pass its frozen target_at and still be met. That is internally consistent and may not be what an agreement means.', assumption: Elapsed excludes paused time and target_at is frozen for display. Whether the agreement means the same thing is not established., confidence: VALIDATION_REQUIRED, method: legal and commercial review of sample agreements; this specific point is a common source of dispute, priority: Critical, blocks: [sla_measurement.target_at semantics, breach computation, penalty calculation]}
  - {q: 'What happens to obligations when a contract is superseded mid-measurement-period? Obligations accrue per period and the period spans two contracts with potentially different caps.', assumption: None. The model has no rule for this and inventing one would silently decide how much money changes hands., confidence: VALIDATION_REQUIRED, method: commercial review; likely differs by whether the supersession is a renewal or a renegotiation, priority: High, blocks: [penalty_obligation period boundaries, contract versioning]}
  - {q: 'Is a penalty cap per measurement period, per year, or per contract? The model puts it on the contract and applies it per period, which is one of at least three defensible readings.', assumption: 'Per measurement period, aggregated across all obligations in that period.', confidence: WORKING_ASSUMPTION, method: review of sample agreements, priority: High}
