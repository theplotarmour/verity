key: kitchen_flow
name: Preparation Flow
layer: domain
confidence: KNOWN
description: >
  Routing work to preparation stations, tracking its progress through timed states,
  coordinating several stations so that parts of one request finish together, and recalling
  work when something goes wrong. It is a fulfilment route: it receives lines through a port,
  it never learns what kind of operation it is serving, and it runs on cheap shared devices
  with poor connectivity as its normal case rather than its degraded one.

naming_note: >
  The capability KEY is an industry noun and is a known violation of AET-01 and of the
  kernel's exclusion of industry nouns. The key is retained because it is the identifier in
  the authoring backlog and changing it silently would break traceability. Nothing inside the
  model uses that noun: the model speaks of stations, preparation tickets and preparation
  steps. See open_questions for the proposed rename to preparation_flow, which is a decision
  for the product owner rather than one to be taken here.

principles:
  - Offline is the normal state, not the exception. Every action must complete on a device with no connectivity and reconcile without losing work or duplicating it.
  - The display is the product. A station screen is read from two metres away by somebody holding something in both hands, and every model decision that makes the screen denser makes the operation slower.
  - Coordination between stations is the hard part. Parts of one request finishing at different times is the default failure and the model addresses it explicitly rather than leaving it to whoever is shouting.
  - A timer measures elapsed time and never asserts quality. A step that has taken too long needs a person to look at it, not an automatic transition.
  - Recall is a first-class act with a cost. Work that has to be redone is the single most useful quality signal a preparation operation produces, and a model that treats it as a void loses it.
  - Nothing is ever silently dropped. A ticket that cannot be routed is shown to a human immediately, because the alternative is a request that nobody is preparing and everybody believes is in hand.

entities:

  - key: station
    name: Station
    description: A place where preparation work happens, with its own queue, its own display and its own capacity.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: location_ref, type: uuid, req: true, note: resolved through the org_structure port}
      - {key: key, type: string, req: true, unique_scope: tenant, immutable: true}
      - {key: label, type: string, req: true, note: what is written on the screen and said out loud. Short by necessity}
      - {key: routing_tags, type: json, req: true, note: 'flat list of scalars matched against a line''s routing tags. This is the entire routing mechanism and it is deliberately a tag match rather than a rule, because a rule engine on a station screen is a rule engine nobody can debug at the busiest hour'}
      - {key: concurrent_capacity, type: int, req: true, default: 1, note: how many preparation steps this station can have in progress at once. Drives the queue display and the load warning}
      - {key: sequence_position, type: int, req: true, default: 0, note: 'where this station sits in a chain, for operations where work passes from one station to the next. Zero means it is not part of a chain'}
      - {key: default_step_seconds, type: int, nullable: true, note: 'used where an item supplies no duration, so that a timer exists rather than not existing'}
      - {key: display_device_refs, type: json, nullable: true, note: 'flat list of device references, resolved through the principal_directory port'}
      - {key: expedite_visible, type: bool, req: true, default: true, note: whether this station sees expedite signals. A station that cannot act on urgency should not be shown it}
      - {key: accepts_when_offline, type: bool, req: true, default: true}
    invariants:
      - routing_tags may not be empty. A station with no tags receives nothing and appears to be broken to whoever is standing at it.
      - concurrent_capacity is at least one.
      - Two stations at one location may share routing tags; a line matching both is routed to both only where the line explicitly requires multi-station preparation, and otherwise to the one with the lowest sequence_position. This is stated because the alternative - duplicating every ambiguous line - is how one request becomes two pieces of work.
      - A station may not be deleted while any non-terminal preparation ticket references it. Stations are retired, because a historical ticket must resolve to where it was prepared.
    states: [draft, open, paused, closed, retired]
    initial_state: draft
    transitions:
      - {from: draft, to: open, action: open_station, actor: supervisor or ops_manager, guard: routing tags are non-empty and at least one display device is bound or the station is explicitly display-less, side_effects: the station begins receiving routed lines, reversibility: true}
      - {from: open, to: paused, action: pause_station, actor: supervisor or ops_manager, guard: a reason is supplied, side_effects: 'new lines route to the next matching station, or queue unrouted where none matches; work in progress is untouched', reversibility: true}
      - {from: paused, to: open, action: resume_station, actor: supervisor or ops_manager, guard: null, side_effects: queued unrouted lines matching this station are offered to it, reversibility: true}
      - {from: open, to: closed, action: close_station, actor: supervisor or ops_manager, guard: 'no preparation step is in progress, or each has been reassigned', side_effects: the station stops receiving lines; its display shows a closed state rather than an empty queue, reversibility: true}
      - {from: paused, to: closed, action: close_station, actor: as above, guard: as above, side_effects: as above, reversibility: true}
      - {from: closed, to: open, action: open_station, actor: as above, guard: null, side_effects: as above, reversibility: true}
      - {from: closed, to: retired, action: retire_station, actor: ops_manager, guard: no non-terminal ticket references it, side_effects: 'removed from routing configuration, historical tickets still resolve', reversibility: false}
      - {from: draft, to: retired, action: retire_station, actor: ops_manager, guard: null, side_effects: none, reversibility: false}
    stuck_state_policy:
      draft: >
        Threshold: draft_station_stale_days (default 7). Told: the creating principal and the
        location supervisor. Escape hatch: open or retire. The characteristic failure is a
        station configured during setup and never opened, so lines matching its tags queue
        unrouted and nobody knows why.
      open: >
        Steady state. Three monitored exceptions, all in minutes because this is a live
        operation. (a) A station whose queue depth exceeds concurrent_capacity multiplied by
        queue_depth_alert_multiple (default 3) for longer than queue_depth_alert_minutes
        (default 5) - it is overwhelmed and every request behind it is late. Told: the
        location supervisor on the floor, in place, not by email. (b) A station whose display
        device has not been seen for display_heartbeat_seconds (default 90) - the screen is
        dark and the work on it is invisible. Told: the supervisor immediately; this is the
        failure that produces requests nobody prepares. (c) A station with an open queue and
        no step started for idle_with_queue_minutes (default 5), which is somebody having
        walked away from a station that has work on it.
      paused: >
        Threshold: station_pause_review_minutes (default 15). Told: the pausing principal and
        the supervisor. Escape hatch: resume or close. A paused station is routing work
        elsewhere or leaving it unrouted, and either way the effect compounds by the minute,
        which is why the threshold is a quarter of an hour rather than a day.
      closed: >
        Not a queue in itself. The monitored exception is lines routing to no open station at
        all, which is reported against the location rather than against any one station - see
        the preparation_ticket unrouted policy, which is where that condition lives.
      retired: >
        Terminal. Retained permanently so a historical ticket resolves to where it was
        prepared. Nothing pends.

  - key: preparation_ticket
    name: Preparation Ticket
    description: One request's worth of preparation work, spanning every station involved, with its coordination target and its overall progress.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: location_ref, type: uuid, req: true}
      - {key: source_ref, type: uuid, req: true, note: 'the request this prepares, resolved through the fulfilment_route port. Opaque here - this capability never learns what kind of request it is'}
      - {key: source_capability_key, type: string, req: true}
      - {key: display_reference, type: string, req: true, note: 'the short code on the screen and called out. Deliberately short and deliberately not the source reference, because a long identifier read aloud across a noisy room is misheard'}
      - {key: sequence_number, type: int, req: true, note: 'monotonic per location per operating day. This is what people actually use to order work, and it must be stable and gapless within a day even when tickets are recalled'}
      - {key: received_at, type: timestamptz, req: true, immutable: true}
      - {key: target_ready_at, type: timestamptz, nullable: true, note: 'when everything should be finished together. The coordination target, from the source request''s promise'}
      - {key: coordination_mode, type: enum, values: [all_together, as_ready, staged], req: true, default: all_together, note: 'whether the parts must finish together, may leave as they finish, or leave in declared stages. This single field is the difference between a coordinated operation and a shouted one'}
      - {key: priority, type: enum, values: [normal, expedite, hold], req: true, default: normal}
      - {key: expedited_by_principal_id, type: uuid, nullable: true}
      - {key: expedited_reason, type: text, nullable: true}
      - {key: ready_at, type: timestamptz, nullable: true}
      - {key: collected_at, type: timestamptz, nullable: true}
      - {key: recall_of_ticket_id, type: uuid, nullable: true, fk: preparation_ticket}
      - {key: recall_count, type: int, req: true, default: 0}
      - {key: notes, type: text, nullable: true, note: 'instructions that must reach every station, shown on every step rather than only on the ticket header'}
      - {key: created_offline, type: bool, req: true, default: false}
      - {key: sync_lag_seconds, type: int, nullable: true}
    invariants:
      - sequence_number is unique per location per operating day and is allocated from a device-local range when offline, so two devices cannot mint the same number. The range allocation is what makes offline sequence numbers safe and it is stated because the obvious implementation collides on the first busy offline period.
      - A ticket with no steps may not leave received. An empty ticket is a display line nobody can act on.
      - ready_at is set only when every step required by the coordination mode has completed. It is derived and never written directly.
      - recall_of_ticket_id and origin recall are set together, and the original's recall_count is incremented in the same transaction.
      - notes propagate to every step. A note held only on the ticket header is a note the person at the station does not see.
    states: [received, unrouted, in_preparation, partially_ready, ready, collected, recalled, cancelled]
    initial_state: received
    transitions:
      - {from: received, to: in_preparation, action: route_ticket, actor: system, guard: every line matched at least one open station, side_effects: preparation steps are created and appear on station displays, reversibility: false}
      - {from: received, to: unrouted, action: route_ticket, actor: system, guard: at least one line matched no open station, side_effects: 'the ticket appears on the supervisor surface with the unmatched lines named, immediately and loudly', reversibility: true}
      - {from: unrouted, to: in_preparation, action: route_ticket, actor: system or supervisor, guard: 'a station opened, or a supervisor assigned the lines manually', side_effects: as for routing, reversibility: false}
      - {from: in_preparation, to: partially_ready, action: observe_step_completion, actor: system, guard: some but not all steps are complete and coordination_mode is as_ready or staged, side_effects: the completed part is released for collection, reversibility: true}
      - {from: in_preparation, to: ready, action: observe_step_completion, actor: system, guard: every step is complete, side_effects: 'ready_at set, the source is told through the port, whoever collects is told', reversibility: true}
      - {from: partially_ready, to: ready, action: observe_step_completion, actor: system, guard: every step is complete, side_effects: as above, reversibility: true}
      - {from: ready, to: collected, action: record_collection, actor: employee or system, guard: null, side_effects: the source is told; the ticket leaves the display, reversibility: true}
      - {from: partially_ready, to: collected, action: record_collection, actor: employee, guard: coordination_mode is as_ready and the outstanding parts are explicitly abandoned or re-ticketed, side_effects: as above, reversibility: true}
      - {from: ready, to: recalled, action: recall_ticket, actor: 'employee, supervisor or the source through the port', guard: a recall reason is supplied, side_effects: 'a NEW ticket is created with origin recall pointing at this one, the original''s recall_count is incremented, the cost of the recalled work is recorded', reversibility: false}
      - {from: collected, to: recalled, action: recall_ticket, actor: as above, guard: as above, side_effects: as above, reversibility: false}
      - {from: in_preparation, to: cancelled, action: cancel_ticket, actor: 'the source through the port, or a supervisor', guard: a reason is supplied, side_effects: 'steps are cancelled, stations are told immediately, work already done is recorded as produced-and-cancelled with its cost', reversibility: false}
      - {from: received, to: cancelled, action: cancel_ticket, actor: as above, guard: null, side_effects: none, reversibility: false}
      - {from: unrouted, to: cancelled, action: cancel_ticket, actor: as above, guard: null, side_effects: none, reversibility: false}
      - {from: partially_ready, to: cancelled, action: cancel_ticket, actor: supervisor, guard: a reason is supplied, side_effects: as for in_preparation, reversibility: false}
    stuck_state_policy:
      received: >
        Received and unrouted for more than routing_lag_seconds (default 10) means the routing
        machinery is not running while requests are arriving. Told: the location supervisor
        AND platform_operator, because the two possible causes - no matching station open, and
        the router being down - look identical from the floor and have completely different
        fixes. Threshold in seconds, because a preparation operation measured in minutes
        cannot absorb a routing delay measured in minutes.
      unrouted: >
        The loudest condition in this capability. A request has been accepted and nothing is
        being prepared. Threshold: immediate on entry, repeated every unrouted_repeat_seconds
        (default 60) until resolved. Told: the location supervisor on the floor surface, with
        the specific lines and the tags that matched nothing. Escape hatch: open a station,
        assign manually, or cancel. Never resolved automatically by routing to the nearest
        station, because a line prepared at the wrong station is worse than one nobody started
        - it consumes capacity and produces the wrong thing.
      in_preparation: >
        Bounded by the steps. The monitored exception is a ticket whose slowest step will miss
        target_ready_at, computed continuously rather than at the deadline. Threshold: when
        projected completion exceeds target_ready_at by more than
        lateness_alert_seconds (default 120). Told: the station holding the slow step, then
        the supervisor. Escape hatch: expedite, reassign, or change the coordination mode so
        that the ready parts can leave. Projecting rather than waiting is the whole point,
        because at the deadline nothing can be done.
      partially_ready: >
        Parts are finished and waiting, losing condition or occupying space, while other parts
        are still being prepared. Threshold: partial_wait_alert_seconds (default 180) from the
        first part becoming ready. Told: the station holding the outstanding steps and the
        supervisor. Escape hatch: finish, release the ready parts, or re-ticket the remainder.
        This state is where a coordination failure actually costs something, and it is
        deliberately measured from the first part rather than from the ticket start.
      ready: >
        Finished and uncollected. Threshold: uncollected_alert_seconds (default 120), then
        every minute. Told: whoever collects, then the supervisor. Escape hatch: collect, or
        recall as unusable with a reason. This is the state where preparation work quietly
        degrades and the loss is invisible unless it is measured, so the elapsed time between
        ready_at and collected_at is retained on every ticket and reported.
      recalled: >
        Terminal on this ticket; the successor carries the work. The monitored condition is a
        chain - more than recall_chain_alert recalls in sequence (default 1) - told to the
        supervisor and ops_manager immediately rather than as a pattern, because a second
        recall of the same request means something is wrong that another attempt will not fix.
      collected: >
        Terminal. Retained. The one thing still pending is the source acknowledgement - a
        collected ticket whose source has not been told within source_ack_seconds (default 30)
        is reported to platform_operator, because a source that believes work is still in
        preparation will not release the request.
      cancelled: >
        Terminal. Retained with the reason and with the cost of any work already done,
        recorded as produced-and-cancelled. Absorbing that cost silently means the operation
        never learns what late cancellation costs it. Nothing pends.

  - key: preparation_step
    name: Preparation Step
    description: One station's part of one ticket, with its own timer, its own state and its own person.
    owner: tenant
    tenancy: tenant_scoped_with_site_partition
    fields:
      - {key: id, type: uuid, req: true, immutable: true}
      - {key: tenant_id, type: uuid, req: true, immutable: true}
      - {key: ticket_id, type: uuid, req: true, fk: preparation_ticket}
      - {key: station_id, type: uuid, req: true, fk: station}
      - {key: line_refs, type: json, req: true, note: flat list of source line references this step covers}
      - {key: display_summary, type: string, req: true, note: the frozen text shown on the station display. Frozen because resolving item names live means a station screen that changes while somebody is reading it}
      - {key: quantity_summary, type: string, req: true}
      - {key: step_notes, type: text, nullable: true}
      - {key: expected_seconds, type: int, nullable: true}
      - {key: started_at, type: timestamptz, nullable: true}
      - {key: completed_at, type: timestamptz, nullable: true}
      - {key: elapsed_seconds, type: int, nullable: true}
      - {key: started_by_principal_id, type: uuid, nullable: true}
      - {key: completed_by_principal_id, type: uuid, nullable: true}
      - {key: bumped_forward_from_step_id, type: uuid, nullable: true, fk: preparation_step, note: for chained stations where work passes onward}
      - {key: sequence_position, type: int, req: true, default: 0}
      - {key: hold_reason, type: text, nullable: true}
      - {key: device_ref, type: uuid, nullable: true, note: 'which display the action was taken on, resolved through the principal_directory port'}
    invariants:
      - completed_at requires started_at, and completed_at is on or after started_at.
      - elapsed_seconds is derived from the timestamps and is never written directly, so a device with a wrong clock cannot inflate or deflate it.
      - display_summary and quantity_summary are frozen at creation. A station display whose text changes while somebody is reading it is a station display nobody trusts.
      - A step in a chained station may not start before its predecessor completes, and the guard is on the step rather than on the display, because a display can be bypassed and a constraint cannot.
      - step_notes always carries the ticket notes as well as any line-specific ones. A note the person at the station cannot see is a note that does not exist.
    states: [queued, in_progress, held, complete, cancelled]
    initial_state: queued
    transitions:
      - {from: queued, to: in_progress, action: start_step, actor: employee, guard: the station is open and any predecessor step is complete, side_effects: the timer starts; the step moves to the active area of the display, reversibility: true}
      - {from: in_progress, to: queued, action: unstart_step, actor: employee, guard: within unstart_grace_seconds of starting, side_effects: the timer is discarded and the mis-tap is recorded rather than the elapsed time being kept, reversibility: false, note: 'a short window for the near-universal mis-tap on a crowded screen. Without it, every accidental start becomes a false timing record'}
      - {from: in_progress, to: held, action: hold_step, actor: employee, guard: a reason is supplied, side_effects: 'the timer continues to run and the hold is shown, because a step that is waiting is still late', reversibility: true}
      - {from: held, to: in_progress, action: resume_step, actor: employee, guard: null, side_effects: none, reversibility: true}
      - {from: in_progress, to: complete, action: complete_step, actor: employee, guard: null, side_effects: 'elapsed recorded, the ticket''s readiness recomputed, the next station in a chain is offered its step', reversibility: true}
      - {from: held, to: complete, action: complete_step, actor: employee, guard: null, side_effects: as above, reversibility: true}
      - {from: complete, to: in_progress, action: reopen_step, actor: employee or supervisor, guard: 'within reopen_grace_seconds, or with supervisor authority afterwards, and a reason is supplied', side_effects: 'the ticket''s readiness recomputed, the original elapsed time retained alongside the new one', reversibility: false}
      - {from: queued, to: cancelled, action: cancel_ticket, actor: system on ticket cancellation, guard: null, side_effects: removed from the display, reversibility: false}
      - {from: in_progress, to: cancelled, action: cancel_ticket, actor: system on ticket cancellation, guard: null, side_effects: 'removed from the display and the partial work is recorded with its elapsed time, so the cost of a late cancellation is visible', reversibility: false}
      - {from: held, to: cancelled, action: cancel_ticket, actor: as above, guard: null, side_effects: as above, reversibility: false}
    stuck_state_policy:
      queued: >
        A step waiting while its station has capacity is either a busy moment or a station
        nobody is at. Threshold: queued_alert_seconds (default 120), or the projected lateness
        of its ticket, whichever comes first. Told: the station display itself first, by moving
        the step to the top and marking it, which is the only notification that reliably
        reaches somebody with both hands full. Then the supervisor. Escape hatch: start it, or
        reassign the step to another station with matching tags.
      in_progress: >
        Threshold: expected_seconds multiplied by overrun_alert_multiple (default 2), or
        step_overrun_alert_seconds (default 600) where no expectation exists. Told: the
        station display, then the supervisor. Escape hatch: complete, hold with a reason, or
        have a supervisor reassign. There is deliberately no automatic completion at any
        threshold. An automatic completion marks something as done that nobody did, and the
        request then leaves as ready with nothing behind it.
      held: >
        A held step is late and known to be late, and the timer keeps running so that the
        lateness is honest. Threshold: hold_alert_seconds (default 300). Told: the supervisor
        with the hold reason, because a hold reason repeated across several steps is a supply
        problem rather than a preparation problem. Escape hatch: resume, complete, or cancel
        the ticket.
      complete: >
        Terminal unless reopened. The reopen window is short by design. The monitored condition
        is a step completing far faster than its expectation - below
        implausible_speed_fraction of expected_seconds (default 0.1) - reported as a pattern
        rather than an instance, because a station where everything completes in two seconds
        is a station where somebody is clearing the screen rather than doing the work, and
        that is the most damaging failure a station display can have.
      cancelled: >
        Terminal. Retained with any elapsed time already accrued. Nothing pends.

ports:
  - port_key: fulfilment_route
    direction: provides
    contract: >
      Accept lines for preparation with their routing tags, notes, quantities and a
      coordination target; report start, readiness, collection and recall; accept a
      cancellation request and refuse it where the work is already done. The source request is
      opaque throughout.
    cardinality: zero_or_many

  - port_key: orderable_item
    direction: requires
    contract: Resolve a line to its display label, its routing tags, its expected preparation duration and its composition where components are consumed.
    cardinality: zero_or_one
    unbound_behaviour: >
      Lines arrive carrying their own display text and tags from the source, and no expected
      duration is known, so timers run without an expectation and every overrun alert falls
      back to the fixed threshold. This works and loses the projected-lateness monitor, which
      is the most valuable thing this capability computes.

  - port_key: org_structure
    direction: requires
    contract: Resolve the location and its operating day boundary, so that sequence numbers reset correctly.
    cardinality: zero_or_one
    unbound_behaviour: 'Sequence numbers reset at calendar midnight in the tenant timezone. For any operation running past midnight this restarts numbering mid-service, which is confusing at exactly the busiest moment and is stated rather than discovered.'

  - port_key: stock_movement_sink
    direction: requires
    contract: Consume component quantities at the location when a step completes.
    cardinality: zero_or_one
    unbound_behaviour: 'No consumption is recorded. Preparation works completely; stock does not move. This is the correct behaviour for an operation with no stock system and it means component availability cannot constrain what is accepted.'

  - port_key: evidence_capture
    direction: requires
    contract: Attach a photograph to a completed step or a recall, with tamper evidence and offline queueing.
    cardinality: zero_or_one
    unbound_behaviour: Recalls carry a reason and no evidence. Quality disputes about a recall become one person's word, which is materially weaker and is not a blocker.

  - port_key: notification
    direction: requires
    contract: Deliver readiness and collection signals to whoever collects, and unrouted and lateness alerts to the supervisor.
    cardinality: zero_or_one
    unbound_behaviour: >
      Everything is shown on the station and supervisor displays and nothing is pushed. For an
      operation where everybody is in one room this is entirely sufficient. For one where the
      collector is elsewhere, readiness is invisible to them, and a pack enabling remote
      collection must bind this port.

  - port_key: presence_evidence
    direction: requires
    contract: Confirm that the device recording a step is at the location it claims to be.
    cardinality: zero_or_one
    unbound_behaviour: Steps are recorded with the device reference and no position verdict. A fixed station display is not going anywhere, so this port matters only where preparation happens on handheld devices, and its absence is recorded on each step rather than assumed away.

actions:

  - key: route_ticket
    entity: preparation_ticket
    label: Route work to stations
    actors: [system, supervisor]
    rationale: >
      The moment a request becomes work somebody can see. Its failure mode - a line matching
      no open station - is the single most damaging quiet failure in a preparation operation
      and it is modelled as a state rather than as an error.
    preconditions: [the ticket has at least one line, the location has at least one station configured]
    inputs: [ticket_id, manual_station_assignments]
    creates: [preparation_step rows]
    updates: [ticket state]
    events: [preparation.routed, preparation.unrouted]
    notifications:
      - {to: the location supervisor, channel: floor_surface_and_push, when: any line matched no open station, template: unrouted_work, must_include: [display_reference, unmatched_lines, tags_that_matched_nothing], priority: high, mandatory_operational: true}
    undoable: true
    reversal_action: cancel_ticket, or re-route after opening a station
    audit_class: always
    idempotency_key_source: 'ticket_id. Routing is deterministic given the station set, so a replay produces the same steps rather than a second set. Duplicate steps mean the same work is prepared twice, which is the most expensive routing defect available.'
    offline_policy: queue
    concurrency: >
      Routing takes the ticket row exclusively and reads the station set from a snapshot. A
      station opening or closing during routing does not change the outcome for that ticket;
      it affects the next one. Deterministic routing is what makes replay safe and it is worth
      more than routing to the most current station set.
    failure_modes:
      - {code: E_PRECONDITION, cause: a line matches no open station, message: null, note: the ticket enters UNROUTED rather than failing. An error here would be swallowed by an integration; a state is visible on a screen a human is already looking at}
      - {code: E_PRECONDITION, cause: the location has no stations configured at all, message: null, note: 'the ticket enters unrouted and the supervisor is told that nothing is configured, which is a different message from nothing matching'}
      - {code: E_VALIDATION, cause: a manual assignment names a station whose tags do not match the line, message: This station does not handle that., note: 'overridable with a reason, because a supervisor at the counter knows something the tags do not'}
      - {code: E_QUOTA, cause: the ticket would create more than max_steps_per_ticket, message: null, note: routed up to the limit and flagged. Refusing entirely would leave the whole request unprepared over a configuration mistake}
    edge_cases:
      - A line matching two stations. Routed to the one with the lowest sequence_position, unless the line declares multi-station preparation, in which case it produces a step at each and the ticket is not ready until both complete. Duplicating every ambiguous line would turn one request into two pieces of work.
      - Routing while offline. Performed locally against the cached station set, and re-evaluated on sync. Where the server's routing differs, the local routing stands for steps already started and the difference is recorded, because moving work that somebody has begun is worse than a routing inconsistency.
      - A ticket arriving for a location whose stations are all closed, at the end of a service period. Enters unrouted and alerts loudly. Automatically closing the request would be a decision this capability may not take - it is the source's request and only the source can withdraw it.
      - Re-routing after a station opens. The unrouted ticket is routed automatically without a human, because the condition that caused it has been fixed and re-alerting somebody who has just fixed it is noise.
      - A ticket whose source cancels it during routing. The cancellation wins; steps created in the same transaction are cancelled with it, so no station ever sees a step for a cancelled request.

  - key: complete_step
    entity: preparation_step
    label: Mark a step done
    actors: [employee]
    rationale: >
      The most frequent action on a station display, performed with one hand, wet, at speed.
      It must be a single unambiguous target and it must work with no connectivity, and its
      idempotency must be absolute because a double tap is the normal input.
    preconditions: [the step is in progress or held, the station is open or the tenant permits completing at a paused station]
    inputs: [step_id, device_ref, completed_at, evidence_ref]
    creates: [stock consumption where the sink is bound]
    updates: [step state and elapsed, ticket readiness, the next chained station offered its step]
    events: [preparation.step_completed, preparation.ticket_ready]
    notifications:
      - {to: whoever collects, channel: display_and_push, when: the ticket becomes ready, template: ready_for_collection, must_include: [display_reference], mandatory_operational: true}
      - {to: the next station in a chain, channel: display, when: a chained successor exists, template: work_incoming}
    undoable: true
    reversal_action: reopen_step
    audit_class: always
    idempotency_key_source: >
      step_id plus target state. A double tap produces one completion and one stock
      consumption. This is the most important idempotency key in the capability, because a
      duplicated consumption silently drains stock and a duplicated readiness signal releases
      a request twice.
    offline_policy: queue
    concurrency: >
      Completion is a conditional write on the step's current state. Two people completing the
      same step from two displays converge to one completion, and the second display simply
      shows it as done rather than showing an error - an error on a station screen at the
      busiest moment is read as a fault and the device is abandoned. Ticket readiness is
      recomputed under the ticket row lock from the full step set, so a race cannot mark a
      ticket ready while a step remains.
    failure_modes:
      - {code: E_PRECONDITION, cause: the step is already complete, message: null, note: '2xx no-op, and the display simply shows it as done'}
      - {code: E_PRECONDITION, cause: the step was never started, message: null, note: 'completed anyway, with started_at set equal to completed_at and the step marked as never-timed. Refusing would mean somebody who did the work cannot record it, and an untimed record is better than no record'}
      - {code: E_DEPENDENCY, cause: the stock sink is bound but unavailable, message: null, note: the completion COMMITS and the consumption is queued. Blocking a station display on a stock service is how an entire operation stops because of a background system}
      - {code: E_OFFLINE_STALE, cause: the ticket was cancelled while the device was offline, message: null, note: 'the completion is retained and recorded as work done on a cancelled ticket, with its elapsed time, so the cost is visible. It is never silently discarded - somebody did the work'}
      - {code: E_VALIDATION, cause: completed_at is in the future by more than clock_skew_tolerance_seconds, message: null, note: 'clamped to server receipt time with the skew recorded, because a station device with a wrong clock would otherwise produce negative elapsed times'}
    edge_cases:
      - Completed offline and synced hours later. elapsed_seconds is computed from the device's own start and completion times, which is correct - the work took what it took - while received_at and the sync lag come from the server. Computing elapsed from server timestamps would make every offline step appear to take hours.
      - The last step of a ticket completing while another device is holding a different step open. Readiness is recomputed from the step set under the lock, so the ticket does not become ready. The display on the completing device shows the outstanding step, because the person's next question is what is still missing.
      - Completion of a step whose ticket has been recalled. Recorded against the original ticket, which is now terminal, and flagged. The work happened and hiding it would understate what a recall costs.
      - A station completing steps far faster than plausible. Not blocked - blocking a station display is unacceptable - and reported as a pattern by the complete stuck policy. The remedy is a conversation, and the model's job is to make the conversation possible.
      - Completion with evidence attached, for a step where quality is disputed later. The evidence and the completion queue together as one unit offline, for the same reason work orders queue their evidence with their completion.

  - key: recall_ticket
    entity: preparation_ticket
    label: Send work back
    actors: [employee, supervisor, integration_principal]
    rationale: >
      Work that has to be redone is the most useful quality signal a preparation operation
      produces. Modelling it as a linked successor rather than as a cancellation and a new
      request is what makes the recall rate measurable at all.
    preconditions: [the ticket is ready or collected, a recall reason from the configured list is chosen]
    inputs: [ticket_id, reason_key, reason_note, affected_line_refs, evidence_ref]
    creates: [a new preparation_ticket with recall_of_ticket_id set, and its steps]
    updates: [the original's recall_count, the original's state]
    events: [preparation.recalled]
    notifications:
      - {to: the stations that prepared the affected lines, channel: display, when: always, template: work_recalled, must_include: [display_reference, reason, affected_lines], priority: high, mandatory_operational: true}
      - {to: the location supervisor, channel: floor_surface, when: always, template: recall_recorded}
      - {to: ops_manager, channel: in_app, when: the recall chain exceeds recall_chain_alert, template: repeated_recall, priority: high}
    undoable: true
    reversal_action: cancel_ticket on the successor
    audit_class: always
    idempotency_key_source: original ticket_id plus reason_key plus the acting principal plus the minute bucket
    offline_policy: queue
    concurrency: The original is locked while recall_count is incremented and the successor created, so two concurrent recalls produce one successor. Two recalls of one request is two pieces of replacement work for one failure.
    failure_modes:
      - {code: E_VALIDATION, cause: no reason chosen, message: Choose what went wrong., note: 'from a short configured list rather than free text, because free-text reasons on a station display become a single character within a week and the recall report is then worthless'}
      - {code: E_PRECONDITION, cause: the ticket is still in preparation, message: null, note: 'this is not a recall; the correct act is to reopen the specific step, and the message says so'}
      - {code: E_PRECONDITION, cause: the ticket was already recalled, message: null, note: returns the existing successor. Recalling a recall means working on the successor}
      - {code: E_DEPENDENCY, cause: the source cannot be told through the port, message: null, note: the recall COMMITS and the notification is queued. The replacement work must start regardless of whether the source system is reachable}
    edge_cases:
      - Recall of part of a ticket. The successor contains only the affected lines, and the unaffected parts are not redone. Redoing everything is the naive implementation and it doubles the cost of every partial failure.
      - Recall after collection, reported by the source. Fully supported and is the most common case. The successor carries a marker that the original had already left, because that changes both the urgency and the cost.
      - A recall chain. Each successor points at its immediate predecessor and the chain is walked with a depth guard. A second recall of the same request is escalated immediately rather than counted as a pattern, because another attempt is unlikely to fix what two attempts have not.
      - Recall reasons concentrated on one item or one station. This is the entire value of the reason list and it is reported to ops_manager weekly. The report deliberately shows reasons by station and by item separately, because attributing an item problem to a station is how the wrong thing gets fixed.
      - The cost of recalled work. Recorded from the elapsed time and the consumed components of the original steps. Without it a recall looks free, and an operation that believes recalls are free will not reduce them.

rules:
  - key: nothing_is_silently_unrouted
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A line matching no open station puts its ticket into the unrouted state, which alerts immediately and repeats until resolved. It is never dropped, never queued invisibly, and never auto-routed to a non-matching station.'
    on_conflict: not overridable
    rationale: A request nobody is preparing while everybody believes it is in hand is the worst failure this capability can produce, and it is silent by default in every naive implementation.

  - key: no_automatic_completion
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'No timer, threshold or sweep may transition a step to complete. Only a person completes work.'
    on_conflict: not overridable
    rationale: An automatic completion marks as done something nobody did, and the request then leaves as ready with nothing behind it.

  - key: timers_measure_and_never_judge
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'elapsed_seconds is derived from timestamps. A timer produces an alert to a person and never a state change and never a quality assertion.'
    on_conflict: not overridable

  - key: display_text_is_frozen
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'display_summary and quantity_summary are captured at step creation and never resolved live.'
    on_conflict: not overridable
    rationale: A station display whose text changes while somebody is reading it is a display nobody trusts, and the trust is the whole product.

  - key: offline_work_is_never_discarded
    kind: constraint
    scope: kernel
    overridable_at: null
    default: 'A step completed offline against a ticket that has since been cancelled or recalled is retained with its elapsed time and recorded as work done, never discarded on sync.'
    on_conflict: not overridable
    rationale: Somebody did the work. Discarding it hides a real cost and tells the person their effort did not count.

  - key: coordination_mode
    kind: policy
    scope: capability
    overridable_at: site
    default: 'all_together. Parts of one request wait for each other. A site may set as_ready or staged per location or per source channel.'
    on_conflict: most specific scope wins
    rationale: Coordination is the difference between an operation that runs and one that shouts, and which mode is right differs completely between a counter operation and a delivered one.

  - key: recall_reasons_are_a_closed_list
    kind: validation
    scope: capability
    overridable_at: tenant
    default: 'A recall reason is chosen from a tenant-configured list, with optional free text. The list may not be empty.'
    on_conflict: most specific scope wins
    rationale: Free text on a station display becomes one character within a week, and the recall report is the only quality signal this capability produces.

policy_knobs:
  - {key: routing_lag_seconds, default: 10, range: [1, 120], lowest_settable_scope: kernel}
  - {key: unrouted_repeat_seconds, default: 60, range: [10, 600]}
  - {key: queue_depth_alert_multiple, default: 3, range: [1, 20]}
  - {key: queue_depth_alert_minutes, default: 5, range: [1, 60]}
  - {key: display_heartbeat_seconds, default: 90, range: [15, 600]}
  - {key: idle_with_queue_minutes, default: 5, range: [1, 60]}
  - {key: station_pause_review_minutes, default: 15, range: [1, 240]}
  - {key: lateness_alert_seconds, default: 120, range: [10, 3600]}
  - {key: partial_wait_alert_seconds, default: 180, range: [10, 3600]}
  - {key: uncollected_alert_seconds, default: 120, range: [10, 3600]}
  - {key: queued_alert_seconds, default: 120, range: [10, 3600]}
  - {key: step_overrun_alert_seconds, default: 600, range: [30, 7200]}
  - {key: overrun_alert_multiple, default: 2, range: [1, 10]}
  - {key: hold_alert_seconds, default: 300, range: [30, 3600]}
  - {key: unstart_grace_seconds, default: 20, range: [0, 300]}
  - {key: reopen_grace_seconds, default: 120, range: [0, 3600]}
  - {key: implausible_speed_fraction, default: 0.1, range: [0.0, 1.0]}
  - {key: recall_chain_alert, default: 1, range: [1, 10]}
  - {key: source_ack_seconds, default: 30, range: [5, 600], lowest_settable_scope: kernel}
  - {key: clock_skew_tolerance_seconds, default: 300, range: [0, 3600]}
  - {key: max_steps_per_ticket, default: 50, range: [5, 500]}
  - {key: draft_station_stale_days, default: 7, range: [1, 90]}

open_questions:
  - {q: 'The capability key kitchen_flow is an industry noun and violates AET-01 and the kernel exclusion of industry nouns. Should it be renamed to preparation_flow? Renaming is correct on the model''s own terms and breaks the authoring backlog identifier and any traceability already established against it.', assumption: 'None. The key is retained and the violation is declared rather than concealed, because silently renaming a backlog item is a worse defect than the naming one.', confidence: VALIDATION_REQUIRED, method: 'product owner decision, and a check of whether anything outside this repository references the key', priority: High, blocks: [AET-01 pass condition, capability naming convention]}
  - {q: 'Should a station display be able to show work from more than one location - a shared preparation area serving several nearby locations? The model binds a station to exactly one location, which is simpler and excludes a real operating pattern.', assumption: One location per station., confidence: VALIDATION_REQUIRED, method: operator interviews with multi-location operators who share preparation capacity, priority: Medium}
  - {q: 'What is the correct behaviour when a device syncs after a very long offline period - hours rather than minutes - carrying completions for tickets whose service period has ended? The model retains them and records them, which is honest and adds noise to a closed period''s reporting.', assumption: 'Retained and recorded against the original operating day, with the sync lag visible.', confidence: WORKING_ASSUMPTION, method: measure real offline durations at pilot locations, priority: Medium, blocks: [offline_sync replay attribution]}
  - {q: 'Should the projected-lateness computation account for station queue depth ahead of a step, or only for the step''s own expectation? Queue-aware projection is far more accurate and requires modelling station throughput, which is a scheduling problem this capability has deliberately avoided.', assumption: 'Own expectation only. The projection is therefore optimistic whenever a station is busy, which is exactly when it matters.', confidence: VALIDATION_REQUIRED, method: compare projected against actual completion at a pilot location under load, priority: High}
  - {q: 'Who owns the recall cost - the station, the item, or nobody? The model records the cost and attributes it to neither, because attributing it to a station makes the station display a performance monitor and people stop using displays that judge them.', assumption: 'Recorded and unattributed. Reported by station and by item separately for diagnosis, never as an individual performance figure.', confidence: WORKING_ASSUMPTION, method: review with an operator on how recall data would actually be used, priority: Medium}
