open_questions:
  - {q: 'The two sources consulted disagree on which turnover band the 30-day external reporting limit applies to - one says above the 5 crore e-invoicing threshold, the other says only above 10 crore. registration_window_days therefore ships null and is mandatory per tenant. The correct reading must come from the primary notification rather than from a secondary summary.', assumption: None. Encoding either reading would be inventing a legal obligation or inventing an exemption., confidence: VALIDATION_REQUIRED, method: 'read the primary advisory and notification text, and confirm with a practising tax adviser for the specific turnover bands the target tenants occupy', priority: Critical, blocks: [registration_window_days, invoice.registration_deadline_at, the issued stuck-state escalation]}
  - {q: 'When a document''s registration deadline passes without success, is re-invoicing under a new date lawful, and what happens to the original? The model records the loss and escalates, and does not attempt the correction, because the answer has tax consequences this capability may not decide.', assumption: None., confidence: VALIDATION_REQUIRED, method: tax adviser review, priority: Critical, blocks: [registration_failed escape hatch]}
  - {q: 'Should a tenant below the registration threshold be able to issue documents at all without the financial_document_sink bound, given that crossing the threshold mid-year makes every subsequently issued document invalid until a binding exists?', assumption: 'Yes, with pack publication checking the registration_required setting against the binding. Whether the platform should detect the crossing itself is not decided.', confidence: VALIDATION_REQUIRED, method: determine whether turnover is knowable inside Verity for a tenant that bills partly elsewhere, priority: High}
  - {q: 'Should collection sequences be able to suspend service - stopping work for a counterparty in arrears - or is that strictly a commercial decision taken outside the system? Automating it is powerful and is the single most damaging thing an incorrect balance can cause.', assumption: 'None. No such mechanism is modelled, deliberately.', confidence: VALIDATION_REQUIRED, method: operator interviews; likely differs sharply between segments, priority: High, blocks: [collection sequence design, party risk_flag semantics]}
  - {q: 'How should revenue be recognised where an outcome occurs in one period and is invoiced in another? The model records occurred_at and issue_date separately and takes no position, which is correct for a record-keeping system and insufficient for anybody producing accounts from it.', assumption: None., confidence: VALIDATION_REQUIRED, method: 'accounting review, alongside the comp and return treatment questions raised by the order capability', priority: High, blocks: [reporting revenue definitions]}
