composition_version: 0.1.0
status: WORKING_ASSUMPTION
title: The Verity Composition Model

purpose: >
  The kernel (_kernel.yaml) says what Verity is made of. This file says how those
  pieces combine into materially different business operating systems without
  branching on industry anywhere in the code.

  Test of success, restated from the mandate: a blank tenant plus Pack A must
  present as a different product from the same blank tenant plus Pack B, with no
  code difference between them.

# ===========================================================================
# 1. THE COMPOSITION STACK
# ===========================================================================
composition_stack:
  description: >
    Resolution is strictly layered. Each layer may only narrow or override the
    layer above it, never contradict a kernel rule. The resolved output is a
    TENANT MANIFEST — a fully explicit, versioned, diffable document describing
    exactly what this tenant is. Nothing at runtime is implicit.
  layers:
    - layer: 1
      name: Kernel
      supplies: constructs, reserved states, error taxonomy, permission evaluation order, audit classes, expression language
      overridable: false
    - layer: 2
      name: Capability Library
      supplies: entities, fields, lifecycles, actions, events, ports, default rules, default views
      overridable_by: [pack, tenant]
      versioned: semver_per_capability
    - layer: 3
      name: Pack
      supplies: capability selection, port bindings, role definitions, navigation, default configuration, default workflows, seeded reference data
      overridable_by: [tenant]
      versioned: semver_per_pack
    - layer: 4
      name: System Template
      supplies: a named, tested starting point that is a pack set plus opinionated configuration, e.g. "Security Agency — Delhi NCR"
      note: A template is a snapshot, not a live link. Once instantiated the tenant does not track template updates automatically. This is deliberate — a live link means an upstream change can break a running client at 6am.
      overridable_by: [tenant]
    - layer: 5
      name: Tenant Configuration
      supplies: configuration values, role tuning, navigation tuning, rule overrides within overridable_at limits, branding
      overridable_by: [site, role, user]
    - layer: 6
      name: Site / Role / User Configuration
      supplies: the narrowest overrides — a site with a different SLA, a role with a shorter session, a user with different notification preferences
      overridable: terminal

# ===========================================================================
# 2. THE TENANT MANIFEST
# ===========================================================================
tenant_manifest:
  one_line: The single resolved, versioned artifact that fully describes one tenant's operating system.
  why: >
    Without a manifest, "what is this client actually running" becomes archaeology
    across a database. The manifest makes a tenant diffable, reproducible, testable
    in staging, and portable. It is also what makes support tractable at scale.
  contents:
    - manifest_version and generated_at
    - tenant identity and org hierarchy (sites, departments, regions)
    - enabled capabilities with exact resolved versions
    - installed packs with exact resolved versions
    - every port binding, including deliberate null bindings
    - every configuration value that differs from default, with the scope it was set at and who set it
    - every rule override, with the rule's overridable_at proving the override was legal
    - role definitions and their permission expansions
    - navigation tree
    - active workflow definitions
    - integration bindings and their credential references (never the credentials)
    - schema fingerprint (hash of resolved DDL) for drift detection
  properties:
    - immutable_once_deployed: true
    - a change produces a NEW manifest version; manifests are never edited in place
    - the running system is continuously reconciled against its manifest; drift is an alert, not a surprise
  generated_artifacts: [manifest_json_schema, manifest_diff_tool_spec, drift_detection_spec, reproduce_tenant_in_staging_spec]

# ===========================================================================
# 3. PORTS — THE COMPOSITION PRIMITIVE
# ===========================================================================
port_catalog_seed:
  note: >
    Seed only. Every capability model must declare its own ports. These are the
    cross-cutting ones already implied by the domain research.

    Several declared_by entries name capabilities that are NOT in the authoring
    backlog - spaces, shift_requirement, production_order, quality_inspection,
    delivery, manufacturing, service_completion, finance, client_portal,
    consumer_web and whatsapp_conversational. These are deliberate forward
    references: they record which future capability is expected to declare the
    port, so that the port contract is designed for more than the capabilities
    that happen to exist today. The generator reports each as a gap, which is
    correct - the capability does not exist - and the gap should be read as
    "not yet modelled" rather than as "wrong".
  ports:
    - key: billable_outcome_sink
      direction: requires
      declared_by: [work_order, attendance_verification, booking, service_completion]
      contract: accepts a billable event with quantity, rate basis, contract reference, and evidence references
      unbound_behaviour: The producing action completes normally and records the outcome. No billable event is created. The UI does not show billing affordances at all rather than showing them disabled.
      typical_providers: [contract_billing, attendance_based_billing, order_billing, none]
    - key: party_directory
      direction: requires
      declared_by: [work_order, booking, helpdesk, billing, attendance_verification]
      contract: resolve a party reference to a display name, contactable channels, and a permission scope
      unbound_behaviour: FORBIDDEN. party is a kernel-adjacent capability and is always present. Declared here so the dependency is explicit rather than assumed.
      cardinality: exactly_one
    - key: schedulable_resource
      direction: provides
      declared_by: [people, assets, spaces]
      contract: an entity that has availability, capacity, qualifications and calendar exceptions
      note: This is the port that makes one scheduling engine serve guards, doctors, technicians, tables and machines. Scheduling never knows what kind of thing it is scheduling.
    - key: schedulable_demand
      direction: provides
      declared_by: [booking, work_order, shift_requirement, production_order]
      contract: a unit of demand with a time window, a required qualification set, a location and a priority
    - key: evidence_capture
      direction: requires
      declared_by: [attendance_verification, work_order, quality_inspection, delivery]
      contract: capture and attach photo, geolocation, signature, scan or form response with tamper-evidence
      unbound_behaviour: Actions requiring evidence become unavailable and the reason is shown, rather than silently permitting unevidenced completion.
    - key: sla_clock
      direction: requires
      declared_by: [helpdesk, work_order, booking]
      contract: start, pause, resume, breach-check and escalate against a target derived from a contract
      unbound_behaviour: No clock runs, no breach fires, no escalation. Timestamps are still recorded so SLAs can be applied retroactively if the capability is enabled later.
    - key: approval_chain
      direction: requires
      declared_by: [procurement, finance, people, work_order]
      contract: submit for approval, resolve approvers from role and scope, record decision with reason
      unbound_behaviour: The action executes immediately with an audit note recording that no approval chain was configured.
    - key: stock_movement_sink
      direction: requires
      declared_by: [work_order, manufacturing, delivery]
      contract: consume, reserve, return or scrap a quantity of an item at a location
      unbound_behaviour: Parts used are recorded as free text on the work order for billing evidence, with no stock effect.
    - key: customer_surface
      direction: provides
      declared_by: [client_portal, consumer_web, whatsapp_conversational]
      contract: a permissioned external projection of a subset of entities
    - key: financial_document_sink
      direction: requires
      declared_by: [billing]
      contract: produce a legally valid document, including jurisdiction-specific requirements such as IRN and QR
      unbound_behaviour: An internal invoice is produced and clearly marked not-tax-valid.

  external_provider_ports:
    note: >
      Ports whose provider is a system outside Verity rather than a capability in the library.
      They are bound through the integrations framework, which owns their credentials, retries
      and failure surfacing. Recorded here because the anti-ERP test reports them as ports with
      no provider in the library, and that report is correct and is not a defect.
    ports:
      - {key: address_resolution, required_by: [party, sites], provider: external geocoding service}
      - {key: message_transport, required_by: [notification], provider: 'external messaging providers, one per channel'}
      - {key: payment_authorisation, required_by: [billing, booking, order, procurement], provider: external payment provider}
      - {key: secret_store, required_by: [integrations], provider: external secret store; deliberately never the application database}
      - {key: tax_treatment, required_by: [billing, catalog], provider: external tax determination service or a jurisdiction rule set}
      - {key: index_source, required_by: [lease_management], provider: external published index}

  ports_awaiting_a_capability:
    note: >
      Ports required by an authored capability whose natural provider is a capability that has
      not been modelled. These are genuine gaps and are listed rather than resolved, because
      inventing the provider would be inventing a decision about scope.
    ports:
      - {key: occupiable_space, required_by: [lease_management], natural_provider: 'a spaces capability. sites is the closest and models locations without measured area on a stated basis, which lease_management requires'}
      - {key: payroll_input_sink, required_by: [attendance_verification], natural_provider: a payroll capability. Not in the authoring backlog and deliberately not invented}
      - {key: fulfilment_target, required_by: [order], natural_provider: a delivery or collection capability. Not in the authoring backlog}
      - {key: reporting_source, required_by: [reporting], natural_provider: 'every capability, as an opt-in declaration. Left undeclared across the library rather than added mechanically to all 29, because which entities a capability chooses to expose for aggregation is a decision per capability'}

  unspecified_platform_services:
    note: >
      Required by three authored capabilities and specified nowhere. This is a gap in the
      platform specification rather than in any capability, and it is the single largest one
      the library surfaced.
    services:
      - key: change_feed
        required_by: [search, reporting, integrations]
        why_it_matters: >
          search declares it FORBIDDEN when unbound, because an index that cannot be maintained
          incrementally cannot find a record created a minute ago - which is exactly when people
          search. integrations declares it FORBIDDEN because emitting outbound messages from
          in-process hooks sends events for transactions that later roll back. reporting
          degrades to computing aggregates against the operational store, which puts an
          unbounded query on the same database as the transaction recording somebody arriving
          for work.
        question: >
          Is it the event bus described by the vocabulary event convention, a transactional
          outbox derived from it, or a separate service? Its ordering, durability and cursor
          semantics are unspecified.
        confidence: VALIDATION_REQUIRED

# ===========================================================================
# 4. PACK ANATOMY
# ===========================================================================
pack:
  one_line: A tested, versioned, opinionated composition that turns a blank tenant into a working business system.
  not: A checklist of module checkboxes.
  required_contents:
    - capabilities with version ranges
    - resolved port bindings for every requires-port of every included capability
    - role set with full permission expansion
    - navigation tree per role archetype per surface
    - default configuration values
    - default rules and rule overrides
    - default workflows
    - default notification set
    - seeded reference data (units, categories, document types) — never demo customers or fake dashboard widgets
    - default reports, each with its decision question
    - acceptance scenario set that must pass before the pack may be published
  invariants:
    - A pack that leaves any requires-port of any included capability unbound AND unbound_behaviour undefined cannot be published.
    - A pack must declare its conflicts. Two packs binding the same port to different providers is a conflict, surfaced at install time, never silently last-write-wins.
  seed_packs:
    - key: service_operations
      target: FM, AMC, maintenance contractors
      capabilities: [party, sites, people, scheduling_dispatch, work_order, helpdesk, sla_contract, assets, evidence_capture, billing, notification, audit]
      landing_workflow: customer -> ticket -> work order -> technician -> completion with evidence -> SLA measurement -> billing
    - key: deployed_workforce
      target: security agencies, manpower/staffing
      capabilities: [party, sites, people, scheduling_dispatch, attendance_verification, backfill_dispatch, sla_contract, billing, payroll_input, notification, audit]
      landing_workflow: roster -> deployment -> verified attendance -> backfill on absence -> client billing on verified hours -> payroll input
      note: Per product owner, backfill billing is a configurable policy, not a hardcoded rule.
    - key: appointment_services
      target: clinics, salons
      capabilities: [party, catalog, scheduling_dispatch, booking, people, billing, consumer_surface, notification, audit]
    - key: food_service
      target: restaurants, cloud kitchens
      capabilities: [party, catalog, order, kitchen_flow, inventory, procurement, billing, consumer_surface, offline_sync, audit]
    - key: property_operations
      target: commercial property management
      capabilities: [party, sites, lease_management, billing, helpdesk, work_order, assets, notification, audit]
      note: Per product owner, lease management is a domain capability and explicitly NOT part of Core.

# ===========================================================================
# 5. OVERRIDE MODEL
# ===========================================================================
override_model:
  principle: >
    Overrides are separate artifacts from definitions. This is the single most
    load-bearing lesson from the platforms researched: Frappe keeps overrides in
    Custom Field and Property Setter records so the underlying DocType is untouched,
    and ServiceNow keeps them in sys_dictionary_override so an inherited field's
    behaviour changes on the child without modifying the parent. Verity copies this
    shape because it is what makes upgrades survivable.
  override_kinds:
    - {kind: field_addition, scope_allowed: [pack, tenant], mechanism: 'additive custom field record, never a change to the capability''s field list'}
    - {kind: field_property_override, scope_allowed: [pack, tenant, site], mechanism: property override record naming capability version it was authored against}
    - {kind: rule_override, scope_allowed: per rule.overridable_at, mechanism: override record with the base rule id}
    - {kind: label_and_terminology, scope_allowed: [pack, tenant], mechanism: 'terminology map, e.g. "Work Order" -> "Job Card" -> "Complaint"'}
    - {kind: navigation_override, scope_allowed: [pack, tenant, role]}
    - {kind: workflow_override, scope_allowed: [pack, tenant], mechanism: 'a new workflow version, never an edit to a running instance'}
    - {kind: view_override, scope_allowed: [pack, tenant, role, site]}
  forbidden_overrides:
    - Changing a field's type. This is a new field plus a migration, always.
    - Removing a field a kernel rule depends on.
    - Overriding tenant isolation, audit immutability, permission evaluation order, or the offline financial-action refusal.
    - Editing a generated artifact. Generated artifacts are outputs; editing one is a drift bug.
  upgrade_semantics:
    - Every override records the capability version it was authored against.
    - On capability upgrade, each override is re-evaluated: still valid, valid with warning, or broken.
    - Broken overrides block the upgrade in staging and are listed with their owning tenant, the exact override, and the change that broke it. They are never silently dropped.
    - Terminology and label overrides can never break an upgrade, which is why they are separated from structural overrides.

# ===========================================================================
# 6. VERSIONING AND DEPLOYMENT
# ===========================================================================
versioning:
  capability: semver
  breaking_change_definition:
    - removing or renaming a field, entity, action, event, port or state
    - narrowing a permission default
    - changing an event payload shape without a parallel version
    - changing a lifecycle so an existing instance sits in a state with no legal outbound transition
  event_payload_policy: A breaking payload change ships as a new payload_version emitted in parallel with the old for at least one minor release.
  deployment_paths:
    - path: immediate
      applies_to: [label, terminology, colour, branding, feature flag, notification preference, non-structural view tweak]
      rationale: Product owner decision. These cannot corrupt data.
    - path: staging_first
      applies_to: [schema migration, workflow change, major capability version, permission-affecting change, port rebinding, integration credential change]
      sequence: [develop, version, deploy to tenant staging, automated acceptance run, human validation, approval, production deploy, post-deploy reconciliation against manifest]
      rationale: Product owner decision, staging-first is the default for significant change.
  rollback:
    status: BLOCKED_BY_DEC-K-011
    note: >
      Cannot be specified until the rollback strategy decision is made. Evidence
      already gathered shows forward-only migration is the norm in this class of
      platform, so a naive "rollback" promise would be dishonest. Flagged, not guessed.

# ===========================================================================
# 7. HOW THIS AVOIDS BECOMING AN ERP — FALSIFIABLE TESTS
# ===========================================================================
anti_erp_tests:
  - id: AET-01
    test: grep the capability library for industry nouns (restaurant, clinic, guard, salon, factory, vehicle, patient, diner, table).
    pass_condition: zero occurrences outside pack definitions, terminology maps and test fixtures.
    automatable: true
  - id: AET-02
    test: grep for conditional branching on tenant identity, pack identity or industry.
    pass_condition: zero occurrences in capability logic.
    automatable: true
  - id: AET-03
    test: every cross-capability reference resolves to a Port, not a concrete entity.
    pass_condition: zero direct cross-capability foreign keys.
    automatable: true
  - id: AET-04
    test: instantiate service_operations and food_service from the same blank tenant; diff the resulting navigation, roles, entities and workflows.
    pass_condition: the diff shows two materially different products with an identical binary.
    automatable: partially
  - id: AET-05
    test: disable a capability that another capability declares a requires-port against.
    pass_condition: the consumer degrades per its declared unbound_behaviour, with no error and no orphaned UI affordance.
    automatable: true
  - id: AET-06
    test: count decisions a tenant MUST answer before the system is usable.
    pass_condition: under a threshold to be set from operator interviews. High counts are how onboarding becomes a consulting engagement, which is the dominant complaint pattern in the platforms researched.
    automatable: true
    threshold: VALIDATION_REQUIRED

# ===========================================================================
# 8. OPEN COMPOSITION DECISIONS
# ===========================================================================
open_decisions:
  - id: DEC-C-001
    question: Does a tenant track its System Template after instantiation, or is the template a one-time snapshot?
    current_assumption: Snapshot. A live link risks an upstream change breaking a running client.
    confidence: WORKING_ASSUMPTION
    validation: pilot customers
  - id: DEC-C-002
    question: When two installed packs bind the same port to different providers, is the resolution operator-chosen at install, or is co-existence supported (multiple providers, routed by rule)?
    current_assumption: Operator-chosen at install for v1; routed co-existence is a later capability.
    confidence: WORKING_ASSUMPTION
    blocks: [pack publication rules, K13]
  - id: DEC-C-003
    question: Can a tenant hold two versions of the same capability simultaneously (e.g. per site during rollout)?
    current_assumption: No. One capability version per tenant. Per-site version skew multiplies the test matrix without a demonstrated need.
    confidence: WORKING_ASSUMPTION
    validation: pilot with a multi-site client mid-rollout
  - id: DEC-C-004
    question: Is the terminology map per tenant, per pack, or per role? A guard, a client contact and an owner may legitimately call the same record different things.
    current_assumption: Per tenant with optional per-role override.
    confidence: VALIDATION_REQUIRED
