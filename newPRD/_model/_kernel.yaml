kernel_version: 0.1.0
status: WORKING_ASSUMPTION
title: The Verity Kernel Meta-Model

purpose: >
  This file defines WHAT VERITY IS MADE OF. It is one level above every capability
  model. A capability model is an instance of the constructs defined here.
  If a construct is not defined in this file, it may not appear in any capability
  model, and the generator will reject it.

  The distinction this file exists to protect: an ERP ships a fixed set of modules.
  Verity ships a KERNEL plus a LIBRARY. The kernel is what makes two tenants running
  the same binary present as two different business operating systems. If the kernel
  is weak, Verity degrades into an ERP with a theme picker.

evidence_basis:
  - claim: Mature configurable platforms store the specification itself as data, and generate schema and UI from it.
    sources:
      - "Frappe: DocType manages schema plus metadata about behaviour; because metadata is stored in a table it can change without code, and changing it changes schema and UI automatically. https://frappe.io/framework/doctype"
      - "Frappe: schema synchronisation translates DocType definitions into database DDL operations; JSON storage enables version control and deployment. https://deepwiki.com/frappe/frappe/2.3-doctype-system-and-metadata-management"
      - "ServiceNow: creating a table adds a record to sys_db_object, adding a field adds a record to sys_dictionary; schema is determined through these metadata tables rather than by direct DB manipulation. https://note.com/u_sn_notes/n/nddf7e8fbba46"
      - "Odoo: ir.model is the metadata registry holding one record per model, written identically whether the model came from Python or Studio. https://www.dasolo.ai/en/blog/odoo-data-api-5/odoo-ir-model-guide-167"
      - "Odoo: views are stored as records and can be edited independently of the models they represent. https://www.odoo.com/documentation/18.0/developer/reference/user_interface/view_records.html"
    confidence: KNOWN
  - claim: Overrides must live in a separate artifact from definitions, or upgrades break customisations.
    sources:
      - "Frappe: Custom Field and Property Setter override DocType properties without changing the underlying DocType. https://docs.frappe.io/framework/user/en/basics/doctypes/customize"
      - "ServiceNow: sys_dictionary_override changes inherited field behaviour on a child table without modifying the parent definition. https://servicenow.github.io/sdk/guides/table-guide"
    confidence: KNOWN
  - claim: Metadata-driven does not mean upgrade-safe by itself. Frappe explicitly does not support reverse schema migrations, and removed or renamed fields leave their columns in place to avoid data loss.
    sources:
      - "https://docs.frappe.io/framework/v14/user/en/database-migrations"
    confidence: KNOWN
    implication: Verity must specify a forward-only migration model with an explicit compensating-change strategy, not pretend rollback is free. See DEC-K-011.

# ===========================================================================
# THE SIXTEEN CONSTRUCTS
# Order is dependency order. A construct may only reference constructs defined
# above it, except where an explicit back_reference is declared.
# ===========================================================================

constructs:

  # -------------------------------------------------------------------
  - id: K01
    construct: FieldType
    one_line: A primitive value domain with defined storage, validation, rendering and comparison semantics.
    why_it_exists: >
      If fields carry arbitrary types, the generator cannot emit DDL, validation,
      API schema or UI controls. A closed FieldType set is what makes the whole
      generation pipeline possible.
    identity: {key: field_type_key, scope: kernel, mutable: false}
    required_attributes:
      - {name: storage_sql, note: Postgres column type}
      - {name: storage_json, note: representation in API payloads and in the offline store}
      - {name: validation_rules, note: 'intrinsic rules, e.g. e164 shape for phone'}
      - {name: default_ui_control}
      - {name: comparable, note: can it be used in ORDER BY}
      - {name: filterable_operators}
      - {name: indexable}
      - {name: pii_default, note: does an instance default to sensitive}
      - {name: offline_safe, note: can it be edited offline without a merge hazard}
    closed_set: true
    extension_rule: >
      A new FieldType is a kernel change, not a tenant change. Tenants and packs
      may never introduce one. This is deliberate: ServiceNow's field-type set is
      similarly fixed and its field population concentrates in a handful of types
      (string and reference dominate), which is evidence that a small closed set is
      sufficient for real enterprise workloads.
    invariants:
      - Every FieldType must define behaviour for null, empty and unknown separately. "Empty" and "not permitted to see" must never collapse into the same wire representation, because that leaks permission state.

  - id: K02
    construct: Field
    one_line: One named, typed attribute of one Entity, carrying its own security, validation and lifecycle metadata.
    identity: {key: field_key, scope: entity, mutable: false, rename_policy: 'rename creates a new field and a migration mapping, never an in-place rename'}
    required_attributes:
      - {name: field_type, ref: K01}
      - {name: required}
      - {name: immutable_after, note: 'null | create | state:<state_key> — e.g. an invoice number is immutable after issue'}
      - {name: unique_scope, note: 'null | tenant | site | global'}
      - {name: sensitive, note: gated by view_sensitive}
      - {name: financial, note: gated by view_financial}
      - {name: default_value_source, note: 'literal | computed | inherited_from_parent | tenant_config | null'}
      - {name: validation_rules}
      - {name: offline_editable}
      - {name: merge_strategy, note: 'lww | server_wins | client_wins | manual | additive — used by offline reconciliation'}
      - {name: audit_on_change}
      - {name: retention_class}
    invariants:
      - A field marked financial or sensitive is never offline_editable without an explicit kernel exemption, because offline devices are the weakest link in the security model.
      - merge_strategy is mandatory for every offline_editable field. There is no default. A missing merge_strategy is a hard generator error, not a warning, because silent LWW on a quantity field silently destroys stock.
    generated_artifacts: [ddl_column, api_property, validation_rule, ui_control, test_cases, audit_mapping]

  - id: K03
    construct: Entity
    one_line: A named business concept with identity, a field set, a lifecycle, an owner and a tenancy mode.
    identity: {key: entity_key, scope: capability, mutable: false}
    required_attributes:
      - {name: fields, ref: K02}
      - {name: tenancy_mode, values: [tenant_scoped, platform_scoped, cross_tenant_with_membership, tenant_scoped_with_site_partition]}
      - {name: lifecycle, ref: K05}
      - {name: identity_strategy, values: [uuid_v7, tenant_scoped_sequence, natural_key], note: 'human-facing numbers (WO-2026-00123) are a separate display field, never the primary key'}
      - {name: soft_delete}
      - {name: retention_policy}
      - {name: search_projection, note: 'which fields enter the platform search index, and under which permission gate'}
      - {name: offline_availability, values: [never, on_demand, prefetch_by_assignment, prefetch_by_site]}
    invariants:
      - Every tenant_scoped entity carries tenant_id and is protected by row-level security at the database role level, not by application predicates.
      - No entity may be referenced across a capability boundary except through a declared Relationship (K04). Direct foreign keys across capabilities are a generator error — this is what stops the library collapsing into a monolith.
    generated_artifacts: [entity_doc, ddl_table, ddl_rls_policy, api_resource, permission_matrix, screen_set, test_suite, search_index_spec]

  - id: K04
    construct: Relationship
    one_line: A declared, directional, cardinality-bearing link between two Entities, including across capability boundaries.
    why_it_exists: >
      This is the construct that makes composition real. Work Order does not know
      that Assets exists. It declares that it MAY reference a subject of kind
      "asset-like" and the composition layer binds that to the Assets capability
      only if the tenant has Assets enabled.
    required_attributes:
      - {name: from_entity, ref: K03}
      - {name: to_entity_or_port, note: 'a concrete entity, or a Port (K13) when the target is resolved at composition time'}
      - {name: cardinality, values: [one_to_one, one_to_many, many_to_one, many_to_many]}
      - {name: optionality, values: [required, optional, conditional]}
      - {name: on_target_archive, values: [block, allow_and_freeze, allow_and_null]}
      - {name: on_target_delete, values: [block, cascade_soft, null_out]}
      - {name: traversal_permission, note: 'may a principal who can see the source see the target? Never assumed yes.'}
      - {name: denormalisation, note: 'which target fields are copied onto the source for list performance, and the staleness policy for each'}
    invariants:
      - Every cross-capability relationship must target a Port, never a concrete entity. A concrete cross-capability target is a hard generator error.
      - traversal_permission must be declared. Inheriting visibility down a relationship is the single most common source of accidental data exposure and is never implicit in Verity.

  - id: K05
    construct: State and Transition (Lifecycle)
    one_line: The finite state machine that governs what may happen to an Entity instance and when.
    required_attributes:
      - {name: states, note: 'each with terminal, mutable, billable, visible_to_customer'}
      - {name: initial_state}
      - {name: transitions, note: 'each with from, to, triggering_action, guards, side_effects, reversibility'}
      - {name: illegal_transition_behaviour, note: 'always E_PRECONDITION, never a silent no-op'}
      - {name: stuck_state_policy, note: 'for every non-terminal state: how long may an instance sit here before it is an exception, who is told, and what is the escape hatch'}
    invariants:
      - Every non-terminal state must have at least one outbound transition reachable by a role that actually exists in the shipped packs. A state only an administrator can escape is an operational trap.
      - Every state machine must declare a stuck_state_policy for every non-terminal state. This is what turns a lifecycle into an operations system rather than a data model.
      - Transitions are the only legal way to change state. No action may write the state field directly.
    generated_artifacts: [state_machine_doc, transition_matrix, mermaid_diagram, guard_test_cases, stuck_state_monitors]

  - id: K06
    construct: Action
    one_line: A named, permissioned, auditable operation that a principal or the system may invoke against an Entity.
    required_attributes:
      - {name: verb, ref: vocabulary.verbs}
      - {name: actors}
      - {name: preconditions}
      - {name: inputs}
      - {name: effects, note: 'creates, updates, transitions'}
      - {name: events_emitted, ref: K08}
      - {name: notifications, ref: K10}
      - {name: reversibility}
      - {name: concurrency_rule}
      - {name: idempotency_key_source}
      - {name: audit_class}
      - {name: failure_modes}
      - {name: edge_cases}
      - {name: offline_policy, values: [queue, refuse, read_only]}
      - {name: rate_limit}
    invariants:
      - An action with reversibility=false must have a confirmation specification. Irreversible-and-unconfirmed is a generator error.
      - Every mutating action must declare an idempotency_key_source, because at-least-once delivery and offline replay both re-send.
      - No action may be defined without at least one enumerated failure mode. An action that "cannot fail" has not been thought about.

  - id: K07
    construct: Rule
    one_line: A declarative constraint or derivation evaluated by the platform rather than coded per capability.
    kinds:
      - {kind: validation, when: before_write, effect: reject with E_VALIDATION}
      - {kind: guard, when: before_transition, effect: reject with E_PRECONDITION}
      - {kind: derivation, when: on_write, effect: compute a field value}
      - {kind: policy, when: on_evaluation, effect: 'yield a configurable decision, e.g. is this backfill billable'}
      - {kind: constraint, when: continuous, effect: 'an invariant the system monitors, e.g. no site left unstaffed'}
    why_it_exists: >
      This is where tenant difference lives. The product owner's directive is explicit:
      where businesses legitimately differ, model the difference as configuration or
      workflow policy, never as a hardcoded assumption. A Rule is the artifact that
      difference is expressed in.
    required_attributes:
      - {name: scope, values: [kernel, capability, pack, tenant, site]}
      - {name: overridable_at, note: the lowest scope permitted to override this rule}
      - {name: expression_language, note: see K16}
      - {name: evaluation_order}
      - {name: on_conflict, note: what happens when two rules at the same scope disagree}
    invariants:
      - A rule marked scope=kernel may never be overridden. Tenant isolation, audit immutability and financial-action-offline-refusal are kernel rules.
      - Every overridable rule must ship a default. A rule with no default forces every tenant to answer a question at provisioning time, which is how onboarding becomes a consulting project — the exact failure mode Odoo implementations are criticised for.

  - id: K08
    construct: Event
    one_line: An immutable record that something happened, published for consumption by other capabilities and by automations.
    required_attributes:
      - {name: envelope, ref: vocabulary.event_convention}
      - {name: payload_schema}
      - {name: payload_version}
      - {name: emitted_by_actions}
      - {name: subscribers_permitted, note: 'which capabilities may subscribe, and whether the payload is redacted per subscriber'}
    invariants:
      - Events are the ONLY permitted cross-capability runtime coupling other than declared Ports. A capability may not call another capability's action directly.
      - Event payloads are permission-blind. Redaction happens at delivery, per subscriber. A capability must never receive a field it could not have read via the API.

  - id: K09
    construct: Workflow
    one_line: A named, resumable, multi-step orchestration that spans actions across one or more capabilities.
    distinguishing_note: >
      A Lifecycle (K05) is intra-entity. A Workflow is inter-entity and often
      inter-capability. Ticket -> Work Order -> Technician -> Asset -> Inventory ->
      Completion -> Billing is a Workflow, not a lifecycle.
    required_attributes:
      - {name: trigger, values: [event, schedule, manual, external_webhook, rule_constraint_breach]}
      - {name: steps, note: 'each step names a capability Port, an action, its actor, its timeout and its compensating action'}
      - {name: compensation, note: what unwinds when a later step fails after an earlier step committed}
      - {name: timeout_policy}
      - {name: escalation_policy}
      - {name: idempotency}
      - {name: partial_completion_semantics}
      - {name: human_in_the_loop_steps}
    invariants:
      - Every step that commits an irreversible external effect (payment captured, WhatsApp sent, invoice IRN generated) must be marked non_compensable, and the workflow must be designed so all non_compensable steps occur after every step that can fail cheaply.
      - A workflow must declare what an operator sees when it is stuck. Invisible stuck workflows are how operations teams lose trust in a system.

  - id: K10
    construct: Notification
    one_line: A targeted, channel-routed, preference-aware message produced by an Event or Rule.
    required_attributes:
      - {name: trigger, ref: K08}
      - {name: audience_selector, note: 'by role archetype, by relationship (assignee, site supervisor, client contact), never by hardcoded user'}
      - {name: channels, values: [in_app, push, email, sms, whatsapp]}
      - {name: template_per_channel}
      - {name: priority}
      - {name: batching_policy}
      - {name: escalation_chain}
      - {name: quiet_hours_behaviour}
      - {name: cost_class, note: 'free_in_service_window | utility | marketing — see integrations research; this is a real money field'}
    invariants:
      - Audience is always computed from a relationship or role, never stored as a user id, or the notification silently dies when that person leaves.
      - Every notification must be suppressible by the recipient EXCEPT those marked mandatory_operational (SLA breach, safety, security alert) or mandatory_legal.

  - id: K11
    construct: Permission
    one_line: A grant of (verb x entity x field-set x scope) to a role, evaluated in that order.
    required_attributes:
      - {name: verb}
      - {name: entity}
      - {name: field_set, note: 'all | all_except_gated | explicit list'}
      - {name: scope, ref: vocabulary.scopes}
      - {name: conditions, note: optional rule expression for conditional grants}
    evaluation_order: [authenticate, entity_check, action_check, scope_check, field_projection, rule_conditions]
    invariants:
      - Denial at scope returns 404, never 403. Confirming that a record exists outside your scope is itself a leak.
      - Field denial removes the key from the payload. It must not appear as null.
      - Permissions are additive across roles (a principal holding two roles gets the union), with explicit DENY entries evaluated last and winning. This mirrors the additive permission-set model rather than profile cloning, which is what makes role explosion avoidable.

  - id: K12
    construct: Role
    one_line: A named bundle of Permissions, instantiated per tenant, mapped to one or more platform role archetypes.
    required_attributes:
      - {name: archetypes}
      - {name: permissions, ref: K11}
      - {name: assignable_scopes, note: which scopes may be bound when this role is granted to a person}
      - {name: is_system, note: 'system roles cannot be deleted, only cloned'}
    invariants:
      - Every tenant must retain at least one principal holding a role with tenant_owner archetype and tenant scope. Enforced at revoke time, not at read time.

  - id: K13
    construct: Port
    one_line: A named, typed extension point through which one capability consumes another WITHOUT knowing which capability satisfies it.
    why_it_exists: >
      THIS IS THE CONSTRUCT THAT MAKES VERITY NOT AN ERP. Work Order declares a port
      "billable_outcome_sink". In a security-agency tenant that port is bound to
      Attendance-based billing. In an AMC tenant it is bound to Contract billing. In
      a tenant with no billing module it is bound to null and the work order simply
      completes. The Work Order capability contains no branch on industry.
    required_attributes:
      - {name: port_key}
      - {name: direction, values: [requires, provides]}
      - {name: contract, note: 'the entity shape, actions and events a provider must satisfy'}
      - {name: cardinality, values: [zero_or_one, exactly_one, zero_or_many]}
      - {name: unbound_behaviour, note: 'MANDATORY. What the consuming capability does when nothing is bound. "Error" is rarely the right answer.'}
      - {name: bound_by, values: [pack, tenant_config, system_template]}
    invariants:
      - Every requires-port must declare unbound_behaviour. A capability that cannot function with a port unbound is not composable and must be redesigned or merged with its dependency.
      - A provides-port declares a contract that the provider is tested against. Contract tests are generated, not written by hand.
    generated_artifacts: [port_contract_doc, provider_conformance_tests, composition_graph_node]

  - id: K14
    construct: View / Surface
    one_line: A permission-aware projection of entities rendered for a specific role on a specific surface.
    surfaces: [console_desktop, console_tablet, field_mobile, kds, pos, client_portal, consumer_web, hq_console]
    required_attributes:
      - {name: surface}
      - {name: role_archetypes}
      - {name: entities_projected}
      - {name: primary_task, note: 'the single job this view exists to complete — mandatory, and if you cannot name one, the view is a dashboard and probably should not exist'}
      - {name: states_specification, ref: vocabulary.ui_states}
      - {name: offline_behaviour}
      - {name: accessibility_criteria}
      - {name: hardware_assumptions, note: 'per product owner: assume cheap Android, gloves, sunlight, shared devices'}
    invariants:
      - A view may not display a field the viewing role cannot read. The projection is computed from K11, not hand-maintained, or the two drift and the UI leaks.
      - Every view must specify all eleven UI states. A view without an offline state specification cannot ship to field_mobile, kds or pos.

  - id: K15
    construct: Configuration
    one_line: A typed, scoped, defaulted, validated setting that alters behaviour without altering the model.
    scopes_in_precedence_order: [kernel_default, capability_default, pack_default, tenant, site, role, user]
    required_attributes:
      - {name: config_key}
      - {name: value_type, ref: K01}
      - {name: lowest_settable_scope}
      - {name: default}
      - {name: validation}
      - {name: change_impact, values: [immediate, next_session, requires_migration, requires_staging]}
      - {name: audit_on_change, default: true}
    invariants:
      - Precedence is strictly most-specific-wins with no partial merging of scalar values. Object-valued configuration is forbidden precisely because merge semantics become ambiguous.
      - Any configuration with change_impact=requires_migration or requires_staging may not be changed by a tenant admin in production directly; it routes through the staging-first path.

  - id: K16
    construct: Expression
    one_line: The single, sandboxed, side-effect-free language in which guards, validations, derivations, policies and audience selectors are written.
    why_it_exists: >
      Platforms that allow arbitrary server-side scripting for configuration acquire
      an upgrade problem and a security problem simultaneously. A closed expression
      language is inspectable, statically analysable, and safe to run inside a tenant.
    required_attributes:
      - {name: grammar}
      - {name: available_context, note: 'subject, principal, tenant config, now, related entities reachable via declared relationships ONLY'}
      - {name: determinism, note: 'an expression must return the same result for the same inputs; no network, no randomness, no wall-clock beyond an injected now'}
      - {name: complexity_bound, note: 'static cost ceiling, rejected at save time rather than timing out at runtime'}
      - {name: null_semantics, note: MANDATORY and explicit. Three-valued logic. An expression that is neither true nor false must not silently be treated as false.}
    invariants:
      - Expressions may not perform writes. Anything that writes is an Action.
      - Expressions may not traverse relationships that the evaluating principal cannot traverse, or configuration becomes a data-exfiltration channel.

# ===========================================================================
# WHAT THE KERNEL DELIBERATELY DOES NOT CONTAIN
# ===========================================================================
kernel_exclusions:
  - excluded: Any industry noun.
    reason: There is no restaurant, clinic, guard, factory or vehicle in the kernel. The moment one appears, every tenant pays for it.
  - excluded: Any fixed navigation.
    reason: Navigation is produced by composition from enabled capabilities plus pack defaults plus tenant overrides.
  - excluded: Any dashboard.
    reason: Dashboards are Views (K14) with a declared primary_task. A dashboard with no primary task is decoration.
  - excluded: Reporting as a module.
    reason: Reporting is a projection over entities and events with a permission-aware query layer, not a capability that owns data.

# ===========================================================================
# KERNEL-LEVEL DECISIONS RAISED BY THIS FILE
# ===========================================================================
kernel_decisions_required:
  - id: DEC-K-001
    question: Is the Entity set per tenant fixed at composition time, or may a tenant add entities at runtime (true Studio-style no-code)?
    options: [A pack-time only, B tenant admin may add entities via a builder, C Verity HQ may add entities per tenant but tenants may not]
    consequence: >
      B is what Odoo Studio and Frappe Customize Form offer and is the strongest
      commercial differentiator, but it makes every generated artifact runtime-dynamic
      rather than build-time, which changes the architecture fundamentally.
    confidence: VALIDATION_REQUIRED
    blocks: [K01, K02, K03, generator design, DDL strategy]
  - id: DEC-K-002
    question: Does a Port bind at pack install time (static) or may it rebind at runtime as modules are enabled and disabled?
    consequence: Runtime rebinding requires every consumer to handle a port becoming unbound mid-flight, including for in-progress workflows.
    confidence: VALIDATION_REQUIRED
    blocks: [K13, K09]
  - id: DEC-K-011
    question: Given Frappe explicitly does not support reverse schema migrations, what is Verity's rollback story for a failed tenant upgrade?
    options: [A forward-only with compensating migrations, B blue-green tenant schema with cutover, C snapshot-and-restore with data loss window]
    evidence: "Frappe docs state reverse schema migrations are unsupported and removed fields keep their columns to avoid data loss. https://docs.frappe.io/framework/v14/user/en/database-migrations"
    confidence: VALIDATION_REQUIRED
    blocks: [K15, deployment model, custom module lifecycle]
